<script>
(function(){
"use strict";
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("stage");
const stageGrid=document.getElementById("stageGrid");
const uAxis=document.getElementById("uAxis");
const plotG=document.getElementById("plot");
const formulaG=document.getElementById("formulas");
const targetG=document.getElementById("target");
const railG=document.getElementById("rail");
const badgeG=document.getElementById("badge");
const capEl=document.getElementById("caption");

const C={bg:"#070A12",text:"#E8EEF9",dim:"#7A869C",faint:"#2A3448",
  cyan:"#35E0FF",gold:"#F5C542",amber:"#FFB020",purple:"#8A7CFF",white:"#F2F5FA"};

const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeIO=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const easeOutBack=t=>{t=clamp(t,0,1);const c=1.70158;return 1+ (c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const rnd=s=>{let x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x);};

function E(tag,attrs,parent){
  const e=document.createElementNS(NS,tag);
  if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);
  if(parent)parent.appendChild(e);
  return e;
}
function T(parent,x,y,size,color,str,opts){
  opts=opts||{};
  const t=E("text",{x:x,y:y,"font-size":size,fill:color,
    "font-family":opts.font||ZH,"font-weight":opts.weight||"normal"},parent);
  if(opts.anchor)t.setAttribute("text-anchor",opts.anchor);
  if(opts.opacity!=null)t.setAttribute("opacity",opts.opacity);
  if(opts.spacing)t.setAttribute("letter-spacing",opts.spacing);
  t.textContent=str;
  return t;
}
// 一行公式：parts = [{t,it,sup,font}]
function FT(parent,x,y,size,color,parts){
  const t=E("text",{x:x,y:y,"font-size":size,fill:color,"font-family":MATH},parent);
  parts.forEach(p=>{
    const s=E("tspan",{},t);
    if(p.sup){ s.setAttribute("baseline-shift","super"); s.setAttribute("font-size",(size*0.62).toFixed(1)); }
    if(p.sub){ s.setAttribute("baseline-shift","sub"); s.setAttribute("font-size",(size*0.62).toFixed(1)); }
    if(p.it){ s.setAttribute("font-style","italic"); s.setAttribute("font-family",MATH); }
    if(p.font){ s.setAttribute("font-family",p.font); }
    if(p.color){ s.setAttribute("fill",p.color); }
    s.textContent=p.t;
  });
  return t;
}
function vis(g,t,a,b,fin,out){
  fin=fin==null?0.22:fin; out=out==null?0.22:out;
  let o=0;
  if(t>=a&&t<=b){ o=1; if(t<a+fin)o=easeOut((t-a)/fin); if(t>b-out)o=1-easeOut((t-(b-out))/out); }
  g.setAttribute("opacity",o.toFixed(3));
  return o;
}

// 数值：Γ（Lanczos）与 ζ（Euler–Maclaurin），仅为画曲线与数值校验
const G_C=[0.99999999999980993,676.5203681218851,-1259.1392167224028,
  771.32342877765313,-176.61502916214059,12.507343278686905,
  -0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
function gamma(z){
  if(z<0.5)return Math.PI/(Math.sin(Math.PI*z)*gamma(1-z));
  z-=1; let x=G_C[0];
  for(let i=1;i<9;i++)x+=G_C[i]/(z+i);
  const t=z+7.5;
  return Math.sqrt(2*Math.PI)*Math.pow(t,z+0.5)*Math.exp(-t)*x;
}
function zeta(s){
  if(Math.abs(s-1)<1e-9)return NaN;
  const N=24; let sum=0;
  for(let n=1;n<N;n++)sum+=Math.pow(n,-s);
  sum+=Math.pow(N,1-s)/(s-1)+0.5*Math.pow(N,-s);
  const p=Math.pow(N,-s);
  sum+=(1/12)*s*Math.pow(N,-s-1);
  sum+=(-1/720)*s*(s+1)*(s+2)*Math.pow(N,-s-3);
  sum+=(1/30240)*s*(s+1)*(s+2)*(s+3)*(s+4)*Math.pow(N,-s-5);
  sum+=(-1/1209600)*s*(s+1)*(s+2)*(s+3)*(s+4)*(s+5)*(s+6)*Math.pow(N,-s-7);
  return sum;
}
function xi(s){
  if(Math.abs(s-1)<1e-7)return 0.5;
  return 0.5*s*(s-1)*Math.pow(Math.PI,-s/2)*gamma(s/2)*zeta(s);
}

const LNXI1=Math.log(xi(1));
const lnxi=s=>Math.log(xi(s));
const NUM=(lnxi(1+1e-4)-lnxi(1-1e-4))/(2e-4);

const vy=v=>PY1-(v-VMIN)/(VMAX-VMIN)*(PY1-PY0);

E("line",{x1:PX0,y1:PY0,x2:PX0,y2:PY1,stroke:C.faint,"stroke-width":"1"},plotG);
for(let s=1.0;s<=2.001;s+=0.2){
  const x=sx(s);

}

});

let d="", first=true;
for(let i=0;i<=240;i++){

  d+= (first?"M ":" L ")+x.toFixed(2)+" "+y.toFixed(2);

}

curve.setAttribute("stroke-dasharray",CL); curve.setAttribute("stroke-dashoffset",CL);
// 切线
const tanPts=[];
for(let i=0;i<=80;i++){

// 校验插页

T(chkG,1340,590,19,C.dim,"数值微分",{font:MONO});

FT(F5,200,306,42,C.white,[{t:"− ("},{t:"s",it:1},{t:"/2) ln "},{t:"π",it:1},{t:" + ln Γ("},{t:"s",it:1},{t:"/2) + ln "},{t:"ζ",it:1},{t:"("},{t:"s",it:1},{t:")"}]);

FT(F6,150,240,40,C.white,[{t:"ξ′("},{t:"s",it:1},{t:")/ξ("},{t:"s",it:1},{t:") = 1/"},{t:"s",it:1},{t:" + 1/("},{t:"s",it:1},{t:"−1) − ½ ln "},{t:"π",it:1}]);

// F7

/* ================= 刻度尺 ================= */

/* ================= 声场（OfflineAudioContext） ================= */
function makeNoise(ctx,dur,seed){
  const n=Math.floor(ctx.sampleRate*dur);
  const b=ctx.createBuffer(1,n,ctx.sampleRate);
  const d=b.getChannelData(0);
  let s=seed||1;
  for(let i=0;i<n;i++){ s=(s*1664525+1013904223)>>>0; d[i]=(s/4294967296)*2-1; }
  return b;
}
function makeIR(ctx,dur){
  const n=Math.floor(ctx.sampleRate*dur);
  const b=ctx.createBuffer(2,n,ctx.sampleRate);
  for(let c=0;c<2;c++){
    const d=b.getChannelData(c);
    let s=12345+c*777;
    for(let i=0;i<n;i++){
      s=(s*1664525+1013904223)>>>0;
      const x=i/ctx.sampleRate;
      let v=(s/4294967296)*2-1;
      v*=Math.exp(-x/0.62);
      if(i===Math.floor(0.05*ctx.sampleRate))v+=0.35;
      if(i===Math.floor(0.12*ctx.sampleRate))v+=0.22;
      if(i===Math.floor(0.21*ctx.sampleRate))v+=0.12;
      d[i]=v*0.55;
    }
  }
  return b;
}
async function renderAudio(){
  const SR=48000,DUR=90;
  const ctx=new OfflineAudioContext(2,SR*DUR,SR);
  const master=ctx.createGain(); master.gain.value=1;
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-20; comp.knee.value=14; comp.ratio.value=3.2;
  comp.attack.value=0.006; comp.release.value=0.18;

  const gapGain=ctx.createGain(); gapGain.gain.value=1;
  comp.connect(gapGain); gapGain.connect(ctx.destination);
  gapGain.gain.setValueAtTime(1,31.98);
  gapGain.gain.linearRampToValueAtTime(0.0001,32.0);
  gapGain.gain.setValueAtTime(0.0001,32.33);
  gapGain.gain.linearRampToValueAtTime(1,32.36);

  function env(dest,t,dur,peak,atk){

    bq.frequency.value=opt.fc||1500; bq.Q.value=opt.q||1;

  function thud(t,f,peak,pan){

  sub(20.05,110,0.06);

  glass(31.6,1560,0.012,0);

  pluck(33.45,392,0.012,-0.2);

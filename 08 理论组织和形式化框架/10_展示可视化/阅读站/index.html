G$→$K_{\\text{eff}}$→$T_c$，环节1-4全部第一性（$K_0$从黎曼零点指数公式第一性计算，$\\gamma_n$从Weyl群分类和谱间隙决定）。**$K_0$包含电子结构细节，材料参数不足，从黎曼零点指数公式第一性导出**（数值验证无可复核产物）。\n14. **$T_c$计算链**（§11.14）：10环节计算链（元素→嘉当矩阵→分子嘉当矩阵→原子分布→Regge剖分→角亏→曲率谱→声子谱→$\\theta_D$→角亏涨落→$T_c$）。**最小分布单元**概念：CQM不需处理宏观材料，提取能体现局域角亏的最小结构即可。$N$在Debye积分中消去（局域量）：$\\Delta\\delta_0^2 = \\frac{C^2}{l^2}\\cdot\\frac{3\\hbar}{4\\omega_D}\\cdot(1-f)\\cdot\\sum_{\\text{edges}}\\left(\\frac{1}{m_i}+\\frac{1}{m_j}\\right)$，$C^2=2/3$（**严格导出**：几何因子$4/3$×边共享因子$1/2$），$f$=关联因子（Debye零阶公式$f=\\mathrm{sinc}^2(k_DR/2)$导出）。**自由能公式构成第一性预测框架**（$T_c^2 = 8\\Delta\\delta_0^2 K_{\\text{eff}} \\theta_D / (9\\ln 2)$，数值验证无可复核产物），不需要$\\delta_v$。\n15. **超导判据**（§11.11）：超导临界条件$\\beta\\delta_v + \\frac{3\\beta^2}{16(\\gamma_2-\\gamma_1)}\\Delta\\delta_0^2 > 1$。双尺度涨落$\\Delta\\delta_0^2 = \\Delta\\delta_{\\text{inter}}^2 + \\Delta\\delta_{\\text{intra}}^2$。**自由能公式构成第一性预测框架**（$T_c^2 = 8\\Delta\\delta_0^2 K_{\\text{eff}} \\theta_D / (9\\ln 2)$，数值验证无可复核产物），不需要$\\delta_v$，详见§11.14自由能推导链；数值验证无可复核产物。\n\n**未解决**：\n\n1. **关联因子$f$的严格推导**（本文档 §11.12）：**Debye模型下导出严格公式**：$f = \\mathrm{sinc}^2(k_D R/2)$，其中$k_D=(6\\pi^2 n)^{1/3}$是Debye波矢，$R$是最近邻距离，$n$是原子数密度。数值验证与解析公式完全一致（误差$\u003c10^{-9}$）。BCC: $f\\approx0.16$，FCC: $f\\approx0.14$，SC: $f\\approx0.23$。与唯象值$f=0.5$有差异，因Debye模型是各向同性零阶近似——精确值需DFT完整声子谱。氢化物：$f=(f_{ac}+w\\cdot f_{op})/(1+w)$，$w=(M_{\\text{heavy}}/m_H)(\\omega_{ac}/\\omega_{op})^2$，$f_{ac}>0$（声学模同相），$f_{op}\u003c0$（光学模反相）。数值验证无可复核产物；\n2. **内禀角亏$\\delta_{\\text{intrinsic}}$的严格推导**（本文档 §11.12）：**公式已写出**：$\\delta_{\\text{intrinsic}} = \\frac{1}{2\\pi}\\int_{\\text{FS}}|\\Omega(\\mathbf{k})|dS/A_{\\text{FS}}$，其中$\\Omega(\\mathbf{k})$是贝里曲率，$A_{\\text{FS}}$是Fermi面面积。球形Fermi面→$\\delta=0$（Cu/Ag/Au不超导），van Hove奇点→$\\delta$最大（2D正方晶格van Hove点$\\delta\\approx0.29\\approx7.6/\\beta$，铜氧化物高温超导）。物理内容在于非超导体$\\delta_v\u003c1/\\beta$。数值验证：元素超导体$\\delta_v/(1/\\beta)\\approx0.94$-0.99，氢化物0.38-0.68（$\\Delta\\delta_0$补偿）。自由能框架已不需要$\\delta_v$。数值验证无可复核产物；\n3. 常压室温第二类超导体的合成与验证；\n4. 路径积分中作用量 $S_{U(1)//\\mathbb{Z}_n}$ 的显式形式（严谨化文档已有四部分自由能构造 $F_n = E_{\\text{Regge}} + E_{\\text{gauge}} + E_{\\text{cond}} - TS_n$，完整作用量泛函待推导）；\n5. **氢原子Rydberg态能级间距GUE统计检验**（§11.6可检验预言）：高精度测量氢原子高激发态能级，分析间距统计分布是否服从Montgomery-Odlyzko定律（黎曼零点间距统计），而非标准量子力学的 $1/n^3$ 衰减。\n6. **缺陷来源丰度的定量计算**（§11.9）：$\\kappa_N$ 的微观来源，组合几何缺陷的定量公式，非单调行为的定量条件。\n\n## 18.5 最终目标（续《核心理论》§18）\nCQM 超导理论的核心已经足够强：FG → 达到跃迁阈值 → 结构群叠加态 → 同步跃迁，这四个机制统一解释了从常规超导到高温超导再到多电子凝聚的现象。同步=相位相干，不要求结构群统一（允许多群超导）。理论理想提供了完整的选群框架；实际计算退化为选一个主导群后的标准计算。\n\n当前最核心的实践目标仍然是：\n\n$$\\boxed{\\text{常压室温第二类超导体}}$$\n\n只有这个目标实现，CQM 超导理论才能从理论框架变成被物质实践证明的物理学。\n", "backlinks": ["D001", "D004", "D005", "D006", "D007", "D008", "D010", "D023"], "outlinks": ["D008"]}, {"id": "D033", "doc_id": "D033", "title": "统一方法论", "path": "06 超导/CQM_超导_统一方法论.md", "group": "06 超导", "layer": 3, "type": "超导", "text": "# CQM超导统一方法论：四层FG纤维丛与相对第一性计算链\n\n**作者**：ruster\n\n> 该文档用统一纤维丛语言严格描述CQM超导预测的方法论：四层FG（元素/分子/晶胞/超导）各自是不同的纤维丛，剖分对象不同，但从Regge剖分到Tc的计算步骤完全统一且第一性。\n>\n> **层级命名对照**：本文的“四层FG”指参与 Regge 剖分的四个物质组织层级（元素/分子/晶胞/超导）；框架的 FG 同步算符层级为电子/元素/分子/晶胞四个（见 `CQM_超导_FG层级同步算符体系.md` §2）。电子 FG 的同步算符为 $V_0$（自由库仑场，无独立剖分，故不列入剖分层）；本文的“超导”层即晶胞 FG 的同步实现（结构群 $U(1)//\\mathbb{Z}_n$）。\n\n## 1. 四层FG的纤维丛定义\n\n### 1.1 主丛四元组\n\n每层FG是一个主丛，其主丛四元组为 $(M_\\ell, P_\\ell, \\pi_\\ell, G_\\ell)$：\n\n- $M_\\ell$：底空间（剖分对象的空间分布）\n- $P_\\ell$：全空间（主丛）\n- $\\pi_\\ell: P_\\ell \\to M_\\ell$：投影映射\n- $G_\\ell$：结构群（对称群作用在纤维上）\n\n配以联络 $\\mathcal{A}_\\ell$ 和曲率 $F_\\ell = d\\mathcal{A}_\\ell + \\mathcal{A}_\\ell \\wedge \\mathcal{A}_\\ell$。\n\n| 层级 | 底空间 $M_\\ell$ | 结构群 $G_\\ell$ | 联络 $\\mathcal{A}_\\ell$ | 剖分对象 |\n|:---|:---|:---|:---|:---|\n| 元素FG | 质子+中子分布 | 核子对称群（从壳层结构） | 核子间联络 | 质子和中子分布 |\n| 分子FG | 原子分布 | 分子点群 | 原子间联络（化学键） | 原子分布 |\n| 晶胞FG | 原子/分子在晶胞中分布 | 空间群 | 晶胞中原子/分子间联络 | 原子/分子分布 |\n| 超导 | 晶胞分布的单位分布 | $U(1)//\\mathbb{Z}_n$ | 超导同步联络 | 单位分布 |\n\n### 1.2 层级嵌套\n\n四层FG的纤维丛之间存在层级嵌套——每层的底空间是上层的纤维：\n\n$$P_{\\text{el}} \\hookrightarrow P_{\\text{mol}} \\hookrightarrow P_{\\text{cell}} \\hookrightarrow P_{\\text{super}}$$\n\n- $M_{\\text{mol}}$ 的每个点（原子）上附着 $P_{\\text{el}}$（核子分布的主丛）\n- $M_{\\text{cell}}$ 的每个点（原子/分子位置）上附着 $P_{\\text{mol}}$（原子分布的主丛）\n- $M_{\\text{super}}$ 的每个点（单位分布位置）上附着 $P_{\\text{cell}}$（晶胞分布的主丛）\n\n### 1.3 元素FG的纤维丛\n\n**底空间** $M_{\\text{el}}$：原子核内Z个质子和N个中子的空间分布。\n\n**结构群** $G_{\\text{el}}$：从核壳层结构（SU(5) 重组实现 ⇒ $A_4$ 嘉当矩阵 → 壳层 {2,6,10,14}）第一性导出的核子对称群。\n\n**电子轨道是元素FG的谱体现**，不是剖分对象本身：\n- 电子轨道主要是U(1)耦合常数涨落的体现\n- 有SO(2)或SU(2)的影响\n- 同位素（中子数N不同）也有影响\n- 电子壳层反映核子分布几何（电子是关系产物），可间接确定对称性\n\n从Z到纤维丛的路径：质子数=Z，中子数N从稳定同位素给出，核子分布对称性从壳层结构第一性导出。118个元素有限，可穷尽列举。\n\n### 1.4 分子FG的纤维丛\n\n**底空间** $M_{\\text{mol}}$：分子中各原子的空间分布。\n\n**结构群** $G_{\\text{mol}}$：分子点群（从分子对称性给出）。\n\n**联络** $\\mathcal{A}_{\\text{mol}}$：原子间联络，从化学键给出。\n\n外部数据：键长、键角、分子点群（从实验或DFT）。\n\n### 1.5 晶胞FG的纤维丛\n\n**底空间** $M_{\\text{cell}}$：晶胞中原子/分子的空间分布。\n\n**结构群** $G_{\\text{cell}}$：空间群。\n\n**联络** $\\mathcal{A}_{\\text{cell}}$：晶胞中原子/分子间联络，从晶格结构给出。\n\n外部数据：空间群、Wyckoff位置、晶格常数（从X射线衍射）。\n\n### 1.6 超导的纤维丛\n\n**底空间** $M_{\\text{super}}$：晶胞分布的单位分布——能体现全局分布的局域单元。\n\n**结构群** $G_{\\text{super}} = U(1)//\\mathbb{Z}_n$：超导结构群，$n$由资格条件筛选。\n\n**联络** $\\mathcal{A}_{\\text{super}}$：超导同步联络，从晶胞FG联络诱导。\n\n超导剖分不是对整个晶体剖分，而是取单位分布进行Regge剖分。N在Debye积分中消去（局域量），不需处理宏观材料。\n\n## 2. Regge剖分与纤维丛的对应\n\n### 2.1 Regge剖分作为底空间的三角剖分\n\n给定纤维丛 $(M_\\ell, P_\\ell, \\pi_\\ell, G_\\ell)$，对底空间 $M_\\ell$ 进行Regge剖分 $T_\\ell$：\n\n- **顶点** = $M_\\ell$ 中的离散点（剖分对象的位置）\n- **边** = 联络 $\\mathcal{A}_\\ell$ 的离散化（连接顶点的路径，给出平移规则）\n- **面** = 曲率 $F_\\ell$ 的离散化（绕回路的和乐）\n\n### 2.2 角亏作为底空间曲率集中\n\n顶点 $v$ 处的角亏 $\\delta_v$ 是底空间曲率在该点的集中：\n\n$$\\delta_v = 2\\pi - \\sum_{\\Delta \\ni v} \\alpha_\\Delta \\quad \\text{(2D, Gauss-Bonnet)}$$\n\n等价于绕顶点 $v$ 的和乐：\n\n$$W_v = \\exp(i \\delta_v \\hat{T}) \\in G_\\ell$$\n\n其中 $\\hat{T}$ 是结构群 $G_\\ell$ 的生成元。\n\n### 2.3 联络离散化为动力学矩阵\n\n联络 $\\mathcal{A}_\\ell$ 在Regge剖分上离散化为力常数矩阵：\n\n$$K_{ij} = \\frac{\\partial^2 V}{\\partial u_i \\partial u_j}$$\n\n其中 $V$ 是Regge作用量，$u_i$ 是顶点 $i$ 的位移。动力学矩阵：\n\n$$D_{ij} = \\frac{K_{ij}}{\\sqrt{m_i m_j}}$$\n\n### 2.4 曲率量子涨落为角亏涨落\n\n底空间曲率的零温量子涨落给出角亏涨落：\n\n$$\\Delta\\delta_0^2 = \\sum_q \\left|\\frac{\\partial \\delta_v}{\\partial u_q}\\right|^2 \\cdot \\frac{\\hbar}{2\\omega_q}$$\n\n其中 $\\omega_q$ 是纤维上的量子谐振子本征频率（声子频率）。\n\n## 3. 同步算符与Tc闭式\n\n### 3.1 同步算符作为主丛谱算符\n\n每层FG的同步算符 $\\hat{\\mathcal{S}}_\\ell$ 是该层主丛 $P_\\ell$ 上的谱算符：\n\n$$\\hat{\\mathcal{S}}_\\ell = V_0 + V_\\ell$$\n\n其中 $V_0$ 是质数势（从前时空基态紧化结构继承，各层级共享），$V_\\ell$ 是层级结构项（元素层级 $L_{\\text{orbital}}$、分子层级 $L_{\\text{mol}}$、晶胞层级 $V_{\\text{角亏激活}}(T)$），从该层主丛对称性与底空间曲率涨落给出。\n\n### 3.2 本征值与温度依赖\n\n同步算符本征值：\n\n$$\\lambda_n(T) = \\gamma_n - \\frac{\\beta^2 \\Delta\\delta_v(T)^2 (n^2-1)}{4n^2 (1-\\beta\\delta_v)}$$\n\n其中：\n- $\\gamma_n$：第 $n$ 个黎曼零点虚部（零温极限，从S1谱方程给出）\n- $\\beta = \\frac{1}{4\\pi}\\ln\\frac{L}{a}$：系统尺寸严格确定（$L$系统尺寸，$a$晶格常数）\n- $\\delta_v$：底空间角亏（从Regge剖分计算）\n- $\\Delta\\delta_v(T) = \\Delta\\delta_0 \\sqrt{\\tanh(\\hbar\\Omega_0 / 2k_B T)}$：温度依赖的角亏涨落\n\n### 3.3 Tc从本征值交叉导出\n\n超导相变发生在同步算符本征值交叉：\n\n$$\\lambda_2(T_c) = \\lambda_1(T_c)$$\n\n解出Tc闭式：\n\n$$T_c = \\frac{\\theta_D}{2\\,\\mathrm{arccoth}(x)}, \\quad x = \\frac{3\\beta^2 \\Delta\\delta_0^2}{16(1-\\beta\\delta_v)(\\gamma_2-\\gamma_1)}$$\n\n超导条件 $x > 1$ 等价于：\n\n$$\\beta\\delta_v + \\frac{3\\beta^2}{16(\\gamma_2-\\gamma_1)} \\Delta\\delta_0^2 > 1$$\n\n## 4. 统一计算步骤（纤维丛语言）\n\n给定任意层FG的纤维丛 $(M_\\ell, P_\\ell, \\pi_\\ell, G_\\ell)$，从剖分到Tc的步骤完全统一：\n\n**步骤A：Regge剖分** — 对底空间 $M_\\ell$ 进行三角剖分 $T_\\ell$（顶点+边+面）\n\n**步骤B：角亏** — 逐顶点计算底空间曲率集中：$\\delta_v = 2\\pi - \\sum_{\\Delta \\ni v} \\alpha_\\Delta$（Gauss-Bonnet定理）\n\n**步骤C：动力学矩阵** — 联络 $\\mathcal{A}_\\ell$ 离散化为力常数矩阵 $K_{ij}$，动力学矩阵 $D_{ij} = K_{ij}/\\sqrt{m_i m_j}$（Regge作用量变分）\n\n**步骤D：声子谱** — 纤维上量子谐振子本征频率：$\\omega_q = \\sqrt{\\text{eig}(D)}$，Debye频率 $\\omega_D = \\max(\\omega_q)$（量子谐振子对角化）\n\n**步骤E：角亏涨落** — 底空间曲率零温量子涨落：$\\Delta\\delta_0^2 = \\sum_q |\\partial\\delta_v/\\partial u_q|^2 \\cdot \\hbar/(2\\omega_q)$\n\n**步骤F：Tc闭式** — 主丛结构群上同步算符本征值交叉：$T_c = \\theta_D / (2\\,\\mathrm{arccoth}(x))$\n\n除耦合参数化缺口（$t_0,\\lambda$，见 `CQM_超导_FG层级同步算符体系.md` §8.3）外，每步都是CQM方程严格导出，无经验拟合参数。\n\n## 5. 相对第一性的界定\n\n### 5.1 完全第一性部分\n\n- 元素FG纤维丛构造：从Z→核子分布→结构群→主丛，无外部输入\n- 从剖分到Tc的步骤：步骤A-F全部从CQM方程严格导出（耦合参数化缺口除外，见 `CQM_超导_FG层级同步算符体系.md` §8.3）\n- 物理常数：$\\beta=\\frac{1}{4\\pi}\\ln\\frac{L}{a}$, $C^2=2/3$, $\\gamma_1$, $\\gamma_2$ 等从CQM方程给出\n\n### 5.2 需要外部数据的部分\n\n- 分子FG纤维丛：需要分子键合几何（键长、键角）确定底空间 $M_{\\text{mol}}$\n- 晶胞FG纤维丛：需要晶体结构（空间群、Wyckoff位置）确定底空间 $M_{\\text{cell}}$\n- 超导纤维丛：需要晶体结构确定单位分布 $M_{\\text{super}}$\n\n### 5.3 相对第一性的含义\n\nCQM超导预测是相对第一性：\n- 不从CQM方程推导底空间分布（分布是组织原则/外部输入）\n- 但从纤维丛到Tc的步骤完全第一性（无经验拟合）\n- 元素FG底空间完全第一性（可穷尽列举）\n- 分子FG/晶胞FG/超导底空间需要外部数据，但计算步骤统一\n\n对比BCS：BCS需要电声耦合 $\\lambda$ 和库仑赝势 $\\mu^*$（经验参数），CQM不需要这些——CQM只需要晶体结构（实验输入确定底空间），从纤维丛到Tc的步骤完全第一性（耦合参数化缺口除外，见 `CQM_超导_FG层级同步算符体系.md` §8.3）。\n\n## 6. 元素FG穷尽列举方案\n\n### 6.1 从Z到纤维丛\n\n元素FG的纤维丛从Z第一性构造：\n\n1. 质子数=Z，中子数N从稳定同位素给出\n2. 底空间 $M_{\\text{el}}$ = Z+N个核子的空间分布\n3. 核壳层结构从 SU(5) 重组实现 ⇒ $A_4$ 嘉当矩阵 → 壳层 {2,6,10,14} 第一性导出\n4. 结构群 $G_{\\text{el}}$ 从核子分布对称性给出\n5. 嘉当矩阵的Dynkin图给出Regge剖分的顶点和边\n\n### 6.2 从Dynkin图到Regge剖分\n\n嘉当矩阵的Dynkin图给出顶点和边：\n- A1（s壳层）：1个顶点，无边\n- A3（p壳层）：3个顶点链\n- A4（d壳层）：4个顶点链\n\n从1D Dynkin图构造2D Regge剖分（补面）：\n- A3链→1个三角形\n- A4链→2个三角形\n\n### 6.3 预计算表\n\n对118个元素预计算：\n1. 质子数Z、中子数N\n2. 核壳层结构与嘉当矩阵\n3. Dynkin图（顶点+边）\n4. 2D Regge剖分（补三角形面）\n5. 顶点位置（从核子分布对称性）\n6. 角亏 $\\delta_v$（从剖分计算）\n\n存储为元素FG纤维丛表，供分子FG和晶胞FG查用。\n\n## 7. 分子FG构造方案\n\n### 7.1 从元素FG纤维丛组合\n\n分子FG纤维丛 = Σ元素FG纤维丛 + 跨原子联络\n\n1. 查元素FG表获取各元素的主丛（核子级别）\n2. 构造分子底空间 $M_{\\text{mol}}$：顶点=原子位置，边=化学键\n3. 跨原子联络 $\\mathcal{A}_{\\text{mol}}$ 从化学键给出\n4. 补跨原子三角形面\n5. 计算分子Regge剖分（原子级别）\n\n### 7.2 外部数据需求\n\n- 键长：从实验或DFT\n- 键角：从实验或DFT\n- 分子点群：从实验或DFT\n\n## 8. 晶胞FG构造方案\n\n### 8.1 从分子FG纤维丛周期化\n\n晶胞FG纤维丛 = 分子FG纤维丛 + 空间群周期化\n\n1. 构造分子FG纤维丛（原子级别）\n2. 应用空间群操作生成周期结构\n3. 取一个晶胞的底空间 $M_{\\text{cell}}$\n4. 晶胞联络 $\\mathcal{A}_{\\text{cell}}$ 从晶格结构给出\n5. 计算晶胞Regge剖分和角亏 $\\delta_v$\n\n### 8.2 外部数据需求\n\n- 空间群：从X射线衍射\n- Wyckoff位置：从X射线衍射\n- 晶格常数：从X射线衍射\n\n## 9. 超导Tc计算：从单位分布到Tc\n\n### 9.1 单位分布的选取\n\n从晶胞FG底空间 $M_{\\text{cell}}$ 中选取单位分布——能体现全局分布的局域单元：\n- 单位分布是最小结构单元，其角亏能代表全局角亏\n- 超导底空间 $M_{\\text{super}}$ = 单位分布\n- 超导联络 $\\mathcal{A}_{\\text{super}}$ 从晶胞FG联络诱导\n- N在Debye积分中消去（局域量），不需处理宏观材料\n\n### 9.2 从单位分布到Tc\n\n对超导纤维丛 $(M_{\\text{super}}, P_{\\text{super}}, \\pi_{\\text{super}}, G_{\\text{super}})$ 执行统一步骤A-F（§4），得到Tc闭式。\n\n## 10. 实现路线\n\n> **实现状态**：Phase 1–4 目前是**待实现的路线**，不是已有的计算链；文档他处涉及这些计算的数值结论均无可复核产物。仓库中现存的数据产物只有 `cqm_analysis/element_fg_table.json`（元素 FG 表，可由 `cqm_framework/` 的原子/晶体数据库再生）与 `cqm_analysis/superconductors_deduplicated.csv`（226 条材料实验数据）。\n\nPhase 1: 元素FG穷尽列举（完全第一性）\n- 118个元素→核子分布→纤维丛→嘉当矩阵→Dynkin图→Regge剖分\n- 预计算元素FG纤维丛表（顶点位置+边+面+角亏）\n\nPhase 2: 统一从纤维丛到Tc的步骤（完全第一性）\n- 输入：Regge剖分（顶点位置+边+面）+原子质量\n- 步骤A-F：剖分→角亏→动力学矩阵→声子频率→角亏涨落→Tc闭式\n\nPhase 3: 分子FG构造（需化学数据）\n- 输入：化学式+分子结构（键长/键角）\n- 从元素FG表组合+跨原子联络→分子纤维丛→Regge剖分\n- 调用 Phase 2 计算 Tc\n\nPhase 4: 晶胞FG构造（需晶体数据）\n- 输入：晶胞结构（空间群/Wyckoff位置/晶格常数）\n- 从分子FG+空间群周期化→晶胞纤维丛→Regge剖分\n- 选取单位分布\n- 调用 Phase 2 计算 Tc\n\n## 11. 与BCS方法的对比\n\n| | BCS（闭式公式跳步） | CQM（纤维丛严格推导） |\n|--|--|--|\n| 数学框架 | 无统一框架 | 四层FG纤维丛 $(M_\\ell, P_\\ell, \\pi_\\ell, G_\\ell)$ |\n| 剖分对象 | 不区分层级 | 元素=核子分布，分子=原子分布，晶胞=原子/分子分布，超导=单位分布 |\n| 角亏 $\\delta_v$ | 经验近似0.01 | 底空间曲率集中（Gauss-Bonnet） |\n| 动力学矩阵 | 不构造 | 联络 $\\mathcal{A}_\\ell$ 离散化 |\n| 声子频率 | 从数据库取 | 纤维上量子谐振子本征频率 |\n| 角亏涨落 | 闭式公式跳步 | 底空间曲率量子涨落 |\n| Tc | 自由能公式 | 同步算符本征值交叉（主丛谱算符） |\n| 严格性 | 含数值拟合 | 从纤维丛到Tc完全第一性 |\n\n## 12. 核心方程（从CQM方程严格导出）\n\n**Tc闭式**（同步算符本征值交叉 $\\lambda_2(T_c) = \\lambda_1(T_c)$）：\n\n$$T_c = \\frac{\\theta_D}{2\\,\\mathrm{arccoth}(x)}, \\quad x = \\frac{3\\beta^2 \\Delta\\delta_0^2}{16(1-\\beta\\delta_v)(\\gamma_2-\\gamma_1)}$$\n\n**角亏**（底空间曲率集中，Gauss-Bonnet）：\n\n$$\\delta_v = 2\\pi - \\sum_{\\Delta \\ni v} \\alpha_\\Delta$$\n\n**和乐**（绕顶点 $v$ 的结构群元素）：\n\n$$W_v = \\exp(i \\delta_v \\hat{T}) \\in G_\\ell$$\n\n**动力学矩阵**（联络离散化）：\n\n$$D_{ij} = \\frac{K_{ij}}{\\sqrt{m_i m_j}}, \\quad K_{ij} = \\frac{\\partial^2 V_{\\text{Regge}}}{\\partial u_i \\partial u_j}$$\n\n**声子频率**（纤维上量子谐振子本征值）：\n\n$$\\omega_q^2 = \\text{eig}(D)$$\n\n**角亏涨落**（底空间曲率零温量子涨落）：\n\n$$\\Delta\\delta_0^2 = \\sum_q \\left|\\frac{\\partial \\delta_v}{\\partial u_q}\\right|^2 \\cdot \\frac{\\hbar}{2\\omega_q}$$\n\n**同步算符**（主丛谱算符）：\n\n$$\\hat{\\mathcal{S}}_\\ell = V_0 + V_\\ell, \\quad \\lambda_n(T) = \\gamma_n - \\frac{\\beta^2 \\Delta\\delta_v(T)^2 (n^2-1)}{4n^2 (1-\\beta\\delta_v)}$$\n\n**超导条件**：\n\n$$x > 1 \\iff \\beta\\delta_v + \\frac{3\\beta^2}{16(\\gamma_2-\\gamma_1)} \\Delta\\delta_0^2 > 1$$\n", "backlinks": ["D001"], "outlinks": []}, {"id": "D030", "doc_id": "D030", "title": "超导核心理论", "path": "06 超导/CQM_超导核心理论.md", "group": "06 超导", "layer": 3, "type": "超导", "text": "# CQM 超导核心理论\n\n> 耦合常数量子力学（CQM）超导涌现框架 —— 主丛的联络-曲率-和乐机制、伴丛同步（序参量全局截面，同步再锁定）机制、完整因果链与元素层级\n\n**作者**：ruster\n**状态**：理论框架，数值关系与实验检验待验证\n\n**声明**：CQM 超导理论的框架性内容——本体论前提、主丛联络-曲率-和乐机制、完整因果链；**不含任何从具体材料导出的数值或拟合数据**。不宣称“室温超导可达”或“已严格证明 $T_c$ 唯一解”。\n\n> **配套文档**：`01 核心理论/CQM_核心_引力存在论前提.md` 给出前时空（先于引力）与两种引力（GR/FG）的本体论前提与主丛的数学结构；`01 核心理论/CQM_核心_因果网络同步理论.md`（CNST）给出超导的存在论基底（同步再锁定与同步动力学）；`CQM_超导_FG层级同步算符体系.md` 给出层级同步算符公理（每种 FG 层级——电子/元素/分子/晶胞——都有自己的同步算符，均为紧化算符在该层级主丛上的实现）与分子 FG 同步算符构造方案（$\\delta_{\\text{intrinsic}}$ 的 CQM 内部来源），均与此文档互补。超导主丛联络-曲率-和乐机制的完整理论（本体论→底空间与结构群→主丛联络→曲率量子→固有时流速→不确定性→和乐量子化→资格条件→丛作用量竞争→伴丛同步→$T_c$）。材料/应用方向的周期表推导、中子缺陷与同位素、超导测试判据，以及严格性缺口、Lean 对应、路线、开放问题、计算路线、确立与未解决、最终目标等进展与状态内容，见配套文档 `CQM_超导_专题与扩展.md`。\n\n---\n\n## 摘要\n\n在 CQM 框架下构建超导的涌现理论——**主丛的联络-曲率-和乐机制与伴丛同步理论**：超导态是FG 底空间上的主丛 $P(M,G)$ 的**伴丛** $E=P\\times_G\\mathbb{C}$ 的全局同步截面（序参量全局截面，同步再锁定，见 §1.5）。主丛提供规范结构（联络 $\\mathcal{A}_{\\text{FG}}$、曲率 $F=d\\mathcal{A}+\\mathcal{A}\\wedge\\mathcal{A}$、和乐 $\\mathcal{H}$），伴丛承载序参量（库珀对波函数 $\\psi$ 为伴丛截面）。核心结论：**CQM 超导不是“筛选 + 吸引”的二分机制，而是单一的主丛几何-动力学过程**——FG 底空间联络 $\\mathcal{A}_{\\text{FG}}$ 生成底空间 Regge 曲率（Regge 角亏 $\\delta_v$），驱动固有时流速涨落，固有时流速涨落通过海森堡代数锁定主丛结构群上的耦合常数量子涨落，涨落给出和乐表示的跃迁耦级谱 $\\Delta u_n = 2\\ln n$（$n=2,4,6,\\ldots$）的资格条件，候选结构群族在路径积分中通过丛作用量竞争选出主导群，电子在主丛的因果条件下自组织为库珀对。配对/相干过程即晶胞量子振荡本身（声子=底空间 Regge 曲率量子）：**温度通过改变晶胞量子振荡模式的声子数，影响自组织——再生产（晶胞量子振荡的维持）是自组织的一个环节，声子数变化经由此环节进入自组织**。伴丛同步三阶段：正常态（和乐非平庸，伴丛无全局截面，未同步）→ 赝能隙（局域和乐平庸化，全局同步未完成）→ 超导态（伴丛全局同步截面/跃迁=再锁定）（§1.5、§10）。**跃迁是全局同步事件，局域只能满足条件，局域不可能跃迁。同步=相位相干，不要求结构群统一（允许多群超导）。**\n\n**元素嘉当矩阵**（而非质子或中子）是主丛结构群李代数的理想根系统。同位素效应揭示元素内部存在主次结构（质子扇区为主，中子扇区为次），中子扇区的缺陷是 FG 底空间 Regge 曲率（Regge 角亏）的主要结构性来源（见 §2.4；质子-质子对原理上亦可形成铰链，但几何上极难）。\n\n---\n\n## 1. 本体论前提\n\n### 1.1 两种引力\n\n| 引力 | 存在论地位 | 数学结构 | 因果网络 |\n|------|-----------|---------|---------|\n| **前时空** | 物质处于前时空的状态 | 谱经GL(5)紧化投影与黎曼零点 $\\gamma_n$ 有关 | 物质自组织 |\n| **经典引力 GR** | 广度前提（平滑展开） | 伪黎曼流形 | 平庸因果网络（基态时空） |\n| **精细引力 FG** | 深度前提（层级激发）：GR 基态的非平庸激发态，连接前时空与 GR 的关键中介 | FG 底空间（Regge 角亏 $\\delta_v$）上的主丛 $P(M,G)$：联络 $\\mathcal{A}_{\\text{FG}}$ 生成两种曲率——Regge 角亏（底空间）+ 伴丛曲率 $F=d\\mathcal{A}+\\mathcal{A}\\wedge\\mathcal{A}$ | 层级因果网络（激发态） |\n\n**核心区分**：\n\n$$\\boxed{\\text{FG} \\neq \\text{GR}}$$\n\n- GR 是时空曲率，受 $G_N$ 限制，量级 $\\sim 10^{-43}$（$G_N$ 理论值与偏差属构造后验数字校验，待独立复现，见 `03 引力与退相干/CQM_引力_GN可能公式.md`）\n- FG 是一个联络生成两种曲率——底空间 Regge 角亏 $\\delta_v$（离散曲率）+ 伴丛曲率 $F=d\\mathcal{A}+\\mathcal{A}\\wedge\\mathcal{A}$（联络曲率）——**不受 $G_N$ 限制**，量级 $O(1)$\n- FG 不走 Regge→GR 连续极限→Poisson 方程路径——它直接由底空间 Regge 角亏给出（见 `01 核心理论/CQM_核心_引力存在论前提.md` §3）\n\n### 1.2 相变量子\n\n$$\\boxed{☯ = \\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1} = \\frac{\\xi'(1)}{\\xi(1)} = 1 + \\frac{\\gamma}{2} - \\ln(2\\sqrt{\\pi}) \\approx 0.02309570897}$$\n\n（$\\gamma$ 为欧拉-马歇罗尼常数；由 $\\xi(s)=\\frac12 s(s-1)\\pi^{-s/2}\\Gamma(s/2)\\zeta(s)$ 的函数方程 $\\xi(s)=\\xi(1-s)$ 与 $\\psi(1/2)=-\\gamma-2\\ln2$ 推出。解析值与数值微分互验，精确到 $10^{-7}$。）严格无量纲，作为全部后续层级的普适比例基准。\n\n### 1.3 有限本体层级\n\n| 实体 | 本体论地位 | 内部结构 |\n| ------- | -------- | -------------------------------------------------- |\n| **质子** | 理想有限本体 | 结构群李代数嘉当矩阵 $A_4$（完美，正四单纯形根系统） |\n| **中子** | 有缺陷的有限本体 | $A_4$ + 缺陷形变 $D(\\delta)$；FG 底空间 Regge 曲率（角亏）的结构性来源（见 §2.4） |\n| **电子** | 基态耦合对应 | 基态耦合常数 $\\alpha$ 的对应，伴丛截面（旋量表示，跃迁前未配对） |\n| **电磁场** | 外部独立自由度 | 不可压缩，与电子响应耦合（伴丛上的 $U(1)$ 规范激发） |\n\n### 1.4 RQM 唯物化：属性随附、因果实现与超导立足点\n\nCQM 对关系量子力学（RQM）进行唯物主义重构——这是超导理论的本体论基石：\n\n1. **属性（物理上即自由度）随附于物质本体**：属性不是独立实体，而是有限本体的随附物。\n2. **属性在因果关系中实现自身**：属性的现实化发生于具体的因果关系中，因而属性自然**相对物理系统而言**——并非相对“观测者”，而是相对构成该系统的有限本体关系网络。\n3. **超导原理由此获得立足点**：大量有限本体（质子/中子）构成的关系网络，通过 FG 退相干机制对电子基础自由度进行操作，涌现超导态。\n4. **取消电子的本体特权**：电子不是独立本体，而是基态耦合常数 $\\alpha$ 的对应——它是质子-中子关系网络历史拓扑路径的产物，但该产物在超导问题中已经“在场”：系统中已有电子，只是耦合常数停在 $\\alpha$ 而未跃迁。CQM 将操作对象下移为“有限本体关系网络对电子基础自由度的操作”——电子自由度来自质子-中子关系网络的历史拓扑路径，而非先验存在；配对与否的区别仅在于耦合常数是否完成 $\\alpha\\to n^2\\alpha$ 跃迁（由丛作用量竞争选出主导 $n$，见 §5.3 本体论分层）。\n\n由此，RQM 唯物化的涌现链为：**RQM（关系性实现前提）→ 主丛 $P(M,G)$（既是关系性实现前提又是其结果）→ 自组织（因果锚定，关系性实现过程）→ 属性（自由度）实现**。\n\n### 1.5 伴丛同步：超导的核心命题\n\n**超导态 = FG 底空间上的主丛 $P(M,G)$ 的伴丛 $E=P\\times_G\\mathbb{C}$ 的全局同步截面（序参量全局截面，同步再锁定）。** 主丛提供规范结构（联络 $\\mathcal{A}_{\\text{FG}}$、曲率 $F$、和乐 $\\mathcal{H}$），伴丛承载序参量 $\\psi$（库珀对波函数）。和乐平庸化（$\\mathcal{H}_{ij}\\approx 1$）是主丛上的**局域同步数学条件**（绕每个闭合回路相位闭合），伴丛全局截面（序参量全局定义且相位相干）是**全局同步态**——全局同步还需全局相位相干（相位关联跨越晶粒）与丛作用量条件。\n\n存在论基底见 `01 核心理论/CQM_核心_因果网络同步理论.md`（CNST）：超导相变是 FG 展开性同步向高阶同步锁定态的跃迁——不是在原层级上恢复同步，而是在新层级（配对态）上建立新的同步秩序。\n\nFG 底空间上的主丛 $P(M,G)$（激发态）的每个顶点——底空间 $M$ 上的物质晶胞——都是一个量子振荡体：晶胞量子振荡携带曲率涨落（声子 = 底空间 Regge 曲率量子，§6），其再生产节律由联络诱导的固有时流速 $\\frac{d\\tau}{dt}=\\sqrt{1-\\beta\\delta_v}$（§7）调制，量子振荡体之间通过主丛联络 $\\mathcal{A}_{\\text{FG}}$ 与和乐 $W_v=\\exp(i\\delta_v\\hat T)$ 耦合（§5）。超导转变是主丛联络诱导的**伴丛同步相变**（序参量从无全局截面到有全局截面）：\n\n| 态 | 伴丛同步状态 | 物理表现 |\n|------|----------------|---------|\n| 正常态 | 和乐非平庸，伴丛无全局截面（FG 激发态，晶胞量子振荡不相干） | 耦合常数停在 $\\alpha$ |\n| 赝能隙 | 局域和乐平庸化，全局同步未完成 | 高曲率区局域和乐闭合，全局跃迁尚未发生，系统处于结构群叠加态 |\n| 超导态 | 伴丛全局同步截面（再锁定） | 相位关联跨越晶粒，全局相位相干（结构群可不统一，允许多群超导） |\n\n同步要素与各节的对应：\n\n| 同步要素 | CQM 主丛/伴丛实现 | 章节 |\n|---------|---------|------|\n| 量子振荡体 | 晶胞量子振荡（声子 = 底空间 Regge 曲率量子） | §6 |\n| 局域节律 | 联络诱导固有时流速 $\\frac{d\\tau}{dt}=\\sqrt{1-\\beta\\delta_v}$ | §7 |\n| 量子振荡体间耦合 | 主丛联络 $\\mathcal{A}_{\\text{FG}}$、和乐 $W_v=\\exp(i\\delta_v\\hat T)$ | §5 |\n| 同步条件 | 和乐平庸化条件 $\\mathcal{H}_{ij}\\approx1$（和乐平庸化） | §10.1 |\n| 资格条件 | 资格条件 $\\Delta\\delta_0 \\ge \\frac{☯\\sqrt{1-\\beta\\delta_v}}{2\\beta\\ln n}$ 筛选候选结构群族，丛作用量竞争选出主导群（$n$ 为跃迁耦级） | §9.2 |\n| 去同步因素 | 温度（声子数 → 和乐相位噪声） | §11 |\n| 全局同步临界点 | $T_c$（和乐平庸化相变点） | §11.2 |\n\n> **说明**：不确定性关系基于相变量子 $☯$，给出下界 $☯/2$。$n$ 为跃迁耦级（$n=2,4,6,\\ldots$）。\n\n---\n\n## 2. 核子层\n\n### 2.1 质子\n\n质子确定主丛的结构群李代数——标准 $A_4$ 型嘉当矩阵（结构群李代数的根系统）：\n\n$$A_4 = \\begin{pmatrix} 2 & -1 & 0 & 0 \\\\ -1 & 2 & -1 & 0 \\\\ 0 & -1 & 2 & -1 \\\\ 0 & 0 & -1 & 2 \\end{pmatrix}$$\n\n**严格生成正四单纯形**：A4 的 10 个正根 = 正四单纯形的 10 条边向量，即主丛纤维的权重系统。正四单纯形的 5 个顶点由 $\\mathbb{R}^5$ 标准基投影到超平面 $x_1+\\cdots+x_5=0$ 得到。\n\n### 2.2 中子\n\n中子嘉当矩阵（结构群李代数的缺陷形变）：\n\n$$D(\\delta) = \\begin{pmatrix} 2 & -1 & 0 & 0 \\\\ -1 & 2 & -1 & 0 \\\\ 0 & -1 & 2 & -\\delta \\\\ 0 & 0 & -\\delta & 2 \\end{pmatrix}$$\n\n缺陷位置锁定在 $\\alpha_4$ 末端，$\\delta = \\delta(Z, N)$ 是**依赖元素（$Z$）和同位素（$N$）的变量**——非定值（见 §2.3）。$\\det D(\\delta) = 8 - 3\\delta^2$，正定条件 $|\\delta| \u003c \\sqrt{8/3} \\approx 1.633$。中子 A4 与质子同构但在同位旋空间中处于不同 Weyl 轨道。\n\n该末端缺陷 $\\alpha_4$ 正是 FG 底空间 Regge 曲率（角亏）的微观结构性来源（见 §2.4：中子提供角亏，FG 由角亏直接给出，**中子并非 FG 的触发器**；质子-质子对原理上也能经非平直二面角形成铰链激活 FG，但几何上极难实现）。\n\n### 2.3 元素嘉当矩阵\n\n**元素——而非质子或中子——才是 CQM 超导主丛结构群的理想根系统。**\n\nBCS 理论揭示**同位素效应**：同一元素的不同同位素（不同中子数 $N$）$T_c$ 差异极大。这证明元素内部存在**主次结构**：\n\n| 扇区 | 结构 | 角色 |\n|------|------|------|\n| **质子扇区（主结构）** | $\\bigoplus^{Z} A_4$，纯 A4 块对角，谱间隙 $\\lambda_1=(3-\\sqrt{5})/2$ | **主结构** |\n| **中子扇区（次结构）** | $\\bigoplus^{N} D(\\delta)$，缺陷 A4 非对角元（$\\alpha_4$ 末端） | **次结构** |\n\n元素嘉当矩阵：\n\n$$\\mathcal{C}_{\\text{element}} = \\left(\\bigoplus_{i=1}^{Z} A_4\\right) \\oplus \\left(\\bigoplus_{j=1}^{N} D(\\delta_j)\\right)$$\n\n其中中子缺陷参数 $\\delta(Z, N)$ 是**依赖元素（$Z$）和同位素（$N$）的变量**，描述中子扇区对纯 A4 的偏离。$\\delta(Z,N)$ 的函数形式从 $SU(5)$ 重组实现动力学导出（见 `CQM_超导_专题与扩展.md` §11.8）：$\\delta(Z,N) = 1 - \\varepsilon_0 \\cdot N/(Z+N)$，$\\varepsilon_0 = 0.0012$（自由中子锚点）。壳层鲁棒性定理保证壳层结构对所有 $|\\delta| \u003c \\sqrt{8/3}$ 不变。同位素效应（§2.3 补注、G15）由 $\\delta$ 随 $N$ 变化自然给出。\n\n> **§2.3 补注 — N2 微扰质量（δ = 1 质子极限附近的谱体积展开，全部 Lean 验证，`SPAF.lean` N2 节）**\n>\n> 对角参数 $\\varepsilon_{\\text{vol}}(\\delta)=\\frac34(\\delta^2-1)$ 在质子极限 $\\delta=1+\\eta$ 处展开：\n> $$\\varepsilon_{\\text{vol}}(1+\\eta)=\\tfrac32\\eta+\\tfrac34\\eta^2,\\qquad \\det D(1+\\eta)=5-6\\eta-3\\eta^2$$\n> 一阶系数 $3/2$、$-6$ 主导，二阶项同号增强。$\\det D(\\delta)$ 在 $\\delta\\ge 0$ 半轴严格单调递减（$\\mathrm{d}/\\mathrm{d}\\delta=-6\\delta\u003c0$），故：\n> $$\\delta>1\\;\\Rightarrow\\;\\det D(\\delta)\u003c5=\\det A_4;\\qquad 0\\le\\delta\u003c1\\;\\Rightarrow\\;\\det D(\\delta)>5$$\n> 中子缺陷对纯 A4 的偏离是**微扰级形变**（$|\\varepsilon_{\\text{vol}}|\\ll 1$），支撑“同位素效应由主次结构谱间隙差驱动（G15）而缺陷本身为小量”的图景。$\\delta(Z,N) = 1 - \\varepsilon_0 \\cdot N/(Z+N)$ 从 $SU(5)$ 重组实现动力学导出（见 `CQM_超导_专题与扩展.md` §11.8），数值上紧邻 1 表明缺陷是小量。\n\n### 2.4 中子扇区作为精细引力的结构性来源\n\n精细引力 FG 由 Regge 角亏 $\\delta_v$ **直接给出**（见 §5.4），它是 GR 基态的非平庸激发态（非平庸因果网络），不存在“中子按下开关才触发 FG”的动态过程。中子扇区的角色是**结构性来源**：中子缺陷 $\\alpha_4$ 提供 Regge 铰链，从而**决定角亏的数值与谱**（即 FG 的强度分布），但 FG 本身是角亏的直接后果。\n\n质子-质子对也能形成 Regge 铰链并激活 FG。两个完整 $A_4$ 通过单纯复形粘合时，若共享三角面且二面角非平直，同样产生非零角亏、同样激活 FG。只是一般情形下质子-质子对难以形成铰链：纯质子系统中质子间库仑排斥强，难以达到形成内部铰链所需的紧密几何构型。**中子-质子对之所以成为元素的 FG 存在论前提**，是因为（1）中子的电中性允许质子-中子紧密粘合，避开库仑排斥壁垒；（2）$\\delta\\neq 1$ 的缺陷使铰链更容易形成。因此中子不是 FG 的唯一来源，而是**元素尺度上 FG 得以稳定存在的构造性前提**——无中子时 FG 在原理上仍可被质子-质子铰链激活，但几何上极难实现。\n\n元素内部的主次结构（§2.3）对应精细引力的角亏来源：中子扇区的末端缺陷 $\\alpha_4$ 提供 Regge 铰链（见 `01 核心理论/CQM_核心_引力存在论前提.md` §二），是晶胞角亏 $\\delta_v$ 的微观起源；纯主结构（无中子缺陷）则无角亏涨落——这是“有无角亏来源”的区别，不是“是否触发 FG”的区别。派生链为：\n\n$$\\boxed{\\text{有限本体粘合（中子缺陷 }\\alpha_4\\text{ 或质子-质子非平直二面角）} \\;\\Rightarrow\\; \\text{Regge 铰链} \\;\\Rightarrow\\; \\text{底空间 Regge 曲率（角亏）} \\delta_v \\;\\Rightarrow\\; \\text{主丛 } P(M,G)\\text{（直接给出，非触发）}}$$\n\n**金属氢（Z=1, N=0）是纯主结构的极限**——氢核 = 单个质子，无中子扇区，晶格无 Regge 角亏涨落（$\\Delta\\delta_v=0$），故不超导。这与“金属氢相需含畸变/缺陷方提供角亏”一致（见 G18）。注意：此极限不排斥“质子-质子铰链在原理上可激活 FG”，只说明单质子氢核在元素尺度无铰链几何。\n\n### 2.5 从元素到晶胞：半唯像框架路线\n\n元素嘉当矩阵向上组装为**分子有效超级嘉当矩阵**，再经周期性凝聚得到**晶胞嘉当矩阵**；Regge 晶胞/角亏由晶胞几何分布**独立生成**。晶胞嘉当矩阵与 Regge 晶胞共同构成当前 CQM 超导的唯象建模对象（正式分工见 §3 晶胞层两条独立链）：\n\n1. **质子嘉当矩阵** $\\mathcal{C}_p = A_4$（纯 A4，无缺陷）\n2. **中子嘉当矩阵** $\\mathcal{C}_n(\\delta) = D(\\delta)$（$\\alpha_4$ 末端非对角元缺陷）\n3. **元素嘉当矩阵** $\\mathcal{C}_{\\text{element}} = \\bigoplus^Z \\mathcal{C}_p \\oplus \\bigoplus^N \\mathcal{C}_n$（理想拼接）\n4. **分子有效超级嘉当矩阵** $\\mathcal{C}_{\\text{mol}} = \\bigoplus_k \\mathcal{C}_{\\text{element}}(k) + \\sum_{i\u003cj} T_{ij}$（跨原子因果耦合 $T_{ij} = t_{ij}\\cdot I_4$，需相对位置计算）\n5. **晶胞嘉当矩阵** $\\mathcal{C}_{\\text{unit\\_cell}}$（链B：分子杂化 → 周期性凝聚，构造性计算非粗粒化；经内禀 Weyl 矩阵嵌入给出结构群，**仅限定**可实现的曲率谱，**不直接生成** Regge 晶胞）\n6. **Regge 晶胞与角亏 $\\delta_v$**（链A：晶胞几何分布独立生成，见 §4）→ FG 退相干场\n\n当前建模对象是**晶胞**——链A（几何分布）生成底空间 Regge 曲率（角亏）数值，链B（晶胞嘉当矩阵）决定角亏可实现谱，两者在主丛处汇合（§3.2、§5）。真实材料的超导发生在晶胞及其分布层面，CQM 原理与最前沿实验（复杂晶胞/多相联合超导）在方向上保持一致。形式化管线见 `MolecularGeometry.lean`。\n\n---\n\n## 3. 晶胞层：两条独立链\n\n### 3.1 两条链的定义\n\n| 链 | 内容 | 输出 | 物理输出 |\n|----|------|------|------|\n| **链 A** | 核子 → 原子核 → 原子 → 分子 → 晶胞空间分布 | 实际几何：键长、键角、缺陷、晶界、向错 | 角亏各向异性 → 底空间 Regge 曲率谱 |\n| **链 B** | 核子 A4 → 原子核交织 → 原子商空间 → 分子杂化 → 晶胞嘉当矩阵 | 纤维 + 结构群（构造性计算，非粗粒化） | 结构群 $G_\\ell$ 谱条件 |\n\n### 3.2 两条链的关系要点\n\n- **链 B 不是粗粒化**，而是一套从质子/中子 A4 到晶胞嘉当矩阵的**构造性计算**（逐级发生学：核子交织 → 原子商空间 → 分子杂化 → 周期性凝聚）。\n- **电子不需要显式输入**：电子是基态耦合常数 $\\alpha$ 的对应，已在系统中存在（角亏涨落越阈前不表现为配对态）。\n- **链 A 决定底空间 Regge 曲率（角亏）数值**；**链 B 决定角亏可实现谱**；两者在主丛处汇合。\n- 晶胞嘉当矩阵**不直接生成** Regge 晶胞，但通过结构群限定可实现的丛曲率。\n- **结论**：d 波/p 波区分由 $\\gamma_n$（黎曼零点序号映射）给出——$\\gamma_n$ 映射从嘉当矩阵谱间隙第一性推导。该结论的数值验证无可复核产物。\n\n### 3.3 嘉当矩阵计算链\n\n从质子A4嘉当矩阵出发，一路给出晶胞嘉当矩阵：\n\n$$\\mathcal{C}_{\\text{proton}} = A_4 \\xrightarrow{\\text{链B}} \\mathcal{C}_{\\text{element}} \\xrightarrow{\\text{链B}} \\mathcal{C}_{\\text{molecule}} \\xrightarrow{\\text{链B}} \\mathcal{C}_{\\text{unit\\_cell}} \\xrightarrow{\\text{链B}} \\mathcal{C}_{\\text{crystal}}$$\n\n链 A 同时给出晶胞的空间分布几何（键长、键角、缺陷位置）。\n\n---\n\n## 4. Regge 几何（底空间离散曲率）\n\n由链 A 的晶胞分布独立计算——主丛 $P(M,G)$ 的底空间 $M$ 上的底空间 Regge 曲率（= 底空间曲率 = Regge 角亏）：\n\n$$\\boxed{\\delta_v = 2\\pi - \\sum_{\\Delta \\ni v} \\arccos\\left(\\frac{l_{ij}^2 + l_{ik}^2 - l_{jk}^2}{2l_{ij} l_{ik}}\\right)}$$\n\n### 4.1 维度门槛\n\n| 外部维度 | Regge 铰链 | 角亏 | 精细引力 |\n|---------|-----------|------|---------|\n| 1D | 无 | 0 | **无** |\n| 2D | 有 | 非零（缺陷处） | **激活** |\n| 3D | 有 | 更丰富 | 更强 |\n\n### 4.2 角亏不受牛顿常数限制\n\nRegge 角亏由晶格几何直接给出，**不受牛顿常数 $G_N$ 限制**（精细引力不表现为几何吸引/测地线限制）。FG 不走 Regge→GR 连续极限→Poisson 方程路径——它直接由 Regge 角亏给出。\n\n---\n\n## 5. FG 底空间上的主丛 P(M,G)\n\n### 5.1 主丛要素\n\n| 要素 | 来源 |\n|------|------|\n| 先在规范结构 | U(1)×SU(2)×SU(3) 三丛（物质自组织内禀的基态结构，非 FG 创造；与三维空间相关） |\n| 底空间 $M$ | 链 A（物质晶胞分布 → Regge 晶胞分布；底空间是物质自组织的空间形态本身） |\n| 纤维 $F$ | 链 B（A4 根空间 $\\simeq \\mathbb{C}^4$，三丛之上自组织展开的内部结构） |\n| 结构群 $G_{\\text{FG}}$ | 链 B（$U(1)_{\\text{em}} \\times SO(2)_{\\text{space}} \\times SU(4)_{\\text{internal}}$，三丛基态结构之上自组织展开的更高层级对称性） |\n| 联络 $\\mathcal{A}_{\\text{FG}}$ | 底空间联络，由 Regge 晶胞分步生成（底空间 Regge 曲率/角亏 $\\delta_v$） |\n| 曲率 | 一个联络 $\\mathcal{A}_{\\text{FG}}$ 生成两种曲率：①底空间 Regge 曲率——Regge 角亏 $\\delta_v$（离散曲率，进入不确定性关系）；②伴丛曲率——$F=d\\mathcal{A}+\\mathcal{A}\\wedge\\mathcal{A}$（进入伴丛运动方程 $D*F=*J_\\Phi$）。同一联络，两种曲率，各自遵循不同的数学规则 |\n| 和乐 $W_v$ | 绕向错闭合回路：$W_v = \\exp(i\\delta_v \\hat{T})$（$\\hat{T}$ 为结构群李代数生成元；和乐平庸化 = 超导的局域必要条件） |\n\n### 5.2 和乐相位\n\n$$\\phi_\\alpha^{(v)} \\approx \\delta_v \\cdot \\theta_\\alpha$$\n\n其中 $\\theta_\\alpha$ 是 A4 根空间特征角，由 Dynkin 图几何决定。\n\n### 5.3 电子作为基态耦合对应\n\n$$\\boxed{\\text{电子} = \\text{基态耦合常数 }\\alpha\\text{ 的对应}}$$\n\n电子携带 A4 根指标（主丛结构群表示权重），作为伴丛截面存在。它是关系性历史产物（来自质子-中子关系网络的历史拓扑路径），但在超导问题中已经“在场”——系统中已有电子。**电荷、质量、自旋**全部编码于主丛的拓扑结构中。配对与否的区别仅在于耦合常数是否完成 $\\alpha\\to n^2\\alpha$ 跃迁（由丛作用量竞争选出主导 $n$，见下方本体论分层）。\n\n**本体论分层（电子 vs 库珀对）**：电子是**基态耦合常数 $\\alpha$** 的对应——它是关系性历史产物，但在超导问题中已经“在场”：系统中已有电子，只是耦合常数停在 $\\alpha$ 而未跃迁。**库珀对是跃迁耦合常数 $4\\alpha$（$n=2$）的对应**。因此“配对”的本质不是“制造出电子”，而是**耦合常数从 $\\alpha$ 跃迁到 $n^2\\alpha$**——电子（基态对应）因角亏涨落不足、资格条件未满足而无候选跃迁；一旦 $\\Delta\\delta_v$ 满足资格条件、路径积分选出主导 $n$、$\\alpha\\to n^2\\alpha$ 跃迁触发，同一批电子便在精细引力的因果条件下自组织为 $n$ 体束缚态。电子是前提，束缚态是前提的跃迁结果。\n\n### 5.4 FG 的精确定义\n\nFG 是 GR 基态的非平庸激发态，是 GR 在深度层级上的非吸引力效应：不表现为几何吸引/测地线限制，而是**主丛上的因果限制/退相干场强度**，由底空间 Regge 角亏直接给出，不受 $G_N$ 限制。FG 对应非平庸因果网络（主丛，激发态），GR 对应平庸因果网络（时空，基态）。**FG 是底空间 Regge 曲率的直接后果，不存在“中子触发 FG”的动态过程**——中子缺陷（或质子-质子非平直粘合）提供角亏的微观结构性来源（见 §2.4）。在超导机制中，FG 的角色是：\n- **因果条件**：通过底空间 Regge 曲率（Regge 角亏）对电子配对通道施加相容性筛选\n- **退相干场**：将叠加态投影到与因果拓扑相容的子空间\n- **非吸引力**：不提供配对吸引力（吸引力仍来自电子-声子耦合），只筛选哪些通道可以配对\n\n### 5.5 前时空 vs FG vs GR：对比总表\n\n| | **前时空** | **精细引力 FG** | **经典引力 GR** |\n| ----------- | --------------------------------------------------------------- | ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | ----------------------------------------------------------------------------------- |\n| **存在论地位** | 物质处于前时空的状态。物质从无限的“质”中自组织为有限本体（质子/中子）的前网络理论，是全部后续层级展开的逻辑地基。 | 深度前提（层级激发）。**不是独立的“第三种力”，而是 GR 基态的非平庸激发态。** 物质在凝聚态内部层级上通过自组织构造出的非平庸因果网络，是连接前时空与 GR（平滑时空）的关键中介。 | 广度前提（平滑展开）。退相干后的平庸因果网络——即“时空”本身。覆盖从核子到可观测宇宙的最大尺度。 |\n| **本体根基** | 终极物质关系网络。物理实在不在禁闭内部（禁闭内部只是 QCD），而是 **FG**；谱结构经 GL(5) 紧化投影与黎曼非平凡零点有关。 | **物质晶胞**（原子/分子构成的实际物质实体）→ 抽象为 **Regge 晶胞**（离散几何：顶点、边、二面角、角亏）→ 构成 FG 非平庸底空间。**物质晶胞是本体，Regge 晶胞是其几何映射，二者不可混同。** | 质子/中子的平庸关系网络。GR 是物质复杂关系网络被平滑化后的形态——微观的关系网络结构（晶胞、角亏、内部层级）被完全抹去，只留下能动张量。 |\n| **因果网络状态** | 物质处于前时空的状态：尚未分化。禁闭内部演化幺正；时空尚未涌现，只有因果序 $\\prec$。 | **展开性同步前提 / 层级态 / 非平庸态。** 物质在自身内部构造出的非平庸因果网络，具有内禀的离散几何结构和层级深度。 | **基底性同步前提 / 平庸态。** 双向干涉冻结，量子叠加退化为经典混合态，非交换代数粗粒化为交换几何。 |\n| **底空间** | 前时空（尚未分化）。不存在连续底空间、维度或流形。 | **物质晶胞分布**（实际物质布局）→ **Regge 晶胞分布**（离散几何抽象）→ FG 底空间。**底空间是物质自组织的空间形态本身。** | 时空流形（平滑化的物质分布抽象）——伪黎曼流形。 |\n| **规范/纤维结构** | 前结构（尚未层级化）。U(1)×SU(2)×SU(3) 处于潜在/未分化状态，等待退相干后的涌现。 | **先在的 U(1)×SU(2)×SU(3) × 物质自组织展开（无限/未定）。** 这三个规范丛不是 FG 创造的，而是物质自组织在内部层级上内禀的基态结构；在此基础之上，物质可进一步自组织出更复杂的内部层级（如 $A_4$ 根空间、SU(4) 内部对称性等），展开方向无限、未定。 | U(1)×SU(2)×SU(3) 在平庸底空间上的平滑展开。**U(1)×SU(2)×SU(3) 与三维空间相关**，切空间是三维空间的线性化、同质化表现。 |\n| **源** | 前源（尚未显现）。能动张量、角亏、电荷等概念尚未分化。 | **物质晶胞分布的内禀不均匀性**，由 Regge 角亏 $\\delta_v$ 几何度量。角亏是物质组织形态的缺陷度量。 | 能动张量 $T_{\\mu\\nu}$。 |\n| **源的位置** | —（尚未分化，无内外之分）。 | **内禀：源即底空间自身的结构。** 物质晶胞分布的不均匀性直接构成 Regge 角亏 $\\delta_v$；Regge 晶胞分步生成底空间联络 $\\mathcal{A}_{\\text{FG}}$；同一联络 $\\mathcal{A}_{\\text{FG}}$ 生成两种曲率——底空间 Regge 曲率（Regge 角亏 $\\delta_v$，参与不确定性关系 $\\delta_v \\to \\Delta v_\\tau \\to \\Delta r/\\langle r\\rangle$）与伴丛曲率（$F=d\\mathcal{A}+\\mathcal{A}\\wedge\\mathcal{A}$，参与伴丛运动方程 $D*F=*J_\\Phi$）。一个联络，两种曲率，各自遵循不同的数学规则。 | **外部：源作为内容作用于先验背景（表现）。** GR 实际上并无独立于物质的先验背景。 |\n| **曲率结构** | 谱经 GL(5) 紧化投影与黎曼零点 $\\gamma_n$ 有关（前时空层）。决定物质能否以有限本体形式自组织出来。 | **底空间联络 $\\mathcal{A}_{\\text{FG}}$ 生成两种曲率**：①底空间 Regge 曲率——离散角亏 $\\delta_v$（底空间几何缺陷）；②伴丛曲率——$F = d\\mathcal{A} + \\mathcal{A}\\wedge\\mathcal{A}$，和乐 $W_v = \\exp(i\\delta_v \\hat{T})$。一个联络，两种曲率。 | 黎曼曲率 $R^\\rho_{\\sigma\\mu\\nu}$。 |\n| **曲率作用** | 前组织条件（自组织的最原始形式）。黎曼零点谱作为“资格审查”的原始形态，决定物质有限化是否可能。 | **自组织。** 物质通过角亏-联络-曲率机制**自我展开**：晶胞量子振荡改变角亏，角亏改变联络，联络限定耦合常数，耦合常数跃迁生成库珀对——曲率是物质自组织过程的内禀因果条件。 | 测地线限制。决定已有经典实体在平庸背景中的运动轨迹，不参与新层级的创生。 |\n| **关系网络性质** | 前展开：物质对无限“质”的自组织。 | **自我展开：** 物质同时是网络构成者（晶胞构造底空间）又是曲率源（角亏生成联络），在此网络中持续涌现新层级（电子、库珀对）。 | **前时空退相干后的表现：** 物质被统计为能量密度，在背景中被动运动，失去了作为网络构成者的主体性。 |\n| **层级创生** | 尚未分化。只存在最基础的有限本体（质子/中子）。 | **有：** 从核子到晶胞到电子到配对，新层级持续涌现。每一次耦合常数跃迁（如 $\\alpha \\to n^2\\alpha$）都是网络内部结构的重组，创造出前一层级不具备的组织形式。 | **无：** 物质始终停留在经典质点/场层级，无法解释电子、库珀对等如何从更基本组分中涌现。 |\n| **空间生成** | 维度尚未涌现。空间、时间、内部自由度处于前分化状态。 | **U(1)×SU(2)×SU(3) 三个规范丛在 FG 底空间上的展开与三维空间相关。** 这三个丛是先在的基态结构，它们在物质晶胞构成的非平庸底空间上展开；物质自组织可在此基础上进一步展开额外结构。 | **U(1)×SU(2)×SU(3) 在平庸底空间上的平滑展开与三维空间相关。** 切空间是三维空间的同质化、线性化表现，已抹去了物质内部层级。 |\n\n> 注：表中“基态/激发态”按**因果网络状态**定义：基态 = 退相干冻结的平庸因果网络（GR），激发态 = 物质自组织构造的非平庸因果网络（FG）——这是存在论分类，不是量子力学真空激发的类比（见 `01 核心理论/CQM_核心_引力存在论前提.md` §3）。FG 与 GR 同源、不同层：GR 是广度（平庸时空背景 = 基态），FG 是深度（GR 基态的非平庸激发态，物质结构内部的层级因果条件）。本表与 `01 核心理论/CQM_核心_引力存在论前提.md` §4“前时空 vs FG vs GR：对比总表”为同一基准表的同步副本。\n\n### 5.6 涨落伴丛与扇区化\n\n#### 耦合常数指定结构群\n\nCQM 的耦合常数涨落需明确指定所属结构群：$u_G = \\ln g_G$，$[u_G, p_{u_G}] = i$（超导扇区 $u_{U(1)} = \\ln\\alpha$，下文记作 $u$）。超导扇区为 $U(1)_{\\text{em}}$，涨落 $u_{U(1)}$，跃迁耦级谱 $2\\ln n$（$n=2,4,6,\\ldots$），资格条件 $\\Delta\\delta_0 \\ge ☯\\sqrt{1-\\beta\\delta_v}/(2\\beta\\ln n)$。每个结构群只有一个耦合常数，荷是表示矩阵 $T^a$ 的本征值（多样化）。有效荷 $= g_G \\times q_R$，耦合常数跃迁时该扇区所有荷同步改变。\n\n> **定位注（为什么是 U(1) 扇区）**：海森堡代数 $[u_G, p_{u_G}]=i$ 是一维的——$u_G=\\ln g_G$ 作为全局单坐标定义，当且仅当结构群是一维阿贝尔群（$S^1$ 及其商 $U(1)//\\mathbb{Z}_n$）。非阿贝尔群的对数是局部且多值的（Baker–Campbell–Hausdorff 级数），无法定义单一海森堡对。因此耦合常数算符的合法定义域是 GL(5) 固定层级 $U(1)$（内部性+阿贝尔性双重强制）；超导扇区是 $U(1)_{\\text{em}}$ 由此是必然选择而非设定，候选群族 $\\{U(1)//\\mathbb{Z}_n \\mid n\\text{ 偶}\\}$ 的全部成员都是一维阿贝尔群（$U(1)//\\mathbb{Z}_n\\cong S^1$，成员间差别是表示内容：权 $q$ 表示当且仅当 $n\\mid q$ 时下降——电荷量子化扇区），海森堡代数在每一个上都良定义。详见 `07 精细引力（FG）/FG_核心理论.md` §4.1 定位注。\n\n#### 涨落伴丛（耦合常数涨落的产物）\n\n耦合常数涨落作用在主丛结构群 $G$ 上，产生涨落伴丛——涨落伴丛是耦合常数涨落的**产物**，不是涨落作用的舞台。条件是分层的：\n\n$$\\underbrace{[\\hat{u},\\hat{p}_u]=i}_{\\substack{\\text{条件}_1\\\\\\text{海森堡一维性}}}\\;\\Rightarrow\\;\\underbrace{U(1)}_{\\substack{\\text{条件}_1\\text{产物}\\\\\\text{=条件}_2\\text{对象}}}\\;\\xRightarrow{\\;\\mathbb{Z}_n\\text{ 商}\\;}\\;\\underbrace{U(1)//\\mathbb{Z}_n}_{\\substack{\\text{条件}_2\\text{产物}\\\\\\text{=丛构造输入}}}\\;\\Rightarrow\\;\\underbrace{E_n}_{\\text{产物}}$$\n\n- **条件$_1$**：海森堡代数一维性 → 结构群必须一维阿贝尔 → 产物 $U(1)$\n- **条件$_2$**：$\\mathbb{Z}_n$（电荷量子化：权 $q$ 表示当且仅当 $n\\mid q$ 时下降）商限定 $U(1)$ → 产物 $U(1)//\\mathbb{Z}_n$\n- **丛构造**：每个 $U(1)//\\mathbb{Z}_n$ 给出伴丛 $E_n = P\\times_{G_n}\\mathbb{C}$\n\n涨落伴丛是**伴丛族**（不是群族——承载序参量的是伴丛，不是群集合）：\n\n$$\\mathcal{E}_{\\text{涨落}} = \\{E_n = P\\times_{G_n}\\mathbb{C} \\mid G_n \\in \\mathcal{G}\\}, \\quad \\mathcal{G} = \\{U(1)//\\mathbb{Z}_n \\mid n\\text{ 偶}\\}$$\n\n三重条件（和乐+拓扑+表示）圈定候选群族 $\\mathcal{G}$，不唯一决定。具体剩余群是 $\\{e\\}$、$\\mathbb{Z}_2$ 还是 $U(1)//\\mathbb{Z}_2$，由序参量表示和拓扑决定，实验上通过磁通量子化确定。路径积分在**伴丛族** $\\mathcal{E}_{\\text{涨落}}$ 上选出主导伴丛 $E_{n^*}$（选群的目的是选丛）。\n\n#### 先在规范直积群\n\n$$G_0 = U(1) \\times SU(2) \\times SU(3)$$\n\n是物质自组织的基态规范骨架，不可还原。物质在先在规范群基础上，通过底空间 Regge 角亏、联络诱导固有时流速、主丛结构群上的耦合常数涨落，展开出具体层级的涨落伴丛结构。物质在某个层级看到的涨落伴丛结构群 $= G_0$ 经过所有扇区耦合常数涨落改造后的剩余结构。\n\n#### 对称性叠加\n\n耦合常数涨落后，$\\alpha \\to n^2\\alpha$（$n=2,4,6,\\ldots$），每个 $n$ 对应不同的结构群 $U(1)//\\mathbb{Z}_n$。因此**涨落后的耦合常数本身对应多个群**——结构群叠加态是耦合常数涨落的自然结果，不是额外假设：\n\n$$|\\Psi_{\\text{对称性}}\\rangle = \\sum_{n=2,4,6,\\ldots} c_n\\, |U(1)//\\mathbb{Z}_n\\rangle$$\n\n由底空间 Regge 角亏涨落与温度决定哪个群被宏观实现。超导相变不是对称性重组实现，而是结构群叠加态的退相干：\n\n- 正常态：$c_{U(1)}$ 占主导\n- 超导态：$c_{\\{e\\}}$ 或 $c_{\\mathbb{Z}_2}$ 占主导\n- 临界点 $T_c$：叠加最完整，两组权重相等\n\n#### 伴丛族路径积分\n\n$$Z = \\sum_{E_n \\in \\mathcal{E}_{\\text{涨落}}} \\int D[A,\\psi]\\, e^{-S_{E_n}[A,\\psi]}$$\n\n主导伴丛由丛作用量最小决定；跃迁条件（两个伴丛作用量相等）给出 $T_c$；离散子群保留（如 $U(1)//\\mathbb{Z}_2$）决定磁通量子化。超导大群是事后结果而非先验预设：\n\n$$G_{\\text{超导大群}} = \\left( \\prod_{\\text{所有扇区}} G_i \\right) \\Big/ \\left( \\text{被超导锁定的扇区} \\right)$$\n\n#### 超导群的多样性统一解释\n\n超导群之所以多样，是因为物质条件丰富。路径积分自动选出主导群：\n\n| 条件 | 主导超导群 |\n|:------|:-----------|\n| 角亏低，序参量标量 $q=2$ | $U(1)\\to\\{e\\}$ 或 $U(1)//\\mathbb{Z}_2$（s 波） |\n| 角亏各向异性，序参量在 $SO(2)$ 下变号 | $U(1)\\times SO(2)\\to\\mathbb{Z}_2$（d 波） |\n| 角亏含自旋扇区，序参量为三重态 | $U(1)\\times SU(2)\\to H_{\\text{spin}}$（p 波） |\n| 角亏强且和乐非平庸 | 拓扑超导群，马约拉纳零模 |\n\n群是计算结果。\n\n---\n\n## 6. 声子 = 底空间 Regge 曲率量子\n\n> **声子的系统理论**：声子是CQM的核心量子媒介——振荡的量子、曲率涨落的源、同步的前提、时空的前提。声子的三层结构（前时空/GR/FG）、与同步和时空的关系、时空同步前沿速度、与超导的关系等详见 `01 核心理论/CQM_核心_声子理论.md`。\n\n晶胞量子振荡导致底空间 Regge 曲率（角亏）涨落：\n\n$$\\delta_v(t) = \\delta_v^{(0)} + \\Delta\\delta_v(t)$$\n\n量子化：\n\n$$\\Delta\\delta_v(\\mathbf{r},t) = \\sum_{\\mathbf{q}} \\sqrt{\\frac{\\hbar}{2\\rho_m \\omega_{\\mathbf{q}}}} \\left( b_{\\mathbf{q}} + b_{-\\mathbf{q}}^{\\dagger} \\right) e^{i\\mathbf{q}\\cdot\\mathbf{r}}$$\n\n$$\\boxed{\\text{声子} = \\text{量子化底空间 Regge 曲率涨落} = \\text{FG 底空间 Regge 曲率（角亏）的动态激发}}$$\n\n声子在此不是独立晶胞量子振荡，而是 FG 底空间 Regge 曲率（角亏）的量子涨落，经联络诱导的固有时流速进入主丛结构群上的耦合常数动力学（§7-§8）。频率由底空间 Regge 曲率刚度决定 $\\hbar\\omega_{\\text{ph}} \\sim K_{\\text{eff}}(\\Delta\\delta_v)^2$。\n\n**与 `CQM_超导_统一方法论.md` §4 步骤 D 的关系（避免读作两种声子）**：此处给出的是**谱的物理来源**（曲率刚度的量级关系），`CQM_超导_统一方法论.md` 步骤 D 给出的 $\\omega_q = \\sqrt{\\text{eig}(D)}$ 是**同一谱的计算实现**（$D_{ij} = K_{ij}/\\sqrt{m_i m_j}$ 的数值对角化，$\\omega_D = \\max\\omega_q$）。二者不是两个独立的声子定义：步骤 D 是量级关系的具体计算，本节的关系是步骤 D 中 $K_{ij}$ 的物理含义。凡需数值 $\\omega_q$ 处，一律用步骤 D 的 $\\sqrt{\\text{eig}(D)}$。\n\n---\n\n## 7. 联络诱导的固有时流速\n\n### 7.1 底空间 Regge 曲率决定固有时\n\n$$\\boxed{\\frac{d\\tau}{dt} = \\sqrt{1 - \\beta \\,\\delta_v}}$$\n\n这是 GR 时间膨胀的类比：\n\n$$\\frac{d\\tau}{dt} = \\sqrt{-g_{00}} = \\sqrt{1 + 2\\Phi/c^2} \\approx 1 + \\frac{\\Phi}{c^2}$$\n\n（引力势 $\\Phi\u003c0$ 使 $\\sqrt{-g_{00}}\u003c1$：正曲率使时间变慢。CQM 中角亏 $\\delta_v>0$ 扮演正曲率角色，故 $\\sqrt{1-\\beta\\delta_v}\u003c1$，固有时流速减慢；小角亏极限 $\\sqrt{1-\\beta\\delta_v}\\approx1-\\beta\\delta_v/2$。）\n\n> **$\\beta$ 的微观来源**：$\\beta$ 是离散拉普拉斯算符的格林函数，$\\beta = \\frac{1}{4\\pi}\\ln\\frac{L}{a}$，其中 $L$ 为系统尺寸，$a$ 为晶格常数。$\\beta$ **对数依赖于系统尺寸**，不是材料常数。纳米颗粒 $\\beta$ 减小 $\\Rightarrow$ $T_c$ 降低（有限尺寸效应）。\n\n### 7.2 固有时 = 再生产周期\n\n固有时不是抽象时间参数，而是**物质再生产周期的几何化身**。曲率改变固有时流速，就是改变再生产周期在坐标时间中的流逝率。\n\n- 因果限制越强（$\\delta_v$ 越大），固有时流速越慢（$d\\tau/dt = \\sqrt{1-\\beta\\delta_v} \u003c 1$），再生产周期变慢——与黑洞冻结一致（§7.1）\n- 平直极限 $\\delta_v = 0$ 时 $d\\tau/dt = 1$，固有时与坐标时同步\n\n---\n\n## 8. 主丛结构群上的耦合常数涨落不确定性\n\n### 8.1 耦合坐标与耦合动量\n\n耦合坐标 $u = \\ln\\alpha$（$= u_{U(1)}$，$\\alpha$ 为精细结构常数，主丛结构群 $U(1)_{\\text{em}}$ 扇区的耦合常数），耦合动量：\n\n$$\\boxed{p_u = \\frac{1}{☯}\\frac{d\\tau}{dt}}$$\n\n其中 $☯ = \\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1}$ 是相变量子。\n\n### 8.2 海森堡代数\n\n主丛结构群上耦合常数涨落的海森堡代数：\n\n$$[\\hat{u}, \\hat{p}_u] = i$$\n\n### 8.3 底空间 Regge 曲率-结构群耦合常数不确定性关系\n\n由海森堡代数 $[\\hat u,\\hat p_u]=i$ 得 $\\Delta u\\cdot\\Delta p_u \\ge 1/2$（本框架采用的量子化约定，与 §9.2 资格条件及 §11.2 $T_c$ 公式一致）。代入 $p_u = \\sqrt{1-\\beta\\delta_v}/☯$（§7.1），$\\Delta p_u = \\frac{\\beta}{2☯\\sqrt{1-\\beta\\delta_v}}\\Delta\\delta_v$，因此：\n\n$$\\boxed{\\Delta u \\cdot \\Delta\\delta_v \\ge \\frac{☯\\sqrt{\\,1-\\beta\\delta_v\\,}}{\\beta}}$$\n\n**物理意义**：底空间 Regge 曲率涨落通过联络诱导的固有时流速涨落，强制主丛结构群上的耦合常数产生量子涨落。阈值由相变量子 $☯$、几何耦合参数 $\\beta$ 与背景底空间 Regge 曲率 $\\delta_v$ 共同决定。\n\n---\n\n## 9. 和乐表示的跃迁耦级谱 = 电荷量子化\n\n### 9.1 跃迁耦级谱\n\n$n$ 个电子复合体携带电荷 $ne$，有效精细结构常数跃迁：\n\n$$\\boxed{\\alpha \\to n^2\\alpha \\iff \\Delta u_n = 2\\ln n,\\qquad n = 2,4,6,\\cdots}$$\n\n- $n=2$：库珀对，$\\alpha \\to 4\\alpha$，$\\Delta u_2 = \\ln 4$，结构群 $U(1)//\\mathbb{Z}_2$\n- $n=4$：四电子凝聚，$\\alpha \\to 16\\alpha$，$\\Delta u_4 = 2\\ln 4$，结构群 $U(1)//\\mathbb{Z}_4$\n- $n=6$：六电子凝聚，$\\alpha \\to 36\\alpha$，$\\Delta u_6 = 2\\ln 6$，结构群 $U(1)//\\mathbb{Z}_6$\n\n**为何 $n$ 必须为偶数**：$n$ 个电子复合体在 $n$ 偶时为玻色子（可凝聚），$n$ 奇时为费米子（不可凝聚）。这是泡利统计的选择定则，不是额外假设。\n\n> **配对本质**：电子是基态耦合常数 $\\alpha$ 的对应，已在系统中存在；$n$ 电子凝聚是同一耦合常数跃迁到 $n^2\\alpha$ 的对应。**配对的本质即耦合常数的 $\\alpha\\to n^2\\alpha$ 跃迁**——不是“无中生有地产生电子”，而是已存在的电子在角亏涨落满足资格条件后被激发为凝聚态。超导与否的区别仅在于耦合常数是否完成了跃迁（见 §5.3 本体论分层）。\n\n> **$n=2$ 的 $A_4$ 表示论来源**：$\\mathbf{4} \\otimes \\mathbf{4} = \\mathbf{10}_s \\oplus \\mathbf{6}_a$，配对后有效内部空间维度从 16 压缩到 4，$\\ln(16/4) = \\ln 4 = 2\\ln 2$。这是 $A_4$ 表示论的严格推论，非唯象参数。更高 $n$ 对应更高阶复合体的表示论推广。\n\n### 9.2 资格条件\n\n由不确定性关系 $\\Delta u \\cdot \\Delta\\delta_v \\ge ☯\\sqrt{1-\\beta\\delta_v}/\\beta$（见 §8），要触及第 $n$ 级跃迁 $\\Delta u_n = 2\\ln n$ 所需最小曲率涨落：\n\n$$\\boxed{\\Delta\\delta_0 \\ge \\frac{☯\\sqrt{\\,1-\\beta\\delta_v\\,}}{2\\beta\\ln n}\\quad(n\\text{ 为跃迁耦级})}$$\n\n这是**资格条件**：底空间 Regge 曲率涨落必须足够大，才能让第 $n$ 级跃迁进入候选集。底空间 Regge 曲率涨落不直接决定跃迁是否发生——它决定哪些跃迁进入候选集，最终由丛作用量竞争（§11.2）选出主导群。\n\n### 9.3 正向链与反向链\n\n**正向链**（晶胞量子振荡 → 候选群族 → 丛作用量竞争 → 主导群）：\n\n$$\\text{晶胞量子振荡} \\to \\Delta\\delta_v \\to \\text{资格条件筛选} \\to \\text{候选群族 } \\mathcal{G} \\to \\text{路径积分} \\to G_{\\text{主导}}$$\n\n**反向链**（实验测得主导群 → 晶胞量子振荡）：\n\n$$\\text{实验测得 } h/ne \\to \\text{荷为 } ne \\to \\alpha\\to n^2\\alpha \\to \\Delta u_n = 2\\ln n \\to \\Delta\\delta_0 \\ge \\frac{☯\\sqrt{1-\\beta\\delta_v}}{2\\beta\\ln n} \\to \\text{晶胞量子振荡振幅}$$\n\n耦合涨落给出资格条件，但具体主导群由丛作用量竞争决定，实验上通过磁通量子化确定。\n\n---\n\n## 10. 伴丛同步：晶胞量子振荡与自组织-再生产\n\n配对/相干这一整套过程**就是晶胞量子振荡本身**——晶胞量子振荡（声子 = 底空间 Regge 曲率量子）携带底空间 Regge 曲率涨落、主丛结构群上的耦合常数响应与和乐相位关联的全部信息。本节陈述这一**单一主丛几何-动力学过程**，其终态即伴丛同步（§1.5）：晶胞量子振荡是各顶点的局域因果过程，超导态作为晶胞量子振荡全局相干模式涌现（§12.2），即 主丛的伴丛全局同步截面（再锁定）的建立。\n\n$$\\boxed{\\text{晶胞量子振荡（声子=底空间 Regge 曲率量子）} \\;\\Rightarrow\\; \\delta_v(t)=\\delta_v^{(0)}+\\Delta\\delta_v(t) \\;\\Rightarrow\\; \\text{不确定性 } \\Delta u\\cdot\\Delta\\delta_v\\ge \\frac{☯\\sqrt{1-\\beta\\delta_v}}{\\beta} \\;\\Rightarrow\\; \\text{资格条件筛出候选结构群族} \\;\\Rightarrow\\; \\text{结构群叠加态（= 同步算符）本征值交叉（§11.6）} \\;\\Rightarrow\\; \\text{丛作用量竞争选出主导群 } (\\alpha\\to n^2\\alpha) \\;\\Rightarrow\\; \\text{超导态}}$$\n\n**温度的统一作用**：温度通过改变晶胞量子振荡模式的声子数 $n_B(\\omega_{\\mathbf{q}})=(e^{\\hbar\\omega_{\\mathbf{q}}/k_BT}-1)^{-1}$，改变底空间 Regge 曲率涨落 $\\Delta\\delta_v(t)$ 的幅度谱与和乐相位关联长度，从而**影响自组织——再生产（晶胞量子振荡的维持）是自组织的一个环节，声子数变化首先作用于这一环节——进而影响配对与相干**。所有温度效应都出自这一条声子数，自然体现在底空间 Regge 曲率涨落的统计分布中。临界温度 $T_c$ 对应 $\\Delta\\delta_v$ 的统计分布使资格条件在全局平均上归零的临界点（见 §12.3）。\n\n### 10.1 和乐平庸化条件（晶胞量子振荡的内在单值性条件）\n\n绕局域缺陷（向错）一周后，主丛纤维上 A4 根指标的相位必须闭合——即和乐平庸化。这是晶胞量子振荡过程中自然满足的**单值性条件**——即主丛和乐平庸化（伴丛同步的**局域相位匹配条件**，§1.5）：只有和乐平庸化的量子振荡模式才能参与全局同步：\n\n$$\\mathcal{H}_{ij} = \\exp\\left(i\\oint_C \\omega_{\\alpha_i\\alpha_j}\\right) \\approx 1 \\pmod{2\\pi}$$\n\n**空间不均匀性的作用**（赝能隙的因果核心）：\n- **向错芯**（$\\delta_v$ 大）：单值性窗口宽 → $\\mathcal{H}_{ij}$ 容易 $\\approx 1$ → 通过\n- **晶粒内部**（$\\delta_v$ 小）：窗口窄 → 热漂移易使 $\\mathcal{H}_{ij}$ 偏离 $1$ → 失败\n\n热漂移 $\\Delta\\phi_{thermal}$ 由晶胞量子振荡声子数给出：有效窗口宽度 = $\\delta_v \\cdot \\xi_{coher} - \\Delta\\phi_{thermal}(T)$，温度升高 → 窗口收窄。\n\n### 10.2 赝能隙的本质：局域和乐平庸化但全局同步未完成（和乐平庸化条件的空间梯度）\n\n在同一温度 $T$ 下，上述和乐平庸化条件在空间上不均匀满足：\n\n| 空间区域 | 局域底空间 Regge 曲率 $\\delta_v$ | 有效窗口 | 结果 | 可观测表现 |\n|---------|-------------------|---------|------|-----------|\n| 向错芯 | 大 | 宽 | 通过 | 局域和乐平庸化 |\n| 晶粒内部 | 小 | 窄 | 失败 | 正常态 |\n| 全局平均 | 中等 | 中等 | 临界 | 取决于 $T$ 与平均窗口的关系 |\n\n**赝能隙** = 高底空间 Regge 曲率区局域和乐已平庸化（资格条件通过）、但全局和乐跃迁尚未发生的中间态——系统处于“准备好了但还没有统一行动”的结构群叠加态。**局域不可能跃迁，局域只能满足条件，跃迁是全局同步事件。** 全局跃迁需要足够多区域满足局域条件、这些区域通过主丛联络保持和乐相位相干、温度足够低、路径积分丛作用能使全局超导态丛作用量低于正常态。这是晶胞量子振荡空间不均匀性的直接产物。\n\n---\n\n## 11. 温度依赖与临界温度\n\n> 编号说明：§11.5、§11.7–§11.9、§11.11–§11.14 的内容见 `CQM_超导_专题与扩展.md` 对应节。\n\n### 11.1 相干曲率涨落\n\n温度通过玻色-爱因斯坦统计抑制相干曲率涨落：\n\n$$\\Delta\\delta_v(T) = \\Delta\\delta_0 \\sqrt{\\frac{1}{1 + 2n_B(\\Omega_0)}}$$\n\n其中 $n_B(\\Omega_0) = 1/(e^{\\hbar\\Omega_0/k_BT}-1)$ 是 Bose-Einstein 分布给出的平均声子数，$\\Omega_0$ 是主导曲率量子振荡模式频率，$\\Delta\\delta_0$ 是零温曲率涨落幅度。\n\n### 11.2 临界温度（丛作用量竞争，G22 公式推导完成、严格性待提升）\n\n**第一步：涨落幅度的温度依赖闭式。** §11.1 中 $n_B(\\Omega_0) = 1/(e^{\\hbar\\Omega_0/k_BT}-1)$ 满足恒等式：\n\n$$\\frac{1}{1+2n_B(\\Omega_0)} = \\frac{e^{\\hbar\\Omega_0/k_BT}-1}{e^{\\hbar\\Omega_0/k_BT}+1} = \\tanh\\frac{\\hbar\\Omega_0}{2k_BT}$$\n\n因此相干曲率涨落随温度单调衰减：\n\n$$\\boxed{\\Delta\\delta_v(T) = \\Delta\\delta_0 \\sqrt{\\tanh\\frac{\\hbar\\Omega_0}{2k_BT}}}$$\n\n零温 $T\\to0$：$\\Delta\\delta_v \\to \\Delta\\delta_0$；高温 $T\\to\\infty$：$\\Delta\\delta_v\\to 0$（涨落被声子热噪声完全抑制）。\n\n**第二步：候选群族与路径积分。** 资格条件（§9.2）筛选出候选群族：\n\n$$\\mathcal{G} = \\left\\{U(1)//\\mathbb{Z}_n \\;\\middle|\\; n \\text{ 偶},\\;\\Delta\\delta_0 \\ge \\frac{☯\\sqrt{1-\\beta\\delta_v}}{2\\beta\\ln n}\\right\\}$$\n\n路径积分在候选群族上选择主导群：\n\n$$\\boxed{Z = \\sum_{U(1)//\\mathbb{Z}_n \\in \\mathcal{G}} \\int D[A,\\psi]\\, e^{-S_{U(1)//\\mathbb{Z}_n}[A,\\psi]}}$$\n\n每个候选群的自由能：\n\n$$F_n = -k_B T \\ln \\int D[A,\\psi]\\, e^{-S_{U(1)//\\mathbb{Z}_n}}$$\n\n主导群由丛作用量最小决定：\n\n$$\\boxed{G_{\\text{主导}} = \\arg\\min_n F_n}$$\n\n**没有独立的“跃迁能级”。只有丛作用量竞争。** 路径积分直接选出丛作用量最低的结构群。\n\n**丛作用量的物理来源。** 丛作用量不是独立实体，由四部分构成：\n\n$$F_n = E_{\\text{角亏}}^{(n)} + E_{\\text{规范场}}^{(n)} + E_{\\text{序参量}}^{(n)} - T S_n$$\n\n1. **角亏能** $E_{\\text{角亏}} \\sim \\sum_v \\epsilon_v \\delta_v^2$：来自底空间 Regge 角亏，晶格几何缺陷越多越强则角亏能越高；\n2. **规范场能** $E_{\\text{规范场}} \\sim \\int \\text{Tr}(F\\wedge *F)$：来自伴丛曲率，结构群不同则规范场能不同；\n3. **序参量凝聚能** $E_{\\text{凝聚}} \u003c 0$：序参量凝聚（如库珀对场 $\\Delta$ 获得非零真空期望值）时系统能量降低，这是超导态比正常态能量更低的原因；\n4. **熵项** $-TS$：凝聚态更有序，熵更低（$S_{\\text{超导}} \u003c S_{\\text{正常}}$），因此熵项倾向于破坏超导；温度越高，熵项越重要。\n\n**丛作用量不是什么**：（1）不是跃迁能级——它不是“第 $n$ 级跃迁的能量”，而是系统处于某个结构群配置时的整体热力学势；（2）不是固定常数——它随温度、底空间 Regge 曲率涨落、材料结构而变；（3）不是额外的物理实体——它只是能量与熵竞争的数学总结。\n\n**当前状态**：丛作用量竞争作为选择机制框架正确，但 CQM 尚未给出可计算的作用量 $S_{U(1)//\\mathbb{Z}_n}$，$F_n$ 停留在形式定义。要变成可计算的量，必须构造：底空间 Regge 作用量（角亏几何如何贡献能量）、伴丛规范场作用量（$U(1)//\\mathbb{Z}_n$ 的联络和曲率）、序参量作用量（凝聚场的势能）、熵（结构群的态数）。这是 CQM 尚未完成的部分（属缺口 G18 的延伸）。\n\n**第三步：临界温度 = 丛作用量交叉。** $T_c$ 由两个主导群的丛作用量交叉给出——正常态（$n=1$，无凝聚）与超导态（$n=2$，库珀对）竞争：\n\n$$\\boxed{F_1(T_c) = F_2(T_c)}$$\n\n展开为 $F = E - TS$：\n\n$$\\boxed{T_c = \\frac{E_2 - E_1}{S_2 - S_1}}$$\n\n其中 $E_n$ 是结构群 $U(1)//\\mathbb{Z}_n$ 的宏观能量（来自作用量），$S_n$ 是熵。**不需要单独的“跃迁能级”概念。**\n\n**竞争机制**：因为凝聚使能量降低（$E_{\\text{凝聚}} \u003c E_{\\text{正常}}$），但超导态更有序（$S_{\\text{超导}} \u003c S_{\\text{正常}}$），所以低温下能量项占优、超导态自由能更低，高温下熵项占优、正常态自由能更低。相变发生在两个自由能相等的温度 $T_c$。\n\n> 超导相变由丛作用量交叉 $F_1(T_c) = F_2(T_c)$ 决定。\n\n> **深层根基（见 §11.6）**：丛作用量竞争本身不是最根本的选择机制——**超导同步算符 = 结构群叠加态的谱算符 = 前时空基态紧化结构（GL(5)/SU(5)）重组实现后子结构经 FG 激活后的再现**，其本征态就是结构群基矢 $|U(1)//\\mathbb{Z}_n\\rangle$，本征值为相变有效谱 $\\lambda_n(T)$（零温无角亏极限退化为黎曼零点 $\\gamma_n$）。相变 = 叠加态自身谱结构的本征值交叉 $\\lambda_2(T_c)=\\lambda_1(T_c)$，叠加态通过自组织退相干到本征值最低的分量，丛作用量交叉 $F_1(T_c)=F_2(T_c)$ 是其热力学投影。\n\n**第四步：结构群叠加态。** 在候选集内，结构群处于叠加态：\n\n$$|\\Psi\\rangle = \\sum_{n\\text{ 偶}} \\sqrt{w_n}\\,|U(1)//\\mathbb{Z}_n\\rangle,\\qquad w_n \\propto e^{-F_n/k_BT}$$\n\n权重由路径积分自由能决定。叠加态受跃迁耦级条件（候选集）和自由能条件（权重），不需要额外的能级概念。\n\n### 11.3 统计极限与 $\\zeta(s)$\n\n配对后电子服从费米-狄拉克统计。母积分 $I_s = \\int_0^\\infty x^{s-1}/(e^x+1)\\,dx = \\Gamma(s)(1-2^{1-s})\\zeta(s)$。三维费米子配对取 $s=3$：\n\n$$\\int_0^\\infty \\frac{x^2}{e^x+1}dx = \\frac{3}{2}\\zeta(3)$$\n\n二维超导对应 $s=2$，出现 $\\zeta(2) = \\pi^2/6$（费米积分因子）。\n\n### 11.4 温度破坏机制\n\n温度不是“能量注入”，而是伴丛同步的**去同步因素**（§1.5）——**通过晶胞量子振荡声子数改变自组织的再生产环节**：声子数 $n_B(\\omega_{\\mathbf{q}})$ 升高使角亏涨落 $\\Delta\\delta_v$ 幅度谱展宽、相位关联长度压缩，再生产（自组织的一个环节）的周期一致性被破坏。当热相位噪声超过和乐相位闭合的单值性窗口时，配对波函数的全局一致性被破坏，全局同步瓦解，超导通道指数级关闭。\n\n### 11.6 同步算符 = 结构群叠加态：相变机制的深层根基\n\n> 交叉引用：本节的算符形式与 $\\lambda_n(T)$、$T_c$ 闭式为一种参数化；其算符定义、温度项与符号与 §11.10（及 `CQM_超导_FG层级同步算符体系.md` §7）存在差异，数值计算一律以 §11.10 为准。\n\n**核心同一性。** 超导同步算符不是外在于结构群叠加态的选择机制——**它就是结构群叠加态自身的谱算符**。候选群族 $\\mathcal{G} = \\{U(1)//\\mathbb{Z}_n \\mid n \\text{ 偶}\\}$ 张成 Hilbert 空间 $\\mathcal{H}_{\\mathcal{G}}$，结构群叠加态 $|\\Psi\\rangle = \\sum_{n\\text{ 偶}} \\sqrt{w_n}\\,|U(1)//\\mathbb{Z}_n\\rangle$ 是此空间中的态。同步算符 $\\hat{\\mathcal{S}}_{\\text{super}}$（见 `01 核心理论/CQM_核心_因果网络同步理论.md` §4、§9：同步算符是**紧化算符**，不是 Hilbert–Pólya 算符）是此空间上的算符，**其本征态就是结构群基矢 $|U(1)//\\mathbb{Z}_n\\rangle$**：\n\n$$\\hat{\\mathcal{S}}_{\\text{super}}\\,|U(1)//\\mathbb{Z}_n\\rangle = \\lambda_n(T)\\,|U(1)//\\mathbb{Z}_n\\rangle$$\n\n其中 $\\lambda_n(T)$ 是**相变有效谱**（有限温度下的有效本征值，见下文 $\\lambda_n(T)$ 公式），零温无角亏极限下退化为 $\\gamma_n$（黎曼零点虚部，同步成本）。分层定位：超导同步算符作用于**GL(5) 固定层级结构群空间**——它是基态紧化算符 $\\hat{\\mathcal{S}}_0: \\mathcal{H}_{\\text{auto}}(GL(5)) \\to \\mathcal{H}_{\\text{phys}}(SU(5))$ 在 SU(5) 重组实现后子结构上的再现，黎曼零点通过紧化等价关系 $\\mathcal{C}_1(\\lambda_{\\text{phys}}, \\gamma_n) = 0$ 间接进入。\n\n**同步算符与 Hilbert–Pólya 算符的关系。** 同步算符是紧化算符（投影/条件型算符），**不是** Hilbert–Pólya 算符（微分算符）：Hilbert–Pólya 型算符 $\\hat{H}_{\\text{HP}} = -d^2/du^2 + 1/4 + \\sum_{p\u003c\\Lambda} \\frac{\\ln p}{\\sqrt{p}}\\delta(u-\\ln p) + \\text{（高阶修正）}$ 是黎曼零点谱的候选实现（其本征值给出耦级 $1/4 + \\gamma_n^2$），而同步算符的本征值（相变有效谱 $\\lambda_n(T)$，零温极限 $\\gamma_n$，同步成本）与之不同层级。两者的形式关系：\n\n$$\\hat{H}_{\\text{HP}} \\sim \\hat{\\mathcal{S}}_{\\text{super}}^2 + \\frac{1}{4}, \\qquad \\mathfrak{c}_n = \\frac{1}{4} + \\gamma_n^2 \\quad\\text{（耦级，导出量）}$$\n\n此关系是 GL(5) 固定层级的形式猜测，待严格证明（两类算符类型不同，紧化算符与微分算符之间的映射机制开放）。**同步成本 $\\gamma_n$ 是本根物理量，耦级 $1/4 + \\gamma_n^2$ 是导出量**。能级结构与实验比对证实本征值应为 $\\gamma_n$ 而非耦级：若用 $1/4 + \\gamma_n^2$，黎曼零点差 $\\gamma_2^2 - \\gamma_1^2 \\approx 242$ 太大，角亏激活无法克服；用 $\\gamma_n$，差值 $\\gamma_2 - \\gamma_1 \\approx 6.9$，角亏可克服（见下文超导条件）。\n\n因此：\n- **同步算符的本征值谱 = 叠加的结构群的相变有效谱** $\\{\\lambda_n(T)\\}$（零温极限退化为黎曼零点虚部 $\\{\\gamma_n\\}$，同步成本）\n- **超导同步算符 = 结构群叠加态的谱算符**——不是两个东西，是同一个东西的算符面与态面\n- 结构群叠加态 $|\\Psi\\rangle$ 是同步算符本征态的叠加；同步算符是叠加态自身的谱结构\n\n**同步算符 = 前时空紧化结构的再现（GL(5) 固定层级）。** 超导同步算符不是超导层级新产生的数学对象——它是前时空紧化结构通过 FG 激活后的再现。发生学链条（分层定位：前时空基态谱是 GL(5) 自守谱，紧化为 SU(5)；超导层级再现的是 SU(5) 重组实现后子结构）：\n\n$$\\text{前时空（基态 } GL(5)/SU(5) \\text{ 谱结构活跃）} \\xrightarrow{\\text{退相干}} \\text{GR（谱结构锁定为经典时空）} \\xrightarrow{\\text{FG 激活}} \\text{FG（子结构重新活跃）} \\xrightarrow{\\text{再锁定}} \\text{超导（子结构再现）}$$\n\n- **前时空**：基态谱空间 = 紧化算符 $\\hat{\\mathcal{S}}_0$ 作用下的 GL(5) 自守谱与 SU(5) 物理谱，前时空结构活跃（CNST §5：前时空＝物质处于前时空的状态）\n- **GR**：基底性同步前提，退相干冻结所有前时空自由度为经典时空，谱结构被“锁定”\n- **FG**：GR 基态的非平庸激发，角亏 $\\delta_v > 0$ **激活**被封存的前时空结构——不是消灭结构，而是重新打开被封存的前时空自由度\n- **超导**：FG 激发态的再锁定，前时空紧化结构在超导层级**再现**——同步算符（紧化算符）在 GL(5) 固定层级结构群空间上重新出现，本征值谱是相变有效谱 $\\lambda_n(T)$（零温极限退化为黎曼零点 $\\gamma_n$）\n\n因此超导同步算符的“来源”不是超导动力学自己创造的，而是前时空紧化结构经 FG 激活后在 GL(5) 固定层级的再现。**FG 本来就是激活前时空**——角亏涨落打开的前时空自由度，在超导再锁定时以同步算符（紧化算符）的形式重新组织。这与 CNST 的同步层级递进（§6.3.4）一致：每一次层级跃迁都是同一质数分布谱结构在不同层级上的重新组织。\n\n**有限温度的有效同步算符。** 零温无角亏极限下 $\\hat{\\mathcal{S}}_{\\text{super}}$ 的本征值退化为黎曼零点 $\\gamma_n$（若黎曼猜想——GL(5) 固定层级的实谱条件——成立，全部落在临界线上）。有限温度下，热声子噪声修正有效同步算符：\n\n$$\\hat{\\mathcal{S}}_{\\text{super}}(T) = \\hat{\\mathcal{S}}_0 + \\hat{V}_{\\text{热}}(T)$$\n\n其中 $\\hat{V}_{\\text{热}}(T)$ 是温度诱导的修正项——热噪声改变质数势的有效截断 $\\Lambda(T)$（温度越高，有效截断越低，质数势越弱），并引入热涨落修正。本征值 $\\lambda_n(T)$ 随温度移动：零温 $\\lambda_n(0) \\to \\gamma_n$，高温本征值被热修正推开。\n\n**相变 = 叠加态自身谱结构的本征值交叉。** 临界温度由结构群叠加态自身谱结构给出——正常态本征态 $|U(1)\\rangle$（$n=1$，无凝聚）与超导态本征态 $|U(1)//\\mathbb{Z}_2\\rangle$（$n=2$，库珀对）的有效本征值在 $T_c$ 交叉：\n\n$$\\boxed{\\lambda_2(T_c) = \\lambda_1(T_c)}$$\n\n低温下 $\\lambda_2 \u003c \\lambda_1$（超导态本征值更低，叠加态自组织退相干到 $|U(1)//\\mathbb{Z}_2\\rangle$）；高温下 $\\lambda_2 > \\lambda_1$（热修正使超导态本征值升高，叠加态自组织退相干到 $|U(1)\\rangle$）。**相变是叠加态自身谱结构在温度变化下的本征值交叉——叠加态通过自组织退相干到本征值最低的分量。**\n\n**丛作用量是同步算符的热力学投影。** 丛作用量 $F_n(T)$ 是同步算符本征值 $\\lambda_n(T)$ 在热力学层面的唯象导出量：\n\n$$F_n(T) = \\Phi\\big(\\lambda_n(T),\\, T\\big) + F_{\\text{熵修正}}(T)$$\n\n其中 $\\Phi$ 是单调递增函数（本征值越高，丛作用量越高），$F_{\\text{熵修正}}$ 是热力学熵的修正项。因此丛作用量交叉 $F_1(T_c)=F_2(T_c)$ 是同步算符本征值交叉 $\\lambda_1(T_c)=\\lambda_2(T_c)$ 的唯象表现——两者给出同一个 $T_c$，但同步算符交叉是更根本的判据。\n\n**为什么同步算符比丛作用量更根本。**\n\n1. **同一性**：同步算符 = 结构群叠加态的谱算符，是叠加态自身结构；丛作用量是叠加态的热力学投影，丢失了谱结构信息。\n2. **谱结构根基**：同步算符的本征值谱（相变有效谱，零温极限为黎曼零点）由 GL(5) 固定层级的紧化条件决定，这是数论-物理的深层联系；丛作用量没有这层联系。\n3. **黎曼猜想的物理入口**：黎曼猜想（GL(5) 固定层级的实谱条件）等价于该层级配对不变量 $\\mathfrak{c}_n=\\rho_n(1-\\rho_n)$ 为实，等价于物质同步稳定性（见 `CQM_超导_专题与扩展.md` §16）。若黎曼猜想不成立，配对不变量不为实，本征值交叉不给出唯一的 $T_c$——相变判据本身依赖于黎曼猜想。丛作用量竞争无法表达这层依赖。\n4. **与前时空的统一**：超导同步算符 = 前时空紧化结构在 GL(5) 固定层级的再现（FG 激活前时空），不是“共享”而是“同一个结构在不同层级的再现”。超导相变直接是前时空谱结构在凝聚态层级的显现。丛作用量是凝聚态层面的有效理论，无法表达这层再现关系。\n5. **跃迁耦级谱的来源**：跃迁耦级谱 $\\Delta u_n = 2\\ln n$ 和 Sierra-CQM 耦谱定理（渐近式 $\\mathfrak{c}_n = 1/4 + \\gamma_n^2 + O(\\gamma_n^2/n)$，相对误差 $O(1/n)$；**精确等同 $\\mathfrak{c}_n=1/4+\\gamma_n^2$ 属 CQM 框架自建构造，超出渐近定理范围；算符形式借自 Berry–Keating/Sierra，非 Sierra 2008/2011 原文的直接结果**——原文给出的是连续谱嵌入离散共振/与平均零点谱一致）（见 `01 核心理论/CQM_核心_集成理论.md` §8.1、§11.3）在 GL(5) 固定层级实现——Hilbert–Pólya 型算符 $\\hat{H}_{\\text{HP}}$ 的本征值给出耦级 $\\mathfrak{c}_n = 1/4 + \\gamma_n^2$（导出量），紧化算符本征值（同步成本 $\\gamma_n$，零温极限）与之不同层级。丛作用量竞争使用了跃迁耦级谱但无法解释其来源。\n\n**因果链中的位置。** 同步算符在因果链中的位置：\n\n$$\\text{底空间 Regge 曲率涨落} \\to \\text{资格条件筛出候选群族} \\to \\text{结构群叠加态（= 同步算符）本征值交叉} \\to \\text{丛作用量竞争（热力学投影）} \\to \\text{叠加态自组织退相干} \\to \\text{全局同步}$$\n\n资格条件筛出候选群族后，候选群族张成 Hilbert 空间，同步算符 = 此空间上结构群叠加态的谱算符。本征值交叉是叠加态自身谱结构的内禀事件，不是外部选择。丛作用量竞争是本征值交叉在热力学层面的投影——将谱结构的离散交叉投影为自由能的连续竞争。\n\n**超导同步算符的导出形式。** 同步算符从三个物理领域分别导出：(A) **静态部分** $\\hat{\\mathcal{S}}_0$ 从 Hilbert–Pólya 算符（数学：Riemann 零点结构），(B) **热涨落** $V_{\\text{热}}$ 从 Bose-Einstein 统计（热力学：声子分布），(C) **角亏涨落** $V_{\\delta}$ 从 Regge 作用量量子涨落（几何：离散 GR）。六条物理条件：(1) 零温无角亏 → $\\lambda_n \\to \\gamma_n$；(2) 角亏涨落 → 降低同步成本；(3) 温度 → 升高同步成本；(4) $n=1$ → 无角亏修正；(5) $\\Delta\\delta_0 = 0$ → 不超导；(6) 大 $n$ → 高模受温度抑制更强。超导同步算符形式：\n\n$$\\boxed{\\hat{\\mathcal{S}}_{\\text{super}}(T) = \\hat{P}_{\\text{资格}} \\left[\\hat{\\mathcal{S}}_0 + V_{\\text{热}}(u, T) + V_{\\delta}(u, \\delta_v, \\Delta\\delta_v)\\right] \\hat{P}_{\\text{资格}}}$$\n\n其中：\n- **前时空再现（GL(5) 固定层级谱实现）**：$\\hat{\\mathcal{S}}_0 = \\sqrt{\\hat{H}_{\\text{HP}} - 1/4}$，其中 $\\hat{H}_{\\text{HP}} = -d^2/du^2 + 1/4 + \\sum_{p\u003c\\Lambda(T)} \\frac{\\ln p}{\\sqrt{p}}\\delta(u-\\ln p)$ 为 Hilbert–Pólya 型算符（黎曼零点谱的候选实现，非同步算符本身），截断 $\\Lambda$ 温度依赖（温度越高，有效截断越低）。$\\hat{\\mathcal{S}}_0$ 本征值 $= \\gamma_n$（同步成本），耦级 $\\mathfrak{c}_n = 1/4 + \\gamma_n^2$ 为导出量\n- **资格投影**：$\\hat{P}_{\\text{资格}} = \\sum_{n \\text{ 偶},\\, \\Delta\\delta_0 \\geq \\frac{☯\\sqrt{1-\\beta\\delta_v}}{2\\beta\\ln n}} |U(1)//\\mathbb{Z}_n\\rangle\\langle U(1)//\\mathbb{Z}_n|$，将算符限制在候选群族上\n- **温度修正**：$V_{\\text{热}}(u, T) = \\left[\\coth\\frac{\\hbar\\Omega_0}{2k_BT} - 1\\right] \\cdot \\frac{u^2}{4}$，零温时为零，高温时增大，$u^2/4$ 标度使高耦级（大 $n$）模受温度抑制更强\n- **角亏激活**：$V_{\\delta}(u, \\delta_v, \\Delta\\delta_v) = -\\frac{\\beta^2 \\Delta\\delta_v^2}{4(1-\\beta\\delta_v)} \\cdot \\frac{e^u - 1}{e^u}$，负号（角亏降低同步成本），$\\Delta\\delta_v = 0$ 时为零，$(e^u-1)/e^u$ 因子确保 $n=1$（$u=0$）时角亏修正为零。角亏系数用 $\\beta^2$（非 $☯^2/\\beta^2$），因 $☯^2 \\approx 5.33 \\times 10^{-4}$ 太小，无法产生足够的角亏修正克服黎曼零点差\n\n本征态在 $u_n = 2\\ln n$ 处离散化（跃迁耦级量子化），有效本征值：\n\n$$\\boxed{\\lambda_n(T) = \\gamma_n + \\underbrace{\\left[\\coth\\frac{\\hbar\\Omega_0}{2k_BT} - 1\\right] (\\ln n)^2}_{\\text{温度修正}} - \\underbrace{\\frac{\\beta^2(n^2-1)\\,\\Delta\\delta_v^2}{4\\, n^2(1-\\beta\\delta_v)}}_{\\text{角亏激活}}}$$\n\n**条件验证**：\n\n| 条件 | 验证 |\n|:---|:---|\n| $T=0$, $\\Delta\\delta_v=0$ → 纯前时空再现 | $\\lambda_n = \\gamma_n$（同步成本 = 黎曼零点虚部）|\n| $n=1$（正常态）→ 无修正 | $\\lambda_1 = \\gamma_1$（两项修正均为0：$(\\ln 1)^2=0$，$(n^2-1)/n^2=0$）|\n| $\\Delta\\delta_v > 0$, $n > 1$ → 角亏降低 $\\lambda_n$ | 角亏项为负 |\n| $T > 0$, $n > 1$ → 温度升高 $\\lambda_n$ | 温度项为正 |\n| $\\Delta\\delta_0 = 0$（金属氢）→ 不超导 | $\\hat{P}_{\\text{资格}} = \\vert U(1)\\rangle\\langle U(1)\\vert$，只有 $n=1$ |\n| 大 $n$ → 高模受温度抑制更强 | 温度修正 $\\propto (\\ln n)^2$ 增大 |\n\n**$T_c$ 闭式**（本征值交叉 $\\lambda_2(T_c) = \\lambda_1(T_c)$，注意 $\\lambda_1 = \\gamma_1$ 无修正）：\n\n$$\\boxed{T_c = \\frac{\\hbar\\Omega_0}{2k_B\\,\\mathrm{arccoth}\\!\\left[1 + \\dfrac{\\dfrac{3\\beta^2\\,\\Delta\\delta_v^2}{16(1-\\beta\\delta_v)} - (\\gamma_2 - \\gamma_1)}{(\\ln 2)^2}\\right]}}$$\n\n物理行为：\n- $\\Delta\\delta_v$ 增大 → 角亏项增大 → 分子增大 → $\\mathrm{arccoth}$ 减小 → $T_c$ 升高（角亏涨落越大，$T_c$ 越高）\n- $\\delta_v$ 增大 → $1-\\beta\\delta_v$ 减小 → 角亏项增大 → $T_c$ 升高\n- $\\Delta\\delta_v \\to 0$ → 角亏项消失，分子 $\u003c 0$，无解——超导需要角亏激活先克服黎曼零点差\n- 黎曼零点差 $\\gamma_2 - \\gamma_1 \\approx 6.887315$（GL(5) 固定层级谱，经紧化条件进入）出现在 $T_c$ 中，直接体现前时空谱结构对超导相变的控制\n- 角亏激活 $\\to (\\gamma_2 - \\gamma_1)^+$ 时 $T_c \\to 0$（刚过阈值）；角亏激活 $\\gg \\gamma_2 - \\gamma_1$ 时 $T_c \\to \\infty$（强激活）\n\n**超导条件与可检验预言**：\n- **超导条件**：角亏激活必须克服黎曼零点差，即 $\\frac{3\\beta^2\\,\\Delta\\delta_v^2}{16(1-\\beta\\delta_v)} > \\gamma_2 - \\gamma_1 \\approx 6.887315$\n- **临界角亏涨落**：$\\Delta\\delta_c \\approx 0.20$（低于此值不超导，无论温度多低）\n- **各阶临界角亏涨落**（高阶跃迁需要更强角亏激活）：$\\Delta\\delta_c^{(n=2)} \\approx 0.20$，$\\Delta\\delta_c^{(n=4)} \\approx 0.27$，$\\Delta\\delta_c^{(n=6)} \\approx 0.32$——高阶跃迁只在强角亏涨落材料中出现\n- **高阶跃迁 $T_c$ 比值**（最可检验预言，仅在 $\\Delta\\delta_v > \\Delta\\delta_c^{(n=4)}$ 时有意义）：$T_c(4)/T_c(2) \\approx 0.13\\text{–}0.27$（随角亏涨落增大而增大），$T_c(6)/T_c(2) \\approx 0.11\\text{–}0.15$\n- **$\\Omega_0$ 是材料依赖的**（通过声子谱），$T_c$ 量级由 $\\Omega_0$ 决定，角亏修正决定超导资格与 $T_c$ 的精细值\n\n> **猜测状态说明**：以上算符形式和本征值公式是从六条物理条件出发的**猜测**，待严格推导。开放问题：(1) 温度修正 $V_{\\text{热}}$ 和角亏激活 $V_{\\delta}$ 的具体函数形式的严格推导（目前由条件唯象确定）；(2) 截断 $\\Lambda(T)$ 的显式形式；(3) 从前时空基态紧化算符（GL(5) 层）到超导同步算符（GL(5) 固定层级）的严格化“再现”映射及紧化等价关系 $\\mathcal{C}_1(\\lambda_{\\text{phys}}, \\gamma_n) = 0$ 的显式构造；(4) 同步算符（紧化算符）$\\hat{\\mathcal{S}}_{\\text{super}}$ 与 Hilbert–Pólya 型算符 $\\hat{H}_{\\text{HP}}$ 关系 $\\hat{H}_{\\text{HP}} \\sim \\hat{\\mathcal{S}}_{\\text{super}}^2 + 1/4$ 的严格证明（两类算符类型不同：紧化算符是投影/条件型，Hilbert–Pólya 型算符是微分型）；(5) 本征值用 $\\gamma_n$（非 $1/4 + \\gamma_n^2$）的严格推导——当前由能级结构与实验比对得出（$\\gamma_2^2 - \\gamma_1^2 \\approx 242$ 太大，角亏无法克服；$\\gamma_2 - \\gamma_1 \\approx 6.9$ 可被角亏克服）。\n\n> **与 §11.10 的 $T_c$ 闭式的关系**：本节闭式（$x$ 以 $(\\ln 2)^2$ 归一、含 $\\hbar\\Omega_0$）与本征值交叉推导链（§11.10，$x = 3\\beta^2\\Delta\\delta_0^2/[16(1-\\beta\\delta_v)(\\gamma_2-\\gamma_1)]$，含 $\\theta_D$）是同一物理机制（角亏激活克服黎曼零点差）的两种参数化，归一因子与温度标度不同，**不能同时引用**。数值计算以 §11.10 的闭式为准（该处给出 $\\mathrm{arccoth}$ 的统计身份与临界占据数 $\\bar n_c$）；本节闭式的参数化严格化属开放问题。\n\n> **实验现状：能级是表现，同步算符是本质。** 已有实验在量子信息平台观察到黎曼零点作为能级：He et al. 2020（Phys. Rev. A **101**, 043402）单量子比特 Floquet 实验——驱动参数与 ζ 零点重合时动力学冻结；He et al. 2021（npj Quantum Information **7**, 109）囚禁离子实验——高精度测量最低非平凡黎曼零点。但这些实验观察到的是**能级（表现）**——能级是同步算符本征值的唯象显现，实验尚未认识到能级背后的**同步算符（本质）**。超导直接关联：Sierra 2005（J. Stat. Mech. P12006，cond-mat.supr-con）Russian doll 超导模型将黎曼零点嵌入超导谱（缺失态，循环重整化群，与 Efimov 物理同构），Sierra-Townsend 2008（PRL **101**, 110201）Landau 能级与黎曼零点，但均尚无实验验证。从能级（表现）深入到同步算符（本质）是验证本理论的关键实验路径。\n\n> **本体论说明**：同步算符与结构群叠加态是同一个数学对象的两个面——算符面（谱结构）与态面（叠加态）。这个数学对象不是超导层级新创造的，而是前时空基态紧化结构（GL(5)/SU(5)）重组实现后子结构经 FG 激活后的再现——FG 的角亏涨落打开前时空自由度，超导再锁定时该子结构以同步算符（紧化算符）形式重新组织。相变是叠加态自身谱结构的本征值交叉，通过自组织退相干到本征值最低的分量，不是外部机制的选择。丛作用量是同步算符在凝聚态有效理论中的热力学投影，丢失了谱结构（相变有效谱，零温极限为黎曼零点）信息。自由能竞争是唯象的，同步算符本征值交叉是本根的。\n\n### 11.10 从 $V_{\\text{element}}$ 到超导同步算符的显式连接与 $T_c$ 闭式\n\n**问题定位。** 「`CQM_超导_专题与扩展.md` §11.7」构造元素 FG 上的同步算符 $V_{\\text{element}} = V_0 + L_{\\text{orbital}}$（给出周期表），本文档 §11.6 确立超导同步算符在 GL(5) 固定层级是黎曼式的（本征值 $= \\gamma_n$）。本节构造从 $V_{\\text{element}}$ 到超导同步算符 $\\hat{\\mathcal{S}}_{\\text{super}}$ 的显式映射 $\\Phi$，并从本征值交叉 $\\lambda_1(T_c) = \\lambda_2(T_c)$ 严格导出 $T_c$ 闭式。\n\n#### 超导同步算符的构造\n\n$$\\hat{\\mathcal{S}}_{\\text{super}} = V_0 + V_{\\text{角亏激活}}(T)$$\n\n其中 $V_0 = \\sum_p \\frac{\\ln p}{\\sqrt{p}} \\delta(u - \\ln p)$（质数势，与 $V_{\\text{element}}$ 共享），\n\n$$V_{\\text{角亏激活}}(n, T) = \\frac{\\beta^2 \\cdot \\Delta\\delta_v(T)^2 \\cdot (n^2 - 1)}{4n^2 \\cdot (1 - \\beta\\delta_v)}$$\n\n温度依赖 $\\Delta\\delta_v(T) = \\Delta\\delta_0 \\sqrt{\\tanh\\frac{\\theta_D}{2T}}$（见 §11.1–§11.2 的推导）。\n\n本征值：\n\n$$\\lambda_n(T) = \\gamma_n - V_{\\text{角亏激活}}(n, T)$$\n\n其中 $\\gamma_n$ 是黎曼零点虚部（同步成本），角亏激活降低同步成本。\n\n#### 显式映射 $\\Phi: V_{\\text{element}} \\to \\hat{\\mathcal{S}}_{\\text{super}}$\n\n$$\\Phi(V_0 + L_{\\text{orbital}}) = V_0 + V_{\\text{角亏激活}}$$\n\n映射规则：\n\n1. $\\Phi(V_0) = V_0$——质数势不变（前时空普适显现）；\n2. $\\Phi(L_{\\text{orbital}}) = V_{\\text{角亏激活}}$——轨道角动量 $\\to$ 角亏激活（电子配对后 $L=0$，轨道角动量不相关，角亏涨落成为主导）；\n3. $\\Phi(N(\\gamma_n)) = \\gamma_n$——黎曼零点计数函数 $\\to$ 零点本身（元素语境：库仑场中 $N(\\gamma_n) \\approx n$ 是离散量子数；超导语境：凝聚态场中 $\\gamma_n$ 是连续本征值）。\n\n#### $T_c$ 闭式严格推导\n\n本征值交叉 $\\lambda_1(T_c) = \\lambda_2(T_c)$：\n\n$$\\gamma_1 = \\gamma_2 - \\frac{\\beta^2 \\cdot \\Delta\\delta_v(T_c)^2 \\cdot 3}{16 \\cdot (1 - \\beta\\delta_v)}$$\n\n代入 $\\Delta\\delta_v(T_c) = \\Delta\\delta_0 \\sqrt{\\tanh\\frac{\\theta_D}{2T_c}}$，设 $x = \\frac{3\\beta^2 \\Delta\\delta_0^2}{16(1-\\beta\\delta_v)(\\gamma_2 - \\gamma_1)}$，解出：\n\n$$\\boxed{T_c = \\frac{\\theta_D}{2 \\cdot \\mathrm{arccoth}(x)}, \\quad x = \\frac{3\\beta^2 \\Delta\\delta_0^2}{16(1-\\beta\\delta_v)(\\gamma_2 - \\gamma_1)}}$$\n\n**超导条件**：$x > 1$，即 $3\\beta^2 \\Delta\\delta_0^2 > 16(1-\\beta\\delta_v)(\\gamma_2 - \\gamma_1)$。\n\n**定义域**：$\\mathrm{arccoth}$ 仅在 $|x| > 1$ 上有实值。本闭式的适用域是 $x > 1$（对应 $\\bar n_c > 0$）；$x \\le 1$ 时该式不给出实数 $T_c$，物理上对应“该温度尺度上不发生同步跃迁”，应记为**无解**而非 $T_c = 0$。$x \u003c -1$ 的情形需 $(1-\\beta\\delta_v) \u003c 0$（即 $\\beta\\delta_v > 1$），已超出固有时流速 $v_\\tau = \\sqrt{1-\\beta\\delta_v}$ 的实值域，不在本框架允许的参数范围内。\n\n> **定位注（arccoth 的统计身份）**：$\\mathrm{arccoth}$ 不是任意数学形式，它是玻色-爱因斯坦统计的反函数——声子平均占据数 $\\bar{n}=1/(e^{\\hbar\\omega/k_BT}-1)$ 满足 $\\coth(\\hbar\\omega/2k_BT)=2\\bar{n}+1$，故 $T=\\hbar\\omega/(2k_B\\,\\mathrm{arccoth}(2\\bar{n}+1))$。与本闭式逐项对照：$\\theta_D$ 即曲率涨落模式的声子能量标度，$x=2\\bar{n}_c+1$，临界占据数 $\\bar{n}_c=(x-1)/2=\\frac{1}{2}\\left(\\frac{3\\beta^2\\Delta\\delta_0^2}{16(1-\\beta\\delta_v)(\\gamma_2-\\gamma_1)}-1\\right)$，即**曲率涨落强度与谱隙之比**。$T_c$ 的物理含义：曲率涨落模式的玻色-爱因斯坦占据数达到临界值 $\\bar{n}_c$ 的温度；超导条件 $x>1$ 即 $\\bar{n}_c>0$（占据数非负），与 §9.2 资格条件同向。谱隙分母 $\\gamma_2-\\gamma_1$ 为黎曼零点差（$\\approx 6.887315$）。临界占据数对曲率涨落的平方依赖（$x\\propto\\Delta\\delta_0^2$）是临界现象的本性（对照 BCS 的 $T_c\\sim e^{-1/\\lambda}$ 指数敏感），$\\delta_v$ 的高精度要求由此是物理特征而非缺陷。\n\n#### 元素 vs 超导：同步算符的两种语境\n\n| | 元素语境 | 超导语境 |\n|--|---------|---------|\n| 同步算符 | $V_{\\text{element}} = V_0 + L_{\\text{orbital}}$ | $\\hat{\\mathcal{S}}_{\\text{super}} = V_0 + V_{\\text{角亏激活}}$ |\n| $V_0$ | 质数势（共享） | 质数势（共享） |\n| 激活项 | $L_{\\text{orbital}} = \\sum_l l \\cdot \\Pi_l$（轨道角动量） | $V_{\\text{角亏激活}}(T)$（角亏涨落激活） |\n| 本征值 | $N(\\gamma_n) + l = n + l$（Madelung规则） | $\\gamma_n - V_{\\text{角亏激活}}$（同步成本 - 激活） |\n| $\\gamma_n$ 角色 | $N(\\gamma_n) \\approx n$（离散量子数） | $\\gamma_n$ 直接（连续本征值） |\n| 物理场 | 库仑场（核子） | 凝聚态场（配对） |\n| 结果 | 周期表 | $T_c$ 闭式 |\n\n## 12. 完整因果链\n\n完整因果链分为**基础本体链**（§12.1，给出电子（基态耦合对应）与耦合空间的来源）和**晶胞量子振荡中的主丛结构群上的耦合常数动力学**（§12.2，对应§10：配对/相干即晶胞量子振荡这一单一几何-动力学过程，温度由 Bose 分布给出的声子数统一进入）。\n\n### 12.1 基础本体链\n\n$$\\boxed{\\begin{aligned}\n&\\text{前时空与两种引力（GR/FG，FG}\\neq\\text{GR）} + \\text{相变量子 } ☯ \\\\\n&\\Downarrow \\\\\n&\\text{质子 } A_4 + \\text{中子 } D(\\delta) \\\\\n&\\Downarrow \\\\\n&\\text{链A（晶胞几何分布）} + \\text{链B（晶胞嘉当矩阵，构造性）} \\\\\n&\\Downarrow \\\\\n&\\text{Regge 角亏 } \\delta_v \\\\\n&\\Downarrow \\\\\n&\\text{主丛（联络 } \\mathcal{A}_{\\text{FG}}\\text{，其在 A4 根空间指标上的分量形式 } \\omega_{\\alpha_i\\alpha_j}\\text{）} \\\\\n&\\Downarrow \\\\\n&\\text{电子作为基态耦合常数 }\\alpha\\text{ 的对应（已在系统中存在）} \\\\\n&\\Downarrow \\\\\n&\\text{声子 } = \\text{底空间 Regge 曲率量子 } \\Delta\\delta_v \\\\\n&\\Downarrow \\\\\n&\\frac{d\\tau}{dt} = \\sqrt{\\,1 - \\beta\\delta_v\\,} \\quad (\\text{固有时流速=两时间之比，基准 1；见 §7}) \\\\\n&\\Downarrow \\\\\n&p_u = \\frac{1}{☯}\\frac{d\\tau}{dt} = \\frac{\\sqrt{\\,1-\\beta\\delta_v\\,}}{☯}, \\quad ☯ = \\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1} \\\\\n&\\Downarrow \\\\\n&[\\hat{u}, \\hat{p}_u] = i \\;\\Rightarrow\\; \\Delta u \\cdot \\Delta\\delta_v \\ge \\frac{☯\\sqrt{\\,1-\\beta\\delta_v\\,}}{\\beta}\n\\end{aligned}}$$\n\n基础本体链止于耦合空间不确定性关系，为主丛结构群上的耦合常数动力学提供**动力学舞台**——耦合坐标 $u$ 与曲率涨落 $\\Delta\\delta_v$ 的量子对偶。配对/相干过程即晶胞量子振荡本身（见 §10），其展开即 §12.2 的单一因果链。\n\n### 12.2 晶胞量子振荡中的主丛结构群上的耦合常数动力学（对应§10）\n\n$$\\boxed{\\begin{aligned}\n&\\text{晶胞量子振荡（声子 = 底空间 Regge 曲率量子）} \\Rightarrow \\delta_v(t) = \\delta_v^{(0)} + \\Delta\\delta_v(t) \\\\\n&\\Downarrow \\;(\\text{温度只改变 Bose 分布给出的声子数 } n_B(\\omega_{\\mathbf{q}})\\text{，统一调制 } \\Delta\\delta_v \\text{ 统计分布}) \\\\\n&\\text{不确定性 } \\Delta u \\cdot \\Delta\\delta_v \\ge \\frac{☯\\sqrt{\\,1-\\beta\\delta_v\\,}}{\\beta} \\\\\n&\\Downarrow \\\\\n&\\Delta u_n = 2\\ln n \\text{ 跃迁 } u \\to u+2\\ln n \\;\\Rightarrow\\; \\alpha\\to n^2\\alpha \\text{（跃迁耦级谱，} n=2,4,6,\\ldots\\text{）} \\\\\n&\\Downarrow \\;(\\text{资格条件 } \\Delta\\delta_0 \\ge \\frac{☯\\sqrt{1-\\beta\\delta_v}}{2\\beta\\ln n} \\text{ 筛选候选群族；和乐平庸化条件 } \\mathcal{H}_{ij} = \\exp(i\\oint_C \\omega_{\\alpha_i\\alpha_j})\\approx 1 \\text{ 在晶胞量子振荡中自然满足}) \\\\\n&\\text{结构群叠加态（= 同步算符）本征值交叉 } \\lambda_2(T_c)=\\lambda_1(T_c) \\text{（§11.6）} \\;\\Rightarrow\\; \\text{丛作用量竞争（热力学投影）选出主导群 } G_{\\text{主导}} = \\arg\\min_n F_n \\\\\n&\\Downarrow \\\\\n&\\text{超导态 } = \\text{ 主丛的伴丛全局同步截面（晶胞量子振荡全局相干模式，同步再锁定）}\n\\end{aligned}}$$\n\n### 12.3 判据与临界温度的涌现位置\n\n资格条件 $\\Delta\\delta_0 \\ge ☯\\sqrt{1-\\beta\\delta_v}/(2\\beta\\ln n)$ 在晶胞量子振荡动力学中的**涌现位置**（与 §9.2 资格条件一致）：\n\n$$\\boxed{\\text{不确定性 } \\Delta u\\cdot\\Delta\\delta_v \\ge \\frac{☯\\sqrt{\\,1-\\beta\\delta_v\\,}}{\\beta} \\;+\\; \\text{跃迁耦级 } \\Delta u_n = 2\\ln n \\;\\Rightarrow\\; \\text{资格条件 } \\Delta\\delta_0 \\ge \\frac{☯\\sqrt{\\,1-\\beta\\delta_v\\,}}{2\\beta\\ln n} \\;\\Rightarrow\\; \\text{候选群族} \\;\\Rightarrow\\; \\text{结构群叠加态（= 同步算符）本征值交叉} \\;\\Rightarrow\\; \\text{丛作用量竞争选出主导群}}$$\n\n临界温度 $T_c$ 对应**结构群叠加态自身谱结构的本征值交叉**的临界点（§11.6，唯象表现为丛作用量交叉，见 §11.2）：\n\n$$\\boxed{F_1(T_c) = F_2(T_c),\\qquad T_c = \\frac{E_2 - E_1}{S_2 - S_1}}$$\n\n### 12.4 赝能隙在因果链中的定位\n\n**赝能隙** = 和乐平庸化条件在空间上的不均匀通过：高曲率区（向错芯）闭合条件满足 → 局域条件满足，但全局跃迁尚未发生 → 系统处于“准备好了但还没有统一行动”的结构群叠加态 → 全局超导未形成。**局域不可能跃迁，跃迁是全局同步事件。** 这是晶胞量子振荡空间不均匀性的直接产物。\n\n### 12.5 结构要点：单值性瓶颈与空间不均匀性\n\n“晶胞量子振荡 → $d\\tau/dt$ → 不确定性 → 跃迁耦级谱 → 资格条件 → 结构群叠加态（= 同步算符）本征值交叉 → 丛作用量竞争 → 超导”是不可再拆解的单一几何-动力学过程，其结构要点：\n1. **和乐平庸化条件是瓶颈**——并非所有跃迁都成功，条件 $\\mathcal{H}_{ij}\\approx 1$ 是晶胞量子振荡过程中必须满足的单值性条件；\n2. **空间不均匀性是一阶效应**——赝能隙是条件通过率的空间梯度直接产物；\n3. **温度统一进入**——温度只通过晶胞量子振荡模式的声子数进入角亏涨落统计分布，再生产是自组织的一个环节。\n\n## 17. 界面超导与边界定理\n\n### 17.1 广义斯托克斯定理与边界项\n\n在带边流形上应用广义斯托克斯定理：\n\n$$\\int_M d\\omega = \\int_{\\partial M} \\omega$$\n\n边界项可忽略的五种情形：\n\n| 情形 | 条件 |\n|:---|:---|\n| 形式在边界上为零 | $\\omega\\vert_{\\partial M}=0$（紧支撑、Dirichlet 边界条件） |\n| 流形本身无边 | $\\partial M=\\varnothing$（闭曲面，如环面） |\n| 积分区域是闭链 | 链复形意义下 $\\partial M=0$（闭链） |\n| 边界项互相抵消 | 物理设定使边界贡献相消 |\n| 只关心局部行为 | 局域计算不涉及全局边界积分 |\n\n### 17.2 体超导中边界可忽略\n\n常规体超导有两个特征长度：相干长度 $\\xi$（序参量显著变化的尺度）和穿透深度 $\\lambda_L$（磁场穿透的深度）。宏观样品 $L \\gg \\xi, \\lambda_L$，序参量只在表面 $\\sim \\xi$ 薄层内变化，磁场只在表面 $\\sim \\lambda_L$ 薄层内穿透。\n\n边界贡献 $\\propto$ 表面积，体积贡献 $\\propto$ 体积：\n\n$$\\frac{\\text{表面积}}{\\text{体积}} \\sim \\frac{L^2}{L^3} = \\frac{1}{L} \\to 0$$\n\nCQM 中边界贡献同样按 $1/L$ 压低：\n\n$$\\frac{\\sum_{v\\in\\text{边界}}\\delta_v}{\\sum_{v\\in\\text{体}}\\delta_v} \\sim \\frac{1}{L} \\to 0$$\n\n体超导的 CQM 核心机制（角亏涨落 $\\Delta\\delta_v$、固有时流速调制、耦合跃迁 $\\alpha\\to n^2\\alpha$、同步算符本征值交叉）均在体内局域/全局发生，不需要边界。\n\n### 17.3 界面超导：边界成为主角\n\n边界不能忽略的四种情形：\n\n| 情形 | 原因 |\n|:---|:---|\n| 纳米超导 | $L\\sim\\xi$，量子尺寸效应 |\n| 界面超导 | 超导只存在于界面附近 |\n| 拓扑超导 | 边界态（马约拉纳零模）是核心 |\n| 超导/磁性界面 | 界面自旋极化破坏配对 |\n\n界面超导的物理特征：超导性集中在二维界面薄层，界面两侧晶格失配产生巨大角亏，缺陷密度高（向错、位错），二维各向异性远强于三维体。\n\n### 17.4 CQM 中界面超导的边界处理\n\n界面处 Regge 角亏远大于体内：\n\n$\\delta_v^{\\text{界面}} \\gg \\delta_v^{\\text{体}}$，因此 $\\Delta\\delta_v^{\\text{界面}}$ 主导 $T_c$。\n\n| 体超导 | 界面超导 |\n|:---|:---|\n| 体角亏主导 | 界面角亏主导 |\n| 边界项 $\\sim 1/L$ | 边界项 $\\sim O(1)$ |\n| 斯托克斯边界可忽略 | 边界项必须显式处理 |\n\n### 17.5 界面超导中的 GL(5) 固定层级结构\n\n界面的二维性改变了 GL(5) 固定层级的实现：\n\n| 层级 | 三维体 | 二维界面 |\n|:---|:---|:---|\n| GL(5) 固定层级 | 体电磁跃迁 | 界面电磁跃迁 |\n| SU(2) | 自旋配对（SU(5)重组实现的输出） | 自旋配对（SU(5)重组实现的输出） |\n\n界面超导的二维性使非常规配对更容易出现。\n\n### 17.6 边界重要性判据\n\n$$\\boxed{\n\\text{边界是否重要}\n\\iff\n\\frac{\\sum_{\\text{边界}}\\delta_v}{\\sum_{\\text{体}}\\delta_v}\n\\begin{cases}\n\\sim 1/L \\ll 1 \\Rightarrow \\text{可忽略（体超导）} \\\\\n\\sim O(1) \\Rightarrow \\text{必须处理（界面超导）}\n\\end{cases}\n}$$\n\n**边界不是固定变量，而是由 Regge 几何的角亏分布动态决定其重要性。** CQM 统一了体超导与界面超导两种情形：边界的重要性取决于 Regge 角亏在几何中何处集中——体超导中在体内，界面超导中在边界。\n\n---\n\n## 18. 结论\n\n> 编号说明：§18.2、§18.4、§18.5 的内容见 `CQM_超导_专题与扩展.md` 对应节。\n\nCQM 超导框架的核心结构：\n\n1. **两种引力区分**：FG ≠ GR，FG 是一个联络生成两种曲率（底空间 Regge 角亏 + 伴丛曲率），不受 $G_N$ 限制，直接由 Regge 角亏给出；FG 是 GR 基态的非平庸激发态（非平庸因果网络）\n2. **元素嘉当矩阵**是主丛结构群的理想根系统，同位素效应揭示其主次结构（中子扇区为角亏的主要结构性来源，质子-质子对原理上亦可但几何极难）；金属氢（Z=1, N=0）是纯主结构极限（无角亏涨落，不超导）\n3. **两条独立链**（链A几何 + 链B嘉当矩阵）在主丛处汇合，电子作为基态耦合常数 $\\alpha$ 的对应已在系统中存在\n4. **主丛曲率机制**：曲率涨落→固有时流速（两时间之比）→耦合动量→海森堡不确定性→跃迁耦级谱 $\\Delta u_n = 2\\ln n$→资格条件筛选候选群族→结构群叠加态（= 同步算符）本征值交叉→丛作用量竞争选出主导群 $\\alpha\\to n^2\\alpha$→$n$ 体束缚态\n5. **晶胞量子振荡与自组织-再生产**：配对/相干即晶胞量子振荡（声子=底空间 Regge 曲率量子）本身；温度改变晶胞量子振荡模式声子数，影响自组织——再生产（晶胞量子振荡的维持）是自组织的一个环节\n6. **临界温度**：$\\lambda_1(T_c) = \\lambda_2(T_c)$（结构群叠加态 = 同步算符 = 前时空基态紧化结构子结构再现的本征值交叉，§11.6），叠加态通过自组织退相干到本征值最低的分量，唯象表现为 $F_1(T_c) = F_2(T_c)$，$T_c = (E_2 - E_1)/(S_2 - S_1)$（§11.2 丛作用量竞争，闭合 G22）。同步算符本征值 = 相变有效谱 $\\lambda_n(T)$（零温无角亏极限退化为黎曼零点虚部 $\\gamma_n$，同步成本），耦级 $1/4+\\gamma_n^2$ 为导出量，相变判据依赖黎曼猜想（GL(5) 固定层级的实谱条件）\n7. **赝能隙本质**：和乐平庸化条件在空间上的不均匀满足——高曲率区局域条件满足，低曲率区被阻断，全局跃迁尚未发生\n8. **曲率不均匀材料**中和乐平庸化条件空间梯度响应，是赝能隙与多芯涡旋结构的来源（见 §12.4–§12.5）\n9. **共振机制（退相干是子类自组织的表现）**：黎曼零点 = 质数分布共振频率 → 同步算符本征值 = 共振频率 → 叠加态拍频决定退相干速率 → 本征值交叉 = 拍频消失 = 同步共振 → 共振诱导退相干（自组织到最低同步成本）→ Kuramoto 型共振传播（底空间联络传播相位相干）→ 全局同步超导相变。唯物主义：黎曼共振谱先在（前时空），FG激活+降温只利用先在规律，超导相变是先在潜能的显现（§11.6）\n\n**核心结论**：自组织是晶胞量子振荡中的单一几何-动力学过程。温度是改变晶胞量子振荡声子数、影响自组织——再生产（晶胞量子振荡的维持）是自组织的一个环节，声子数变化经由此环节进入自组织。曲率不均匀的材料中，和乐平庸化条件在空间上梯度响应，导致同一温度下高曲率区先满足局域条件（赝能隙），低曲率区后不满足，直到温度足够低使全局同步完成、全局跃迁发生。**局域不可能跃迁，局域只能满足条件，跃迁是全局同步事件。**\n\n### 18.1 核心机制精炼\n\n$$\\boxed{\\text{FG} \\;\\to\\; \\text{达到跃迁阈值} \\;\\to\\; \\text{结构群叠加态} \\;\\to\\; \\text{同步跃迁}}$$\n\n- **主丛（提供驱动力）**：底空间 Regge 角亏 $\\delta_v$ 由晶格几何与缺陷决定，角亏涨落 $\\Delta\\delta_v$ 通过固有时流速 $v_\\tau = \\sqrt{1-\\beta\\delta_v}$ 耦合到对数耦合常数 $u$，几何涨落转化为耦合常数的量子涨落。\n- **达到跃迁阈值（局域条件满足）**：跃迁耦级谱 $\\Delta u_n = 2\\ln n$（$n=2,4,6,\\ldots$），资格条件 $\\Delta\\delta_0 \\ge ☯\\sqrt{1-\\beta\\delta_v}/(2\\beta\\ln n)$ 筛选候选群族。**局域只能满足条件（达到阈值），局域不可能跃迁。**\n- **结构群叠加态（全局结构群处于量子叠加态）**：$|\\Psi_{\\text{全局}}\\rangle = \\sum_{n=2,4,6,\\ldots} \\sqrt{w_n}\\,|U(1)//\\mathbb{Z}_n\\rangle$，权重 $w_n \\propto e^{-F_n/k_BT}$。结构群叠加态是全局的，不是局域的。\n- **同步跃迁（全局集体事件）**：结构群叠加态自身谱结构（= 同步算符）本征值交叉（§11.6）→ 丛作用量竞争（热力学投影），全局叠加态退相干。**跃迁 = 全局同步，两者是同一个事件，不是先后两个阶段。**\n\n**全局同步跃迁的条件**：（1）足够多的区域满足局域条件（达到跃迁阈值）；（2）这些区域通过底空间联络保持相位相干；（3）温度足够低，热噪声不足以破坏全局相干；（4）结构群叠加态自身谱结构（= 同步算符）本征值交叉使超导态本征值低于正常态（§11.6），唯象表现为全局超导态丛作用量低于正常态。\n\n#### 同步 ≠ 群统一：多群超导\n\n**全局同步指的是相位相干，不等于所有区域选择同一个结构群。**\n\n$$\\boxed{\\text{同步} = \\text{全局相位相干} \\;\\neq\\; \\text{结构群统一（单一主导群）}}$$\n\n- **相位同步**：整个材料中序参量相位相干，宏观上产生零电阻（能隙保护）和迈斯纳效应（GL(5) 固定层级非平凡自守形式→光子质量→磁场排斥）。这是超导的充分条件。\n- **结构群统一**：所有区域退相干到同一个 $U(1)//\\mathbb{Z}_n$。这是超导的一种简单情形，但不是必要条件。\n\n**多群超导**：某些区域退相干到 $U(1)//\\mathbb{Z}_2$，另一些退相干到 $U(1)//\\mathbb{Z}_4$，甚至同一区域存在多个凝聚分量。只要不同群的序参量通过底空间联络共享同一个整体相位，它们就能相干叠加，形成宏观超导态。类比多带超导（MgB₂ 双能隙共享同一超导相位）。\n\n| 现象 | 多群超导解释 |\n|------|-------------|\n| 多能隙 | 不同群分量有不同能隙 |\n| 磁通量子化偏离 $h/2e$ | 多个 $n$ 分量共存，有效磁通单位复合 |\n| 宽转变 | 不同群分量在不同温度下同步 |\n| 高温超导复杂性 | 多群共存 + 空间不均匀 |\n| 非普适 $2\\Delta/k_BT_c$ | 不同群分量能隙不同，比值非普适 |\n\n**超导的统一性在于相位相干，不在于群的一致性。** 群可以多样，但相位必须同步。统一性寓于多样性之中。\n\n#### 同步的多种群实现\n\n同步不唯一指定结构群——**同一个同步态可由不同的群组合实现**。耦合常数涨落后 $\\alpha \\to n^2\\alpha$（$n=2,4,6,\\ldots$）对应多个结构群 $U(1)//\\mathbb{Z}_n$，路径积分在涨落伴丛上选出的主导群不一定是单一的：多个群的丛作用量可能近简并，形成多群共存的同步态。同步是相位相干的条件，群是实现相干的载体——载体可以多样，条件只有一个：相位相干。\n\n#### 同步后的未完全退相干区域\n\n全局同步发生后，**某些区域可能仍存在未完全退相干的残留态**——同步不是完美的全局退相干，而是“大部分区域同步 + 少数区域未完全退相干”：\n\n- **涡旋芯**：磁场穿透区域，和乐平庸化不完全，芯内处于正常态或残余涨落态\n- **晶界/缺陷**：拓扑缺陷区域，联络奇异，和乐相位闭合条件局部失效\n- **拓扑超导边缘**：马约拉纳零模区域，体态已同步但边缘态保留未完全退相干的拓扑保护态\n\n这些区域是同步的**拓扑缺陷**——和乐平庸化在全局已成立，但在这些局域区域不完全。超导态的拓扑性质（磁通量子化、马约拉纳零模、拓扑不变量）正源于同步后残留的未完全退相干结构。\n\n### 18.3 与 BCS 的关系\n\n| | BCS | CQM |\n|--|-----|-----|\n| 机制 | 电子配对 | 耦合常数跃迁 |\n| 群 | $U(1)\\to\\{e\\}$ | $U(1)//\\mathbb{Z}_n$，$n$ 可变 |\n| 能隙 | 拆对能 | 结构群能量差 |\n| $T_c$ | 能隙方程 | 丛作用量交叉 |\n| 多电子凝聚 | 不可解释 | 自然涌现 $n=4,6$ |\n| 高温超导 | 打补丁 | 结构群叠加态 + 非均匀 |\n\n**关系本质：现象学对应，不是理论统一。**\n\n## 附录 A：符号表\n\n| 符号 | 含义 | 数学类型 |\n|------|------|---------|\n| $A_4$ | 质子嘉当矩阵 | 4 × 4 整数矩阵 |\n| $D(\\delta)$ | 中子嘉当矩阵（缺陷形变） | 4 × 4 实矩阵 |\n| $\\mathcal{C}_{\\text{element}}$ | 元素嘉当矩阵 | $4(Z+N)$ × $4(Z+N)$ 矩阵 |\n| $\\mathcal{C}_{\\text{mol}}$ | 分子有效超级嘉当矩阵 | 大方矩阵 |\n| $\\delta_v$ | Regge 顶点角亏 | 实数 |\n| $\\Delta\\delta_v$ | 曲率涨落（声子） | 实数 |\n| $☯$ | 相变量子 $\\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1} = 1+\\gamma/2-\\ln(2\\sqrt{\\pi}) \\approx 0.02309570897$ | 无量纲实数 |\n| $\\beta$ | 几何耦合参数 $\\frac{1}{4\\pi}\\ln\\frac{L}{a}$（$L$系统尺寸，$a$晶格常数） | 无量纲实数 |\n| $u$ | 耦合坐标 $\\ln\\alpha$ | 无量纲实数 |\n| $p_u$ | 耦合动量 $(1/☯)(d\\tau/dt)$ | 无量纲实数 |\n| $\\tau$ | 固有时 | 时间 |\n| $t$ | 坐标时 | 时间 |\n| $\\omega_D$ | 德拜频率 | 频率 |\n| $\\theta_D$ | 德拜温度 $\\hbar\\omega_D/k_B$（§11.10 $T_c$ 闭式的声子能量标度） | 温度 |\n| $\\Omega_0$ | 主导曲率量子振荡模式频率 | 频率 |\n| $\\Delta\\delta_0$ | 零温曲率涨落幅度 | 无量纲实数 |\n| $\\lambda_L$ | 伦敦穿透深度 | 长度 |\n| $\\Delta_{\\alpha\\beta}$ | A4 根系多分量序参量 | 4 × 4 复矩阵 |\n\n**术语约定（“同步”的两义）**：本文档中“同步”承担两个层次的含义，须按语境区分，不可互换：\n\n| 用法 | 含义 | 所在层次 | 判据 |\n|:---|:---|:---|:---|\n| **退相干意义的同步** | 物质自组织的**过程**——局域和乐平庸化、结构群进入叠加态（§1.5 三相表的前两态） | 过程层 | 和乐 $\\mathcal{H}_{ij}\\approx1$（局域） |\n| **相位相干意义的同步** | 多区域序参量共享同一整体**相位**的**状态**——超导的充分条件（§18.1“同步 ≠ 群统一”） | 状态层 | 伴丛存在全局相位相干截面（全局） |\n\n包含关系：相位相干意义的同步**实现**了退相干意义的同步（前者是后者在全局尺度上的完成态），但**不要求**结构群统一——多群超导即为此情形（§18.1）。故“同步=退相干完成”与“同步≠结构群统一”并不冲突：前者说的是过程归属，后者说的是终态不要求单一主导群。行文中凡涉及资格条件处，“同步”一律取**相位相干**义。\n\n---\n\n## 附录 B：参考文献\n\n1. Bardeen, Cooper, Schrieffer (1957). Theory of Superconductivity. *Phys. Rev.* 108, 1175.\n2. McMillan (1968). Transition Temperature of Strong-Coupled Superconductors. *Phys. Rev.* 167, 331.\n3. Allen, Dynes (1975). *Phys. Rev. B* 12, 905.\n4. Drozdov et al. (2015). Conventional superconductivity at 203 K at high pressures in the sulfur hydride system. *Nature* 525, 73.\n5. Drozdov et al. (2019). Superconductivity at 250 K in lanthanum hydride under high pressures. *Nature* 569, 528.\n6. Errea et al. (2020). Quantum crystal structure in the 250-kelvin superconducting lanthanum hydride. *Nature* 578, 66–69.\n7. Szczęśniak, Durajski (2016). Migdal-Eliashberg equations — the effective model for superconducting state in H3S. arXiv:1609.06079.\n8. Liu et al. (2019). Microscopic mechanism of room-temperature superconductivity in compressed LaH10. *Phys. Rev. B* 99, 140501(R).\n9. Ashcroft (1968). Metallic Hydrogen: A High-Temperature Superconductor? *PRL* 21, 1748.\n10. ruster (2026). CNT 完整研究. Zenodo. DOI: 10.5281/zenodo.20804380.\n11. He et al. (2020). *Phys. Rev. A* **101**, 043402.（单量子比特 Floquet 实验：驱动参数与 ζ 零点重合时动力学冻结）\n12. He et al. (2021). *npj Quantum Information* **7**, 109.（囚禁离子实验：高精度测量最低非平凡黎曼零点）\n13. Sierra (2005). *J. Stat. Mech.* P12006（cond-mat.supr-con）.（Russian doll 超导模型：黎曼零点嵌入超导谱）\n14. Sierra, Townsend (2008). *PRL* **101**, 110201.（Landau 能级与黎曼零点）\n\n---\n\n*该文档为 CQM 超导核心理论框架。主丛曲率机制、完整因果链与第一性数值例链已在 Lean 中部分形式化；数值预言、同位素异常解释与实验检验仍待后续工作验证。*\n", "backlinks": ["D001", "D005", "D006", "D007", "D008", "D011", "D023"], "outlinks": ["D005", "D006", "D007", "D011", "D014", "D028"]}, {"id": "D035", "doc_id": "D035", "title": "系统架构设计", "path": "06 超导/超导材料设计器/01_系统架构设计.md", "group": "06 超导", "layer": 3, "type": "工程", "text": "# 01 系统架构设计\n\n> Godot 4.6 三维分子构建交互系统架构\n\n---\n\n## 场景树\n\n```\nMain (Node3D)\n├── CameraRig (Node3D)          ← 轨道相机\n├── MoleculeWorkspace (Node3D)  ← 分子构建空间\n│   ├── Atoms (Node3D)          ← 原子容器\n│   ├── Bonds (Node3D)          ← 化学键容器\n│   └── LatticePreview (Node3D) ← 晶格预览\n├── UI (CanvasLayer)\n│   ├── ElementPalette          ← 元素周期表\n│   ├── IsotopeSelector         ← 同位素选择器\n│   ├── CalculationPanel        ← 计算控制\n│   ├── ResultPanel             ← 结果展示\n│   └── Toolbar\n└── System (Node)\n    ├── CQMCalculator           ← CQM 计算引擎\n    ├── ElementDatabase         ← 元素数据库\n    ├── UndoRedoManager         ← 撤销/重做\n    └── ProjectManager          ← 项目保存/加载\n```\n\n## 分层架构\n\n| 层 | 组件 |\n|:---|:---|\n| UI 层 | 元素周期表、模式引擎面板、画笔材料面板 |\n| 交互层 | 3D 拾取、拖拽放置、右键结合连接、框选、相机 |\n| 3D 场景层 | 上屏: 原子/键/分子组；下屏: 画笔/TubeMesh/密度场 |\n| 计算引擎层 | 嘉当矩阵、主丛曲率判定、Tc估算、模式匹配、Regge |\n| 数据层 | 元素DB、同位素、CQM常数、预设分子、模式库、超导DB |\n\n## 交互流程\n\n元素周期表取原子 → 3D空间放置 → 右键结合连接 → 自动推导化学式 → 自动匹配超导家族模式 → 选择同位素 → 点击计算 → CQM超导判定\n", "backlinks": ["D034"], "outlinks": []}, {"id": "D036", "doc_id": "D036", "title": "元素同位素数据库", "path": "06 超导/超导材料设计器/02_元素同位素数据库.md", "group": "06 超导", "layer": 3, "type": "工程", "text": "# 02 元素及同位素数据库\n\n> 118 化学元素 + 同位素数据库\n\n---\n\n## 数据范围\n\n- 118 元素（Z=1-118），~251 种稳定核素，~3300 种已知核素\n- 每元素含全部已知同位素，稳定优先展示，放射性折叠\n\n## CQM 理论所需参数\n\n| 参数 | 符号 | 来源 | 用途 |\n|:---|:---:|:---|:---|\n| 原子序数 | Z | 实验 | 质子扇区大小（Z 个 A₄ 块） |\n| 中子数 | N | A − Z | 中子扇区大小（N 个缺陷 A₄ 块） |\n| 中子缺陷参数 | δ(N) | CQM 公式 | 中子扇区缺陷强度 |\n| 原子质量 | m | 实验 | 约化质量计算 |\n| 价电子数 | v | 化学 | 电子扇区建模 |\n| 电负性 | χ | 实验 | 键极性估算 |\n| 原子半径 | r | 实验 | 3D 渲染 + 键长估算 |\n\n## 数据格式\n\n每元素一个 JSON 文件 `data/elements/{Symbol}.json`，含基本属性、同位素列表、CQM参数（Z、N、δ(N)）。\n", "backlinks": ["D034"], "outlinks": []}, {"id": "D037", "doc_id": "D037", "title": "超导判定算法", "path": "06 超导/超导材料设计器/03_超导判定算法.md", "group": "06 超导", "layer": 3, "type": "工程", "text": "# 03 超导性质自动计算与判定算法\n\n> 基于 CQM 超导理论的自动计算与判定算法\n\n---\n\n## 判定流水线\n\n```\n分子结构 → Step 1 嘉当矩阵组装 → Step 2 谱分析 → Step 3 固有时流速与角亏涨落\n→ Step 4 主丛曲率判定 → Step 5 T_c 估算 → Step 6 序参量张量正性 → Step 7 超导判定\n```\n\n## Step 1: 嘉当矩阵组装\n\n$$A_4 = \\begin{pmatrix} 2 & -1 & 0 & 0 \\\\ -1 & 2 & -1 & 0 \\\\ 0 & -1 & 2 & -1 \\\\ 0 & 0 & -1 & 2 \\end{pmatrix}, \\quad \\mathcal{C}_{\\text{element}} = \\left(\\bigoplus_{i=1}^{Z} A_4\\right) \\oplus \\left(\\bigoplus_{j=1}^{N} C_n(\\delta_j)\\right)$$\n\n- 质子扇区：Z 个 A₄ 块对角（每个 4×4）\n- 中子扇区：N 个缺陷 A₄ 块（α₄ 末端非对角元缺陷）\n- 分子超级嘉当矩阵：$\\mathcal{C}_{\\text{mol}} = \\bigoplus_{k} \\mathcal{C}_{\\text{element}}^{(k)} + \\sum_{\\langle i,j \\rangle} T_{ij}$\n\n## Step 2: 谱分析\n\n$$\\lambda_k = 2 - 2\\cos\\frac{k\\pi}{5}, \\quad k = 1,2,3,4$$\n\n态密度（高斯展宽）：$\\rho(\\lambda) = \\frac{1}{N\\sqrt{2\\pi}\\sigma} \\sum_k \\exp\\left(-\\frac{(\\lambda - \\lambda_k)^2}{2\\sigma^2}\\right)$\n\n## Step 3: 固有时流速与角亏涨落\n\n$$v_\\tau = \\sqrt{1 - \\beta \\delta_v}, \\quad \\beta \\sim \\frac{1}{4\\pi}\\ln\\frac{L}{a}$$\n\n角亏涨落 $\\Delta\\delta_v$ 由晶胞振荡（声子 = 底空间Regge曲率量子）携带。\n\n## Step 4: 主丛曲率判定\n\n$$\\psi(\\mathbf{r}, T) = \\int_{\\text{BZ}} d^3k \\; \\mathcal{D}_{\\text{lattice}} \\cdot \\mathcal{P}_{\\text{electron}} \\cdot \\mathcal{C}_{\\text{triple}} \\cdot \\mathcal{K}_{\\text{causal}} \\cdot e^{-\\Gamma_\\phi|\\tau|}$$\n\n| 因子 | 含义 |\n|:---|:---|\n| $\\mathcal{D}_{\\text{lattice}}$ | 晶格传播子（嘉当矩阵本征值构造） |\n| $\\mathcal{P}_{\\text{electron}}$ | 电子传播子（BCS 形式） |\n| $\\mathcal{C}_{\\text{triple}}$ | 三重因果修正 |\n| $\\mathcal{K}_{\\text{causal}}$ | 因果核（指数衰减） |\n\n## Step 5: 临界温度 T_c\n\n**BCS 公式（CQM 修正）**：\n\n$$k_B T_c = \\frac{2e^\\gamma}{\\pi} \\cdot \\hbar\\Omega_0 \\cdot \\exp\\left(-\\frac{1}{N(0)\\cdot V_{\\text{pair}}}\\right)$$\n\n- $\\Omega_0$：主导曲率振荡模式频率（由角亏涨落谱决定，非 Debye 频率）\n- $V_{\\text{pair}}$：配对势，由嘉当矩阵谱间隙决定（区别于理论中的质数势 $V_0$）\n\n**强耦合修正（Allen–Dynes）**：\n\n$$T_c = \\frac{\\Omega_0}{1.2} \\cdot \\exp\\left(-\\frac{1.04(1+\\lambda)}{\\lambda - \\mu^*(1+0.62\\lambda)}\\right)$$\n\n**Tc 闭式**：\n\n$$\\boxed{T_c = \\frac{\\theta_D}{2 \\cdot \\mathrm{arccoth}(x)}, \\quad x = \\frac{3\\beta^2 \\Delta\\delta_0^2}{16(1-\\beta\\delta_v)(\\gamma_2 - \\gamma_1)}}$$\n\n临界条件：$x > 1$，即 $3\\beta^2\\Delta\\delta_0^2 > 16(1-\\beta\\delta_v)(\\gamma_2 - \\gamma_1)$。\n\n**关键参数**：\n\n| 概念 | 数值 | 地位 |\n|:---|:---:|:---|\n| γ₂-γ₁ (黎曼零点差) | ≈ 6.887315 | GL(5) 固定层级谱惟一零点差基准 |\n| 相变量子 $☯$ | ≈ 0.02309570897 | 普适比例基准 |\n\n**自由能公式（前向预测）**：\n\n$$T_c^2 = \\frac{8\\,\\Delta\\delta_0^2\\,K_{\\text{eff}}\\,\\theta_D}{9\\ln 2}$$\n\n该公式的数值验证暂无可复核产物（生成脚本不在仓库）。\n\n## Step 6: 序参量张量正性\n\n$$\\Delta_{\\alpha\\beta} = \\Delta_0 \\sum_{k=1}^{4} \\sqrt{\\lambda_k}\\; v_k^{(\\alpha)}\\, v_k^{(\\beta)}\\, e^{i\\phi_k}$$\n\n超导判定归结为序参量张量的正性：正定→超导，非正定→正常态。\n\n## Step 7: 超导判定\n\n| 条件 | 判定 |\n|:---|:---|\n| T_c > T_target 且置信度高 | `superconducting` |\n| T_c ≈ T_target（±20%） | `borderline` |\n| T_c \u003c T_target 或 T_c = 0 | `normal` |\n\n## BCS 退化\n\n退化为纯 BCS 形式：\n\n$$T_c = \\frac{2e^\\gamma}{\\pi} \\cdot \\Omega_0 \\cdot \\exp\\left(-\\frac{1}{N(0)V_{\\text{pair}}}\\right)$$\n", "backlinks": ["D034"], "outlinks": []}, {"id": "D038", "doc_id": "D038", "title": "应用场景与对比分析", "path": "06 超导/超导材料设计器/04_应用场景与对比分析.md", "group": "06 超导", "layer": 3, "type": "工程", "text": "# 04 应用场景与对比\n\n> CQM 超导材料设计器定位：教育可视化、理论探索辅助、半预测工具（自由能公式前向估算 T_c 量级）\n\n---\n\n## 适用场景\n\n- **教育**：学生拼接分子观察 T_c 变化，可视化 A₄ 嘉当矩阵与本征值谱\n- **理论辅助**：CQM 预测与已知超导体一致性检查、结构-性质映射扫描\n- **界面超导**：边界 Regge 角亏 $\\sim O(1)$ 必须显式处理（见 `CQM_超导核心理论.md` §17）\n\n## 与现有方案对比\n\n| 维度 | 本设计器 | VASP/Quantum ESPRESSO |\n|:---|:---|:---|\n| 定位 | 快速概念估算 | 精确第一性计算 |\n| 方法 | CQM 嘉当矩阵+曲率判定 | DFT 密度泛函 |\n| 速度 | 秒级 | 小时-天级 |\n| 输出 | T_c 量级估算 | 电子结构、声子谱 |\n| 对接 | 可导出 QE pw.x / VASP POSCAR 输入 | — |\n\n**互补关系**：本设计器快速估算 → VASP/QE 精确验证\n", "backlinks": ["D034"], "outlinks": []}, {"id": "D039", "doc_id": "D039", "title": "元素嘉当矩阵参数化设计", "path": "06 超导/超导材料设计器/05_元素嘉当矩阵参数化设计.md", "group": "06 超导", "layer": 3, "type": "工程", "text": "# 05 元素嘉当矩阵参数化设计\n\n> 嘉当矩阵参数化架构，使理论变动可方便跟进\n\n---\n\n## 1. 嘉当矩阵的固定与可变\n\n**A₄ 矩阵固定**（所有元素共享，SU(5) 群论 Cartan 矩阵）：\n\n$$A_4 = \\begin{pmatrix} 2 & -1 & 0 & 0 \\\\ -1 & 2 & -1 & 0 \\\\ 0 & -1 & 2 & -1 \\\\ 0 & 0 & -1 & 2 \\end{pmatrix}$$\n\n**元素嘉当矩阵因元素而异**，由三个参数决定：\n\n| 参数 | 符号 | 来源 | 影响 |\n|:---|:---:|:---|:---|\n| 原子序数 | Z | 实验 | 质子扇区：Z 个 A₄ 块 |\n| 中子数 | N | A−Z | 中子扇区：N 个缺陷块 |\n| 中子缺陷参数 | δ(N) | CQM 公式 | 中子扇区缺陷程度 |\n\n$$\\mathcal{C}_{\\text{element}}(Z, N, \\delta) = \\bigoplus_{i=1}^{Z} A_4 \\oplus \\bigoplus_{j=1}^{N} C_n(\\delta_j)$$\n\n其中 $C_n(\\delta)$ 为 $A_4$ 的 $\\alpha_4$ 末端非对角元缺陷：$(3,4)/(4,3)$ 元从 $-1$ 变为 $-\\delta$，$\\det C_n = 8 - 3\\delta^2$。\n\n**示例**：氢 (Z=1,N=0) → 4×4 纯 A₄；氦 (Z=2,N=2) → 16×16；镧 (Z=57,N=82) → 556×556。\n\n---\n\n## 2. 三层分离架构\n\n| 层 | 内容 | 变动频率 |\n|:---|:---|:---|\n| **第1层 理论核心** | A₄ 矩阵、本征值、谱间隙、BCS 常数、相变量子 $☯$ | 理论修订时 |\n| **第2层 建模选择** | 缺陷位置、δ(N) 函数形式、耦合模型 | 理论调整时 |\n| **第3层 元素数据** | Z、同位素、电负性、半径等实验量 | 实验更新时 |\n\n**理论固定量**（Lean 形式化验证）：A₄ 本征值 $\\lambda_k = 2-2\\cos(k\\pi/5)$、谱间隙 $(3-\\sqrt{5})/2 \\approx 0.382$、BCS 前因子 $2e^\\gamma/\\pi \\approx 1.1339$、普适能隙比 $2\\pi e^{-\\gamma} \\approx 3.5278$、相变量子 $☯ = 0.02309570897$。\n\n**理论可变量**（建模选择）：δ(N) 函数形式（当前线性 $\\delta_0(1-\\beta_\\delta\\Delta N/N_{\\text{ref}})$）、δ₀ 基础缺陷、$\\beta_\\delta$ 缺陷斜率、质子扇区修正、跨元素耦合模型。\n\n---\n\n## 3. 理论变动的跟进\n\n理论变动**只改配置文件** `cqm_theory_config.json`（第1+2层），无需修改 118 个元素文件（第3层仅含实验数据）。\n\n| 变动场景 | 修改对象 |\n|:---|:---|\n| 缺陷位置变更 | 配置 `defect_mode.positions` |\n| δ(N) 函数形式变更 | 配置 `neutron_defect_function` |\n| 质子扇区加修正 | 配置 `proton_sector_model` |\n| A₄ 本身被修正 | 配置 `fixed_constants` |\n| 元素特异覆盖 | 配置 `element_overrides` |\n\n---\n\n## 4. 元素文件生成策略\n\n118 元素的实验数据从公开数据库（NIST/NUBASE）批量导入，理论参数由配置统一管理，不逐个手写。元素 JSON 仅含实验数据，不包含 `cqm_parameters` 字段。\n\n| 阶段 | 元素数 | 覆盖 |\n|:---|:---:|:---|\n| MVP | ~20 | 主要超导体系 |\n| v0.2 | ~60 | 主族 + 3d/4d 过渡族 |\n| v0.5 | 118 | 全部元素 |\n\n---\n", "backlinks": ["D034"], "outlinks": []}, {"id": "D040", "doc_id": "D040", "title": "文献调研与专业化路线", "path": "06 超导/超导材料设计器/06_文献调研与专业化路线.md", "group": "06 超导", "layer": 3, "type": "工程", "text": "# 06 文献调研与专业化路线\n\n## 同类软件对标\n\n| 软件 | 核心能力 | 可借鉴点 |\n|---|---|---|\n| VESTA | 晶体可视化/对称性识别 | 自动成键、cif/POSCAR 导入导出 |\n| Avogadro | 交互式分子构建 | 工具模式切换、测量、撤销栈 |\n| Quantum ESPRESSO | 电声耦合+Tc 输出 | λ、ω_log、μ*、Tc 面板 |\n| VASP | POSCAR 事实标准 | 支持导出对接 |\n\n## Tc 公式\n\n- **Allen–Dynes (1975)**（主通道）：$T_c = f_1 f_2 \\frac{\\omega_{\\log}}{1.2} \\exp\\left(-\\frac{1.04(1+\\lambda)}{\\lambda-\\mu^*(1+0.62\\lambda)}\\right)$\n- **McMillan (1968)**：$T_c = \\frac{\\theta_D}{1.45} \\exp\\left(-\\frac{1.04(1+\\lambda)}{\\lambda-\\mu^*(1+0.62\\lambda)}\\right)$\n- 德拜模型：$\\omega_{\\log} = 0.7165\\,\\theta_D$，$\\sqrt{\\langle\\omega^2\\rangle} = 0.7746\\,\\theta_D$\n- μ* 默认 0.13（Morel–Anderson）\n\n## 关键材料实测 Tc\n\nHg 4.15K | Pb 7.2 | Nb 9.3 | Nb₃Sn 18.3 | MgB₂ 39 | LaFeAsO 26 | BaFe₂As₂ 38 | YBCO 92 | Hg-1223 133 | H₃S 203K@155GPa | LaH₁₀ 250K@170GPa\n\n注：2020–2023 室温超导报道（C-S-H、Lu-N-H 等）已撤稿或存疑，不收录。\n\n## 主要参考\n\nMcMillan PR 167 (1968) | Allen & Dynes PRB 12 (1975) | Ashcroft PRL 92 (2004) | Drozdov Nature 525/569 | Somayazulu PRL 122 (2019) | Flores-Livas RPP 83 (2020)\n", "backlinks": ["D034"], "outlinks": []}, {"id": "D041", "doc_id": "D041", "title": "目标超导搜索策略", "path": "06 超导/超导材料设计器/07_目标超导搜索策略.md", "group": "06 超导", "layer": 3, "type": "工程", "text": "# 07 目标超导搜索策略\n\n> CQM 最终实践目标：**常压室温第二类超导体**（$T_c \\ge 300\\,\\text{K}$，常压，II型）\n\n---\n\n## 已有数据资产\n\n| 家族 | 代表材料 | $T_c$

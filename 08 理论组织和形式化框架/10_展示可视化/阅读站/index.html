不循环），同时是全部零点集体贡献的总谱权重——它不是外加常数，而是整个数论谱的集体自洽性条件。\n\n**“相变量子”命名有据**：$☯$ 取自 $\\xi$，$\\xi$ 提纯非平凡零点 $\\{\\gamma_n\\}$（消去平凡零点），而 $\\gamma_n$ 是共振频率（§5.3）与相变直接关联。$☯$ 取自与相变关联的非平凡零点谱（$\\xi$ 提纯后的零点集）——命名不是隐喻，而是数学来源的直接体现。\n\n**相变本身的关键常数**：$☯$ 不仅是耦合空间的不确定性量子（取代 $\\hbar$），更是相变本身的关键常数——它从相变关联的谱中提取，又经资格条件进入超导 $T_c$ 链条（闭式显式依赖 $\\theta_D$、$\\beta$、$\\Delta\\delta_0$、$\\delta_v$ 与 $\\gamma_2-\\gamma_1$）、$G_N$ 公式（含 $☯^2\\cdot\\exp(-2/☯)$）等相变公式中。从相变中来，回相变中去。\n\n### 5.3 GL(5) 固定层级\n\n物理系统固定在 GL(5) 层级：$\\mathrm{SU}(5)$ 是包含标准模型规范群 $U(1)\\times SU(2)\\times SU(3)$ 的最小单群（$\\operatorname{rank}SU(5)=4=\\operatorname{rank}(U(1)\\times SU(2)\\times SU(3))$）。\n\nζ 零点谱直接作为 GL(5) 固定层级下使用的谱：\n\n| 谱对象 | 定义 | 物理作用 |\n|:---|:---|:---|\n| 相变量子 $☯$ | $\\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1} = \\sum_\\rho 1/(1-\\rho) \\approx 0.02309570897$（谱表示 $\\sum 1/(\\gamma_n^2+1/4)$ 条件于 RH） | 耦合空间不确定性关系下界 $☯/2$ |\n| 零点虚部 $\\gamma_n$ | $\\rho = 1/2 + i\\gamma_n$ | 共振频率 |\n| 零点差 $\\gamma_2-\\gamma_1$ | $\\gamma_2-\\gamma_1 \\approx 6.887315$ | 超导 $T_c$ 公式 |\n\n> **缺口标注**：$☯$ 与 $\\gamma_n$ 谱在 GL(5) 固定层级下的严格谱实现（波利亚类型谱算符的物理铸造）待严格推导，见 §9。\n\n### 5.4 数学事实：$☯_n = n \\cdot ☯_1$\n\n设 $☯_1 = \\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1} \\approx 0.02309570897$ 为 GL(1) 层级的相变量子。对 GL(n) 层级，取 Eisenstein 诱导表示 $\\pi = \\mathrm{Ind}_{\\mathrm{GL}(1)^n}^{\\mathrm{GL}(n)}(\\chi_1, \\ldots, \\chi_n)$，其完成 L 函数满足\n\n$$\\xi(s, \\pi) = \\prod_{k=1}^{n} \\xi(s, \\chi_k).$$\n\n对数导数可加性给出\n\n$$\\frac{\\xi'(1, \\pi)}{\\xi(1, \\pi)} = \\sum_{k=1}^{n} \\frac{\\xi'(1, \\chi_k)}{\\xi(1, \\chi_k)}.$$\n\n当所有 $\\chi_k$ 取平凡特征时，\n\n$$\\boxed{☯_n = n \\cdot ☯_1}$$\n\n这是 **L 函数对数导数的可加性**，是数学事实，不依赖物理假设。\n\n**物理角色**：物理系统固定在 GL(5) 层级（§5.3），使用 $☯ = ☯_1 \\approx 0.02309570897$。$☯_n = n \\cdot ☯_1$ 作为 GL(n) 层级的数学不变量保留，但 $n > 5$ 层级不主导物理谱。\n\n---\n\n## 6. 超导的谱结构\n\n### 6.1 超导使用 GL(5) 固定层级的相变量子\n\n超导 $T_c$ 公式使用 GL(5) 固定层级的相变量子 $☯$ 和黎曼零点差 $\\gamma_2-\\gamma_1$：\n\n现有 CQM 超导公式（`06 超导/CQM_超导核心理论.md` §11.10）：\n\n$$T_c \\sim \\frac{\\theta_D}{2\\,\\mathrm{arccoth}(x)}$$\n\n显式使用了：\n- $\\theta_D$、$\\beta$、$\\Delta\\delta_0$、$\\delta_v$：材料与缺陷参数（`CQM_超导核心理论.md` §11.10 口径）；\n- $\\gamma_2 - \\gamma_1$：黎曼零点差；\n- $☯$ 经资格条件间接进入闭式。\n\n### 6.2 数值证据\n\n$\\lambda_c$ 方程的值（$q_c = 0.3290057278\\ldots$，$\\lambda_c = 1.3160229113\\ldots$）与 $\\mathfrak{c}_1 = 1/4 + \\gamma_1^2$ 均为可复算的纯数学数值，见 `03 引力与退相干/CQM_引力_GN可能公式.md` §8.2 与 `README.md` 核心数值结果表。\n\n超导侧的预测精度（按材料类别的中位误差）当前**无可复核产物**：生成这些数字的脚本不在仓库中，故本节不列具体精度数值。相关框架（自由能公式与类别化幂律）见 `06 超导/CQM_超导_专题与扩展.md` §11.12。\n\n### 6.3 与零点猜想的关系\n\n- $☯$ 的谱表示条件于 **RH（黎曼猜想）**（$\\zeta$/GL(1) 侧）；\n- 超导完整理论的存在论前提是 **GRH（广义黎曼猜想）**（GL(5) 固定层级实谱条件）。\n\n**超导的完整理论的存在论前提是 GRH（广义黎曼猜想）（GL(5) 固定层级实谱条件）。** 这也印证了 CQM 的能力边界由朗兰兹纲领的证明状态决定。\n\n---\n\n## 7. 标准模型难以统一的深层原因\n\n| 规范群 | 朗兰兹层级 | 数学证明状态 | CQM 状态 |\n|:---|:---|:---|:---|\n| 统一 $SU(5)$ | GL(5) 固定层级 | 朗兰兹对应未证明 | 相变量子 $☯ \\approx 0.02309570897$ 已确定 |\n\n**标准模型的难，是难在 GL(5) 固定层级的数学结构（朗兰兹对应）尚未被完全揭开。CQM 的难，因此就是朗兰兹纲领的难。**\n\n---\n\n## 8. 完整发生学共振图\n\n```text\n质数分布（唯一振荡源）\n │\n └─► GL(5) 层：基态共振 → L(s,Π) → 基态零点\n  └─ GRH：实谱条件\n  └─ 相变量子 ☯ = ξ'(1)/ξ(1) ≈ 0.02309570897\n  └─ 同步算符 Ŝ₀ → SU(5) ⇒ 重组实现\n   └─ 规范群 U(1)×SU(2)×SU(3)（重组实现的直接输出，不与 GL(n) 层级挂钩）\n    └─ U(1) 电磁 → 精细结构常数 α；超导 Tc（☯ + γ₂-γ₁）\n```\n\n---\n\n## 9. 状态标注与开放问题\n\n| 环节 | 状态 | 说明 |\n|:---|:---|:---|\n| 质数共振 → ζ 零点谱 | 严格 | 欧拉乘积 + 显式公式 |\n| $☯ = \\sum_\\rho 1/(1-\\rho)$ | 严格 | Hadamard 乘积公式（不依赖 RH） |\n| $☯ = \\sum 1/(\\gamma_n^2+1/4)$ | 严格（条件于 RH） | 代入 $\\rho=1/2+i\\gamma_n$ 后的谱表示 |\n| $\\alpha$ 从 4-单纯形导出 | 启发式近似 | $\\alpha^{-1} = 16384\\pi/375 \\approx 137.2583$，与实验值偏差≈0.162%（非精确值；`CQM_核心_集成理论.md` §7） |\n| 常规超导 $T_c$ | 公式已给出（唯象），待第一性推导 | $☯$ + $\\gamma_2-\\gamma_1$ → $T_c$（唯象模型，前向预测未闭合；与 `CQM_核心_因果网络同步理论.md` §9.2 口径一致） |\n| GL(5) 朗兰兹对应 | 未证明 | 基态自守表示与伽罗瓦表示的对应 |\n| 黎曼猜想（$\\zeta$ 的非平凡零点；GL(5) 固定层级的实谱条件，ζ 零点谱在该层级直接使用） | 未证明 | 等价于配对不变量 $\\mathfrak{c}_n=\\rho_n(1-\\rho_n)$ 为实 |\n| GRH（GL(5) 固定层级实谱条件） | 未证明 | 超导完整理论的存在论前提 |\n\n### 开放问题清单\n\n1. **GL(5) 固定层级零点猜想**：GRH 是超导完整理论的存在论前提。\n\n---\n\n## 结论\n\n> **质数分布在 GL(5) 固定层级上产生共振。广义黎曼猜想保证该层级共振是实谱。同步算符利用实共振谱执行紧化投影，产生物理规范群和可观测参数。黎曼猜想是 GL(5) 固定层级的实谱条件（ζ 零点谱在该层级直接使用），GRH 是 GL(5) 自守 L 函数的完整实谱条件。物理世界的规范群结构，因此是质数共振的投影。**\n>\n> **精细结构常数 $\\alpha$ 来自SU(5) 重组实现：SU(5) 重组实现 ⇒ $U(1)$ 电磁群 → 精细结构常数 $\\alpha$。精细结构常数是GL(5)固定层级整体的反映。数论中的“精细结构”（零点振荡 $\\gamma_n$）与物理中的“精细结构常数”在CQM中获得了同一本体论身份。**\n>\n> **相变量子 $☯ = \\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1} \\approx 0.02309570897$，固定于 GL(5) 层级。**\n>\n> **超导使用 GL(5) 固定层级的相变量子 $☯$ 和黎曼零点差 $\\gamma_2-\\gamma_1$。**\n\n---\n\n## 附录A：朗兰兹纲领静态对象五维层次图\n\n> **定位**：本附录给出朗兰兹纲领中已知主要静态对象的完整分类，按“全局/局部 × 域/环 × 数域型/函数域型 × 伽罗瓦侧/自守侧 × 对象类型”五维分层。此图不涉及对象间的关系（函子、对应、变换），仅做静态归类，为CQM朗兰兹分层提供数学对象的全景索引。CQM的物理对应取自其中GL(5)自守侧+伽罗瓦侧的特定对象。\n\n### A.1 五维层次图（全展开标注版）\n\n**标注规则**：分支节点只用单一分类标准；每个节点标注（属性：…；说明：…；例：…），中间节点标注其下子对象共有的普遍属性，叶子节点标注自身属性、说明与例子。\n\n```\n朗兰兹纲领静态对象\n│\n├─ 全局\n│   ├─ 域\n│   │   ├─ 数域型\n│   │   │   ├─ 伽罗瓦侧\n│   │   │   │   ├─ 群\n│   │   │   │   │   ├─ 绝对伽罗瓦群 Gal(F̄/F)（属性：紧致逆极限拓扑群；说明：F 的全部代数扩张自同构构成的群）\n│   │   │   │   │   ├─ Weil 群 W_F（属性：Gal(F̄/F) 的稠密子群；说明：含 Frobenius 元与惯性群，局部类域论的精确载体）\n│   │   │   │   │   └─ Motivic Galois 群（属性：猜想对象；说明：motive 范畴的 Tannakian 自同构群；例：G_m、motive 意义的 GL₂）\n│   │   │   │   ├─ 表示\n│   │   │   │   │   ├─ 不可约\n│   │   │   │   │   │   ├─ 椭圆曲线 Tate 模（属性：2 维 ℓ-进；说明：椭圆曲线 ℓ-进上同调，Deligne 定理证明其与 L 函数匹配；例：E: y²=x³-x 的 T_ℓ(E)）\n│   │   │   │   │   │   ├─ 模形式 ℓ-进表示（属性：2 维 ℓ-进；说明：Deligne 构造，Frobenius 本征值给出 Hecke 本征值；例：权 12 尖点形式的 ρ_f）\n│   │   │   │   │   │   ├─ crystalline 表示（属性：p 进；说明：p 进 Hodge 理论中的表示类）\n│   │   │   │   │   │   ├─ 不可约 Artin 表示（属性：复；有限像；说明：Gal(F̄/F) 经有限商的表示；例：icosahedral 表示，A₅ 的 2 维表示）\n│   │   │   │   │   │   ├─ 椭圆曲线 motive（属性：纯 motive；权 1；说明：h¹(E)，以 H¹ 实现）\n│   │   │   │   │   │   └─ 模形式 motive（属性：纯 motive；说明：Deligne 构造；对应权 2k-1 的尖点形式）\n│   │   │   │   │   └─ 可约\n│   │   │   │   │       ├─ Dirichlet 特征直和（属性：ℓ-进；说明：1 维表示的直和；例：χ ⊕ χ̄）\n│   │   │   │   │       ├─ 可约 Artin 表示（属性：复；说明：诱导表示的直和分解）\n│   │   │   │   │       └─ Tate motive 直和（属性：混合 motive；权 0；说明：1 的 Tate motive Q(1) 的直和）\n│   │   │   │   ├─ 参数：∅（说明：全局域通常无局部参数）\n│   │   │  │   └─ 函数域型 · 非阿基米德（𝔽_q((t)) 及其扩张）\n    │       ├─ 自守侧\n    │       │   ├─ 群：局部群 G(𝔽_q((t)))（说明：函数域局部群）\n    │       │   ├─ 表示\n    │       │   │   ├─ 超尖点表示（属性：离散）\n    │       │   │   └─ 非超尖点表示（属性：连续）\n    │       │   ├─ 参数：Bernstein 中心作用、局部 Langlands 参数（说明：Laumon 定理）\n    │       │   ├─ L 函数与不变量：局部自守 L 因子、ε-因子、γ-因子\n    │       │   ├─ 几何对象：局部 Shtukas、仿射 Deligne–Lusztig 簇\n    │       │   ├─ 范畴：导出范畴、无穷范畴\n    │       │   └─ 其他：∅\n    │       └─ 伽罗瓦侧\n    │           ├─ 群：Weil 群、Weil–Deligne 群\n    │           ├─ 表示：不可约 Weil–Deligne 表示、可约 Weil–Deligne 表示、Langlands 参数（说明：Langlands 参数单列，不参与可约性分支）\n    │           ├─ 参数：Langlands 参数、Arthur 参数\n    │           ├─ L 函数与不变量：局部 Artin L 因子、ε-因子\n    │           ├─ 几何对象：局部 Shtukas、仿射 Springer 纤维\n    │           ├─ 范畴：导出范畴、无穷范畴\n    │           └─ 其他：∅\n    └─ 环\n        ├─ 数域型：∅（说明：局部无阿代尔环对应物）\n        └─ 函数域型：∅\n```\n\n#### A.1.1 分类规则说明\n\n1. **唯一层次链**：每个具体对象在树中只出现一次，从根到叶路径唯一。\n2. **分类一致**：同一节点下的第一级分支标准对所有同级对象统一适用；不同类别对象单列并标注“不参与该分支”。\n3. **全展开**：具体对象尽量展开到最细层级（如 L 函数列出 Dirichlet L、icosahedral L、椭圆曲线 L 等具体对象）。\n4. **标注格式**：每个节点标注（属性：…；说明：…；例：…）——中间节点标注其下子对象共有的普遍属性，叶子节点标注自身属性、说明与例子；“例：”引出具体实例。\n5. **空分支保留**：以 ∅ 标出并附说明，维持框架完整性。\n\n### A.2 五个维度说明\n\n| 维度 | 取值 | 含义 |\n|:-----|:-----|:-----|\n| **全局/局部** | 全局、局部 | 对象定义在整体域/环上还是局部完备化上 |\n| **域/环** | 域、环 | 对象定义在数域/函数域上还是阿代尔环上 |\n| **数域型/函数域型** | 数域型、函数域型 | 特征零（数域）vs 特征 $p$（函数域） |\n| **伽罗瓦侧/自守侧** | 伽罗瓦侧、自守侧 | 朗兰兹对应的两侧：算术侧 vs 分析侧 |\n| **对象类型** | 群、表示、参数、L函数、几何、范畴、其他 | 对象的数学类别 |\n\n### A.3 扩展说明\n\n- **几何对象**中包含高阶对象：Perfectoid 空间、Diamonds、v-sheaves、D-模、perverse sheaves、堆栈（如 $\\text{Bun}_G$）。\n- **范畴**中包含：导出范畴、无穷范畴、自守表示范畴、Tannakian 范畴。\n- **其他**中包含：顶点代数、周期环（$B_{dR}$, $B_{\\text{cris}}$, $B_{\\text{st}}$）、Galois 变形环、Eigencurve。\n- 在“不关心关系”的前提下，五维框架已能容纳朗兰兹纲领中已知的**全部主要静态对象**。\n\n### A.4 CQM 物理对应\n\nCQM 从上述五维层次图中选取的物理对应对象：\n\n| CQM 物理层 | 选取的数学对象 | 五维位置 |\n|:-----------|:---------------|:---------|\n| GL(5) 固定层级 | $\\zeta(s)$，黎曼零点 $\\gamma_n$，相变量子 $☯$，基态自守表示 | 全局·环·数域型·自守侧·L函数/表示 |\n| 不确定性关系 | $[\\hat{u}, \\hat{p}_u] = i$，$\\Delta u \\cdot \\Delta v_\\tau \\geq ☯/2$ | 局部·域·数域型·阿基米德·自守侧·表示 |\n| p 进大小分化 | $\\mathbb{Q}_p$，p 进赋值 | 局部·域·数域型·非阿基米德·局部域侧 |\n\n## 附录B：相变动力学的数学框架\n\n相变动力学框架用数学语言严格化，明确区分**定义、猜想与开放问题**。\n\n### B.1 基本对象\n\n#### B.1.1 黎曼 $\\xi$ 函数与相变量子 $☯_1$\n\n定义整函数\n\n$$\\xi(s)=\\frac12 s(s-1)\\pi^{-s/2}\\Gamma\\!\\left(\\frac{s}{2}\\right)\\zeta(s),$$\n\n满足 $\\xi(s)=\\xi(1-s)$。\n\n定义**相变量子**\n\n$$☯_1:=\\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1} \\approx 0.02309570897.$$\n\n#### B.1.2 L 函数与正则化\n\n设 $\\pi$ 是 $\\mathrm{GL}(n, \\mathbb{A}_\\mathbb{Q})$ 上的自守表示，$L(s,\\pi)$ 为其标准 L 函数，完成 L 函数为\n\n$$\\Lambda(s,\\pi)=\\Gamma_\\pi(s)L(s,\\pi).$$\n\n定义正则化整函数\n\n$$\\xi(s,\\pi):=s^{m}(s-1)^{m}\\Lambda(s,\\pi),$$\n\n其中 $m=\\operatorname{ord}_{s=1}L(s,\\pi)$，使得 $\\xi(1,\\pi)\\neq0$。\n\n定义 **L 函数对数导数不变量**\n\n$$☯_\\pi:=\\frac{\\xi'(1,\\pi)}{\\xi(1,\\pi)}.$$\n\n### B.2 层级固定 GL(5)\n\n物理系统固定在 GL(5) 层级，理由如下：\n\n- **SU(5) 最小单群**：$\\mathrm{SU}(5)$ 是包含标准模型规范群 $U(1)\\times SU(2)\\times SU(3)$ 的最小单群，$\\operatorname{rank}SU(5)=4=\\operatorname{rank}(U(1)\\times SU(2)\\times SU(3))$。\n- **rank 4 与四维时空共振**：$\\operatorname{rank}SU(5)=4$ 与时空维度 $d=4$ 共振。\n- **$n > 5$ 锁定**：更高层级 $n>5$ 不排除，但 GL(5) 主导物理谱。\n- **$n \u003c 5$ 内嵌**：低层级 $n\u003c5$ 内嵌为 GL(5) 的 Levi 子群或 Eisenstein 诱导。\n\n### B.3 核心方程\n\n相变动力学的核心是 **L 函数自洽条件**：\n\n$$\\boxed{\\frac{\\xi'(1,\\pi)}{\\xi(1,\\pi)} = ☯_1}$$\n\n即 $☯_\\pi = ☯_1$。这是 L 函数对数导数不变量等于相变量子的自洽条件，**不是概率方程或微分方程**。\n\n### B.4 具体可检验模型：GL(5) Eisenstein 参数化\n\n取 $\\mathrm{GL}(5)$ 的 Eisenstein 连续谱族\n\n$$\\pi_t:\\quad L(s,\\pi_t)=\\zeta(s+it)\\zeta(s-it)\\zeta(s)^3,\\quad t\\in\\mathbb{R}.$$\n\n正则化后\n\n$$\\xi(s,\\pi_t)=\\xi(s+it)\\xi(s-it)\\xi(s)^3.$$\n\n其 L 函数对数导数不变量为\n\n$$I(t)=2\\Re F(1+it)+3F(1),$$\n\n其中\n\n$$F(s)=\\frac{\\xi'(s)}{\\xi(s)} =\\frac{1}{s}+\\frac{1}{s-1}-\\frac12\\log\\pi+\\frac12\\psi\\!\\left(\\frac{s}{2}\\right)+\\frac{\\zeta'(s)}{\\zeta(s)}.$$\n\n自洽条件 $I(t)=☯_1$ 化为\n\n$$2\\Re F(1+it)+3F(1)=F(1),$$\n\n整理得**可数值求解的超越方程**\n\n$$\\boxed{ \\Re F(1+it) = -F(1) }.$$\n\n### B.5 变分原理\n\n变分原理在此框架中的角色是**只筛选不构造** L 函数：\n\n- 给定 GL(5) 自守谱空间，变分条件筛选满足 $☯_\\pi = ☯_1$ 的自守表示 $\\pi$。\n- **元作用量 $\\Phi[\\pi]$ 未知且不唯一**：不存在已知的从自守表示空间到 $\\mathbb{R}$ 的泛函 $\\Phi[\\pi]$ 使得变分方程 $\\delta\\Phi/\\delta\\pi=0$ 的解集恰为 $\\{\\pi : ☯_\\pi = ☯_1\\}$。\n- 框架核心是 **GL(5) 自守谱空间结构**，变分只是筛选工具，不是构造工具。\n\n### B.6 概率密度\n\n**不引入概率密度**。连续相变概率密度 $P(x)$ 缺乏数学依据：不存在从自守表示空间自然诱导的概率测度。框架不依赖概率密度。\n\n### B.7 与精细结构常数的联系\n\n精细结构常数\n\n$$\\alpha^{-1} \\approx \\frac{16384\\pi}{375} \\approx 137.2583$$\n\n与实验值 $\\alpha^{-1}\\approx137.035999$ 偏差 $0.162\\%$。\n\n**严格导出未完成**：从核心方程 $☯_\\pi = ☯_1$ 到 $\\alpha^{-1}=16384\\pi/375$ 的严格推导链尚未完成。\n\n### B.8 开放问题\n\n1. **方程解的存在性**：超越方程 $\\Re F(1+it)=-F(1)$ 是否有正实数解？若有，是否唯一？\n2. **元作用量形式**：是否存在从 GL(5) 自守表示空间到 $\\mathbb{R}$ 的泛函 $\\Phi[\\pi]$ 使得变分方程筛选出 $☯_\\pi = ☯_1$ 的解？\n3. **$t_0$ 与 $\\alpha$ 关系**：若方程有解 $t_0$，$t_0$ 与精细结构常数 $\\alpha$ 之间的精确关系是什么？\n4. **$n > 5$ 锁定严格表述**：GL(5) 主导物理谱、$n>5$ 锁定的严格数学表述是什么？\n5. **不同物理系统对应解**：不同物理系统（如不同超导体）对应怎样的自守表示 $\\pi$ 满足 $☯_\\pi = ☯_1$？\n\n### B.9 最终表述\n\n该框架在数学上可表述为三个层次：\n\n$$\\boxed{\\text{相变动力学在 GL(5) 自守谱中求 } \\frac{\\xi'(1,\\pi)}{\\xi(1,\\pi)}=☯_1 \\text{ 的解}}$$\n\n$$\\boxed{\\text{变分只是筛选工具，不构造 L 函数；元作用量 } \\Phi[\\pi] \\text{ 未知且不唯一}}$$\n\n$$\\boxed{\\text{概率密度不作为基本对象；框架核心是 GL(5) 自守谱空间结构}}$$\n\n**状态**：$\\xi$、$☯_1$、$☯_\\pi$ 是严格数学；核心方程是 L 函数自洽条件；Eisenstein 模型是可数值检验的具体方程；精细结构常数严格导出未完成。\n\n> **注**：CQM 当前主要使用**全局·环·数域型·自守侧**的对象（自守表示、L函数、Hecke代数）。伽罗瓦侧对象（Motive、伽罗瓦表示）在CQM中通过朗兰兹对应间接进入。局部非阿基米德对象（p 进域、Perfectoid 空间）在p 进大小分化中潜在使用，但尚未形式化。\n", "backlinks": ["D001", "D007", "D010", "D013", "D014", "D017", "D020", "D023", "D024", "D025", "D028", "D031"], "outlinks": ["D001", "D014", "D021", "D028", "D029", "D030", "D031"]}, {"id": "D009", "doc_id": "D009", "title": "量纲与群论", "path": "01 核心理论/CQM_核心_量纲与群论.md", "group": "01 核心理论", "layer": 1, "type": "理论主干", "text": "# CQM 核心：量纲与群论（量纲发生学）\n\n**作者**：ruster\n\n> CQM 不采用自然单位制（不令 $c=1$、$\\hbar=1$）。电磁采用高斯单位制，SI 作为唯一翻译对照。本文从**量纲发生学**的视角出发，探讨量纲如何从物质之间“质与质的关系”中生成与锁定。量纲发生学层级：第一个量纲是时间 $T$（CQM 的时间动力学：因果时、固有时），无量纲→时间的特征常数未知（可能没有），但无量纲与固有时紧密关联——固有时来自事件计数（无量纲纯数），事件计数经固有时获得时间量纲；无量纲→长度的特征常数为 $K_L$（禁闭映射常数，$r_{\\text{coupling}}\\cdot K_L=r_{\\text{phys}}$，$r_{\\text{coupling}}$ 与固有时共轭，$K_L$ 值有待确定）；$c$ 是时空同步前沿速度，不承担量纲转换；质量的量纲特征常数为 $K_M$（$K_M=G_N^{-1}$）；每压掉一个量纲，冒出一个更基础的特征常数；特征常数可能来自自守形式。自然单位制是还原论暴政，掩盖了不可还原的关系——它把常数藏进单位定义里，是单位锚定而非理论锚定。本文给出整套方案的严格表述。\n>\n> 相关文档：`03 引力与退相干/CQM_引力_GN可能公式.md` §10（SI 转换）。\n\n---\n\n## 引言：文档地图与阅读路线\n\n**本文档讲什么**：属性先在（属性锚点＝$GL(n)$ 的矩阵元素 $g_{ij}$），经关系潜在-显现化为量纲（**量纲发生学**）——量纲如何从物质之间“质与质的关系”中生成与锁定，以及由此给出的单位制选择（高斯制）与对自然单位制的批判。\n\n**建议阅读路线**（按目的选其一）：\n\n- **通读**：§一（总原则与哲学基础）→ §六（量纲发生学的核心：特征常数与层级）→ §七（自守形式猜想：链条本身 §7.6、锚定与检验 §7.7）→ §八（自然单位制批判）→ §十三（最终总结）；\n- **查证某条命题**：先用『定义索引』定位定义，再按各章『章首导语』进入；\n- **只看结论**：§一 的盒式公式 ＋ §13.2「一句话总结」；\n\n**与姊妹文档的分工（单一事实来源）**：本文档与 `01 核心理论/CQM_核心_唯物主义群论.md` 互有引用，一律**以“谁详”为准、另一侧只给指针**，避免同一内容两处展开：\n\n| 内容                              | 以谁为准     | 另一侧的处理             |\n| :------------------------------ | :------- | :----------------- |\n| 量纲／特征常数／独立属性／差异分类学／量纲总分类（本文档 §6.4、§6.5.13） | **本文档**  | 群论文档 §5.5 只列要点     |\n| 三条腿的分工与常数三类分法（本文档 §7.5）         | **本文档**  | 群论文档 §5.5 末只给指针    |\n| 群约束性定义／四条基约束性／不变性／$S_n$ 谱系／自守形式 | **群论文档** | 本文档 §6.4.7 只“列而不论” |\n\n**编号说明**：一级章用中文数字（如“六、”），子节用阿拉伯数字（如 §6.4.4）；正文引用一律写作 `§N.M`，与子节号直接对应。\n\n---\n\n## 一、总原则与哲学基础\n\n$$\\boxed{\n\\begin{aligned}\n&\\text{原初的是质与质的关系；}\\\\\n&\\text{第一个量纲是时间 }T\\text{（CQM 的时间动力学：因果时、固有时）；}\\\\\n&\\text{无量纲}\\to\\text{时间的特征常数未知，可能没有；无量纲与固有时紧密关联（固有时来自事件计数）；}\\\\\n&\\text{无量纲}\\to\\text{长度的特征常数为 }K_L\\text{（禁闭映射常数，}K_L\\text{ 值有待确定）；}\\\\\n&c\\text{ 是时空同步前沿速度，不承担量纲转换；}\\\\\n&\\text{质量的量纲特征常数为 }K_M\\text{（}K_M=G_N^{-1}\\text{）；}\\\\\n&\\text{电磁采用高斯单位制，电荷不是独立量纲；}\\\\\n&\\text{温度、物质的量、发光强度由 }K_\\Theta,K_N,K_J\\text{ 从能量、计数、功率转换；}\\\\\n&\\text{SI 作为唯一翻译对照，用于给出数值；}\\\\\n&\\text{更底层（猜想）：自守形式作为输入，推出量纲和常数；}\\\\\n&\\text{自然单位制是还原论暴政，掩盖了不可还原的关系。}\n\\end{aligned}}$$\n\n---\n\n> **定义索引**（**只列定义**，不列定理、结论与总览表；便于查阅；括号内为该条所在节）\n\n| 定义 | 位置 | 一句话 |\n|:---|:---|:---|\n| $K_Q$ 的定义 | §3.1 | 由 SI 联立定出电荷层特征常数 |\n| 大差异／同量纲内差异 | §6.2 | 前者产生特征常数、后者不产生（§6.2.1、§6.2.2 各有定义式） |\n| 量纲内差异（定义） | §6.2.2 | 同一量纲内部不可简单组合、不可简单归约的结构性差异 |\n| **量纲＝属性的量度类别；特征常数** | §6.4.1 | 属性被实现为量纲；$K$ 是该次实现的特征常数 |\n| **三层：量纲／具体值（表面）／属性量的值（内蕴）** | §6.4.2 | 表面值不一定一样；内蕴值在实现过程中具有内在不变性 |\n| 特征常数的两支 | §6.4.4 | 跨量纲支／同量纲内支（含三类细分） |\n| 量纲间差异／量纲内差异 | §6.4.5 | 前者＝属性类型差异；后者＝实现群差异（大内＝属性关系群选取、小内＝离散群选取） |\n\n---\n\n## 二、量纲空间与量纲分析基础\n\n### 2.1 Buckingham π 定理\n\n量纲分析的核心定理是 Buckingham π 定理（Buckingham, 1914）：\n\n> 若一个物理上有意义的方程涉及 $n$ 个物理量，且这些量由 $k$ 个独立量纲构成，则该方程可改写为 $p = n-k$ 个无量纲组合（π 群）之间的关系。\n\n形式化表述：设物理量 $q_1,\\dots,q_n$ 满足某物理定律 $\\Phi(q_1,\\dots,q_n)=0$，其量纲矩阵的秩为 $r$，则存在 $p=n-r$ 个独立的无量纲量 $\\pi_1,\\dots,\\pi_p$，使得定律等价于：\n\n$$\\Psi(\\pi_1, \\pi_2, \\dots, \\pi_p) = 0$$\n\n**物理意义**：物理定律不依赖于单位制的选择——只有无量纲组合才是“真实的”物理关系，有量纲量只是这些关系在特定单位制下的表达。\n\n**群论形式（与 §7.6 锚点论证衔接）**：单位制的任意选择，就是**量纲空间的重标度群**\n$$G_{\\text{scale}}\\cong(\\mathbb{R}_{>0})^{k}$$\n作用在 $k$ 个独立量纲上——换单位即施加群作用：$q_i\\mapsto\\lambda_1^{a_{i1}}\\cdots\\lambda_k^{a_{ik}}q_i$。$\\pi$ 定理说的正是：**该群作用下的不变量恰是无量纲组合**；量纲矩阵的秩 $r$ 给出轨道维数，$p=n-r$ 即独立不变量的个数。\n\n⇒ **单个量纲并非“没有非平凡关系化”**：它自带 $\\mathbb{R}_{>0}$ 重标度，只是该作用**不跨量纲**；跨量纲的锚须另求（§7.6 二）。【标准数学】\n\n## 三、电磁部分：高斯单位制\n\n采用高斯单位制（CGS-esu 与 CGS-emu 的对称合成）。为什么选高斯制而不是 SI、Heaviside–Lorentz 或其他？\n\n**高斯制的核心优点**：\n1. **电荷量纲完全导出**：$[q] = M^{1/2}L^{3/2}T^{-1}$，不需要引入第四独立量纲（电流/电荷）\n2. **电场与磁场同量纲**：$[E] = [B] = M^{1/2}L^{-1/2}T^{-1}$，相对论协变性更直观——$E$ 和 $B$ 是同一张量的分量，量纲理应相同。\n3. **$c$ 显式出现在基本方程中**：实现关系不藏在 $\\varepsilon_0$、$\\mu_0$ 里，而是直接以光速形式出现，符合“特征常数显式呈现”的原则。\n4. **理论物理界的传统选择**：量子力学、量子场论、粒子物理教材普遍采用高斯制或其近亲 Heaviside–Lorentz 制，因为公式更简洁、物理关系更透明。\n\n**为什么不选 Heaviside–Lorentz（有理化高斯制）**：Heaviside–Lorentz 去掉了 $4\\pi$ 因子，麦克斯韦方程更对称，但代价是库仑定律和毕奥-萨伐尔定律多出 $4\\pi$。在 CQM 框架中，**$4\\pi$ 因子有物理意义**（球对称、立体角），不应被有理化“吸收”掉。高斯制保留了 $4\\pi$ 在力定律中的原始位置，更有利于追踪几何来源。\n\n电荷是导出量：\n\n$$\\boxed{\n[q] = M^{1/2} L^{3/2} T^{-1}\n}$$\n\n电荷单位：\n\n$$\\boxed{\\text{esu} = \\text{statC}}$$\n\n其他电磁量也全部由 $M,L,T$ 组合：\n\n| 物理量 | 高斯制量纲 |\n|---|---|\n| 电荷 | $M^{1/2}L^{3/2}T^{-1}$ |\n| 电流 | $M^{1/2}L^{3/2}T^{-2}$ |\n| 电场 | $M^{1/2}L^{-1/2}T^{-1}$ |\n| 磁场 | $M^{1/2}L^{-1/2}T^{-1}$ |\n| 电压 | $M^{1/2}L^{1/2}T^{-1}$ |\n| 电阻 | $L^{-1}T$ |\n| 电容 | $L$ |\n\n### 3.1 esu → esu(SI) → C：$K_Q$ 的推导\n\n**核心原则**：特征常数的功能是提供一个新量纲。电荷量纲 $Q$ 不是预先存在的，而是由**真正的特征常数**从力学量纲中生成。**方向决定角色**：乘在旧单位上、使旧量纲变成新量纲的因子，才是特征常数。\n\n**esu 的量纲**：高斯制库仑定律 $F=q_1q_2/r^2$ 给出 $[\\text{esu}]=M^{1/2}L^{3/2}T^{-1}$。CGS 中 $1\\ \\text{esu}=1\\ \\mathrm{g}^{1/2}\\mathrm{cm}^{3/2}\\mathrm{s}^{-1}$。\n\n**esu → esu(SI)**：由 $1\\ \\mathrm{g}=10^{-3}\\ \\mathrm{kg}$，$1\\ \\mathrm{cm}=10^{-2}\\ \\mathrm{m}$，得 $1\\ \\text{esu}=10^{-9/2}\\ \\text{esu(SI)}$，其中 $\\text{esu(SI)}:=\\mathrm{kg}^{1/2}\\mathrm{m}^{3/2}\\mathrm{s}^{-1}$。$10^{-9/2}$ 是纯数。\n\n**C 与 esu 的关联**：$1\\ \\mathrm{C}=10c\\ \\text{esu}$，故 $1\\ \\text{esu}=\\frac{1}{10c}\\ \\mathrm{C}$。$10c$ 是关联因子，不是特征常数。\n\n**$K_Q$ 的定义**：CQM 要求 SI，联立得 $1\\ \\mathrm{C}=\\frac{10c}{10^{9/2}}\\ \\text{esu(SI)}$。定义：\n\n$$\\boxed{K_Q=\\frac{10c}{10^{9/2}}\\approx 9.480\\times 10^{4}}$$\n\n$$\\boxed{1\\ \\mathrm{C}=K_Q\\ \\text{esu(SI)}}$$\n\n量纲：$Q=[K_Q]\\cdot M^{1/2}L^{3/2}T^{-1}$，故\n\n$$\\boxed{[K_Q]=QM^{-1/2}L^{-3/2}T}$$\n\n$K_Q$ 是电荷层的量纲特征常数（统一公式模式 §6.3：旧×$K$=新），满足 $M^{1/2}L^{3/2}T^{-1}\\cdot K_Q=Q$。$10c$ 只是 C → esu 的关联因子，不是特征常数。\n\n\n---\n\n## 四、光速的地位\n\n光速物理值：\n\n$$\\boxed{c = 299792458\\ \\text{m/s}}$$\n\n量纲：\n\n$$[c] = L T^{-1}$$\n\n在本方案中：\n\n- 光速是时空同步前沿速度（信息传播前沿速率），不承担量纲转换；\n- 它出现在高斯制麦克斯韦方程组和洛伦兹力中：\n\n$$\\nabla\\times\\mathbf{E}=-\\frac{1}{c}\\frac{\\partial\\mathbf{B}}{\\partial t}$$\n\n$$\\mathbf{F}=q\\left(\\mathbf{E}+\\frac{\\mathbf{v}}{c}\\times\\mathbf{B}\\right)$$\n\n---\n\n## 五、温度、物质的量、发光强度\n\n### 5.1 温度\n\n温度作为独立量纲 $\\Theta$，由温度层特征常数 $K_\\Theta$ 从能量转换（统一公式模式 §6.3：旧×$K$=新）：\n\n$$\\boxed{ML^2T^{-2}\\cdot K_\\Theta=\\Theta}$$\n\n与已有物理常数的关系：$K_\\Theta = k_B^{-1}$，其中玻尔兹曼常数\n\n$$k_B = 1.380649\\times 10^{-23}\\ \\text{J/K}$$\n\n量纲（$\\Theta$ 为温度量纲符号）：\n\n$$\\boxed{\n[K_\\Theta] = \\Theta M^{-1} L^{-2} T^2\n}$$\n\n实现关系验证：$ML^2T^{-2}\\cdot[K_\\Theta]=ML^2T^{-2}\\cdot\\Theta M^{-1}L^{-2}T^2=\\Theta$，实现关系成立。等价地，$E=k_B T$ 中 $k_B=K_\\Theta^{-1}$，$[k_B]\\cdot\\Theta=\\Theta^{-1}ML^2T^{-2}\\cdot\\Theta=ML^2T^{-2}=[E]$。\n\n理论目标：\n\n$$\\boxed{\n\\text{由更深层理论推出 }K_\\Theta\\text{ 的数值}\n}$$\n\n### 5.2 物质的量\n\n物质的量作为独立量纲 $N$，由物质的量层特征常数 $K_N$ 锁定计数基准（统一公式模式 §6.3：旧×$K$=新）：\n\n$$\\boxed{1\\cdot K_N=N}$$\n\n与已有物理常数的关系：$K_N = N_A^{-1}$，其中阿伏伽德罗常数\n\n$$N_A = 6.02214076\\times 10^{23}\\ \\text{mol}^{-1}$$\n\n量纲（$N$ 为摩尔量纲符号）：\n\n$$\\boxed{\n[K_N] = N\n}$$\n\n实现关系验证：$1\\cdot[K_N]=N$，实现关系成立。等价地，$[N_A]\\cdot N = N^{-1}\\cdot N = 1$（无量纲），即 $N_A\\times 1\\ \\text{mol}=6.02214076\\times 10^{23}$ 为纯数。\n\n**与自守量纲的关系**：$N$ 是**独立量纲**，$K_N$（$=N_A^{-1}$）把无量纲的计数基准实现为物质的量（$1\\cdot K_N=N$）。$N$ 是**人为定义**的、用以衡量物质多少的计量量，**与自守量纲无关**——不属量纲-自守链的讨论对象（§7.6 二、§7.7.3）【CQM 构造假设】。\n\n> **与自守量纲的关系**：$N$ 是**人为定义**的、用以衡量物质多少的计量量，**与自守量纲无关**——不存在承载 $N$ 的不变量 $f$ 与相应极大关系群 $G_{\\max}(f)$（$[G_{\\max}(f)]$ 为一个基本自守量纲，§6.5 定义 3）。$N$ 在 SI 中为**独立物理量纲**（§6.4.3）。\n\n### 5.3 发光强度\n\n发光强度作为独立量纲 $J$，由发光强度层特征常数 $K_J$ 从功率转换（统一公式模式 §6.3：旧×$K$=新）：\n\n$$\\boxed{ML^2T^{-3}\\cdot K_J=J}$$\n\n与已有物理常数的关系：$K_J = K_{cd}^{-1}$，其中光度学常数\n\n$$K_{cd} = \\frac{1}{683}\\ \\text{W/cd} \\quad(\\text{555 nm 明视觉})$$\n\n量纲（$J$ 为坎德拉量纲符号）：\n\n$$\\boxed{\n[K_J] = J M^{-1} L^{-2} T^3\n}$$\n\n实现关系验证：$ML^2T^{-3}\\cdot[K_J]=ML^2T^{-3}\\cdot JM^{-1}L^{-2}T^3=J$，实现关系成立。等价地，$[K_{cd}]\\cdot J = J^{-1}ML^2T^{-3}\\cdot J = ML^2T^{-3} = [\\text{W}]$，与 $1\\ \\text{cd}=\\frac{1}{683}\\ \\text{W}$ 一致。\n\n---\n\n## 六、特征常数与量纲压缩（量纲发生学层级）\n\n> **本章导语**：本章是全文最重的一章（§6.0–§6.5），按本体论纲领「属性先在，关系潜在-显现化它」（§6.5.13）组织——「潜在-显现」指的是**属性**：属性先在为潜在，经关系而显现（显现为实例属性、自守形式、量纲），「潜在-显现化」沿三环节展开——**属性先在**（§6.4.3 独立属性、§6.5.2 完备属性矩阵）→ **关系分化**（§6.4.7、§6.5：极大关系群作为稳定化子把处在潜在态的属性切割为实例属性类别）→ **实例化**（§6.2、§七：自守形式＝稳定性的体现）→ **具体化**（§6.0–§6.3：特征常数 $K$ 族锁定各层的物理实现刻度，SI 对照见 §13）。行文主线：**层级生成**（§6.0–§6.1：每压掉一个量纲就冒出一个特征常数）→ **双重差异**（§6.2：大差异／同量纲内差异）→ **各常数的角色**（§6.3）→ **量纲作为属性实现**（§6.4：独立属性、特征常数的两支、差异分类学）→ **群论形式与量纲总分类**（§6.5：$G_{\\max}(f)$ 层级、计数、基本／子／派生）。只想看结论可径入 §6.2.4（核心结论）、§6.4.4（特征常数的两支）与 §6.5.13（量纲总分类）。\n\n> **术语**：本文用“**（属性实现的）量纲特征常数**”，记号 $K_X$ 不变（$K_L,K_M,K_Q,K_\\Theta,K_N,K_J$）。\n> 它不是“量纲之间的转换器”，而是“**属性 $P$ 被实现为某个量纲（某种实现）时的特征常数**”——\n> $\\text{属性 }P\\xrightarrow{\\ \\text{特征常数}\\ K_{P\\to\\mathcal R}\\ }\\text{量纲（或实现）}\\ \\mathcal R$。\n> 数值与量纲不因术语而变（$c$ 是 $[L]/[T]$；$K_M=G_N^{-1}$ 即 $[K_M]=ML^{-3}T^{2}$）。\n> 同名关系在 §7.2、§8.1 称“**实现关系**”；**单位制换算因子**（如 $\\mathrm{GeV}^{-2}\\!\\leftrightarrow\\!\\mathrm{SI}$）与**特征常数**（属性实现的特征常数）分属不同层，不要混用。\n> 跨量纲支与同量纲内支同构：见 §6.2.1（大差异）、§6.2.2（同量纲内差异）与 §6.4.4。\n\n\n核心观察：\n\n$$\\boxed{\n\\text{每压掉一个量纲，就会冒出一个特征常数。}\n}$$\n\n这不是简单的“替换”，而是量纲发生学中的**层级生成**：从原初层出发，通过特征常数的锁定，逐层生成我们在物理世界中观察到的量纲结构。\n\n### 6.0 量纲发生学层级\n\n量纲发生学关注量纲如何从物质之间“质与质的关系”中生成与锁定。其层级结构如下：\n\n> 按本体论纲领：**属性先在**（属性锚点＝$GL(n)$ 的矩阵元素 $g_{ij}$，量纲尚未显现）；下表各层的特征常数锁定即**潜在-显现化**（关系分化→具体化）的逐层实现刻度——每一行都是一个属性类别经其特征常数被实现为量纲的记录。\n\n| 层级     | 内容                              | 地位                                                                           |\n| ------ | ------------------------------- | ---------------------------------------------------------------------------- |\n| 原初     | 质与质的关系                          | 关系本身，先于量纲                                                                    |\n| 时间层    | 第一个量纲 $T$（因果时、固有时）              | CQM 时间动力学的起点；无量纲→时间特征常数未知（可能没有）；无量纲与固有时紧密关联——固有时来自事件计数（无量纲纯数），事件计数经固有时获得时间量纲 |\n| 长度层    | $r_{\\text{coupling}}\\cdot K_L=r_{\\text{phys}}$ | 由 $K_L$ 从无量纲耦合坐标生成（$r_{\\text{coupling}}$ 与固有时共轭）；$K_L$ 值有待确定 |\n| 质量层    | $L^3T^{-2}\\cdot K_M=M$              | 由 $K_M$ 从 $L,T$ 生成                                                           |\n| 电荷层    | $M^{1/2}L^{3/2}T^{-1}\\cdot K_Q=Q$ | 由 $K_Q$ 从 $M,L,T$ 生成（§3.1）                                                   |\n| 温度层    | $ML^2T^{-2}\\cdot K_\\Theta=\\Theta$               | 由 $K_\\Theta$ 从能量转换                                                                |\n| 物质的量层  | $1\\cdot K_N=N$                       | 由 $K_N$ 锁定计数基准                                                               |\n| 发光强度层  | $ML^2T^{-3}\\cdot K_J=J$               | 由 $K_J$ 从功率转换                                                             |\n\n#### 6.0.1 层级总表：不同量纲之间\n\n| 层级    | CQM 量纲关系                                       | 量纲特征常数            | 特征常数量纲                       | SI 对应单位 | SI 量纲    |\n| ----- | ---------------------------------------------- | ----------------- | ---------------------------- | ------- | -------- |\n| 原初关系  | 质与质的关系                                         | —                 | —                            | —       | —        |\n| 时间层   | 第一个量纲 $T$（因果时、固有时）                             | 未知（可能没有）          | —                            | 秒 s     | $T$      |\n| 长度层   | $r_{\\text{coupling}}\\cdot K_L=r_{\\text{phys}}$ | $K_L$             | $L$                          | 米 m     | $L$      |\n| 质量层   | $L^3T^{-2}\\cdot K_M=M$                             | $K_M$             | $ML^{-3}T^2$            | 千克 kg   | $M$      |\n| 电荷层   | $M^{1/2}L^{3/2}T^{-1}\\cdot K_Q=Q$                     | $K_Q$（§3.1） | $QM^{-1/2}L^{-3/2}T$ | 库仑 C    | $Q$      |\n| 温度层   | $ML^2T^{-2}\\cdot K_\\Theta=\\Theta$                     | $K_\\Theta$             | $\\Theta M^{-1}L^{-2}T^2$    | 开尔文 K   | $\\Theta$ |\n| 物质的量层 | $1\\cdot K_N=N$                                           | $K_N$             | $N$                     | 摩尔 mol  | $N$      |\n| 发光强度层 | $ML^2T^{-3}\\cdot K_J=J$                           | $K_J$          | $JM^{-1}L^{-2}T^3$         | 坎德拉 cd  | $J$      |\n\n这个层级表揭示了量纲生成的核心机制：**每压掉一个量纲，就会冒出一个特征常数**，这些特征常数正是量纲发生学的“生成节点”。\n\n### 6.1 特征常数的生成作用\n\n| 操作       | 压掉的量纲       | 冒出的常数      | 发生学意义             |\n| -------- | ----------- | ---------- | ----------------- |\n| 无量纲→长度   | 长度 $L$      | $K_L$      | 无量纲耦合坐标→物理长度的实现关系 |\n| 时空量→质量   | 质量 $M$      | $K_M$      | 时空量→质量的实现关系       |\n| 力学量纲→电荷  | 电荷 $Q$      | $K_Q$      | 力学量纲→电荷的实现关系      |\n| 能量→温度    | 温度 $\\Theta$ | $K_\\Theta$ | 能量→温度的实现关系        |\n| 无量纲→物质的量 | 摩尔 $N$      | $K_N$      | 无量纲计数→物质的量的实现关系   |\n| 功率→发光强度  | 坎德拉 $J$     | $K_J$      | 功率→发光强度的实现关系      |\n\n因此：\n\n$$\\boxed{\n\\text{量纲数} + \\text{特征常数数} \\approx \\text{守恒}\n}$$\n\n并且：\n\n$$\\boxed{\n\\text{特征常数比被压掉的量纲更基础。}\n}$$\n\n\n### 6.2 大差异与同量纲内差异：量纲发生学的双重结构\n\n量纲发生学中存在两种根本不同的差异类型，它们由自守形式的不同差异层级锁定：\n\n#### 6.2.1 大差异：不同量纲之间\n\n$$\\boxed{\n\\text{大差异：不同量纲之间，由自守形式的大差异锁定，产生量纲特征常数}\\text{（＝属性 }P\\text{ 被实现为该量纲时的特征常数）。}\n}$$\n\n这是量纲发生学的核心机制：不同量纲之间存在**大差异**，这种差异需要特征常数来“桥接”。例如：\n- 温度 $\\Theta$ 与能量 $ML^2T^{-2}$ 之间：由 $K_\\Theta$ 桥接（大差异）\n\n大差异产生量纲特征常数，这些常数正是量纲发生学的“生成节点”（§6.0）。\n\n#### 6.2.2 同量纲内差异：同一量纲内部细分\n\n$$\\boxed{\n\\text{同量纲内差异：同一量纲内部，由自守形式的小差异锁定，不产生新的跨量纲特征常数——}\\\\\\text{同量纲内差异表现为实现之间的无量纲标度，与不可简单组合的结构性差异。}\n}$$\n\n**定义**：量纲内差异是同一量纲内部不可简单组合、不可简单归约的结构性差异。它不是“同一量纲内的不同数值”，而是同一量纲内部有各自独立谱来源、各自锁定方式的不同层面。\n\n**判定标准——不能简单组合**：\n- 不是加法：$m \\neq m_{\\text{惯性}} + m_{\\text{引力}} + m_{\\text{静}}$\n- 不是函数关系：$q \\neq f(q_{\\text{裸}}, q_{\\text{有效}})$\n- 而是：各差异类型分属不同表示类别、不同边界条件、不同自守形式参数\n\n各量纲内部差异对照表：\n\n| 量纲              | 内部差异类型    | 为什么不能简单组合                                                      |\n| --------------- | --------- | -------------------------------------------------------------- |\n| **时间** $T$      | 坐标时       | 外部参数，依赖参考系，不描述系统内禀演化                                           |\n|                 | 固有时       | 运动学量，与粒子世界线绑定，是“经历”而非“寿命”                                      |\n|                 | 寿命        | 动力学量，由衰变矩阵的谱决定，与坐标时、固有时属于不同范畴                                  |\n| **长度** $L$      | 固有长度      | 时空几何量，与坐标系无关                                                   |\n|                 | 坐标长度      | 依赖参考系，是规范变量                                                    |\n|                 | 康普顿波长     | 质量的内禀量子尺度，对应粒子离散谱                                              |\n|                 | 德布罗意波长    | 依赖动量，对静止粒子无定义                                                  |\n| **质量** $M$      | 惯性质量      | 由牛顿第二定律定义，概念来源是惯性定律                                            |\n|                 | 引力质量      | 由万有引力定律定义，概念来源是引力定律                                            |\n|                 | 粒子静质量     | 由四维动量不变量定义，属于量子场论范畴                                            |\n|                 | 有效质量      | 来自 $T_{ij}$ 的局部应力结构，对应连续谱的局部激发                                 |\n| **电荷** $Q$      | 裸电荷       | 依赖截断；截断趋于无穷时裸电荷趋于零                                             |\n|                 | 有效电荷      | 与裸电荷通过重整化群方程联系，但不可简单相加                                         |\n| **温度** $\\Theta$ | 全局温度      | 在引力场中可能根本不存在                                                   |\n|                 | 局部温度      | 只在系统尺度足够大时存在；量子多体系统中不一定存在                                      |\n|                 | Tolman 温度 | 与局部温度、全局温度分属不同物理层面                                             |\n| **物质的量** $N$    | 离散计数      | 计数本身是离散的，不参与连续谱的曲率变形机制                                         |\n|                 | 宏观摩尔量     | $N_A$ 是计数基准而非**同量纲内**物理特征常数（其跨量纲转换角色见 §5.2、§6.1）；二者之间不存在连续变形关系 |\n| **发光强度** $J$    | 辐射强度      | 纯物理量，不依赖观察者                                                    |\n|                 | 发光强度      | 视见函数依赖人类视觉系统的生理响应，不是物理常数                                       |\n\n**注意**：上表为粗略分类，不严格，甚至可能有误。表中分类仅作示意，关键在于各差异类型背后的具体物理关系——不同表示类别、不同边界条件、不同自守形式参数，而非表中的分类本身。\n\n**关键区分**：坐标时 $T$ 是量纲发生学中的基本时间量纲，长度由 $K_L$ 从无量纲耦合坐标直接生成（大差异），不经过时间。$c$ 是时空同步前沿速度，不承担量纲转换，但定义局部时空结构。固有时 $\\tau$ 是观测者自身经历的时间，涉及引力红移和时空弯曲，属于同量纲内差异，由曲率/自守形式的小差异锁定，不产生新的量纲特征常数。本句即**两个锚点**的读法：长度不经时间——各有其无量纲来源，时间来自事件计数，长度来自耦合空间经 $K_L$（§6.3.1）；发生学上时间先于空间，而空间不借时间量纲承担自守链。二者随后**同步**为时空，其表现为保持时空间隔的群 $O(1,3)$ 与光速 $c$（§7.6 二）。严格链式（长度依靠时间，$\\ell=\\mathsf{F}(\\tau)$）则要求 $K_L$ 的输入换成由寿命导出的数，与 $K_L$ 在耦合空间中的存在方式不相容（§7.7.3）。\n\n#### 6.2.3 自守形式差异层级\n\n自守形式的差异层级决定了量纲转换的性质：\n\n| 差异类型 | 作用范围 | 表现 | 是否产生量纲特征常数 |\n|---|---|---|---|\n| **大差异** | 不同量纲之间 | 量纲分化与锁定 | 是（$K_L$、$K_M$、$K_Q$、$K_\\Theta$、$K_J$；$K_N$ 属人为定义计量层，见 §7.7.3） |\n| **同量纲内差异** | 同一量纲内部 | 各量纲内部细分（详见 §6.2.2） | 否（由曲率/度规锁定） |\n\n自守形式承担**关系本身的锁定**：不同量纲之间是**大差异**，由自守形式之间的分化锁定（§6.2.6）；同一量纲内部细分是**同量纲内差异**，由同一量纲自守形式的变形分化锁定（§6.2.6）。\n\n#### 6.2.4 核心结论\n\n$$\\boxed{\n\\text{“不能简单组合”是判定量纲内差异的核心标准。}\n}$$\n\n各量纲内部差异之所以不可简单组合，根源在于它们**不是同一个谱点的不同数值，而是不同表示类别、不同边界条件、不同自守形式参数在物理层的投影**——即同一量纲自守形式的变形分化。\n\n每一个量纲都是一个有内部结构的谱，而非一个标量点。\n\n#### 6.2.5 转换与关联：核心区分\n\n量纲发生学中的所有关系可分为两类：**转换**（量纲之间的关系，即大差异，由特征常数锁定）与**关联**（量纲内的关系，即同量纲内差异）。\n\n| | 转换 | 关联 |\n|---|---|---|\n| **作用范围** | 量纲之间 | 量纲内（同一量纲内部） |\n| **锁定方式** | 特征常数 | 曲率 / 自守形式谱条件 |\n| **是否普遍** | 不确定 | 依赖具体谱点、曲率、观测者 |\n| **典型例子** | $L^3T^{-2}\\cdot K_M=M$，$ML^2T^{-2}\\cdot K_\\Theta=\\Theta$，$M^{1/2}L^{3/2}T^{-1}\\cdot K_Q=Q$ | 坐标时↔固有时，惯性质量↔引力质量，裸电荷↔有效电荷 |\n\n$$\\boxed{\n\\text{转换与关联是两种并行的实现关系：转换跨量纲、由特征常数锁定；关联在量纲内、由谱条件锁定。}\n}$$\n\n**特征常数的性质——跨量纲特征常数**：每个量纲转换有一个**跨量纲特征常数**（如长度层的 $K_L$、质量层的 $K_M$、电荷层的 $K_Q$）。“特征”体现在考虑的是直接的量纲-量纲转换，而非具体场景。具体情况下的量纲特征常数可能与之不同，但可能和跨量纲特征常数有关：\n\n1. **跨量纲特征常数是量纲实现关系上的标准常数**（大差异的锁定），不是“通用”那种含糊的“到处可用”；\n2. **具体情况下可能不同**——量纲内差异下的特征常数可能不是跨量纲特征常数（如质量层的跨量纲特征常数是 $K_M$，但在具体的质量情况下，可能不是 $K_M$ 而是别的）；\n3. **但可能和跨量纲特征常数有关**——具体情况下的量纲特征常数与跨量纲特征常数之间可能存在关联，这种关联是量纲内差异的体现；\n4. **是否有普适性不确定**——跨量纲特征常数是否具有普适性（即是否在更广泛的意义上适用），目前不确定。\n\n**质量层的特殊情况**：质量层**同时有转换和关联**——$K_M$（质量层特征常数，$[K_M]=ML^{-3}T^2$，$K_M=G_N^{-1}$）是真正的量纲特征常数（$L^3T^{-2}\\cdot K_M=M$）。\n\n**角色区分（避免循环）**：本节的量纲发生学只确定**哪一个常数承担转换角色**（质量层为 $K_M$），不涉及该常数的**数值从何而来**；$K_M$（$=G_N^{-1}$）的数值是否可由谱不变量算出，是 `03 引力与退相干/CQM_引力_GN可能公式.md` 的议题。二者层次不同，不构成“$K_M$ 既是输入又是输出”的角色冲突：量纲层用 $K_M$ 作为时空–质量的锁定关系，数值层才追问 $K_M$ 本身的来源。\n\n\n#### 6.2.6 自守形式—量纲—分化\n\n**核心对应**：一个自守形式 ↔ 一个量纲。自守形式的分化分两个层次：\n\n- **自守形式之间的分化**（跨量纲）：不同量纲对应不同自守形式，其分化对应量纲之间的转换（生成新量纲，锁定为特征常数），即大差异；\n- **同一自守形式内部的变形分化**（量纲内）：同一量纲自守形式在不同谱参数下的变形分化，对应量纲内差异，不产生新量纲、不产生新的量纲特征常数。\n\n$$\\boxed{\n\\text{自守形式是量纲的数学载体；}\\\\\n\\text{其分化（自守形式之间）生成新量纲（特征常数）；}\\\\\n\\text{其变形分化（同一自守形式内部）对应量纲内差异。}\n}$$\n\n此对应属 CQM 框架内的结构性类比，尚待第一性推导与严格化。\n\n\n### 6.3 各特征常数的角色\n\n每个量纲特征常数统一遵循 **旧量纲 × 特征常数 = 新量纲**（“旧”“新”指量纲发生学先后）：\n\n$$\\boxed{[\\text{旧}]\\cdot K = [\\text{新}]}$$\n\n- **$K_L$**：禁闭映射常数，$[K_L]=L$，$r_{\\text{coupling}}\\cdot K_L=r_{\\text{phys}}$（无量纲 × $K_L$ = 长度）。$r_{\\text{coupling}}$ 与固有时 $\\tau$ 共轭（$[\\hat{u},\\hat{p}_u]=i$，$u=\\ln r_{\\text{coupling}}$，$p_u=v_\\tau/☯$，固有时流速 $v_\\tau=d\\tau/dt$ 见 `CQM_核心_因果网络同步理论.md` §6.3.6）。长度层特征常数，不要求普适。$K_L$ 值有待确定（第一性链给 $K_L=0.656$ fm，标定链 $0.67860$ fm，几何值 $0.6805$ fm，值链间差 3.3%，$g_s^{IR}$ 张力 3.73%，见 §6.3.1 及 `04 前沿研究/CQM_前沿研究_待推1边界条件深度分析.md` §6.5）。\n- **$c$**：时空同步前沿速度（信息传播前沿速率），$[c]=L/T$，不承担量纲转换。$L=c\\,T$ 是物理速度关系（速度=距离/时间），非量纲实现关系。$c$ 同时定义局部时空结构。\n- **$K_M$**：质量层特征常数，$[K_M]=ML^{-3}T^2$，$L^3T^{-2}\\cdot K_M=M$（时空量 × $K_M$ = 质量）。由万有引力定律锁定。\n- **$c^2$**：质能特征常数，$[c^2]=L^2T^{-2}$，由 $E=mc^2$ 锁定。但 $[c^2]$ 不含 $M$，不消除质量量纲，故 $c^2$ 不是量纲特征常数。\n- **$K_Q$**：电荷层特征常数，$[K_Q]=QM^{-1/2}L^{-3/2}T$，$M^{1/2}L^{3/2}T^{-1}\\cdot K_Q=Q$（力学量纲 × $K_Q$ = 电荷）。\n- **$K_\\Theta$**：温度层特征常数，$[K_\\Theta]=\\Theta M^{-1}L^{-2}T^2$，$ML^2T^{-2}\\cdot K_\\Theta=\\Theta$（能量 × $K_\\Theta$ = 温度）。\n- **$K_N$**：物质的量层特征常数，$[K_N]=N$，$1\\cdot K_N=N$（无量纲计数 × $K_N$ = 物质的量）。\n- **$K_J$**：发光强度层特征常数，$[K_J]=JM^{-1}L^{-2}T^3$，$ML^2T^{-3}\\cdot K_J=J$（功率 × $K_J$ = 发光强度）。\n\n**与已有物理常数的对比**：\n\n| 特征常数 | 已有物理常数 | 关系 | 已有常数数值 |\n|---|---|---|---|\n| $K_L$ | — | 禁闭映射常数 | $0.656$/$0.67860$/$0.6805$ fm |\n| $K_M$ | $G_N$ | $K_M = G_N^{-1}$ | $G_N \\approx 6.674\\times10^{-11}\\ \\mathrm{m^3\\,kg^{-1}\\,s^{-2}}$ |\n| $K_Q$ | — | 电荷层特征常数 | $K_Q \\approx 9.480\\times10^{4}$ |\n| $K_\\Theta$ | $k_B$ | $K_\\Theta = k_B^{-1}$ | $k_B \\approx 1.381\\times10^{-23}\\ \\mathrm{J\\,K^{-1}}$ |\n| $K_N$ | $N_A$ | $K_N = N_A^{-1}$ | $N_A \\approx 6.022\\times10^{23}\\ \\mathrm{mol^{-1}}$ |\n| $K_J$ | $K_{cd}$ | $K_J = K_{cd}^{-1}$ | $K_{cd} = 1/683\\ \\mathrm{W/cd}$ |\n\n#### 6.3.1 $K_L$ 的谱结构与数值状态\n\n**前置量**：\n\n| 量 | 公式 | 数值 | 含义 |\n|---|---|---|---|\n| $r_{\\text{conf}}$ | $\\sqrt{I\\lambda_c}$ | $1.481$ | 无量纲耦合空间禁闭壳 |\n| $r_{\\text{GUT}}$ | $\\sqrt{4\\pi\\,☯\\,\\lambda_c}$ | $0.6180$ | GUT 标度（无量纲） |\n| $g_s^{IR}$ | $\\sqrt{I\\cdot\\lambda_c}$ | $1.481$ | 红外强耦合冻结值（归档定理 10.4，见 `04 前沿研究/CQM_前沿研究_待推1边界条件深度分析.md` §6.5，相变点 $\\lambda_c=(g_s^{IR})^2/I$） |\n| $\\Lambda_{\\text{QCD}}$ | $m_p c^2/(☯\\cdot\\mathfrak{c}_1)$ | $203$ MeV | QCD 能标先验公式（归档定理 10.2） |\n| $\\lambda_{\\text{QCD}}$ | $\\hbar c/\\Lambda_{\\text{QCD}}$ | $0.9716$ fm（第一性）/$1.005$ fm（标定） | QCD 特征长度 |\n\n其中 $\\mathfrak{c}_1=\\gamma_1^2+\\tfrac14\\approx 200.04$ 是第一耦级（黎曼谱第一本征值）。\n\n**谱参数公式**（归档 D1 回捞）：\n\n$$K_L = \\frac{\\lambda_{\\text{QCD}}}{r_{\\text{conf}}} = \\frac{\\hbar c \\cdot ☯ \\cdot \\mathfrak{c}_1}{m_p c^2 \\cdot g_s^{IR}}$$\n\n$K_L$ 把无量纲禁闭壳转换为 QCD 特征长度：$r_{\\text{conf}}\\cdot K_L=\\lambda_{\\text{QCD}}$（无量纲 $\\times\\,K_L$ = 长度）。\n\n**几何确定方式**（归档 §6.1）：\n\n$$K_L = \\frac{\\sqrt{\\lambda_p \\cdot r_p}}{r_{\\text{GUT}}} = \\frac{\\sqrt{0.2103 \\times 0.8409}}{0.6180} \\approx 0.6805 \\text{ fm}$$\n\n其中 $\\lambda_p=\\hbar/(m_p c)=\\hbar c/(m_p c^2)=0.2103$ fm 为质子康普顿波长，$r_p=0.8409$ fm 为质子电荷半径。$K_L$ 是质子内外尺度几何平均与 GUT 标度之比。\n\n**量纲地位（禁闭映射常数）**：\n\n$K_L$ 是**禁闭映射常数**：量纲为长度（fm）的特征常数，把无量纲耦合壳 $r_{\\text{coupling}}$ 映为物理长度 $r_{\\text{phys}}=r_{\\text{coupling}}\\cdot K_L$。它与 $K_M=G_N^{-1}$、$K_Q$ 同属层间特征常数，是「旧量纲 × 特征常数 = 新量纲」模式（§6.3）在长度层的实例。\n\n> **不是交织算子**：$K_L$ 是换算比值，不是两套 Hilbert 空间之间的算符。交织算子的严格定义要求先指定群 $G$ 与两侧表示；本框架中不存在这样的群作用，故 $K_L$ 不具备交织算子的数学身份；又算子范数在两侧同归一化时是纯数，与 $K_L$ 的长度量纲（fm）冲突；且 $\\{\\gamma_n\\}$ 不是任何一维自伴算符的严格点谱（Weyl 律否证），以 $\\gamma_n$ 为谱的 $\\mathcal H_{\\text{Riemann}}$ 不存在。详见 `04 前沿研究/CQM_前沿研究_待推1边界条件深度分析.md` §6.5.1。【框架内构造（比值定义）】\n\n**自对偶结构（D4–D7）**：\n\n经 $K_L$ 映射后，质子康普顿波长 $\\lambda_p$、GUT 标度 $r_{\\text{GUT}}$、质子电荷半径 $r_p$ 在耦合空间中形成 $\\tfrac{1}{2}:1:2$ 几何级数：\n\n| 发现 | 关系 | 偏差 |\n|---|---|---|\n| D4 | $\\lambda_p/K_L = 0.3100 \\approx r_{\\text{GUT}}/2 = 0.3090$ | $0.32\\%$ |\n| D5 | $r_p/K_L = 1.2394 \\approx 2\\,r_{\\text{GUT}} = 1.2360$ | $0.27\\%$ |\n| D6 | $\\sqrt{\\lambda_p \\cdot r_p\\,/\\,K_L^2} = 0.6199 \\approx r_{\\text{GUT}} = 0.6180$ | $0.30\\%$ |\n| D7 | $\\lambda_p/K_L : r_{\\text{GUT}} : r_p/K_L = \\tfrac{1}{2} : 1 : 2$ | $\u003c0.33\\%$ |\n\nGUT 壳层是质子内部尺度（$\\lambda_p$）与外部尺度（$r_p$）的几何平均——自对偶中心。上述偏差依赖 $K_L=0.67860$（标定链谱参数公式）；几何公式给 $K_L=0.6805$（差 ~0.3%），改用第一性 $K_L=0.656$ 则偏差全部升至 ~$3.74\\%$。\n\n**两条值链与不一致**：\n\n| 链 | 起点 | $K_L$ 值 | 状态 |\n|---|---|---|---|\n| 第一性链 | $\\Lambda_{\\rm QCD}=203$ MeV → $\\lambda=0.9716$ fm | $0.656$ fm | 严格第一性 |\n| 标定链 | $\\lambda_{\\rm QCD}=1.005$ fm（≈实验 $\\Lambda\\approx196$ MeV） | $0.67860$ fm | 含实验输入 |\n\n两值差 $3.3\\%$（标定谱参数 $0.67860$ vs 第一性 $0.656$，比值 $0.9668$）；几何公式给 $K_L=0.6805$ fm，与标定谱参数差 ~$0.3\\%$。来源：$g_s^{IR}$ 公式要求 $\\approx 1.428$，定理给 $g_s^{IR}=1.481$，张力 $3.73\\%$（对应 $K_L\\approx 0.680$）。$K_L$ **尚未定死**；在 $K_L$ 定死前，依赖 $K_L=0.67860$ 的精确数值（含 D4–D7 自对偶偏差 $\u003c0.33\\%$）属**标定符合**。详见 `04 前沿研究/CQM_前沿研究_待推1边界条件深度分析.md` §6.5。【数值事实】\n\n### 6.4 量纲作为属性实现：独立属性、特征常数与差异分类\n\n本节把量纲发生学的三条线索系统化：**属性→量纲的实现**、**独立属性的判定**、**差异的分类学**；并给出与群论的对接（群侧完整讨论见 `01 核心理论/CQM_核心_唯物主义群论.md` 第 5、6 章）。\n\n#### 6.4.1 量纲＝属性的量度类别；常数＝该次实现的特征常数\n\n量纲不是“转换”来的，而是**属性被实现的结果**：\n\n$$\\text{属性 }P\\ \\xrightarrow[\\ \\text{特征常数}\\ K_{P\\to\\mathcal{R}}\\ ]{\\ \\text{被实现为}\\ }\\ \\text{量纲（或实现）}\\ \\mathcal{R}$$\n\n其中“**属性**”≈ 物理上的**自由度**（degree of freedom）——指系统在描述中**可独立取值、并承受变换作用的那些方面**（空间广延、相位、质量……）。\n\n#### 6.4.2 三个层次：量纲／具体值（表面）／属性量的值（内蕴）\n\n| 层次 | 内容 | 性质 |\n|:---|:---|:---|\n| ① | 属性被实现为**量纲** | 量纲＝该属性的**量度类别**；$K$＝该次实现的特征常数 |\n| ② | 各形式（实现）各带**具体值**（数值 $\\times$ 量纲） | **表面层**——**表面值不一定一样**；“原形式 → 新形式”由自守因子联系 $f(\\gamma x)=j(\\gamma,x)f(x)$（$j\\not\\equiv1$ 时二者不等） |\n| ③ | **属性量的值** | **内蕴层**——该量的值在实现过程中具有**内在不变性**，区别于表面不变性 |\n\n#### 6.4.3 七大 SI 基本量纲均为独立属性\n\n| 档 | 成员 | 判定依据 |\n|:---|:---|:---|\n| **独立属性**（七大 SI 基本量纲） | 时间 $[T]$、长度 $[L]$、质量 $[M]$（**惯性实现**）、电流／电荷 $[Q]$、温度 $\\Theta$、物质的量 $N$、发光强度 $J$ | 各有独立的本体论来源；质量须限定为**惯性实现**（见 §6.2.2 的四种实现） |\n\n- **“与别的基本量纲有联系”应解释为**：**该属性在别的属性约束下被实现**（如高斯制下 $[Q]=[M]^{1/2}[L]^{3/2}[T]^{-1}$、$\\Theta$ 由能量经 $K_{\\Theta}$ 引出）——不是“可还原”；\n- 独立性**挂在“属性”上**，不挂在“量纲符号”上；**本体论独立 $\\ne$ 单位制独立**（量纲可压缩，代价是生成特征常数）；\n- **温度**是统计量：其量纲-自守链经能量 $ML^{2}T^{-2}$（$K_\\Theta$）借得（§7.7.3），对应的**属性量纲关系群**列入 §6.5.11 待建立项 3；\n- **物质的量** $N$：其独立性属 **SI 计量层**（人为定义的计量量，§5.2）；在量纲总分类（§6.5.13）中它不是自守量纲，而是**派生量纲**（无自守形式对应）。\n\n#### 6.4.4 特征常数的两支\n\n- **跨量纲支**（＝本节的**大差异**）：$[K]=[Q']/[Q]$，量纲上跨量纲；如 $c:[L]/[T]$、$\\hbar:ML^{2}T^{-1}$、$K_M=G_N^{-1}:[M][L]^{-3}[T]^{2}$、$K_Q$、$K_\\Theta$；\n- **同量纲内支**（＝**同量纲内差异**）：同一量纲内部的标度，量纲上为 $1$。须再分三类：\n  1. **约定性单位换算**（$1\\ \\mathrm{m}=100\\ \\mathrm{cm}$、SI 词头）——**非物理常数**；\n  2. **物理性标度**（$\\ell_P/\\mathrm{m}$、$\\lambda_C=\\hbar/(mc)$、$a_0=4\\pi\\varepsilon_0\\hbar^{2}/(m_ee^{2})$）——**这才是特征常数**；\n  3. **结构性差异**（惯性／引力／有效质量，裸／有效电荷）——各有独立谱来源，**不可用单一常数桥接**（§6.2.2）。\n\n- **注意（勿混两套分类）**：本小节的“两支”是按**量纲性质**分（跨量纲支／同量纲内支）；§7.5 则按“**是不是某个量纲对之比的体现**”把基本常数分**三类**（有量纲特征常数／比值型无量纲常数／纯数型）。其中本小节的“**物理性标度**”子类与 §7.5 的“**比值型无量纲常数**”相衔接（同量纲内的实现标度 ⇒ 量纲相消 ⇒ 无量纲）；两套分类的完整对照见 §7.5。\n\n#### 6.4.5 量纲间差异＝属性类型；量纲内差异＝实现群\n\n| 层级 | 差异所在 | 差异的内容 |\n|:---|:---|:---|\n| **量纲间差异** | 不同量纲之间 | **属性类型的差异**（不同自由度 → 不同量纲） |\n| **量纲内差异** | 同一量纲之内 | **实现群的差异**，分两级：**大内差异**＝**连续属性关系群的选取**；**小内差异**＝**离散子群的选取**——两级都是**结构性**差异；**数值差异**（固定 $(G_Q,\\Gamma)$ 后的参数与谱数据）不是内差异、单列 |\n\n- **大内差异改结构**：改的是“哪个群保这个量”（同一属性量在不同实现空间给出不同属性关系群；例：“保距离”在欧氏平面 → $O(2)$、三维欧氏 → $O(3)$、双曲平面 → $PSL(2,\\mathbb{R})$、闵氏时空 → $O(1,3)$、弯曲流形 → $\\mathrm{Isom}(M,g)$）；其**群链读法**（粗粒化／细粒化＝沿子群链上下）见 §6.5.9.2。\n- **小内差异也是结构性的**：在选定连续属性关系群内取哪种离散子群（晶格 $\\mathbb{Z}^{3}$、空间群、离散洛伦兹群 $O(1,3;\\mathbb{Z})$、$U(n;\\mathbb{Z}[i])$、点群）带结构性——商空间紧性决定连续谱有无（无尖点 → 无 Eisenstein 连续谱）、算术（同余）／非算术决定 Hecke 算子代数、尖点数与秩亦然（群论文档 §5.6、§8.2）；\n- **数值差异（不是内差异）**：固定 $(G_Q,\\Gamma)$ 之后的参数与谱数据（格常数、傅里叶系数、Hecke 特征值 $\\lambda_p$）只调数值——它们**不是群**，不属于“实现群的差异”，单列一层；\n- **勿混**：单位与标度（米→英尺）不是任何内差异——同一群的不同标度约定、群不变。\n\n> **用语提示**：本节的“**大差异**”指**量纲间**；“**大内差异**”指**量纲内**的一级细分——两者不在同一层次，勿混。\n> 另：这里的“属性关系群”指 §5.3 分类中的**属性量纲关系群**（针对属性的量纲实现；完整分类见 `CQM_核心_唯物主义群论.md` §5.3）——属性关系群**不止**“属性量纲关系群”这一类，本节只用了其中的这一支。\n\n#### 6.4.6 跨量纲支的物理常数与 $G_N$ 的量纲\n\n| 常数 | 被实现的属性 | 量纲 |\n|:---|:---|:---|\n| $c$ | 时间 ↔ 长度 | $[L]/[T]$ |\n| $\\hbar$ | 长度 ↔ 动量 | $ML^{2}T^{-1}$ |\n| $G_N$ | 质量 ↔ 长度／时间 | $[M]^{-1}[L]^{3}[T]^{-2}$（若取“质量 ↔ 长度”的标度，则为 $G_N/c^{2}:[L]/[M]$） |\n| $e$ | 电荷 ↔ 力学量 | 依赖单位制 |\n\n**自然单位制的新解读**：令 $c=\\hbar=1$ 即**把若干跨量纲特征常数约定为纯数 $1$**——消灭的是数值，不是实现关系；代价是量纲被压缩（§8.1 与此一致）。\n\n#### 6.4.7 与群论的对接（列而不论）\n> **本节只列要点**；完整表述（基本层级 $G_{\\max}(f)\\le H\\le GL(n,\\mathbb{F})$、核心定义 1–5、核心命题、$GL(5)$ 情形、两级量纲、基本自守量纲群与量纲内分化）见 **本文档 §6.5**。\n- **时空型属性**（$[T]$、$[L]$、$[M]$）的载体群位于**时空（仿射）层**；$[M]$ 的群论角色是庞加莱群的 Casimir 不变量 $P^{\\mu}P_{\\mu}=m^{2}c^{2}$（粒子静质量）；\n- **内部规范荷型属性**（$[Q]$、色荷、弱同位旋）的载体群位于**内部 $GL$ 层酉族**（$U/SU\\subset SU(5)\\subset GL(5)$）；\n- **温度**（统计量）：经能量 $ML^{2}T^{-2}$（$K_\\Theta$）借链（§7.7.3），**属性量纲关系群**列入 §6.5.11 待建立项 3；\n- 群侧的“不变群约束性／属性关系群／与诺特的关系”见 `01 核心理论/CQM_核心_唯物主义群论.md` 第 5、6 章。\n- **极大关系群优先（定义顺序）**：量纲的定义顺序是**先给不变量、后定群**——给定标量函数 $f$（与作用 $\\rho$、母群 $G_0$），先取保持 $f$ 不变的**最大群**（**极大关系群**）$G_{\\max}(f)=\\mathrm{Stab}_{G_0,\\rho}(f)$，再取同构类 $[G_{\\max}(f)]$ 为基本自守量纲。**取极大的目的是归类**【标准数学】：任何保持 $f$ 的 $G$ 满足 $G\\subseteq G_{\\max}(f)$——保持同一 $f$ 的群族（含 $\\mathbb{Z}/m$ 族）都归入同一个极大关系群 $G_{\\max}(f)$，从而归入同一个基本自守量纲 $[G_{\\max}(f)]$；不在选取唯一代表，而在把群族归类（常数函数给 $G_{\\max}=G_0$ 满群，是否计入属计数口径）。**两处精确化**：①$G_{\\max}$ **随作用而变**，$f$ 单独不定量纲——例：$f=\\|A\\|_F^2$（Frobenius 范数）在**左乘**下 $\\mathrm{Stab}=O(2)$，在**共轭**下 $=\\mathrm{CO}(2)$（共轭作用的核＝标量群恒含于任何稳定子，故共轭稳定子永不紧）；同一 $f$、不同作用，量纲不同。②子群 $G\u003cG_{\\max}$ 给出的是**量纲内分化**（§6.5.9.2 口径）——**基本自守量纲群是极大关系群 $G_{\\max}(f)$**，子群只给出该量纲内部的细粒度结构；其计数 $D_{H,\\rho}(n)$ 即量纲内分化的计数（本文档 §6.5.12）。定义顺序：**极大关系群为基本自守量纲群**（命名裁定：“极大关系群”，见本文档 §6.5.12）。标注：【标准数学（极大性的归类性与作用相对性）】＋【CQM 构造假设（定义顺序裁定与命名）】。\n- **链内细粒度差异＝$G_{\\max}$ 的闭子群同构类（可计算流程）**：继上条裁定，量纲内差异获得可计算形态——给定 $f$（与 $\\rho$、$G_0$），先算 $G_{\\max}(f)=\\mathrm{Stab}_{G_0,\\rho}(f)$，再分类 $G_{\\max}$ 的**闭（李）子群**同构类，逐类对应一个量纲内分化 $[G']$（按上条裁定属**量纲内分化层**）。**极大性＝链内完备性**【标准数学】：任何保持 $f$ 的群都在 $G_{\\max}$ 内，故固定实现内部的差异无遗漏。**与 §6.4.5／群论文档 §5.6 两级差异的接合（三点勿混）**：①链内**连续**真子群步（$O(3)\\to SO(3)$，“长度＋定向”）改结构；②链内**离散**子群步（$SO(3)\\supset D_n\\supset C_n$）＝§6.4.5 **小内差异**（离散子群选取，**结构性**——含紧性／同余性／尖点数／秩等类型结构）；固定 $(G,\\Gamma)$ 后的参数与谱数据＝**数值差异**（非内差异）；③§6.4.5 **大内差异**的原义是“**同一属性量在不同实现空间**给出不同属性关系群”（“保距离”：欧氏 →$O(2)$、三维 →$O(3)$、双曲 →$PSL(2,\\mathbb{R})$、闵氏 →$O(1,3)$）——那是**不同实现各有各的 $G_{\\max}$**（族），$PSL(2,\\mathbb{R})$ 非紧、不是紧群 $O(3)$ 的（李）子群，**不落在同一子群格内**；故“内差异＝$G_{\\max}$ 子群同构类”只对**固定实现内部**成立，不覆盖跨实现的大内差异。**计数警示**：闭性不可省（全部子群含稠密子群，不可分类），且闭子群同构类一般**无穷多**——$O(3)$ 的 $C_n,D_n$ 两族已无穷；例链 $O(3)\\supset SO(3)\\supset D_n\\supset C_n\\supset\\{I\\}$ 只是一条**示例支链**，“长度有 3 种内差异”不是完备计数。**勿混**：单位换算（米→英尺）是**同一群的不同标度约定**（群不变），**不是**子群差异。标注：【标准数学（闭子群分类与极大性包含）】＋【CQM 构造假设（流程与接合口径）】。\n- **自由度前提**：见 §6.5.2（完备属性矩阵 $A\\in GL(n,\\mathbb{F})\\subset M_n$，$n^{2}$ 个坐标承载全部自由度）。\n- **对象侧约束（特殊位置）**：被作用矩阵被约束到子群子流形时自由度缩减（一般位置 $A\\in GL(n)$ 下 $n^2$ 个坐标独立，特殊位置如 $A\\in SU(3)$ 降为 $\\dim G$）；它与作用侧稳定子约束分属对象侧与作用侧。候选计数分层见 §6.5.5.4。\n- **计数层级（基础候选／组合候选）**：见 §6.5.5.4（$f$ 的候选分层；组合函数可给出单坐标给不出的种类，如 $\\det A$ 在左乘下给 $SL(n)$）。\n- **子群约束（硬约束）**：$G$ 必须是 $GL(n,\\mathbb{F})$ 的子群，且须同时满足子群／代数性／**可观察性**三层（§6.5.5.2、§6.5.3 定义 5 注）。\n\n---\n\n### 6.5 量纲的群论形式：$G_{\\max}(f)\\le H\\le GL(n,\\mathbb{F})$ 的层级、计数与两级量纲\n\n> **术语**：本节的**基本自守量纲群** $G_{\\max}(f)$ 即「**属性量纲关系群**」——属性关系群在**量纲实现**这一支（`CQM_核心_唯物主义群论.md` §5.3）；最外层的「关系群」是一般定义（§2.2）。\n\n#### 6.5.1 核心定位：量纲发生学，不是量纲分析\n\n$$\\boxed{\\ \\text{CQM 不是量纲分析，而是量纲发生学。}\\ }$$\n\n| | 量纲分析 | 量纲发生学 |\n|:---|:---|:---|\n| **问题** | 给定量纲，如何约束规律形式？ | 量纲从何而来？为何是这些？ |\n| **方向** | 自上而下：量纲 → 规律 | 自下而上：物质自组织 → 约束 → 群 → 量纲 |\n| **量纲地位** | 给定的、约定的 | 被实现的、派生的 |\n| **核心工具** | 白金汉 $\\pi$ 定理 | 极大关系群同构类、不变量理论 |\n\n$$\\boxed{\\ \\text{物质自组织} \\to \\text{约束} \\to \\text{极大关系群 } G_{\\max}(f) \\to \\text{实现} \\to \\text{基本自守量纲 } [G_{\\max}(f)]\\ }$$\n\n> **标注**：定位对照【CQM 框架基础】（本文档开篇的量纲发生学视角，此处仅汇总重述）；发生链表述【哲学诠释／CQM 构造假设（汇总层面）】——“约束→群”一步即群论文档 §2.2 的关系群读法；本节全部内容都落在这条链的最后两环（“哪个群保哪个量”这一条腿，§7.5）。\n\n> **纲领定位**：本节承载纲领「潜在-显现化」的「**关系分化**」环节——属性先在（属性锚点＝$GL(n)$ 的矩阵元素 $g_{ij}$，承载全部自由度，§6.5.2），极大关系群作为**稳定化子**把处在潜在态的属性切割为实例属性类别；「实例化」（自守形式＝稳定性的体现）见 §七，「具体化」（量纲选取）的定稿见 §13.3。\n\n---\n\n#### 6.5.2 基本层级：$G_{\\max}(f)\\le H\\le GL(n,\\mathbb{F})$\n\n$$\\boxed{\\ G_{\\max}(f)\\ \\le\\ H\\ \\le\\ GL(n,\\mathbb{F})\\ \\ni\\ A\\ \\xrightarrow{\\ \\rho\\ }\\ M_n(\\mathbb{F})\\ \\xrightarrow{\\ f\\ }\\ \\mathbb{F}\\ }$$\n\n| 层级 | 对象 | 说明 |\n|:---|:---|:---|\n| **母群** | $GL(n,\\mathbb{F})$ | 所有 $n\\times n$ 可逆矩阵 |\n| **矩阵群** | $H\\le GL(n,\\mathbb{F})$ | $GL(n)$ 的子群，如 $GL(5)$、$SU(5)$、$O(n)$ |\n| **基本自守量纲群** | $G_{\\max}(f)\\le H$ | $f$ 的**极大关系群** $\\mathrm{Stab}_{G_0,\\rho}(f)$，即属性量纲关系群；子群 $G\u003cG_{\\max}$ 为量纲内分化 |\n| **被作用矩阵** | $A\\in M_n(\\mathbb{F})$ | 矩阵；$GL(n,\\mathbb{F})\\subseteq M_n(\\mathbb{F})$ 是其稠密开子集；**一般位置**（$A\\in GL(n)$，可逆）下 $n^{2}$ 个坐标独立承载全部自由度——一旦 $A$ 被约束到子群子流形（如 $A\\in SU(3)$），独立实参数降为 $\\dim G$（本文档 §6.4.7“自由度前提／对象侧约束”） |\n| **作用** | $\\rho:G\\times M_n(\\mathbb{F})\\to M_n(\\mathbb{F})$ | 左乘、右乘、共轭、张量诱导 |\n| **不变量** | $f\\in\\mathbb{F}[M_n]^{G,\\rho}$ | $G$-不变标量函数 |\n| **基本自守量纲** | $[G_{\\max}(f)]$ | 极大关系群的同构类 |\n\n> **【标准数学】一处技术提示**：$GL(n,\\mathbb{F})$ 是 $M_n(\\mathbb{F})$ 的**稠密开**子集，$G$-不变多项式在稠密开集上由取值唯一确定，故“在 $M_n$ 上讨论不变量环、在 $GL(n)$ 上讨论群”二者相容。\n\n---\n\n#### 6.5.3 核心定义\n\n**定义 1（属性量）**【标准数学】\n设 $f\\in\\mathbb{F}[M_n]^{G,\\rho}$，即\n$$\\forall g\\in G,\\ \\forall A\\in M_n(\\mathbb{F}),\\quad f(g\\cdot A)=f(A).$$\n称 $f(A)$ 为一个 **$G$-属性量**。\n\n**定义 2（属性量纲关系群）**【CQM 构造假设（命名）】\n**极大关系群** $G_{\\max}(f)=\\mathrm{Stab}_{G_0,\\rho}(f)$ **就是属性量纲关系群**（**基本自守量纲群**）——给定标量函数 $f$（与作用 $\\rho$、母群 $G_0$），取保持 $f$ 不变的**最大群**。\n\n> **【标准数学】极大性**：由定义 1 必有\n> $$G\\ \\subseteq\\ \\mathrm{Stab}_{G_0}(f)\\ \\le\\ G_0,$$\n> **极大**的不变群是 $\\mathrm{Stab}(f)=G_{\\max}(f)$。**子群 $G\u003cG_{\\max}(f)$ 不是另一个量纲，而是该量纲的量纲内分化**（§6.5.9.2）；其计数 $D_{H,\\rho}(n)$ 即量纲内分化的计数（本文档 §6.5.12）。规范表述见本文档 §6.4.7“极大关系群优先”。\n\n**定义 3（基本自守量纲）**【CQM 构造假设（量纲解读）】\n$$\\mathrm{Dim}:=[G_{\\max}(f)].$$\n即：**基本自守量纲 ＝ 极大关系群的同构类。**\n\n**定义 4（量纲等价）**【CQM 构造假设】\n两个属性量同量纲 $\\iff$ 它们的极大关系群同构：\n$$f_1\\sim f_2\\iff[G_{\\max}(f_1)]=[G_{\\max}(f_2)].$$\n\n**定义 5（基本自守量纲计数）**【CQM 构造假设（研究纲领）】\n固定 $H\\le GL(n,\\mathbb{F})$ **与作用 $\\rho$**，**基本自守量纲**的计数为**极大关系群的同构类数**\n$$D_{\\rho}(n):=\\Bigl|\\Bigl\\{[G_{\\max}(f)]\\ \\Bigm|\\ f\\in\\mathbb{F}[M_n],\\ G_{\\max}(f)=\\mathrm{Stab}_{G_0,\\rho}(f)\\le H\\Bigr\\}\\Bigr|.$$\n即：$H$ 上**极大关系群**的同构类中，**能作为属性量纲关系群出现**的类的数目。\n\n> **作用标签**：$\\mathbb{F}[M_n]^{G}$ **依赖 $\\rho$**（同一 $G$，左乘与共轭下的不变量环不同），故 $D$ 必须带 $\\rho$。\n>\n> **【标准数学】“$\\exists f\\not\\equiv$ 常数”这一条正是可观察性条件**：若 $\\mathbb{F}[M_n]^{G}=$ 常数（例如 $G=GL(n)$ 作**左乘**，其不变量环平凡），则 $G$ **不计入**。$G$ 能否由不变量环恢复，即**可观察子群（observable subgroup）**问题（Grosshans 一系），**非自动成立**。\n>\n> **【标准数学】量纲内分化的计数 $D_{H,\\rho}(n)$**：子群 $G\u003cG_{\\max}(f)$ 给出**量纲内分化**，其计数为\n> $$D_{H,\\rho}(n):=\\Bigl|\\Bigl\\{[G]\\ \\Bigm|\\ G\\le H,\\ \\exists f\\in\\mathbb{F}[M_n]^{G,\\rho},\\ f\\not\\equiv\\text{常数}\\Bigr\\}\\Bigr|,$$\n> 即 $H$ 的子群同构类中，**能作为非平凡不变标量函数作用群出现**的类的数目——这是**量纲内分化**的计数（本文档 §6.5.12），不是基本自守量纲的计数。\n\n---\n\n#### 6.5.4 核心命题\n\n**命题 1（极大关系群即量纲）**【CQM 构造假设／定义性重述】\n极大关系群 $G_{\\max}(f)$ 的同构类 $[G_{\\max}(f)]$ 就是一个基本自守量纲。\n**诚实标注**：本命题是定义 3 的重述，**非实质定理**（符合项目“避免平凡证明”的要求，故明标）。\n\n**命题 2（量纲的相对性）**【CQM 构造假设】\n$$\\mathrm{Dim}=[G_{\\max}(f)].$$\n**$[G_{\\max}(f)]$ 只依赖 $G_{\\max}(f)$**（的同构类，而 $G_{\\max}(f)$ 由 $(f,\\rho,G_0)$ 确定）；$(H,\\rho)$ **只决定“哪些 $G_{\\max}$ 计入”**——即**量纲的集合**相对 $(H,\\rho)$，**单个量纲不相对**。换 $f$ → 量纲改变；换 $H$ 或换作用类型 $\\rho$ → **可计入的 $G_{\\max}$ 改变**（见命题 6）。\n\n**命题 3（量纲数 $\\le$ 子群种类数）**【标准数学】\n$$D_{\\rho}(n)\\ \\le\\ \\bigl|\\{[G]\\mid G\\le H\\}\\bigr|.$$\n**证明**：$D_{\\rho}(n)$ 是集合 $\\{[G]:G\\le H\\}$ 的**子集**的基数，故不超过全集基数。$\\blacksquare$\n\n> **注意（$n^2$ 不是种类数上界）**：$n^2=\\dim M_n$ 是**坐标个数**，与“子群种类数”无关。$n\\ge2$ 时 $\\mathbb{Z}/m$（在某个二维平面内作 $2\\pi/m$ 旋转、其余方向固定）对一切 $m\\ge1$ 都是 $GL(n,\\mathbb{R})$ 的 **Zariski 闭**子群，且两两不同构，故 $|\\{[G]:G\\le H\\}|\\ge\\aleph_0$。**只有 $n=1$ 有限**。$n^2$ 至多可作为“**单坐标**属性量 $A_{ij}$ 的候选个数”（$A_{ij}\\in\\mathbb{F}[M_n]^G$ 须 $G\\le G_{ij}$），**不是**基本自守量纲数的上界。\n\n**命题 4（函数不同 $\\ne$ 量纲不同）**【CQM 构造假设／定义性重述】\n极大关系群相同的不同 $G_{\\max}$-不变函数 $f_1,f_2$ 属于同一量纲——它们是同一量纲的不同分量。\n**诚实标注**：本命题是定义 3、4 的**直接重述**（同一 $G_{\\max}(f)$ → 同一 $[G_{\\max}(f)]$）；反之，不同 $f$ 可有不同极大关系群，故**函数不同不蕴含量纲不同，也不排除量纲不同**。\n\n**命题 5（子群约束）**【标准数学】\n$G$ 必须是 $H$ 的子群，$H$ 必须是 $GL(n,\\mathbb{F})$ 的子群。**不是任意抽象群。**\n$$G\\le H\\le GL(n,\\mathbb{F}).$$\n\n> **【标准数学】这条硬约束的后果**：①**不能嵌入** $GL(n,\\mathbb{F})$ 的抽象群**排除**；②**超出** $GL(n,\\mathbb{F})$ 的更大群**排除**；③与 $GL(n,\\mathbb{F})$ **无包含关系**的群**排除**。基本自守量纲的计数范围因此严格限定在 $GL(n,\\mathbb{F})$ 的**子群范畴**内。\n\n**命题 6（量纲的等号）**【CQM 构造假设／定义性重述】\n$$G_{\\max}(f_1)\\cong G_{\\max}(f_2)\\iff[G_{\\max}(f_1)]=[G_{\\max}(f_2)]\\iff\\text{同一个基本自守量纲}.$$\n**诚实标注**：本命题是定义 4 的**重述**（$[\\cdot]$ 即同构类），**非实质定理**。\n\n> **同构口径必须取“李群同构”，不可取“抽象群同构”**：抽象群同构**过粗**，会出反例——\n> $$(\\mathbb{R},+)\\ \\cong\\ (\\mathbb{R}^2,+)\\qquad(\\text{同为 }\\mathbb{Q}\\text{-向量空间，维数 }2^{\\aleph_0}),$$\n> 按“抽象同构即同量纲”将得 $[\\mathbb{R}]=[\\mathbb{R}^2]$，把**一维与二维加法群判为同一基本自守量纲**，不应。取**李群同构**（或**代数群同构**）则 $\\dim$ 是不变量 → $(\\mathbb{R},+)\\ncong(\\mathbb{R}^2,+)$；而 $SO(2)\\cong U(1)$（同为 $1$ 维紧连通）**仍成立**，故“$SO(2)$ 与 $U(1)$ 同一量纲”这一结论**保住**。**紧群**情形二者无差别（**紧李群的抽象同构必为李群同构**，标准结果）；差别只在**非紧**群。\n\n> **“不同单位” $\\ne$ “不同表示”（类比错位）**：常见类比“米/英尺＝同量纲不同**单位** $\\leftrightarrow$ $SO(2)/U(1)$＝同量纲不同**表示**”**不成立**——米、英尺是**单位（标度）**，**不是群**；把长度建模为 $(\\mathbb{R},+)$ 时，米与英尺是**同一个群**的两种单位约定，**谈不上“同构”**。正确的对应：\n>\n> | 标准物理 | 唯物群论 |\n> |:---|:---|\n> | 同一量纲的不同**单位**（米/英尺） | 同一群的**不同标度／单位约定**（群**不变**） |\n> | 同一量纲的不同**矩阵实现**（$SO(2)\\subset GL(2,\\mathbb{R})$ vs $U(1)\\subset GL(1,\\mathbb{C})$） | 同构但**不同**的具体群（**不同忠实表示**） |\n>\n> 即：$SO(2)/U(1)$ 配的是“**不同矩阵实现**”，**不是**“不同单位”。\n\n> **【标准数学】跨母群同一量纲是允许的**：$SO(2)\\le GL(2,\\mathbb{R})$ 与 $U(1)\\le GL(1,\\mathbb{C})$ 的**母群不同**（$n=2$ vs $1$、基域 $\\mathbb{R}$ vs $\\mathbb{C}$）。在**李同构类**口径下二者是同一基本自守量纲——这与命题 5 的**子群约束不冲突**：子群约束管的是“**哪些 $G$ 合法**”，**不是**“同一量纲的 $G$ 必须同一母群”。\n\n---\n\n#### 6.5.5 $GL(5)$ 情形\n\n##### 6.5.5.1 自由度\n\n$$\\dim M_5=5\\times5=25.$$\n\n25 个矩阵元素，即 25 个**坐标自由度**。\n\n> **25 是坐标个数**（$\\dim M_5$），**不是**“基本自守量纲数”；基本自守量纲数＝**群种类数**，与 25 无上界关系（见命题 3 注）。\n\n##### 6.5.5.2 物理相关群种类（$G\\le GL(5)$）\n\n| 层 | 群种类（$G\\le GL(5)$） | 量纲数 |\n|:---|:---|:---|\n| 母群 | $GL(5)$ | 1 |\n| 经典族 | $O(5)$、$U(5)$、$SL(5)$ | 3 |\n| 派生族 | $SO(5)$、$SU(5)$、$CO(5)$ | 3 |\n| 有限／离散 | $S_5$、$O(5)$ 的**点群**、$\\mathbb{Z}/m$（平面旋转） | **无限多**（$\\mathbb{Z}/m$，$m\\ge1$） |\n| 例外族 | **无** | 0 |\n| 仿射层 | **无** | 0 |\n| 商群 | **无** | 0 |\n| 辛族 | **无** | 0 |\n\n**清单范围的根据**：\n- $Sp(2m)\\subset GL(2m)$ 需**偶数维**，$Sp(10)\\subset GL(10)$——$GL(5)$ 奇维，**无辛子群**；\n- $PSU(5)$ **不是** $GL(5)$ 子群——其中心 $\\mathbb{Z}_5$ 作用为标量，$PSU(5)$ 不**忠实嵌入** $GL(5,\\mathbb{C})$（它忠实作用于 $\\mathbb{P}^4$），是 $GL(5)$ 的**商群**；\n- 例外族 $G_2,F_4,E_6,E_7,E_8$ 不在 $GL(5)$ 内——最小忠实表示维数 $7,26,27,56,248$，均 $>5$；\n- 仿射层 $E(5),ISO(1,4)$ 含**平移**，$\\subset\\mathrm{Aff}(5)=GL(5)\\ltimes\\mathbb{R}^5\\subset GL(6)$；\n- $\\mathbb{Z}^5$（加法格）不是 $GL(5)$ 的子群；离散侧真子群如 $\\mathbb{Z}/m$（平面旋转）；\n- $\\mathbb{Z}/m$ 一族（$m\\ge1$，两两不同构）使群种类**总数目无限**；“约 20–30”只对**经典族＋派生族＋若干有限群**的命名清单成立，非精确计数。\n\n> **若要恢复例外族／仿射层／商群**：须把母群 $H$ 从 $GL(5)$ **扩大**为三类——(i) **线性** $GL(n,\\mathbb{F})$；(ii) **线性之商** $GL(n,\\mathbb{F})/Z$；(iii) **半直积扩张** $\\mathrm{Aff}(n)=GL(n,\\mathbb{F})\\ltimes\\mathbb{F}^{n}$。此时 $G_2\\le GL(7)$、$E_6\\le GL(27)$、$E(5)\\le\\mathrm{Aff}(5)$、$PSU(5)\\le GL(5)/Z$ 等方合法。\n\n##### 6.5.5.3 标准模型的量纲计数\n\n| 计数方式 | 数量 | 备注 |\n|:---|:---|:---|\n| $GL(5)$ 坐标数 $\\dim M_5$ | 25 | **坐标个数**，非量纲数 |\n| 标准模型自由参数 | 19 | $9$ 带电费米子质量 $+\\,3$ 规范耦合 $+\\,\\theta_{\\text{QCD}}+\\,2$ 希格斯（$\\mu^2,\\lambda$）$+\\,4$ CKM $=19$ |\n| 标准模型涉及的基本自守量纲（自然单位制） | 1（$[M]$） | 自然单位制下所有量纲折为 $[M]$ 的幂 |\n| 标准模型涉及的基本自守量纲（还原 $c,\\hbar$） | 3（$[M],[L],[T]$） | 解开压缩 |\n\n$$\\boxed{\\ \\text{标准模型 19 个自由参数，只落在 }[M]\\text{（还原后 }[M],[L],[T]\\text{）一类量纲上。}\\ }$$\n\n##### 6.5.5.4 计数层级：基础候选与组合候选（量纲归属不分层）\n\n| 层级 | 对象 | 数量（候选口径） |\n|:---|:---|:---|\n| 自由元素（坐标） | $A_{ij}$ | $n^{2}$（$n=5$：$25$） |\n| 基础（单坐标）候选属性量 | $f_{ij}(A)=A_{ij}$ | $n^{2}$；左乘下极大关系群 $G_{\\max}(f_{ij})=G_{ij}\\cong GL(n-1)\\ltimes\\mathbb{F}^{n-1}$（$(gA)_{ij}=A_{ij}\\ \\forall A$ 当且仅当 $g$ 第 $i$ 行为 $e_i^{\\top}$） |\n| 组合候选（大小 $\\ge2$ 的坐标子集上的函数） | $f_I$ | 按**子集**计 $2^{n^{2}}-1-n^{2}$（$n=5$：$33{,}554{,}431-25=33{,}554{,}406$） |\n\n> **三条口径**：①**子集数不是属性数**——同一子集上 $a_1+a_2$ 与 $a_1a_2$ 是不同函数，函数本身无穷多（坐标子集计数 $\\ne$ $G$-不变函数个数）；“有序／允许重复”变体计的是**元组**，又是一条候选口径，仍非函数计数。②**量纲归属不分层**——组合函数可给出单坐标给不出的种类：$f=\\det A$ 是全部 $n^{2}$ 个坐标的**组合函数**，左乘下 $SL(n)$-不变（且仅 $SL(n)$），故 $[SL(n)]$ 由组合候选承载，而单坐标候选左乘下只容许 $GL(n-1)\\ltimes\\mathbb{F}^{n-1}$ 型，给不出它。$D_{\\rho}(n)$ 计**全部**候选层的极大关系群种类，不限于单坐标层（单坐标受限族 $\\le n^{2}$ 只是一个受限族的上界，同命题 3 注口径）。③组合候选的极大关系群满足 $G_{\\max}(f_I)\\supseteq\\bigcap_{(i,j)\\in I}G_{ij}$，且可**严格更大**（例：经 $S_n$ 交换两坐标而保其和）【标准数学】。标注：【标准数学（容许群包含关系与 $\\det$ 例）】＋【CQM 构造假设（候选分层口径）】。\n\n##### 6.5.5.5 $n$ 的下界：由 SI 基本量纲反推\n\n$$\\boxed{\\ \\text{SI 七大基本量纲（物质的量除外，余 }6\\text{ 个）}\\ \\Longrightarrow\\ n\\ \\ge\\ 2\\ }$$\n\n- **前提**【CQM 构造假设】：独立属性 $\\mapsto$ **两两不同**的极大关系群种类（本文档 §6.4.5“量纲间差异＝属性类型差异”）；**例外**：物质的量 $N$ 是人为定义的计量量、**与自守量纲无关**（§5.2），故只需 $6$ 类；\n- **$n=1$（$\\mathbb{F}=\\mathbb{R}$）**：基本自守量纲种类 $D_{\\rho}=3$（含常数函数给出的满群 $[GL(1)]$，见 §6.5.12）；量纲内分化种类 $D_{H,\\rho}=2$（仅 $\\{1\\}$、$\\{\\pm1\\}$——$\\mathbb{R}^{\\times},\\mathbb{R}_{>0}$ 在左乘下只容许常数，不计）。二者均 $\u003c6$，故 $n\\ge2$【标准数学（前提既定则此步为算术）】；\n- **$n=2$ 是否“足够”【待验证】**：$GL(2)$ 的子群种类确 $\\ge8$（$GL(2),SL(2),O(2),SO(2),CO(2)$ 及 $\\mathbb{Z}/m$ 无限族），但须过**可实现过滤**（极大关系群：四层约束②③；量纲内分化：随 $\\rho$ 的“$\\exists f\\not\\equiv$ 常数”）——子群种类数不自动等于可计入种类数。此步列入待建立项 12。\n\n---\n\n#### 6.5.6 量纲的相对性\n\n##### 6.5.6.1 相对于极大关系群\n\n$$\\mathrm{Dim}(f)=[G_{\\max}(f)].$$\n\n换 $f$（极大关系群随之变），量纲改变。\n\n##### 6.5.6.2 相对于矩阵群\n\n换 $H$ ⇒ **可允许的 $G_{\\max}$ 改变**（**量纲的集合**改变；单个量纲 $[G_{\\max}(f)]$ **不变**——见命题 2 的精确化）。\n\n##### 6.5.6.3 相对于作用类型\n\n| 作用类型 | 例子 | 量纲读法 |\n|:---|:---|:---|\n| 左乘 | $A\\mapsto PA$ | 线性型 |\n| 共轭 | $A\\mapsto PAP^{-1}$ | 内蕴型 |\n| 张量诱导 | $A\\mapsto P^{\\sigma}AP$ | 二次型 |\n\n> **【标准数学】作用类型必须进定义**：同一 $f$，换作用类型，$f$ 未必仍不变（例：$f=\\det$ 在**左乘**下 $SL(n)$-不变，在**共轭**下则 $GL(n)$-不变）。故 $D$ 带 $\\rho$（定义 5）。\n\n---\n\n#### 6.5.7 新量纲研究\n\n##### 6.5.7.1 文献中的“第 8 量纲”提案【文献确立（提案层面）】\n\n| 提案 | 核心主张 |\n|:---|:---|\n| 物质类型 | 化学元素种类是独立量纲 |\n| 平面角 | 弧度是独立量纲 |\n| 信息 | 信息是物理实在的基本方面 |\n| 复杂性 | 远离平衡态系统的组织程度 |\n| 感官强度 | 心理物理学感知强度 |\n| 经济价值 | 货币锚定经济基准 |\n\n**均停留在学术提案层面，未成为 SI 标准。**\n\n##### 6.5.7.2 唯物群论的结论\n\n$$\\boxed{\\ \\text{不是加\"第 8 个绝对量纲\"，而是发现新的（极大关系群，矩阵群）对。}\\ }$$\n\n- 量纲是**相对**的，相对于 $(f,H,\\rho)$ 的选取；\n- 换选取，就换量纲；\n- 基本自守量纲数 $=D_{\\rho}(n)\\le|\\{[G]:G\\le H\\}|$，**$n\\ge2$ 时无限**（$n^2$ 是坐标个数，**不是**基本自守量纲数的上界——见命题 3 注）。\n\n---\n\n#### 6.5.8 与标准模型的关系\n\n##### 6.5.8.1 标准模型的惯性中心主义\n\n$$\\text{标准模型 19 个自由参数}\\ \\longrightarrow\\ \\text{只涉及 }[M]\\text{（还原后 }[M],[L],[T]\\text{）一类量纲。}$$\n\n- $9$ 带电费米子质量 $+\\ \\mu^2$：$[M]$ 的幂次；\n- $3$ 规范耦合 $+\\ \\lambda$：还原后涉及 $[M],[L],[T]$；\n- $4$ CKM $+\\ \\theta_{\\text{QCD}}$：纯数。\n\n**标准模型压在惯性上，是因为它固定了（质量，庞加莱群）这一对选取。**\n\n##### 6.5.8.2 特征常数作为化石【CQM 构造假设（待验证）】\n\n标准模型解释不了的常数，对应**尚未展开的（极大关系群，矩阵群）对**：\n\n| 常数 | 可能的极大关系群 | 状态 |\n|:---|:---|:---|\n| 精细结构常数 $\\alpha$ | $U(1)$ 实现路径的特征常数 | 框架既有（$U(1)\\leftrightarrow GL(1)$） |\n| 质量比 $m_e/m_p$ | $SL(4)$ 或 $SL(5)$ 表示论参数 | 待验证 |\n| 宇宙学常数 $\\Lambda$ | 引力侧实现的 $[M]^4$ | 待验证 |\n| Hagedorn 温度 | 时间紧致化的特征温度 | 待验证 |\n\n---\n\n#### 6.5.9 量纲的粗细结构：分解、粗粒化与两级量纲\n\n##### 6.5.9.1 三种分解\n\n| 分解类型 | 数学 | 量纲读法 |\n|:---|:---|:---|\n| **群链分解** | $G\\supset G_1\\supset G_2$ | 粗细层级（见 §6.5.9.2） |\n| **直积分解** | $G=G_1\\times G_2$ | $[G_1\\times G_2]$ 由因子种类对 $([G_1],[G_2])$ 决定【标准数学】；半直积／扩张则不然（由作用而定） |\n| **不可约表示分解** | $V=\\bigoplus V_i$ | 属性空间如何承载 $G$——属性种类的表示论分类【标准数学】；对应到量纲读法【CQM 构造假设】 |\n\n##### 6.5.9.2 粗粒化＝子群关系\n\n$$\\boxed{\\ \\text{粗粒化}=\\text{沿子群链向上（群变大，量纲变粗）；细粒化}=\\text{沿链向下（群变小，量纲变细）。}\\ }$$\n\n| 方向 | 群变化 | 量纲变化 |\n|:---|:---|:---|\n| **粗粒化** | 群变大 | 不变量更少、种类更粗 |\n| **细粒化** | 群变小 | 不变量更多、种类更细 |\n\n- **物理量纲**＝最粗端点（最大群）；**唯物论基本自守量纲**＝极大关系群 $G_{\\max}(f)$（§6.4.7）；**量纲内分化**＝$G_{\\max}$ 的闭子群链；**全约束**＝最细端点（$\\{I\\}$，一切函数皆不变）；\n- **“量纲格＝子群格”是类比，不是定理**【CQM 构造假设（类比层面）】：沿**固定群链**粗细是良定义的全序；但子群格商去同构后**不保格运算**——同构类的 join 依赖具体嵌入（$G_1\\cong G_1'$、$G_2\\cong G_2'$ 而 $\\langle G_1,G_2\\rangle\\not\\cong\\langle G_1',G_2'\\rangle$ 可能），故只在链内逐点比较，不设全局格结构。\n\n##### 6.5.9.3 物理量纲 vs 唯物论基本自守量纲（两级量纲）\n\n| 层级 | 对象 | 粒度 |\n|:---|:---|:---|\n| **物理量纲** | 属性的量度类别（如“长度”） | 粗（SI 的 7 个基本量纲） |\n| **唯物论基本自守量纲** | 极大关系群同构类 $[G_{\\max}(f)]$ | 细（每个实现一类） |\n\n**例（“长度”的实现）**：$O(3)$、$SO(3)$（欧氏转动，含／不含反射）、$E(3)$（欧氏等距，含平移）、$O(1,3)$、$ISO(1,3)$（洛伦兹／庞加莱——保的是**时空间隔**，“长度”的时空分支）。五者两两不同构，故是**五个**基本自守量纲。\n\n> **两处限定**：①$E(3)$、$ISO(1,3)$ **含平移**，不是 $GL(n)$ 子群——须用母群三类扩类（§6.5.5.2 清单范围的根据：线性／线性之商／半直积扩张）；②本例是本文档 §6.4.5“大内差异”（“保距离”在欧氏平面 →$O(2)$、三维欧氏 →$O(3)$、闵氏时空 →$O(1,3)$、弯曲流形 →$\\mathrm{Isom}(M,g)$）的细粒化重述，与 §6.5.12 一致。\n\n$$\\boxed{\\ \\text{一个物理量纲} \\mapsto \\text{多个唯物论基本自守量纲；物理量纲粗，基本自守量纲细。}\\ }$$\n\n---\n\n#### 6.5.10 与文献的关系\n\n- **既有**：量纲分析的群论化处理（Birkhoff 一系【文献确立（经典）】）；量纲分析与 Lie 群的教科书处理（孙博华《量纲分析与 Lie 群》，高等教育出版社 2016【文献确立】）；“量纲分析作为规范理论”（arXiv:2607.21695 *Dimensional Analysis is a Gauge Theory*【文献确立】）；不变量理论中的计数问题。\n- **本文区别**：基本自守量纲＝**极大关系群同构类**（定义 3）；由 SI 基本量纲数**反推** $n$ 下界（§6.5.5.5）；以**量纲发生学**定位（本文档既有视角，此处汇总重述）；系统研究 $GL(n)$ 子群中能承载**非平凡不变量**的同构类。\n- **诚实边界**：**“可实现在性”一半是既有文献**——$G$ 能否由不变量环恢复，即**可观察子群**（observable subgroup）理论（Grosshans 一系），**非自动成立**（定义 5 注）；真正新的只是**计数 $D_{\\rho}(n)$（基本自守量纲）与 $D_{H,\\rho}(n)$（量纲内分化）**。“尚未被系统提出”仅在此限定下成立。\n\n---\n\n#### 6.5.11 待建立项\n\n| 编号 | 待建立项 | 领域 |\n|:---|:---|:---|\n| 1 | $GL(5)$ 子群的完整共轭分类 | 李群／代数群 |\n| 2 | 各群种类对应的物理量 | 物理 |\n| 3 | 质量、电荷、温度的属性量纲关系群 | 物理 |\n| 4 | 特征常数与极大关系群的具体对应 | 物理 |\n| 5 | 标准模型 19 参数如何嵌入 $GL(5)$ 子群框架 | 物理 |\n| 6 | 量纲相对性与自然单位制的形式化关系 | 数学物理 |\n| 7 | $GL(5)$ 约化到 $GL(4)$ 时量纲种类的分解 | 数学物理 |\n| 8 | 离散子群的量纲种类 | 数学 |\n| 9 | $D_{\\rho}(n)$ 的递推或渐近公式 | 数学 |\n| 10 | $D_{\\rho}(2),D_{\\rho}(3)$ 的完整计算 | 数学 |\n| 11 | 基本自守量纲计数 $D_{\\rho}(n)$ 与量纲内分化计数 $D_{H,\\rho}(n)$ 的**关系刻画**（见 §6.5.12） | 数学 |\n| 12 | SI 反推 $n$ 的严格化：可实现过滤（§6.5.5.5 第三条）与“独立属性 $\\mapsto$ 相异种类”假设的核验 | 数学／物理 |\n\n---\n\n#### 6.5.12 基本自守量纲群＝极大关系群；子群＝量纲内分化\n\n$$\\boxed{\\ \\text{基本自守量纲群是极大关系群 }G_{\\max}(f)=\\mathrm{Stab}_{G_0,\\rho}(f)\\text{；其子群给出量纲内分化。}\\ }$$\n\n| 层 | 对象 | 计数 | 代数性约束 |\n|:---|:---|:---|:---|\n| **基本自守量纲** | 极大关系群 $G_{\\max}(f)$ | $D_\\rho(n)=\\lvert\\{[G_{\\max}(f)]\\}\\rvert$ | 要求（$\\mathrm{Stab}$ 恒 Zariski 闭） |\n| **量纲内分化** | 子群 $G\u003cG_{\\max}(f)$ | $D_{H,\\rho}(n)=\\lvert\\{[G]:G\\le H,\\ \\exists f\\not\\equiv\\text{const}\\}\\rvert$ | 闭子群链（§6.4.7“链内细粒度差异”） |\n\n$n=1$（$\\mathbb{F}=\\mathbb{R}$）：基本自守量纲 $D_\\rho=3$（$\\{1\\}$、$\\mathbb{Z}/2$、$GL(1)$——**含常数函数给出的满群**）；量纲内分化 $D_{H,\\rho}=2$（仅 $\\{1\\}$、$\\{\\pm1\\}$——$\\mathbb{R}^{\\times}$、$\\mathbb{R}_{>0}$ 只允许**常数**不变量，**不计**）。\n\n> **定义顺序**：**先 $f$（与作用 $\\rho$）后群**——极大关系群 $G_{\\max}(f)=\\mathrm{Stab}_{G_0,\\rho}(f)$ 定**基本自守量纲** $[G_{\\max}(f)]$；极大性用于归类——任何保持 $f$ 的群都在 $G_{\\max}(f)$ 内，归入同一基本自守量纲。**子群 $G\u003cG_{\\max}(f)$ 不是另一个量纲，而是该量纲的量纲内分化**（§6.4.7、§6.5.9.2）。\n>\n> **计数关系**：两层的差源于**常数函数给出满群类 $[G_0]$**——基本自守量纲层计入该最粗量纲，量纲内分化层以 $f\\not\\equiv$ 常数排除（$n=1$：$3$ vs $2$）。\n\n#### 6.5.13 量纲总分类：自守量纲（基本＋子）与派生量纲\n\n> **本体论纲领**：**属性先在，关系潜在-显现化它。**「属性先在」是**物质先在**在属性侧的展开——**属性锚点**就是 $GL(n)$ 的矩阵元素 $g_{ij}$，是物质本身拥有的潜能，不依赖于测量与命名（唯物立场；属性锚点与自守链的锚点分属两侧——后者是链条侧的起点：无量纲→时间，§7.3、§7.6）；「潜在-显现」指的是**属性**——属性先在为**潜在**（即属性锚点），经关系而**显现**（显现为实例属性、自守形式、量纲）；「潜在-显现化」沿三环节展开——「关系分化」——分化属性的关系即**极大关系群** $G_{\\max}(f)$（作为属性的**稳定化子**，定义不变量环 $\\mathbb{C}[g_{ij}]^{G_{\\max}}$，实例属性即环中元素，如体积、长度、电荷等属性类别）；关系不是先验的，是物质自组织对自己施加的条件（群约束性口径）；「实例化」——物理稳定即重组实现（见下注），稳定下来的标志是建立起自守形式；「具体化」——对自守因子 $j$ 的选取和诠释把它具体化为量纲，量纲是属性的**物理实现刻度**（$j$ 即量纲因子，§6.4.2 层②）。**不变量理论是核心**：定义顺序先 $f$（不变量）后群（§6.5.12）。\n\n$$\\boxed{\\ \\text{属性先在（属性锚点：}GL(n)\\text{ 矩阵元素 }g_{ij}\\text{）}\\xrightarrow{\\text{关系分化（极大关系群）}}\\text{实例属性（不变量被保住）}\\xrightarrow{\\text{实例化（物理稳定）}}\\text{自守形式（稳定性的体现）}\\xrightarrow{\\text{具体化（量纲选取）}}\\text{量纲}\\ }$$\n\n```\n量纲\n├── 自守量纲（有自守形式对应）\n│   ├── 基本自守量纲（极大关系群定义，定义 3）\n│   │   ├── 长度 [L]、质量 [M]、时间 [T]、电流／电荷 [Q]、温度 [Θ]、发光强度 [J]\n│   │   └── （SI 六基各自标准实现下的基本自守量纲；跨实现时另有各自的 G_max，§6.5.9.3）\n│   └── 子自守量纲（极大关系群的子群 [G']（G' \u003c G_max）定义，量纲内细分）\n│       ├── 空间距离（长度细分，E(3) 内连续子群支）\n│       ├── 波长（长度细分，O(3) 支）\n│       ├── 粒子长度（长度细分，SO(3) 支）\n│       └── ……（连续子群支与离散子群支均计，§7.7.2 三层表）\n└── 派生量纲（无自守形式对应）\n    └── 物质的量 [N]（摩尔）：人为定义的计量量、链条外（§5.2、§7.6 二、§7.7.3）\n```\n\n| 类型 | 来源 | 自守形式 | 是否基本自守量纲 | 例子 |\n|:---|:---|:---|:---|:---|\n| **基本自守量纲** | 极大关系群 $G_{\\max}(f)$ | 有 | 是 | 长度、质量、时间、电流／电荷、温度、发光强度（SI 六基，标准实现下） |\n| **子自守量纲** | $G_{\\max}(f)$ 的子群 $G'\u003cG_{\\max}$ | 有（派生） | 否（量纲内细分） | 空间距离、波长、粒子长度 |\n| **派生量纲** | 无群结构（人为定义计量层） | 无 | 否（实用派生） | 物质的量（摩尔） |\n\n> **术语消歧（极大子群 ≠ 极大关系群）**：定义基本自守量纲的是**极大关系群** $G_{\\max}(f)=\\mathrm{Stab}_{G_0,\\rho}(f)$——「极大」指对固定 $f$ 的**稳定子极大性**（一切保持 $f$ 的群都含于 $G_{\\max}(f)$），**不是**子群格意义下的极大子群（maximal subgroup：不被更大真子群真包含）——后者在 $GL(n)$ 中有无穷多互不共轭的代表，不与属性类别一一对应；且定义顺序为**先 $f$（与作用）后群**（§6.5.12）。\n\n> **子自守量纲＝量纲内分化的种类**：$G'\u003cG_{\\max}$ 的同构类是沿链向下的更细种类（§6.4.7 裁定口径、群论文档 §5.6），本节正式命名为**子自守量纲**。同类别基本量可相加（$1\\ \\mathrm{m}+2\\ \\mathrm{m}=3\\ \\mathrm{m}$）；不同实现（子自守量纲）**不能简单相加**（§6.2.4 的「不能简单组合」判定即指此层）。\n\n> **派生量纲与 SI 导出量纲的区分**：本文「派生量纲」专指**无自守形式对应的人为定义计量层量纲**；它与 SI 的「导出量纲」（由基本量纲按幂次组合而成，如速度 $[L][T]^{-1}$）不同——物质的量是 SI 七基中唯一的派生量纲（实用派生量）。\n\n> **自守形式与稳定性（$\\gamma g = z$ 设置）**：$\\gamma\\in GL(n,F)\\subset GL(n,\\mathbb{A}_F)$（对角嵌入）为离散子群元素，$g\\in GL(n,\\mathbb{A}_F)$ 为阿代尔点，$\\gamma g=z\\in GL(n,\\mathbb{A}_F)$ 为群乘法；自守形式 $f$ 定义在商空间 $GL(n,F)\\backslash GL(n,\\mathbb{A}_F)$ 上，$f(\\gamma g)=j(\\gamma,g)f(g)$（协变律，群论文档 §8.2；Borel–Jacquet 设置）。自守形式是**属性稳定性的数学体现**：建立起自守形式，属性才算真正分化、获得稳定的物理身份；自守因子 $j$ 即量纲因子（§6.4.2 层②、群论文档 §8.2 第④身份）。锚定之前的量纲发生学第一步（无量纲→时间）不是自守形式（§7.3）。\n\n> **物理稳定（实现）**：实例属性须经物理世界稳定才落地为自守形式——规范对称性情形走**重组实现**（规范对称性不能自发破缺，Elitzur 定理，群论文档 §6.3）；一般自发对称情形（如真空期望值固定）在框架内读作重组实现。未被稳定下来的属性停留在物质潜能层面。\n\n> **SI 六基选取的三重必然性**【CQM 构造假设（选取论证）】：①数学上更极大——极大关系群的子群多、范围广，不变量最普适；②物理上更稳定——在发生学中最先稳定、鲁棒性最强；③认知上更易抽象——在最多场景中重复出现、最易识别和命名。**反例**：色荷、弱荷是真实属性，但不够极大（子群少、范围窄）、不够稳定（色禁闭；电弱分化经重组实现），故没有量纲化——其载体群位于内部 GL 层酉族（§6.4.7）。\n\n---\n\n## 七、自守形式猜想\n\n> **章导语**：本章承载纲领「潜在-显现化」的「**实例化**」与「**具体化**」环节——自守形式是属性稳定下来的标志（实例化：$f(\\gamma g)=j(\\gamma,g)f(g)$ 建立即稳定），特征常数的数值由自守形式导出、经人为选取与诠释具体化为量纲（具体化；自守因子即量纲因子，§7.6）；锚点（无量纲→时间）先于自守形式（§7.3）。\n\n### 7.1 自守形式作为数值来源\n\n$$\\boxed{\n\\text{自守形式是量纲和量纲的实现关系，}\\\\\n\\text{特征常数的数值就是某个自守形式导出的数。}\n}$$\n\n展开为：\n\n$$\\boxed{\n\\begin{aligned}\n&\\text{底层：自守形式；}\\\\\n&\\text{中层：特征常数 }K_L,K_M,K_Q,K_\\Theta,K_J\\text{ 是自守形式的导出值（}K_N\\text{ 属人为定义计量层，见 }\\S\\text{7.7.3）);}\\\\\n&\\text{翻译层：SI 单位。}\n\\end{aligned}}$$\n\n### 7.2 自守形式作为量纲实现本身\n\n更进一步：\n\n$$\\boxed{\n\\text{自守形式不只是数值来源；}\\\\\n\\text{它可能就是量纲与量纲之间的实现关系本身。}\n}$$\n\n即：\n\n$$\\boxed{\n\\text{自守形式} \\equiv \\text{量纲-量纲的实现关系}\n}$$\n\n### 7.3 量纲发生学第一步：无量纲→时间——自守链的锚点，不是自守形式\n\n$$\\boxed{\\ \\text{\"无量纲} \\longrightarrow \\text{时间\"是量纲发生学的第一步、自守链的锚点；但它本身不是自守形式。}\\ }$$\n\n**为什么不是自守形式**：自守形式需要协变律的全套数据——离散子群 $\\Gamma$、自守因子 $j(\\gamma,z)$、原形式与新形式（群论文档 §8.2）。“无量纲→时间”的实现（事件计数经固有时获得 $T$）发生在这些数据**之前**：此步没有 $\\gamma$ 可作用、没有 $j$ 可携带，是量纲发生学的**第一步**（固有时机制，§6.0 时间动力学），不是自守形式。\n\n**它是什么**：它是自守链的**锚点**——打破量纲循环的无量纲-量纲直接关系（§7.6 二）；计数标定与再生产循环使时间获得**自守化起点**，自守形式在锚定之后的链上环节出现（如寿命—长度稳定关系的自守实现，§7.6 三之②、§7.7.2）。“最原始的自守形式”是链上哪一个，属待定问题。\n\n也就是说：\n\n- 数学侧：计数标定与再生产周期——数学结构，无量纲，纯数；\n- 物理侧：时间量纲 $T$，固有时，可测量；\n- 桥：**固有时机制本身**（不是自守形式）；\n- 该桥是最原始的量纲生成器，也是自守链的起点（锚定之后自守形式才登上链条）。\n\n**注**：无量纲→时间的特征常数未知，可能没有。但无量纲与固有时关系紧密：固有时本质上与事件计数紧密关联——事件计数是无量纲的纯数，固有时是事件计数在物理侧的体现。因此，无量纲→时间的转换并非任意，而是通过固有时/事件计数自然实现：事件计数的纯数（无量纲）经固有时获得时间量纲 $T$。时间 $T$ 是量纲发生学的第一个量纲，这正是 CQM 一直指出的时间动力学（因果时、固有时）。\n\n### 7.4 自守形式输出的量纲性质\n\n自守形式输出的量纲性质取决于输入的量纲性质与具体分析语境，不能一概而论。\n\n**输入决定输出**：当自守形式的输入参数为纯数（无量纲）时，输出为纯数；当输入参数带有物理量纲（如曲率 $R$ 量纲 $L^{-2}$、能量 $E$ 量纲 $ML^2T^{-2}$）时，输出自然带有相应量纲。自守形式作为映射，其输出量纲由输入量纲与映射结构共同决定。\n\n**情形一：无量纲输入 → 纯数输出，直接作为无量纲常数。** 如精细结构常数 $\\alpha \\approx 1/137$，自守形式以无量纲参数为输入，给出的纯数本身就是物理常数。\n\n**情形二：无量纲输入 → 纯数输出，作为有量纲特征常数的数值部分。** 如 $10c = 2.99792458\\times 10^9$、$K_Q = 10c/10^{9/2} \\approx 9.480\\times 10^{4}$。自守形式给出的纯数本身无量纲，但扮演有量纲特征常数的数值角色，需配合单位制翻译得到带量纲的物理量。\n\n**情形三：有量纲输入 → 有量纲输出。** 当自守形式的输入参数带有物理量纲时，输出直接带有量纲，无需单位制翻译。自守形式作为“量纲-量纲的实现关系本身”（§7.2），输入端量纲与输出端量纲可以不同，自守形式本身就是带量纲的转换映射。\n\n**情形四：作为量纲结构参数。** 如表示维数 $70 = \\dim \\mathrm{Sym}^4(\\mathrm{SU}(5))$，纯数但承载量纲发生学的结构信息，不直接对应某个物理常数。\n\n**总结**：自守形式输出的数值是否无量纲，取决于输入是否带量纲以及具体分析语境。输入无量纲时输出为纯数（可作为无量纲常数或有量纲特征常数的数值部分）；输入有量纲时输出直接有量纲。不应笼统断言“自守形式只能给出纯数”而掩盖这些区别。\n\n### 7.5 三条腿的分工与常数的分类\n\n把“量纲—群论—自守形式”三者的分工摆清楚，是本章最容易误读的一点：三条腿**给的东西不是同一类**。\n\n| 腿 | 给什么 | 性质 | 出处 |\n|:---|:---|:---|:---|\n| **量纲发生学** | 量纲类别；“每压掉一个量纲就冒出一个特征常数 $K$” | **定性**（哪些常数有量纲、$K$ 是什么） | §6.1、§6.4.1 |\n| **唯物主义群论** | 哪个群保哪个属性量（属性关系群 $G_Q$） | **结构**（不给数值） | `CQM_核心_唯物主义群论.md` §5.3、§6.1 |\n| **自守形式** | 特征常数的**数值**；且本身即“量纲-量纲的实现关系” | **定量** | §7.1、§7.2 |\n\n→ 三条腿合起来才“打通”：**量纲那条腿与群论那条腿都不出数字**，数字只出自守形式那条腿。\n\n**“无法解释的基本常数”不能只按“有无量纲”分**——那样会把两类性质完全不同的东西混在一起。正确判据是：**这个常数是不是某个“量纲对”之比的体现**。据此分三类：\n\n| 类 | 成员 | 与量纲的关系 | 对应 |\n|:---|:---|:---|:---|\n| **有量纲特征常数** | $c$、$\\hbar$、$G_N$、$K_L$、$K_Q$、$K_\\Theta$、$k_B$…… | **跨量纲对**（大差异）的实现特征常数——**直接相关** | §6.2.1、§6.4.4 跨量纲支 |\n| **比值型无量纲常数** | $m_e/m_p$、$\\lambda_C/a_0$、$\\alpha$（$[\\text{能量}\\cdot\\text{长度}]$ 相消）…… | **同量纲对**——即 §6.2.2“同量纲内差异表现为实现之间的**无量纲标度**”的定量体现——**紧密相关**：其“无量纲”来自**量纲相消**，不是“不涉及量纲” | §6.2.2、§6.4.5 |\n| **纯数型无量纲常数** | $☯=\\xi'(1)/\\xi(1)$、$\\gamma_n$、$70=\\dim\\mathrm{Sym}^{4}(\\mathrm{SU}(5))$…… | 谱／表示论／算术量，量纲发生学中**没有对应的“量纲对”** | §7.4 情形四 |\n\n**核心表述**：**“无量纲” $\\ne$ “与量纲无关”**。判据不是“有没有量纲”，而是“**它是不是某个量纲对之比的体现**”：\n\n- **跨量纲对** → 有量纲特征常数（$K$ 系列）；\n- **同量纲对** → 比值型无量纲常数（**量纲内差异的定量体现**）；\n- **不对应任何量纲对** → 纯数型（谱／算术量）。\n\n→ 三条腿的接法也随之明确：**量纲腿**给出“量纲对”（跨量纲的 $K$，以及同量纲内的实现差异），**自守形式腿**给出该比值／数值，**群论腿**给出结构。因此“基本常数都与量纲有关”这句话，**对前两类成立**（它们都是某个量纲对的体现），**只对第三类不成立**。这与 §8.1 记录的立场一致：无量纲常数才是跨文明客观的基本量；但有量纲常数并非“只是人为构造”——它们代表的是**量纲之间的实现关系**，关系是客观的，只是量纲形式依赖单位制（§8.2 末行“自守形式＝最底层”）。\n\n> **状态标注**：本节建立在 §7 章首的**“自守形式猜想”**之上——“自守形式作为数值来源”本身是**猜想**（§8.2 表中亦标“最底层（猜想）”），不是已证事实。另有两处未定：$K_L$ 的数值**尚未定死**（§6.3.1：第一性链 $0.656$ fm 与标定链 $0.67860$ fm 相差 $3.3\\%$，几何公式另给 $0.6805$ fm）；$\\alpha$ 的数值属**构造后验校验**（$\\approx0.16\\%$ 近似），非已被公认的独立第一性推导。\n\n### 7.6 自守-量纲链：三层实现、锚点与计算路径\n\n> 链条由**三层实现**生成，其起点是**锚点**，其展开顺序即**计算路径**；链条的**依托结构**见 §7.7.3，其**检验**见 §7.7.4。\n\n**一、三层实现：原形式的属性被群实现为量纲形式的属性**\n\n属性矩阵（$GL(n)$ 的矩阵表示下，每个元素代表一个属性自由度）承受**属性量纲关系群**的作用；对该矩阵的**标量不变函数** $f$ 给出**内蕴不变量**，该内蕴不变量即**属性的量**：\n\n| 属性量 | 属性量纲关系群 | 保持的结构 |\n|:---|:---|:---|\n| 距离 | $O(n)$ | 实内积 |\n| 概率 | $U(n)$ | 复内积（模方） |\n| 相空间面积 | $Sp(2n)$ | **辛形式** $\\Omega$，$M^{\\mathsf T}\\Omega M=\\Omega$ |\n\n$Sp(2n)$ 由保辛形式**定义**，“保二维相空间面积”是 $n=1$ 时的推论；$n\\ge2$ 时保体积的 $SL(2n)$ 严格大于 $Sp(2n)$，故“保面积”不足以定义 $Sp$（群论文档 §3.1／§5.2／§6.1）。\n\n> **$f$ 的给定性**：$f$ 是**给定**的 $G$-不变函数，不由群自动保证。任意作用都有平凡的常数不变量；**非平凡**不变量是否存在、是否足以分离轨道，取决于**不变量环** $\\mathbb{F}[M_n]^{G}$——即**可观察子群**条件（§6.4.7）。【标准数学】\n\n在离散子群上取协变律 $F(gz)=j(g,z)F(z)$（群论文档 §8.2；$z$ 取自属性矩阵侧的作用空间），自守因子 $j$ 兼作**量纲因子**：$F(gz)$ 即原属性形式被作用后成为的量纲形式，$j$ 承载表面层的换算（§6.4.2 层②；$j$ 的第四身份见群论文档 §8.2 三种身份注）。\n\n于是实现自上而下分三层：\n\n| 层 | 群 | 说明 |\n|:---|:---|:---|\n| **基本自守量纲** | **极大关系群** $G_{\\max}(f)$ | 对指定的属性自由度组合构造；极大性用于归类（§6.4.7 定义顺序口径） |\n| **量纲内细分（子自守量纲，§6.5.13）** | 连续子群；跨实现时另有各自的 $G_{\\max}$ | 一般长度量纲之下：空间长度→$E(3)$、波长→$O(3)$、粒子尺度→$SO(3)$……（群论文档 §5.3） |\n| **具体量纲实现** | 离散子群 | 再取离散子群，对应物体实例层（小内差异，群论文档 §5.6） |\n\n**二、锚点论证：链条凭什么能开始算**\n\n单个量纲**没有跨量纲的非平凡关系化**——它自己关系化自己，只给出自身的**重标度群** $\\mathbb{R}_{>0}$；$k$ 个独立量纲给 $(\\mathbb{R}_{>0})^{k}$，这正是 §2.1 Buckingham $\\pi$ 定理的**群论形式**（换单位即群作用，其不变量恰是无量纲组合）。故量纲与量纲之间若无直接关系，关系链就是**循环结构**——互相定义、无外部锚点，即 §8.1 批判的“单位锚定”困局。\n\n打破循环需要一个既是**无量纲-量纲的直接关系**、又能**自守化**的实现。这样的实现有**两个**：时间与空间各自从无量纲锚定、各自自守化，而**发生学上有先后**——\n\n| 锚点 | 无量纲-量纲的直接关系 | 自守化途径 | 发生学次序 |\n|:---|:---|:---|:---|\n| **时间** $T$ | 事件计数是无量纲纯数，经固有时获得 $T$（§7.3、§6.0） | **再生产循环**：计数标定给出周期结构 | **先** |\n| **长度** $L$ | 耦合空间坐标是无量纲的，经 $K_L$ 获得 $L$（$r_{\\rm coupling}\\cdot K_L=r_{\\rm phys}$，§6.3.1） | **几何**：双曲实现（§7.7.5） | **后** |\n| **物质的量** $N$ | 有（计数）：$1\\cdot K_N=N$（§5.2） | **与自守量纲无关**：人为定义的计量量（§5.2），不充当锚点 | **链条外** |\n\n**物质的量为何不充当链条起点**：$N$ 与时间 $T$ 都自计数出发，但两种计数不同——$T$ 的锚点是**事件计数的周期结构**（再生产循环，§7.3、§7.7.5），$N$ 的量纲关系是**实体个数的计数基准**（$1\\cdot K_N=N$）。$N$ 是**人为定义**的计量量，**与自守量纲无关**（§5.2），不像 $T,L$ 那样挂在一般的周期/几何结构上。→ $N$ 位于链条**外**，链条起点仍由时间与长度两个锚点承担【CQM 构造假设】。\n\n**先后与依托是两回事**：\n\n- **发生学上时间先于空间**——第一个量纲是时间（§6.0 时间层、§7.3），长度层在其后；\n- **但空间不需要时间量纲来承担自守链**——长度的自守化走自己的几何途径，量纲来源是耦合空间的 $K_L$，不经由时间。故“时间先于空间”是**发生学次序**，不是**依托关系**：$L$ 并不依靠 $T$ 生成（§7.7.3）。\n\n**时空一体是同步的产物，不是出发点**：$T$ 与 $L$ 各自锚定并各自自守化之后，二者**同步**为一个结构——其数学表现是保持时空间隔 $ds^{2}=c^{2}dt^{2}-d\\vec{x}^{\\,2}$ 的**洛伦兹群** $O(1,3)$（群论文档 §5.1），它**混合**时间与空间，不是 $O(1)\\times O(3)$ 的直积；其物理产物即**光速** $c$（见 §7.6 三）。→ 时空一体在发生学上**后于**两个锚点，不能反过来当作出发点【CQM 构造假设】。\n\n**同步之后的自守化载体**：$T$ 与 $L$ 同步为时空后，自守化落在保时空间隔的那一层——$SL(2,\\mathbb C)$（$SO^{+}(1,3)$ 的双覆盖）作用于双曲三空间 $\\mathfrak H^{3}$，其算术子群（Bianchi 群 $SL(2,\\mathcal O_K)$）给出 Bianchi 模形式；它同时容纳两侧的周期方向与几何方向（§7.7.5）【标准数学】＋【CQM 构造假设】。\n\n→ 关系经自守化而**稳定、自然、结构化**，自守链由此建立。\n\n**三、计算路径：总前提与顺序**\n\n总前提——数学（特别是数论）结构与物理结构存在对应：无量纲也需要来源，即**把量纲转成数学结构来锚定**（§8.1“理论锚定而非单位锚定”的正面表述）【CQM 构造假设（总前提）】。\n\n| 步 | 做什么 | 承接者 |\n|:---|:---|:---|\n| ① | **时间**：数学结构上的再生产周期 ↔ 符合该结构的粒子 → 时间单位制 | 固有时机制（§7.3） |\n| ② | **长度**：由耦合空间经 $K_L$ 锚定（§6.3.1）；与时间的稳定关系 $\\ell=\\mathsf{F}(\\tau)$ 是同步之后的联系（§7.7.2） | $K_L$（§6.3.1） |\n| ③ | **质量**：同理 | $K_M=G_N^{-1}$（§6.4.6） |\n| ④ | **电荷**：用高斯制，把电荷量纲链接到 $L,M,T$ 上（$[Q]=[M]^{1/2}[L]^{3/2}[T]^{-1}$，§3、§6.4.3） | $K_Q$（§3.1） |\n\n**角色勿混**：$c$ 带跨量纲量纲（$[c]=L/T$，§6.4.6、§7.5 第一类），但**不是长度层的量纲特征常数**——$L=c\\,T$ 是**速度关系**而非**量纲生成关系**（§6.3）；故自守侧若输出一个“带长度量纲的数”，应读作 $K_L$ 而非 $c$。同理，电荷层的 $K_Q$（§3.1）与温度层的 $k_B$（$K_\\Theta=k_B^{-1}$，§5.1）**不是同一个常数**，列举时勿错位。\n\n**光速是两个自守形式相容结合的产物**：时间侧给出一个自守形式（周期／再生产），空间侧给出另一个（几何／耦合空间）；$c$ 不是任一侧单独的输出，而是二者的**同步（相容）条件**。→ 推导 $c$ 需要**两个自守形式的相容结合**，而不是某一个自守形式的输出（§7.7.5）。这也正是 §6.3 判读的由来：$c$ 不“承担”量纲转换——两侧的量纲实现各自完成在前，$c$ 是它们同步之后的常数【CQM 构造假设】。\n\n其中光速的**自洽计算值** $c=299\\,792\\,458.258\\ \\mathrm{m/s}$，并由它**导出某种长度**——“自洽”而非“第一性”：计算在链条内自洽，不宣称独立预测【数值待验证：该值目前无第一性推导】。口径随之澄清：SI 的 $c$ 是**定义值**（精确 $299\\,792\\,458\\ \\mathrm{m/s}$，米由 $c$ 定义），自洽计算给出的 $+0.258\\ \\mathrm{m/s}$ 偏差，含义是“由该数学结构导出的长度与 SI 米的**再现精度差**”（导出的是**长度**，不是 $c$ 的测量值）。\n\n**四、量纲分析的新读法**\n\n经典量纲分析（白金汉 $\\pi$）在此框架中可读作**量纲因子 $j$ 与属性量纲关系群之间的作用**——$\\pi$ 定理的无量纲化即 $j$ 的量纲相消【CQM 构造假设（一句话纲领）】；与 §6.5.1“量纲分析 vs 量纲发生学”定位表衔接。注意二者的分工：$\\pi$ 定理处理的是**同量纲内**的重标度（§2.1），本链条处理的是**跨量纲**的锚（锚点论证）——互补，不是同一件事。\n\n**五、检验**\n\n链条自洽不等于链条**存在**。检验分**约定无关检验／强检验／弱检验**三级及其成立条件，见 §7.7.4。\n\n> **标注**：【标准数学】（高斯制电荷量纲、$O/U/Sp$ 保持的结构、协变律形式、$\\pi$ 定理的群论形式）＋【CQM 构造假设】（自守因子＝量纲因子、锚点论证、计算路径、量纲分析读法）＋【数值待验证】（$c=299\\,792\\,458.258$：无推导出处；“自洽计算”口径下其输出为**导出长度**的再现精度差，见计算路径段）。\n\n### 7.7 锚定的具体化与检验\n\n> 锚定的具体化：起点取**哪个粒子**（§7.7.1），它给出的**寿命—长度关系**（§7.7.2）如何把链条组织成**逐层依托**的结构（§7.7.3）；链条的**检验**分三级（§7.7.4），其自守化有**周期、几何与时空**三条途径（§7.7.5）。\n\n#### 7.7.1 起点的选择：锚定粒子\n\n锚定粒子须同时满足三条：**有限本体**（有明确定义的寿命、质量、量子数，不依赖额外的束缚结构）＋**自带计数—时间结构**（衰变是离散事件，其计数为无量纲纯数，经固有时获得 $T$，§7.3）＋**自身尺度可测**（有“粒子相关长度”可作长度分析对象）。\n\n自由中子满足前两条（$\\tau_n$、$m_n$ 明确），且电中性使它成为“有限本体”的干净样本；但也正因电中性，**第三条含糊**（§7.7.2），且电荷链**必须另找带电粒子**。\n\n> **中子寿命的实验张力**——束流法 $\\tau_n^{\\rm beam}=888.0\\pm2.0$ s、瓶法 $\\tau_n^{\\rm bottle}=879.4\\pm0.6$ s，差 $8.6\\pm2.1$ s（$\\approx4\\sigma$，约 $1\\%$；不同实验组合给出的数值略有出入，此处取代表性测量）。截至 2026 年两法**未收敛**，即所谓“中子寿命谜题”，并引出暗衰变等新物理猜测（亦有一份 2026 年预印本主张经系统误差修正后收敛到 $877.92\\pm0.30$ s，属**非定论**）。参见 Wietfeldt, *Symmetry* **16**(8):956 (2024)；Wei et al., arXiv:2001.10041。\n> → 若以 $\\tau_n$ 锚定时间单位制，这 $1\\%$ 的张力**沿链传给每一个下游量**（§7.7.3 推论 1），且**不能**被链条自身的自洽性吸收——自洽只说明内部无矛盾，不说明锚点准确。\n> → 中子在**概念上**适合作为起点（有限本体、衰变即离散事件计数），在**数值上**则受上述张力所限。**另一种锚定粒子**是 $\\mu$ 子：$\\tau_\\mu=2.1969811(22)\\ \\mu$s（相对不确定度 $\\sim10^{-6}$），且 $\\mu^{\\pm}$ **带电** → 电荷链可与时间链同源锚定；代价是它不是物质的稳定组分。【数值事实】＋【CQM 构造假设】\n\n#### 7.7.2 寿命—长度假设\n\n时间与长度**各有其无量纲来源**；二者同步之后的稳定关系，写成**可证伪的形式**即：\n\n> **假设（寿命—长度锚定）【CQM 构造假设】**：对锚定粒子，存在由数学结构（自守形式）确定的稳定关系\n> $$\\ell=\\mathsf{F}(\\tau)$$\n> 把寿命 $\\tau$（量纲 $T$）映到该粒子的特征长度 $\\ell$（量纲 $L$）；$\\mathsf{F}$ 的**结构**由数学侧给出，其**量纲**由 $K_L$ 承接。\n\n- **两个锚点**：时间由事件计数经固有时锚定（§7.3），长度由耦合空间经 $K_L$ 锚定（§6.3.1）；$\\mathsf{F}$ 是二者**同步之后**的稳定关系，不是长度的量纲来源；\n- **$\\ell$ 的选取**：对中子，候选有康普顿波长 $\\lambda_{C,n}=\\hbar/(m_nc)\\approx0.210$ fm、QCD 特征长度 $\\lambda_{\\rm QCD}=\\hbar c/\\Lambda_{\\rm QCD}\\approx0.97$ fm（§6.3.1）、电荷半径——但中子均方电荷半径为**负**（$\\langle r_n^{2}\\rangle\\approx-0.116\\ \\mathrm{fm}^{2}$），“电中性粒子的特征长度”这一说法本身含糊。**$\\ell$ 一经指定，该关系即可检验**；\n- **$\\mathsf{F}$ 的量纲定位**：$\\mathsf{F}$ 把 $T$ 映到 $L$，故 $[\\mathsf{F}]=[L]/[T]$，是**速度型**量纲（与 $[c]$ 同型，§6.3）→ $\\ell=\\mathsf{F}(\\tau)$ 是**同步之后 $L$ 与 $T$ 之间的关系**，不是量纲生成关系；长度的量纲来源仍是耦合空间的 $K_L$。\n- **与既有路径的汇合点**：§6.3.1 已有一条长度实例——$K_L$ 把无量纲禁闭壳映为物理长度（$r_{\\rm coupling}\\cdot K_L=r_{\\rm phys}$）。若把其中的“无量纲输入”换成“寿命经 $\\mathsf{F}$ 给出的数”，两条路径应当**汇合**；汇合点即 $\\mathsf{F}$。注意 $K_L$ 本身**尚未定死**（第一性链 $0.656$ fm vs 标定链 $0.67860$ fm，差 $3.3\\%$）。\n\n#### 7.7.3 量纲-自守链的层级依托结构\n\n链条不是四个平铺的量纲，而是**逐层依托**：每个下游量纲的“量纲-自守链”是**借上游量纲**搭起来的。高斯制的作用正在于此——它把电荷量纲链接到 $L,M,T$ 上（$[Q]=[M]^{1/2}[L]^{3/2}[T]^{-1}$），**使得电荷能依靠别的量纲来建立量纲-自守链**，正如质量依靠时间—长度、温度依靠能量。\n\n| 量纲 | 依靠什么 | 承接者 | 链上位置 |\n|:---|:---|:---|:---|\n| $T$ | **无量纲计数**（事件计数经固有时，§7.3） | 无量纲→$T$ 的特征常数未知（可能没有） | **锚点**：发生学第 1 |\n| $L$ | **不依靠 $T$**：各有其无量纲来源，长度经耦合空间的 $K_L$ 实现（§6.3.1）；$\\ell=\\mathsf{F}(\\tau)$ 是同步之后的关系（§7.7.2） | $K_L$（§6.3.1） | **锚点**：发生学第 2 |\n| $M$ | 依靠 $T,L$ | $L^{3}T^{-2}\\cdot K_M=M$，$K_M=G_N^{-1}$（§6.3） | 下游第 1 层 |\n| $Q$ | 依靠 $L,M,T$（**高斯制**，§3） | $K_Q$（§3.1） | 下游第 2 层：**链是借来的，自身不是锚点** |\n| $\\Theta$ | 依靠能量 $ML^{2}T^{-2}$ | $K_\\Theta=k_B^{-1}$（§5.1） | 更下游 |\n| $J$ | 依靠功率 $ML^{2}T^{-3}$ | $K_J$（§5.3） | 更下游 |\n| $N$ | **与自守量纲无关**（人为定义计量量；§5.2、§7.6 二） | $K_N=N_A^{-1}$（§5.2） | **链条外** |\n\n**自守化途径：谁自己能自守化，谁必须借链**。依托关系决定了后者（哪些量纲没有独立途径，只能继承）；而自守化本身有**三条途径**（周期、几何、时空，§7.7.5），与依托链不是同一条分野——\n\n| 量纲 | 自守化途径 | 独立性 |\n|:---|:---|:---|\n| $T$ | **再生产循环**：计数标定给出周期结构（§7.6 二） | **独立**（锚点，发生学第 1；提升机制见 §7.7.5） |\n| $L$ | **几何自守化**：双曲实现 $\\mathbb H^{2}$ 的保距离群 $PSL(2,\\mathbb R)$（群论文档 §8.2） | **独立**（锚点，发生学第 2，§7.6 二） |\n| $M$、$Q$、$\\Theta$、$J$ | **继承**：依靠上游量纲的链——**否则无法自守化** | 不独立 |\n| $N$ | **与自守量纲无关**：人为定义的计量量（§5.2） | 链条外 |\n\n电荷正是“否则无法自守化”的那一类：它自身没有独立的自守化途径，必须靠高斯制把量纲链接到 $L,M,T$ 上（见上表第 4 层）。【CQM 构造假设】\n\n**三条推论**：\n\n1. **依托＝依赖：误差沿链继承**。每一环都把上游的数值不确定度**带下去**——若时间侧用中子寿命标定（$1\\%$，§7.7.1），则凡由时间给出的量——$M$、$Q$，以及经 $\\ell=\\mathsf{F}(\\tau)$ 算出的长度值——**全部**继承，且**无法**在下游被修正（下游的自洽检查不到锚点）→ **锚点精度是整个链条的精度上界**；\n2. **依托 $\\ne$ 还原**。“电荷依靠 $L,M,T$”的意思是“该属性在别的属性约束下被实现”（§6.4.3），**不是**“电荷可还原为力学量”——本体论独立 $\\ne$ 单位制独立。依托关系属**大差异**，由特征常数承接（§6.2.2）；\n3. **依托链越长，“绝对数值”的检验力越弱——但 $\\alpha$ 不受此限**。$Q$ 在下游第 2 层、依托链最长、误差累积最多，看似最不适合当检验点；而 §7.7.4 恰恰把电荷（$\\alpha$）列为**最强**检验点。两者不矛盾：$\\alpha=e^{2}/\\hbar c$ **无量纲**（§7.5 比值型），依托链上的量纲在 $\\alpha$ 中**相消**——它检验的是**比值**而非链条的绝对刻度。→ **依托长度削弱“绝对数值”的检验力，不削弱“无量纲比值”的检验力**；这解释了为何检验点选在链条最长的那一支上。\n\n**长度的位置**：长度的量纲来源是耦合空间——$K_L$ 把无量纲耦合坐标映为物理长度（$r_{\\rm coupling}\\cdot K_L=r_{\\rm phys}$，§6.3.1）；它**不依靠时间量纲**生成，自守化走自己的几何途径。发生学上时间先于空间（§6.0），但**先后不是依托**：二者各自从无量纲实现，随后**同步**为时空（§7.6 二）。$\\ell=\\mathsf{F}(\\tau)$ 是同步之后 $L$ 与 $T$ 之间的关系（$\\mathsf{F}$ 带 $[L]/[T]$ 量纲，§7.7.2）。→ $K_L$ 的输入保持为无量纲耦合坐标（§6.3.1 的 $r_{\\rm conf}=\\sqrt{I\\lambda_c}$），$c$ 读作“速度关系”（§6.3、§7.6 三）。若反过来取严格链式（长度依靠时间），$K_L$ 的输入须换成由寿命导出的数，§6.3.1 的 $K_L$ 值链（$0.656$／$0.67860$／$0.6805$ fm）须**重算**，且 $T$ 的 $1\\%$ 张力**直接**进入长度——这与 $K_L$ 在耦合空间中的存在方式不相容。\n\n> **标注**：【标准数学】（依托关系的量纲合成、误差继承、$\\alpha$ 的量纲相消）＋【CQM 构造假设】（层级依托结构、依托≠还原、寿命—长度假设）＋【数值事实】（中子寿命张力、$\\tau_\\mu$）。\n\n#### 7.7.4 检验的分层\n\n链条**自洽**不等于链条**存在**。检验分三级，各自的成立条件不同：\n\n| 级 | 内容 | 检验力 | 成立条件 |\n|:---|:---|:---|:---|\n| **约定无关检验** | 由数学结构算出**无量纲**数（如 $\\alpha=e^{2}/\\hbar c$），与单位制约定无关 | **最强**：连“锚点准不准”都不依赖（§7.7.3 推论 3） | 需第一性算出；目前 $\\alpha$ 属**构造后验校验**（$\\approx0.16\\%$ 近似，§7.5 状态标注） |\n| **强检验** | **同一套机制**迁移到别的基本粒子上仍成立 | **强**：跨对象复用才是真正的预测 | **前提：迁移时不新增自由参数**（见下） |\n| **弱检验** | 同一套自守数学结构**同时**导出链条上若干特征常数（$K_L$、$K_M$、$K_Q$、$K_\\Theta$…） | **弱**：只说明该结构有足够输出与之相容 | 须先清点 $N$ vs $p$（见下） |\n\n- **强检验的前提：不新增自由参数**。若机制对每个新粒子都引入新的可调参数（新粒子＝新拟合），那么“对中子适用、对质子也适用”就**没有任何检验力**——它只说明机制有足够自由度去匹配任意数据。**操作判定**：迁移时先**固定**已在锚定粒子上定死的参数，再看下游量的预测值与实测之差；\n- **弱检验要成为检验，须清点 $N$ 与 $p$**：把“导出 $N$ 个常数”写成“$N$ 个输出 vs $p$ 个自由参数”的计数比较——只有 $N\\gg p$ 才有意义；$N\\le p$ 时所谓“导出”只是**重参数化**。当前链条的 $N$ 与 $p$ **均未清点**；\n- **电荷为何是检验点**：高斯制下 $[Q]$ 由 $L,M,T$ 复合**导出**，故电荷不是独立锚点（与 §7.4 情形二 $K_Q=10c/10^{9/2}$ 由 $c$ 构造一致）；而 $\\alpha$ 是**无量纲**纯数（§7.5 比值型：$[\\text{能量}\\cdot\\text{长度}]$ 相消），与单位制约定无关——若 $\\alpha$ 能由自守形式第一性算出，即构成对整条链条的**约定无关检验**；\n- **高斯制的双重角色（勿只记其一）**：①把断掉的电荷量纲链**拉通**，使电荷能与别的量纲建立联系（§7.7.3）；②但**连通 $\\ne$ 锚定**——电荷侧仍须完整走一遍粒子锚定步骤（选带电的锚定粒子 → 取其电荷属性 → 由数学结构定出 $K_Q$，§3.1）。\n\n⇒ **检验力排序**：**约定无关检验（$\\alpha$ 一类）$\\;>\\;$跨粒子强检验$\\;>\\;$常数复现弱检验$\\;>\\;$链条自洽（**不是检验**）**。\n\n#### 7.7.5 自守化的途径：周期、几何与时空\n\n自守化有三条途径，须分开看待：\n\n| 途径 | 载体 | 状态 |\n|:---|:---|:---|\n| **几何**（长度侧） | 双曲实现 $\\mathbb H^{2}$ 的保距离群 $PSL(2,\\mathbb R)$ 作用于上半平面 $\\mathfrak H$；模形式的自守因子 $j=(cz+d)^{k}$（群论文档 §8.2） | 有**成熟的数学载体**，无下述缺口；具体取哪个长度实现、哪个 $\\Gamma$，尚待给出 |\n| **周期**（时间侧） | **再生产循环**：计数标定给出周期 $\\mathbb{Z}$（$t\\mapsto t+nT$） | **有缺口**，见下 |\n| **时空**（同步后） | $SL(2,\\mathbb C)\\to SO^{+}(1,3)$（双覆盖）作用于双曲三空间 $\\mathfrak H^{3}$；算术子群为 Bianchi 群 $SL(2,\\mathcal O_K)$ | **同时容纳**上述两条：幺幂平移给出周期方向，$\\mathfrak H^{3}$ 给出几何方向；二者的**相容条件**给出 $c$（§7.6 三） |\n\n**时间侧的缺口**：$\\mathbb{Z}$ 作用在 $\\mathbb{R}$（或圆周）上给出的不变对象是**周期函数**（傅里叶级数），**不是**经典意义的自守形式；后者要求 $\\Gamma$ 作用在**非平凡对称空间**上。从 $\\mathbb{Z}$ 到这样的 $\\Gamma$ 需**提升一层**：把平移 $z\\mapsto z+1$ 实现为 $SL(2,\\mathbb{Z})$ 的幺幂元 $\\begin{pmatrix}1&1\\\\0&1\\end{pmatrix}$，再补上 $S:z\\mapsto-1/z$ 一类元素才生成整个 $SL(2,\\mathbb{Z})$——“**补上 $S$ 的物质根据**”尚待给出。\n\n→ **时空途径对上述缺口的收窄**：$SL(2,\\mathbb C)$ 的算术子群（Bianchi 群）本身**含**幺幂平移子群，且生成元多于单独的 $\\mathbb{Z}$，故“从周期 $\\mathbb{Z}$ 提升到 $\\Gamma$”这一步在时空途径中有现成的落点——即把 $\\mathbb{Z}$ 嵌入 $SL(2,\\mathcal O_K)$ 的幺幂子群，而不必另行补上 $S$ 一类的元素。→ 两个锚点同步为时空（§7.6 二）不只是物理上的要求，也是**自守化在数学上得以落地**的条件。若只取幺幂子群，得到的不是模形式而是周期函数／傅里叶展开，§7.7.4 的检验力须**相应下调**。而**长度侧的几何途径不受此限**——这正是“长度也能自守化”（§7.6 二）与时间侧缺口可以并存的原因【标准数学】＋【CQM 构造假设】。\n\n\n> **标注**：【标准数学】（$\\pi$ 定理的群论形式、可观察子群、$Sp$ 由辛形式定义、$\\mathbb{Z}$ 作用的周期函数 vs 模形式）＋【数值事实】（中子寿命张力、$\\tau_\\mu$、$c$ 自洽计算值）＋【CQM 构造假设】（起点主张、寿命—长度假设、层级依托结构、检验分层与 $N$ vs $p$ 判据）。\n\n---\n\n## 八、自然单位制的批判\n\n$$\\boxed{\n\\text{自然单位制是还原论暴政，掩盖了不可还原的关系。}\n}$$\n\n自然单位制令：\n\n$$\\hbar = 1,\\qquad c = 1$$\n\n表面上看，这是“统一”。但实际上，它用**定义**强行抹平了不同物理范畴之间的差异。\n\n它做的事是：\n\n$$\\boxed{\n\\text{把“关系”从公式里赶出去，藏进单位定义。}\n}$$\n\n- 光速 $c$ 不是消失了，而是被吸收进“米”和“秒”的定义里；\n- 普朗克常数 $\\hbar$ 不是消失了，而是被吸收进“焦耳”和“赫兹”的定义里。\n\n所以：\n\n$$\\boxed{\n\\text{自然单位制} = \\text{把不可还原的关系，伪装成“1”。}\n}$$\n\n它是**单位锚定**，不是**理论锚定**。\n\n### 8.1 学界争论：有量纲常数 vs 无量纲常数\n\n关于“哪些常数才是真正基本的”，物理学界有长期争论。以 Duff、Okun 等人为代表的一派认为：**只有无量纲常数才是真正基本的**，有量纲常数（如 $c, \\hbar, G_N$）只是单位制的人为构造，其数值随单位选择而变，不具有客观物理意义。\n\n**CQM 的立场与此有同有异**：\n- **同意**：无量纲常数（如 $\\alpha, m_e/m_p$）是所有文明都能达成一致的客观量；\n- **不同意**：有量纲常数“只是人为构造”——在 CQM 看来，有量纲常数代表的是**量纲之间的实现关系**，这些关系是客观的，只是其量纲表现形式依赖于单位制选择。\n\n换言之，$c$ 的数值是人为的（依赖米和秒的定义），但“长度和时间各自从无量纲直接实现、存在跨量纲特征常数”这件事是客观的。自然单位制令 $c=1$，消灭的是数值，不是实现关系本身——实现关系还在，只是被藏进了“时空是一个四维流形”的几何语言里。\n\n### 8.2 四种单位制层次对比\n\n| 单位制 | 独立量纲数 | 常数处理 | 基础性 |\n|---|---|---|---|\n| 自然单位制 | 少 | 令为 1 | 最不基础（纯工具） |\n| 高斯单位制 | 3 | $c$ 显式出现 | 较基础 |\n| SI | 7 | 全部显式 | 翻译完整 |\n| 自守形式 | 无 | 生成常数 | 最底层（猜想） |\n\n---\n\n## 九、价值转型的同构\n\n$$\\boxed{\n\\text{剩余价值观测不到，}\\\\\n\\text{是因为实现关系没有被理解到。}\n}$$\n\n| 物理 | 政治经济学 |\n|---|---|\n| 自守形式 | 社会必要劳动时间 |\n| 量纲空间 | 价格、利润、工资 |\n| 特征常数 $K_L,K_M,K_Q,K_\\Theta,K_N,K_J$ | 价值转型关系 |\n| 时间 $T$ 作为第一量纲 | 抽象劳动作为锚点 |\n| 自然单位制掩盖关系 | 庸俗经济学掩盖剩余价值 |\n| SI 翻译 | 市场价格作为翻译 |\n\n所以：\n\n$$\\boxed{\n\\text{自然单位制} \\;\\longleftrightarrow\\; \\text{庸俗经济学}\n}$$\n\n两者都是：\n\n$$\\boxed{\n\\text{用表面上的简洁，掩盖底层的不可还原关系。}\n}$$\n\n---\n\n## 十、一与多的辩证关系\n\n### 10.1 多：自守形式不同，量纲相同也不能简单组合\n\n$$\\boxed{\n\\text{由于自守形式不同，}\\\\\n\\text{即使转换成同一量纲，}\\\\\n\\text{物理量也不能简单组合。}\n}$$\n\n例如：\n\n- 能量与力矩：量纲相同，不能相加；\n- 频率与放射性活度：量纲相同，物理意义不同。\n\n### 10.2 一：量纲一致性指向同量纲自守形式的普遍特征\n\n$$\\boxed{\n\\text{量纲一致性，}\\\\\n\\text{说明了同量纲的自守形式具有普遍特征。}\n}$$\n\n所有物理量共享同一个量纲空间，这意味着：\n\n$$\\boxed{\n\\text{所有自守形式，}\\\\\n\\text{都锁定到同一个量纲空间。}\n}$$\n\n### 10.3 统一：一与多的统一\n\n$$\\boxed{\n\\text{同量纲自守形式的普遍特征} = \\text{一与多的统一}\n}$$\n\n它既不是单一的：\n\n$$\\text{一个自守形式生成一切}$$\n\n也不是混乱的：\n\n$$\\text{一切自守形式互不相干}$$\n\n而是：\n\n$$\\boxed{\n\\text{一个谱，多个锁定，共享同一个量纲空间。}\n}$$\n\n---\n\n## 十一、弦论的批判\n\n$$\\boxed{\n\\text{弦论压根不解决量纲疑问。}\n}$$\n\n- 弦论几乎完全使用自然单位制；\n- 它把量纲问题转化为紧致化几何问题；\n- 它引入巨大的真空景观，常数依赖于真空选择；\n- 它内部有自守形式，但不用于生成量纲 $M,L,T$；\n- 它不解释 $\\hbar$ 和 $c$ 本身。\n\n所以：\n\n$$\\boxed{\n\\text{弦论是彻底的还原论，}\\\\\n\\text{它没有解决量纲疑问，}\\\\\n\\text{它只是把疑问从“常数”转移到了“几何”，}\\\\\n\\text{再从“几何”转移到了“景观”。}\n}$$\n\n这是还原论的最终命运：\n\n$$\\boxed{\n\\text{越还原，越发现不可还原。}\n}$$\n\n---\n\n## 十二、与 CQM 框架的衔接\n\n### 12.1 $G_N$ 公式\n\n$G_N$ 的可能公式（`03 引力与退相干/CQM_引力_GN可能公式.md`）在本单位制下显式包含 $\\hbar c$：\n\n$$G_N = \\frac{\\hbar c}{m_p^2} \\cdot I \\cdot \\lambda_c \\cdot ☯^2 \\cdot \\mathfrak{c}_1 \\cdot \\exp\\left(-\\frac{2}{☯}\\right) \\cdot (1 + \\kappa ☯)$$\n\n量纲：$[\\hbar c / m_p^2] = (ML^2T^{-1} \\cdot LT^{-1}) / M^2 = M^{-1}L^3T^{-2}$，与 $[G_N]$ 一致。\n\n数值检验及其状态限定（构造后验数字校验，待独立复现）见 `03 引力与退相干/CQM_引力_GN可能公式.md` §9.3、§10.4；式中参数 $I$、$\\lambda_c$、$\\mathfrak{c}_1$、$\\kappa$ 的定义与来源见该文档 §8.1–§8.2。\n\n## 十三、最终总结\n\n$$\\boxed{\n\\begin{aligned}\n&\\text{原初的是质与质的关系；}\\\\\n&\\text{第一个量纲是时间 }T\\text{（CQM 的时间动力学：因果时、固有时）；}\\\\\n&\\text{无量纲}\\to\\text{时间的特征常数未知，可能没有；无量纲与固有时紧密关联（固有时来自事件计数）；}\\\\\n&\\text{更底层（猜想）：自守形式；}\\\\\n&\\text{电磁：高斯单位制，电荷量纲 }M^{1/2}L^{3/2}T^{-1}\\text{；}\\\\\n&\\text{无量纲}\\to\\text{长度的特征常数为 }K_L\\text{（禁闭映射常数，}K_L\\text{ 值有待确定）；}\\\\\n&c\\text{ 是时空同步前沿速度，不承担量纲转换；光速 }299792458\\ \\text{m/s（第一性推导尚未在项目内成文，属缺口）；}\\\\\n&\\text{质量特征常数为 }K_M\\text{（}K_M=G_N^{-1}\\text{）；}\\\\\n&\\text{温度：}K_\\Theta\\text{ 转换；物质的量：}K_N\\text{；发光强度：}K_J\\text{；}\\\\\n&\\text{SI 作为唯一翻译对照；}\\\\\n&\\text{每压掉一个量纲，冒出一个更基础的特征常数；}\\\\\n&\\text{特征常数可能来自自守形式；}\\\\\n&\\text{自守形式输出的量纲取决于输入：无量纲输入→纯数，有量纲输入→有量纲输出；视具体分析语境而定；}\\\\\n&\\text{自守形式可能就是量纲-量纲的实现关系本身；}\\\\\n&\\text{大差异产生量纲特征常数（}K_L\\text{、}K_M\\text{、}K_Q\\text{、}K_\\Theta\\text{、}K_J\\text{；}K_N\\text{ 属人为定义计量层）;}\\\\\n&\\text{自然单位制是还原论暴政，掩盖了不可还原的关系，纯工具；}\\\\\n&\\text{弦论是彻底的还原论，不解决量纲疑问。}\n\\end{aligned}}$$\n\n\n### 13.1 SI 七基对照结论\n\n从量纲发生学的视角看，SI 七个基本单位与 CQM 量纲层级的对应关系如下：\n\n| SI 基本单位 | 对应层 | 特征常数（量纲） | 状态 |\n|---|---|---|---|\n| 秒 s | 时间 | 未知（可能没有） | — |\n| 米 m | 长度 | $K_L\\ (L)$ | 有 |\n| 千克 kg | 质量 | $K_M\\ (ML^{-3}T^2)$ | 有 |\n| 库仑 C | 电荷 | $K_Q\\ (QM^{-1/2}L^{-3/2}T)$ | 有 |\n| 开尔文 K | 温度 | $K_\\Theta\\ (\\Theta M^{-1}L^{-2}T^2)$ | 有 |\n| 摩尔 mol | 物质的量 | $K_N\\ (N)$ | 有 |\n| 坎德拉 cd | 发光强度 | $K_J\\ (JM^{-1}L^{-2}T^3)$ | 有 |\n\n这个对照表揭示了量纲发生学的核心结构：**大多数 SI 基本单位都有对应的特征常数**（时间层除外，无量纲→时间的特征常数未知，但无量纲与固有时紧密关联——固有时来自事件计数，事件计数经固有时获得时间量纲）。长度层的特征常数是 $K_L$（禁闭映射常数，$[K_L]=L$，把无量纲耦合坐标转换为物理长度，$K_L$ 值有待确定，谱结构与数值状态见 §6.3.1）。$c$ 是时空同步前沿速度，不承担量纲转换。质量层的特征常数是 $K_M$（$[K

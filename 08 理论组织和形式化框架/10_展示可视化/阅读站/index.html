范围 |\n|:-----|:---------|:-----------|\n| 元素 | Nb(9.3K), Pb(7.2K) | 0–10K |\n| A15 | Nb₃Sn(18K), Nb₃Ge(23K) | 17–23K |\n| 二元化合物 | MgB₂(39K) | 39K |\n| 铜氧化物 | Hg-1223(133K), YBCO(92K) | 85–133K |\n| 铁基 | NdFeAsO(51K), BaFe₂As₂(38K) | 8–51K |\n| 氢化物 | LaH₁₀(250K@170GPa), H₃S(203K@155GPa) | 203–250K |\n\nSCDB 46种 + SCData 76元素 + 27化合物基准\n\n## CQM 参数校准\n\n**相变判据层级**：丛作用量交叉 $F_1(T_c)=F_2(T_c)$（唯象层）；深层根基为同步算符本征值交叉 $\\lambda_1(T_c)=\\lambda_2(T_c)$（超导同步算符 = 前时空基态紧化结构（GL(5)/SU(5)）重组实现后电磁因子（GL(1)）子结构的再现）。详见 `CQM_超导核心理论.md` §11.6。\n\n**校准目标**：验证 $T_c = (E_2 - E_1)/(S_2 - S_1)$ 对46种已知超导体的预测能力。\n\n**自由能公式**：$T_c^2 = \\frac{8\\,\\Delta\\delta_0^2\\,K_{\\text{eff}}\\,\\theta_D}{9\\ln 2}$（数值验证暂无可复核产物）。\n\n## 搜索方向\n\n1. **常压化**：氢化物高压→常压（化学预压缩，Ashcroft 2004）\n2. **高 $N(E_F)$**：平带工程（镍酸盐、魔角石墨烯）\n3. **强耦合**：大 λ（H 声子主导、d/p 波配对）\n4. **CQM 判据**：$\\Delta\\delta_0 \\ge \\frac{☯\\sqrt{1-\\beta\\delta_v}}{2\\beta\\ln n}$（资格条件）\n", "backlinks": ["D034"], "outlinks": []}, {"id": "D034", "doc_id": "D034", "title": "材料设计器总览", "path": "06 超导/超导材料设计器/README.md", "group": "06 超导", "layer": 3, "type": "工程", "text": "# CQM 3D专业引力超导实验软件\n\n> 基于 Godot 引擎的3D超导材料设计器，从质子A4嘉当矩阵出发，经五环节展开至晶胞分布结构，实现CQM超导理论的交互式计算\n\n**理论基底**：CQM 超导核心理论（耦合常数量子力学超导涌现框架）\n**引擎**：Godot 4.6（GDScript）| **状态**：回归 105 项 + 冒烟 52 项全通过\n\n---\n\n## 文档导航\n\n| 文档 | 内容 |\n|:---|:---|\n| [01 系统架构设计](#/doc/D035) | 场景树、节点体系、交互逻辑 |\n| [02 元素同位素数据库](#/doc/D036) | 118 元素 + 同位素数据格式 |\n| [03 超导判定算法](#/doc/D037) | 嘉当矩阵组装、T_c 估算、判定流程 |\n| [04 应用场景与对比](#/doc/D038) | 与 VASP/Quantum ESPRESSO 等对比 |\n| [05 嘉当矩阵参数化](#/doc/D039) | 三层分离架构 |\n| [06 文献调研与路线](#/doc/D040) | 同类软件调研 |\n| [07 目标超导搜索](#/doc/D041) | CQM参数校准与搜索策略 |\n\n---\n\n## 核心设计\n\n**一句话定位**：用户用元素拼接三维分子结构，系统基于CQM超导理论实时计算并判定超导性质，可视化A₄嘉当矩阵、凝聚温度等物理量。\n\n### 五层双轨架构\n\n| 层 | 名称 | 物理意义 | 归属 |\n|:---:|:---|:---|:---:|\n| L0 | 化学式 | 全局锚点 | 上屏 |\n| L1 | 结合方式 | 骨架拓扑 | 上屏 |\n| L2 | 相对位置 | 几何参数 | 上屏 |\n| L3 | 晶胞 | 周期性堆积→Regge→嘉当→FG退相干场→CQM | 下屏 |\n| L4 | 晶胞分布 | 晶粒排列（单晶/多晶/薄膜/粉末） | 下屏 |\n\n双轨：模式设计（4超导家族经验规则）/ 自由设计（物理硬条件）\n\n### 理论对接\n\n1. 嘉当矩阵计算链：质子A₄ → 元素 → 分子 → 晶胞 → Regge\n2. 晶胞=Regge单元 → 离散角亏 → FG退相干场 → CQM超导\n3. 超导本质：晶粒中质子-中子关系网络 → FG退相干场 → 库珀对\n\n### 耦合空间曲率判定\n\n$$\\psi(\\mathbf{r}, T) = \\int_{\\text{BZ}} d^3k \\; \\mathcal{D}_{\\text{lattice}} \\cdot \\mathcal{P}_{\\text{electron}} \\cdot \\mathcal{C}_{\\text{triple}} \\cdot \\mathcal{K}_{\\text{causal}} \\cdot e^{-\\Gamma_\\phi|\\tau|}$$\n\n---\n\n## CQM 理论基础速查\n\n| 参数 | 符号 | 数值 | 来源 |\n|:---|:---:|:---:|:---|\n| 相变量子 | $☯$ | 0.02309570897 | ξ'(1)/ξ(1) |\n| 第一耦级 | $\\mathfrak{c}_1$ | 200.04045483 | 1/4 + γ₁² |\n| A₄ 谱间隙 | λ₁ | (3−√5)/2 ≈ 0.382 | A₄ 最小本征值 |\n| BCS 前因子 | 2e^γ/π | ≈ 1.1339 | 弱耦合极限 |\n\n$$A_4 = \\begin{pmatrix} 2 & -1 & 0 & 0 \\\\ -1 & 2 & -1 & 0 \\\\ 0 & -1 & 2 & -1 \\\\ 0 & 0 & -1 & 2 \\end{pmatrix}, \\quad \\lambda_k = 2 - 2\\cos\\frac{k\\pi}{5}$$\n\n$$\\mathcal{C}_{\\text{element}} = \\left(\\bigoplus_{i=1}^{Z} A_4\\right) \\oplus \\left(\\bigoplus_{j=1}^{N} C_n(\\delta_j)\\right), \\quad k_B T_c = \\frac{2e^\\gamma}{\\pi} \\cdot \\hbar\\Omega_0 \\cdot \\exp\\left(-\\frac{1}{N(0)\\cdot V_{\\text{pair}}}\\right)$$\n\n> 注：式中 $V_{\\text{pair}}$ 为配对势，区别于理论中的质数势 $V_0$。\n\n---\n\n## 声明\n\n本设计器的超导判定基于CQM超导理论框架，该理论**尚未经实验完全验证**。输出为**理论估算**，非实验确认。主要价值：理论可视化、教育工具、探索辅助。\n", "backlinks": [], "outlinks": ["D035", "D036", "D037", "D038", "D039", "D040", "D041"]}, {"id": "F037", "doc_id": "", "title": "CQM 超导材料设计器 - AI代理规则", "path": "06 超导/超导材料设计器/godot_project/AGENTS.md", "group": "06 超导", "layer": "", "type": "", "text": "# CQM 超导材料设计器 - AI代理规则\n\n## MCP连接规则 (强制)\n\n1. **禁止调用 `editor_reload_plugin`** — 会销毁WebSocket并使MCP会话过期\n2. **Godot必须带GUI启动** — headless模式不启动MCP服务器\n3. **服务器独立运行** — 用 `start_mcp.ps1` 启动, 编辑器重启不影响服务器\n4. **断联恢复** — 用 `reconnect_mcp.ps1` 或在编辑器godot-ai面板重连\n\n## 启动\n\n```powershell\n# 一键启动 (服务器 + 编辑器)\n.\\start_mcp.ps1\n\n# 仅启动服务器 (编辑器已开)\n.\\start_mcp.ps1 -NoEditor\n\n# 带热重载 (改Python代码自动重启)\n.\\start_mcp.ps1 -Reload\n\n# 断联重连\n.\\reconnect_mcp.ps1\n```\n\n## 验证\n\n```powershell\n# Headless验证脚本编译 (不启动MCP)\n& \"F:\\Program Files\\Godot\\Godot_v4.6.2-stable_win64.exe\" --headless --editor --quit --path \"D:\\WorkSpace\\物理\\CQMFormal\\06 超导\\超导材料设计器\\godot_project\"\n```", "backlinks": [], "outlinks": []}, {"id": "F038", "doc_id": "", "title": "Godot AI", "path": "06 超导/超导材料设计器/godot_project/addons/godot_ai/README.md", "group": "06 超导", "layer": "", "type": "", "text": "# Godot AI\n\nConnect AI assistants to a live Godot editor via the [Model Context Protocol](https://modelcontextprotocol.io/introduction) (MCP).\n\nGodot AI bridges Claude Code, Codex, Antigravity, and other MCP clients with your editor — inspect scenes, create nodes, modify properties, run tests, search project files, and more, all from a prompt.\n\n## Quick Start\n\n1. Copy `addons/godot_ai/` into your project's `addons/` folder\n2. Enable the plugin: **Project > Project Settings > Plugins > Godot AI**\n3. Pick your MCP client in the **Godot AI** dock and press **Configure**\n\nThe plugin auto-starts the MCP server and connects over WebSocket. No manual configuration required.\n\n## Requirements\n\n- Godot 4.5+ (4.7+ recommended)\n- [uv](https://docs.astral.sh/uv/) (used to install the Python server)\n  \u003cdetails>\n  \u003csummary>Install uv\u003c/summary>\n\n  **macOS / Linux:**\n  ```bash\n  curl -LsSf https://astral.sh/uv/install.sh | sh\n  ```\n\n  **Windows (PowerShell):**\n  ```powershell\n  powershell -ExecutionPolicy ByPass -c \"irm https://astral.sh/uv/install.ps1 | iex\"\n  ```\n\n  **Homebrew (macOS / Linux):**\n  ```bash\n  brew install uv\n  ```\n\n  **pipx:**\n  ```bash\n  pipx install uv\n  ```\n\n  See the [uv install docs](https://docs.astral.sh/uv/getting-started/installation/) for more options.\n\n  \u003c/details>\n- An MCP client ([Claude Code](https://docs.anthropic.com/en/docs/claude-code) | [Codex](https://openai.com/index/codex/) | [Antigravity](https://www.antigravity.dev/))\n\n## Documentation\n\nFull documentation, contributing guide, and source code: [github.com/hi-godot/godot-ai](https://github.com/hi-godot/godot-ai)\n\n## License\n\n[MIT](../../../06 超导/超导材料设计器/godot_project/addons/godot_ai/LICENSE)\n", "backlinks": [], "outlinks": []}, {"id": "D028", "doc_id": "D028", "title": "FG核心理论", "path": "07 精细引力（FG）/FG_核心理论.md", "group": "07 精细引力（FG）", "layer": 2, "type": "FG", "text": "# FG核心理论\n\n**作者**：ruster\n\n## 1. FG的定义\n\n精细引力FG是GR基态的非平庸激发态，是GR在深度层级上的非吸引力效应：不表现为几何吸引/测地线限制，而是**主丛上的因果限制/退相干场强度**，由底空间Regge角亏直接给出，不受 $G_N$ 限制。\n\n$$\\boxed{\\text{FG} = \\text{GR基态的非平庸激发} = \\text{主丛 } P(M,G) \\text{ 上的联络 } \\mathcal{A}_{\\text{FG}}}$$\n\nFG是一种**通用的引力理论**，不局限于任何特定物理现象。原子结构、分子键合、晶胞量子振荡等都是FG在不同物质组织层级的具体表现。\n\n### 1.1 本体论定位：前时空与两种引力（GR/FG）\n\n| 层级 | 存在论地位 | 数学结构 | 因果网络 |\n|------|-----------|---------|---------|\n| **前时空**（先于引力） | 物质处于前时空的状态 | 谱经GL(5)紧化投影与黎曼零点 $\\gamma_n$ 有关 | 物质自组织 |\n| **GR** | 广度前提（平滑展开） | 伪黎曼流形 | 平庸因果网络（基态时空） |\n| **FG** | 深度前提（层级激发） | 主丛 $P(M,G)$：联络 $\\mathcal{A}_{\\text{FG}}$ | 层级因果网络（激发态） |\n\n### 1.2 FG的核心特征\n\n- **一个联络生成两种曲率**：底空间Regge角亏 $\\delta_v$ + 伴丛曲率 $F=d\\mathcal{A}+\\mathcal{A}\\wedge\\mathcal{A}$\n- **不受 $G_N$ 限制**，量级 $O(1)$\n- **非吸引力**：不表现为几何吸引，而是因果条件/退相干场\n- **因果条件**：通过底空间曲率对物质状态施加相容性筛选\n- **退相干场**：将叠加态投影到与因果拓扑相容的子空间\n- **层级化**：FG在电子、元素、分子、晶胞等不同物质组织层级有不同实现\n\n## 2. FG的发生学\n\n### 2.1 从前时空到FG\n\n$$\\text{前时空（基态 } GL(5)/SU(5) \\text{ 谱结构活跃）} \\xrightarrow{\\text{退相干}} \\text{GR（谱结构锁定为经典时空）} \\xrightarrow{\\text{FG 激活}} \\text{FG（子结构重新活跃）}$$\n\n- **前时空**：基态谱空间 = 紧化算符 $\\hat{\\mathcal{S}}_0$ 作用下的GL(5)自守谱与SU(5)物理谱\n- **GR**：基底性同步前提，退相干冻结所有前时空自由度为经典时空\n- **FG**：GR基态的非平庸激发，角亏 $\\delta_v > 0$ **激活**被封存的前时空结构\n\n### 2.2 FG的层级发生学\n\n$$\\text{前中子缺陷 } D(\\delta) \\;\\to\\; \\text{底空间角亏} \\;\\to\\; \\text{电子FG} \\;\\to\\; \\text{元素FG} \\;\\to\\; \\text{分子FG} \\;\\to\\; \\text{晶胞FG}$$\n\n- 电子FG先于元素FG形成：$SU(5)$经重组实现时底空间已携带角亏\n- 每层FG是下层FG在更高物质组织层级的延展\n\n## 3. FG的核心问题：底空间+条件→同步方程→本征群→耦合常数\n\n### 3.0 核心逻辑\n\nFG的核心问题之一是：**给定底空间（Regge剖分）+条件（算符+对称性），求解同步方程的自守形式，本征群 $R_k$（重组产物）对应的耦合常数就是由涨落耦合常数指定的。**\n\n$$\\boxed{\\underbrace{M_\\ell}_{\\text{底空间}} + \\underbrace{\\hat{\\mathcal{S}}_k}_{\\text{作用量算符（同步算符，紧化算符的层级实现）}} + \\underbrace{G_k}_{\\text{对称性}} \\;\\longrightarrow\\; \\underbrace{\\Psi_k}_{\\text{自守形式}} \\;\\longrightarrow\\; \\text{耦合常数（由涨落指定）}}$$\n\n**底空间不可省略**：同步算符 $\\hat{\\mathcal{S}}_k$ 必须作用在底空间上的函数空间（自守形式是底空间上的函数/截面），对称性条件 $f(\\gamma x)=\\chi(\\gamma)f(x)$ 依赖群在底空间上的作用，底空间几何/拓扑**条件**作用量算符的谱和自守形式空间（非唯一决定）。正确顺序：$\\text{底空间} + \\text{作用量算符} + \\text{对称性} \\longrightarrow \\text{自守形式}$。\n\n**GL(n) 由重组产物的基本表示严格确定（发生学顺序强制）**：$GL(n)$ 的 $n$ 不由底空间几何读出，而由重组产物 $R$（紧致李群，公理 1+2 保证）的基本表示严格确定。给定重组产物 $R$，取其在重组框架中的基本表示 $\\rho_{\\text{fund}}: R \\to GL(V_{\\text{fund}})$，则 $n = \\dim V_{\\text{fund}}$，$GL(V_{\\text{fund}}) \\cong GL(n,\\mathbb{C})$。$SU(5)$ 经重组实现 $\\Rightarrow U(1)\\times SU(2)\\times SU(3)$，各因子（连同基态 $SU(5)$）通过基本表示给出各自的自守框架：基态 $SU(5) \\xrightarrow{\\rho_{\\text{fund}}} GL(\\mathbb{C}^5) \\cong GL(5)$、$SU(3) \\xrightarrow{\\rho_{\\text{fund}}} GL(\\mathbb{C}^3) \\cong GL(3)$、$SU(2) \\xrightarrow{\\rho_{\\text{fund}}} GL(\\mathbb{C}^2) \\cong GL(2)$、$U(1) \\xrightarrow{\\rho_{\\text{fund}}} GL(\\mathbb{C}) \\cong GL(1)$——$n$ 由表示空间 $V_{\\text{fund}}$ 的维度唯一指定，与基底选取无关。$SU(5)$ 本身由“含标准模型的最小单群”锚定：$\\operatorname{rank}\\,SU(5)=4=\\operatorname{rank}\\big(U(1)\\times SU(2)\\times SU(3)\\big)$（现象学输入/公理），$S_5=\\mathrm{Weyl}(A_4)$ 只作为与四维 Regge 几何自洽的交叉印证，不作为推导。标准数学构造中 $GL(n)$ 与 $\\Gamma$ 是输入、底空间是商空间 $\\Gamma\\backslash GL(n,\\mathbb{R})/K$；CQM 从动力学反推：先定群（重组产物 $R$），再通过基本表示定 $n$，再定底空间条件。底空间（Regge 晶胞）不在这一层决定 $n$，只在各 $GL(n)$ 框架内给定具体谱（角亏 $\\delta_v$、壳层、耦合常数，非唯一决定）。物理主丛不能反向指定 $GL(n)$：主丛结构群（紧群）是紧化投影的输出，以输出指定输入构成循环论证；主丛与伴丛的全部作用在紧化之后的物理层，对算术层只有后验校验资格。在几何朗兰兹视角下，自守理论的底空间本就是丛模空间 $\\mathrm{Bun}_G$——骨架与丛数据在算术层是同一对象的两个侧面。每个壳层的本征群 $R_k$ 是重组产物。若 $R_k$ 含 $SU(2)$ 因子，则 $SU(2)$ 的基本表示 $V=\\mathbb{C}^2$ 给出 $GL(2)$，$s/p/d/f$ 四壳层的区分不在 $GL(n)$ 的 $n$ 上，而在同步算符的不同本征值 $n_k = C_k$（Casimir）或 $GL(5)$ 整体表示中的不同 $K$-type（角动量 $l$ 作为 $SO(5)$ 的表示标签）。壳层结构 $l_k = k-1$ 由 SU(5) 简单根的 Dynkin 图深度严格推导。反证（为何不能由底空间指定 $n$）：(a) **Katz–Sarnak 普遍性**——一族 $GL(n)$ 的 L 函数在高密度极限下，零点统计服从紧经典群（酉/辛/正交）的随机矩阵系综，主情形为 GUE（如 $GL(1)$ 的 $\\zeta$），特定对称型退化为 GOE/GSE；零点统计由对称类型与 $GL(n)$ 决定，不由 L 函数的具体算术实现（CQM 中即底空间具体结构）决定——若由底空间指定，统计应随底空间漂移，而非稳定落在同一系综。(b) **底空间锁 $n$ 使其在 $n$ 层无用且丧失丰富度**——若底空间唯一锁定某个 $n$，则“底空间指定 $n$”退化（$n$ 恒为常数、无区分度），而 $n$ 本有的丰富度来自群重组实现层级 $SU(5)\\Rightarrow U(1)\\times SU(2)\\times SU(3)$，与底空间无关。\n\n**作用量算符 = 同步算符**：同步算符 $\\hat{\\mathcal{S}}_k$ 的本征值 $n_k$ 通过玻尔-索末菲量子化 $\\oint p_u \\, du = 2\\pi n_k$ 给出量子化作用量积分 $J = \\oint p_u \\, du$，即 $n_k = J/(2\\pi)$。本征值就是量子化作用量，因此同步算符即作用量算符。\n\n> **定位注**：作用量算符（同步算符）在**功能角色**上对应模形式理论中 Hecke 算符的本征筛选——两者都是“从底空间函数空间中挑选本征形式”的算符——但**数学对象不同**：Hecke 算符 $T_p$ 是算术算符（双陪集定义，本征值 $a_p(f)$ 编码 L 函数系数），同步算符是谱/动力学算符（玻尔-索末菲量子化，本征值 = 量子化作用量 $J/2\\pi$）。二者是功能对应，非数学等同；自守形式的唯一确定仍需权（K-类型）、Hecke 本征特征等额外数据（Hecke 本征时由强多重性一定理保证唯一，见 `01 核心理论/CQM_核心_朗兰兹分层共振与相变量子.md` §0.5）。\n\n条件链：\n\n$$\\text{Regge剖分} + [\\hat{X},\\hat{P}]=i\\hbar \\xrightarrow{\\text{离散协变导数}} \\text{声子} \\xrightarrow{\\text{几何非线性}} \\hat{\\delta}_v \\xrightarrow{\\text{FG因果}} v_\\tau \\xrightarrow{\\text{定义}} p_u \\xrightarrow{[\\hat{u},\\hat{p}_u]=i} \\text{紧化U(1)} \\xrightarrow{\\text{玻尔-索末菲}} n_k$$\n\n本征群与耦级的**方向性分工**：本征群 $R_k$ 是重组产物，耦级 $n_k$ 由群的 Casimir 格给出。壳层结构（$s/p/d/f$）$l_k = k-1$ 由 SU(5) 简单根的 Dynkin 图深度严格推导。链条方向是 $R_k \\to n_k$。\n\n### 3.1 条件的来源\n\n条件不是外加的，而是从**Regge剖分**和**位置-动量对易关系** $[\\hat{X},\\hat{P}]=i\\hbar$ 第一性严格导出：\n\n- **Regge剖分条件**：$\\mathcal{R}=(V,E,F,\\{\\bar{L}_{ij}\\})$，经典角亏 $\\bar{\\delta}_v = 2\\pi - \\sum_{\\Delta\\ni v}\\bar{\\theta}_v(\\Delta)$ 由经典边长通过余弦定律严格确定。质子（4-单纯形）：$\\bar{\\delta}_v=0$（理想平坦）；中子 $D(\\delta)$：$\\bar{\\delta}_v\\neq 0$（经典背景曲率）\n- **位置-动量代数**：每个顶点 $v$ 上 $[\\hat{X}_v,\\hat{P}_v]=i\\hbar$（预量子化线丛的联络曲率）\n- **声子代数**：简正模式对角化 $\\hat{Q}_k = \\sum_v v_k(v)\\hat{X}_v$ 保持对易子 $[\\hat{Q}_k,\\hat{\\Pi}_{k'}]=i\\hbar\\delta_{kk'}$，声子来自 $[\\hat{X},\\hat{P}]=i\\hbar$，**不是额外假设**\n- **曲率涨落算符（严格推导）**：位置涨落平方 + Regge几何非线性 → $\\hat{\\delta}_v^{(1)} = \\sum_k \\frac{\\hbar\\omega_k}{E_{\\text{bind}}}|v_k(v)|^2(\\hat{a}_k^\\dagger\\hat{a}_k + \\frac{1}{2})$，**不是唯象假设**\n- **总曲率 = 经典背景 + 量子涨落**：$\\hat{\\delta}_v = \\bar{\\delta}_v + \\hat{\\delta}_v^{(1)}$，$\\bar{\\delta}_v$ 是c-数（经典背景曲率），$\\hat{\\delta}_v^{(1)}$ 是算符（量子涨落）\n- **FG因果条件（假设）**：固有时流速 $v_\\tau^{(k)} = \\sqrt{1-\\beta\\delta_v^{(k)}}$，角亏≠几何吸引，而是固有时流速的因果条件。这是FG核心机制，标注为**假设**。其数学结构是引力时间膨胀的Regge版本：广义相对论牛顿极限下 $g_{00}=1+2\\phi/c^2$，固有时流速 $d\\tau/dt=\\sqrt{g_{00}}$；Regge剖分中角亏是离散曲率（细剖分极限下 $\\delta_h/V_h \\to R$），对应 $\\beta\\delta_v \\leftrightarrow -2\\phi/c^2$。由此 $\\beta$ 的物理身份是角亏到牛顿引力势的比例常数，不是拟合参数，原则上由Regge剖分的牛顿极限定值（定值计算尚需完善）。**耦合动量 $p_u = v_\\tau/☯$（相变量子 $☯$）。不确定性关系 $\\Delta u \\cdot \\Delta v_\\tau \\geq ☯/2$，$☯$ 为相变量子。注意：勿将相变量子 $☯$ 与 §3.2 耦级定义中的 Casimir 本征值 $C_k = l_k(l_k+1)+3/4$ 混同。**\n\n### 3.2 同步方程\n\n$$\\hat{\\mathcal{S}}_k \\Psi_k(u) = n_k \\Psi_k(u)$$\n\n同步算符由物理条件严格确定：\n\n$$\\hat{\\mathcal{S}}_k = \\frac{L_u}{2\\pi ☯}\\sqrt{1-\\beta\\hat{\\delta}_v^{(k)}}$$\n\n- $☯ = \\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1} \\approx 0.02309570897$（Riemann xi函数）\n- $L_u = \\ln\\Lambda$（耦合常数空间紧化U(1)周长）\n- 耦级 $n_k \\equiv C_k = l_k(l_k+1) + 3/4$（定义：同步成本=对称性强度）\n- 等价关系 $\\left\\langle \\frac{L_u}{2\\pi ☯}\\sqrt{1-\\beta\\hat{\\delta}_v^{(k)}} \\right\\rangle = C_k$（锁定声子占据数 $N_k$）\n- 本征态 $\\Psi_k(u) = \\frac{1}{\\sqrt{L_u}}e^{i\\frac{2\\pi n_k}{L_u}u}$\n\n### 3.3 本征群→耦合常数\n\n本征群 $R_k$ 是重组产物，壳层标签由 SU(5) Dynkin图深度给出：\n\n$$R_k \\text{（重组产物）}$$\n\n其中 $R_k$ 的具体群结构为 $SU(2)_k$（重组产物的实现），其自旋-轨道分解为 $SU(2)_{\\text{orb}}^{(l_k)} \\times SU(2)_{\\text{spin}}$：$SU(2)_{\\text{orb}}^{(l_k)}$ 为轨道角动量 $l_k$ 的 $SU(2)$ 表示，$SU(2)_{\\text{spin}}$ 为自旋 $1/2$ 表示。$l=0$ 时 $R_1 = SU(2)_{\\text{spin}} \\cong SU(2)$。\n\n- 壳层标签 $l_k = k-1$ 由 SU(5) 简单根的 Dynkin 图深度严格推导，不是输入参数\n- 耦级 $n_k = C_k$ 由群论定义（Casimir本征值），等价关系锁定 $N_k$——是同步方程的**输出**，不是输入参数\n- **CFT OPE**：同步本征态 $\\otimes$ 耦合本征态 $\\to$ 群本征态（共形固定点，Dirac条件=共形自举方程的CQM具体化）\n- 同步成本 $s_k = n_k + l$（径向同步成本+角向同步成本）\n\n## 4. 同步算符\n\n### 4.1 耦合常数算符 $\\hat{u}$\n\n$$\\boxed{\\hat{u} = \\ln \\hat{g}, \\quad [\\hat{u}, \\hat{p}_u] = i}$$\n\n- $\\hat{u}$：耦合常数对数算符，本征值 $u \\in [0, L_u)$\n- $\\hat{g} = e^{\\hat{u}}$：耦合常数算符，本征值 $g = e^u$\n- $\\Delta u \\cdot \\Delta p_u \\geq \\frac{1}{2}$\n\n> **定位注（定义域条件）**：海森堡代数 $[\\hat{u},\\hat{p}_u]=i$ 是一维的——$u=\\ln g$ 作为全局单坐标定义，当且仅当结构群是一维阿贝尔群（$S^1$ 及其商 $U(1)//\\mathbb{Z}_n$，注意 $U(1)//\\mathbb{Z}_n\\cong S^1$ 经覆盖映射 $z\\mapsto z^n$，成员间差别是表示内容：权 $q$ 表示当且仅当 $n\\mid q$ 时下降）。非阿贝尔群的对数是局部且多值的（Baker–Campbell–Hausdorff 级数），无法定义单一海森堡对。因此耦合常数算符的合法定义域是 $U(1)$ 电磁群（内部性+阿贝尔性双重强制：耦合常数乘在内部规范生成元上，且 $u$ 须为全局单坐标）；$SU(2)$、$SU(3)$ 因子的耦合不能直接量子化，只能经 Casimir 阶梯 $g_k=\\alpha^{-1}\\exp(-(n_k-n_1)/n_1)$ 从 $U(1)$ 锚导出。此不对称是海森堡代数一维性的必然结果，不是模型选择。\n\n### 4.2 双空间同步算符\n\n同步算符**同时**作用于核子空间和耦合常数空间：\n\n$$\\boxed{\\hat{\\mathcal{S}} = \\hat{\\mathcal{S}}_{\\text{nucleon}} \\otimes \\hat{\\mathbb{I}}_{U(1)} + \\hat{\\mathbb{I}}_{\\text{nucleon}} \\otimes \\hat{\\mathcal{S}}_{U(1)}(\\hat{u})}$$\n\n**核子部分**（由FG因果严格确定）：\n\n$$\\hat{\\mathcal{S}}_{\\text{nucleon}} = \\frac{L_u}{2\\pi ☯}\\sqrt{1-\\beta\\hat{\\delta}_v}$$\n\n其中曲率算符 $\\hat{\\delta}_v = \\bar{\\delta}_v + \\hat{\\delta}_v^{(1)}$ 严格来自 **Regge剖分条件** + **$[\\hat{X},\\hat{P}]=i\\hbar$**：经典背景曲率 + 位置涨落平方的量子期望 + Regge几何非线性，不是唯象假设。\n\n**耦合常数部分**：\n\n$$\\hat{\\mathcal{S}}_{U(1)}(\\hat{u}) = \\sum_p \\frac{\\ln p}{\\sqrt{p}}\\delta(\\hat{u} - \\ln p)$$\n\n质数势是**投影算符的叠加**，在耦合常数空间选择 $u = \\ln p$ 的离散点。\n\n### 4.3 同步算符的完整形式（含 Casimir）\n\n$$\\boxed{\\hat{\\mathcal{S}}_k^{\\text{(full)}} = \\frac{L_u}{2\\pi ☯}\\sqrt{1-\\beta\\hat{\\delta}_v^{(k)}} \\cdot \\hat{\\mathbb{I}}_{G_k} + \\hat{C}_2(G_k)}$$\n\n- 耦级项：U(1)紧化的同步成本（径向）\n- Casimir项：$G_k$ 内部对称的同步成本（角向）\n- 同步成本 $s_k = n_k + l$\n\n### 4.4 为什么同步算符比丛作用量更根本\n\n1. **同一性**：同步算符由物理条件严格确定；丛作用量是叠加态的热力学投影，丢失了谱结构信息\n2. **谱结构根基**：同步算符的本征值谱由紧化条件决定，这是数论-物理的深层联系\n3. **黎曼猜想的物理入口**：黎曼猜想等价于配对不变量 $\\mathfrak{c}_n=\\rho_n(1-\\rho_n)$ 为实，等价于物质同步稳定性\n4. **与前时空的统一**：FG同步算符 = 前时空紧化结构在GL(5)固定层级的再现\n5. **双空间作用**：$\\hat{u}$ 是探测场，核子声子态通过 $\\hat{\\delta}_v$ 调制耦合常数空间的“有效势”，$\\hat{u}$ 的本征值 $u=\\ln p$ 是耦合常数部分的共振点\n\n## 5. 群谱与朗兰兹纲领\n\n### 5.1 FG的完整数学对象：朗兰兹纲领的GL(n)各层\n\nFG的完整数学对象是**朗兰兹纲领的GL(n)各层+广义黎曼猜想（GRH）**。广义黎曼猜想（GRH）是GL(5)固定层级的实谱条件。\n\n**正确结构**：不是GL(1)+GL(4)+GL(5)直和，而是**单个GL(5)自守表示**。GL(1)和GL(4)是其**子结构**（中心特征和$K$-type），分别贡献主量子数 $n$ 和轨道角动量 $l$。GL(4)来自 $SO(5)\\subset SU(5)$ 的旋量表示 $\\mathbb{C}^4$（$\\dim V = 4$），非 $SU(4)$ 重组因子。\n\n物质自组织的基态同步是SU(5)（对应GL(5)自守谱），SU(5)重组实现后各因子层的GL(n)谱是重组后残留：\n\n$$\\text{GL}(5)\\ \\text{自守谱} \\xrightarrow{\\text{紧化投影（表示层转移）}} \\text{SU}(5)\\ \\text{表示空间} \\xRightarrow{\\text{重组实现}} U(1) \\times SU(2) \\times SU(3)$$\n\n> **定位注（算符作用层级）**：紧化投影是**表示层面**的转移——希尔伯特空间之间的谱投影 $\\hat{\\mathcal{S}}_0:\\mathcal{H}_{\\text{auto}}(\\mathrm{GL}(5))\\to\\mathcal{H}_{\\text{phys}}(SU(5))$，与朗兰兹函子性同型（函子性转移表示，不转移群本身）——不是群层面的态射。GL(5)（阿代尔约化群，非紧，含分裂中心）与SU(5)（紧实李群）处于不同范畴，不存在典范群同态；紧群SU(5)是投影的**靶表示空间**，物理表示由SU(5)不可约表示分类。同步算符在群层面不执行任何转换，这正是谱论三分法的深层原因：紧化投影谱 $\\subseteq\\{0,1\\}$ 不可能携带零点谱，零点谱由GL(5)固定层级谱算符 $\\hat{H}_{\\text{HP}}$ 承担。\n\n各GL(n)层对应不同的L函数和猜想：\n\n| 朗兰兹层 | L函数 | 猜想 | FG中的角色 | 物理对应 |\n|:---|:---|:---|:---|:---|\n| GL(1) | $\\zeta(s)$（黎曼zeta） | RH | — | 主量子数 $n$ |\n| GL(2) | $L(s, \\pi)$（模形式） | — | — | p波/d波对称性 |\n| GL(3) | $L(s, \\pi)$ | — | — | 色相互作用表示结构 |\n| GL(4) | $L(s, \\pi)$ | GRH(GL(4)) | $SO(5)$ 旋量表示（GL(5)的$K$-type） | 轨道角动量 $l$、壳层饱和数 |\n| GL(5) | $L(s, \\pi)$ | GRH(GL(5)) | 基态同步（单层自守表示） | 物质自组织、$SU(5)$、Coxeter数 |\n\n### 5.1.1 SU(5) 重组实现 ⇒ 规范群 + 壳层本征群 → α\n\n> **GL(5)大统一框架**：$GL(5)$ 是真正的宇宙大统一群（约化李群，非紧致），有两个实现：$GL(5,\\mathbb{C})$（含 $SU(5)$）和 $GL(5,\\mathbb{R})$（含洛伦兹群 $SO(1,3)$）。**$GL(5)$ 本身是重组实现的，不是破缺的**——就物理相变而言：破缺的必须是非规范对称群（或更一般地，非规范对称性），但非规范对称群不一定破缺；重组实现的既可以是规范对称群，也可以是非规范对称群；而规范对称群相变必然是重组，而非破缺。$GL(5,\\mathbb{R})$ 的时空对称性若纳入规范群则必须破缺（产生负动能，需破缺或冻结）。$GL(5)$ 本身是物质更前面的自组织的产物。规范群必须紧致，故物理上可行的大统一规范群候选是 $SU(5) \\subset GL(5,\\mathbb{C})$。\n\n> **Elitzur定理文献**：规范对称性不破缺（重组实现）的立场有严格的格点规范理论支持：Elitzur定理（Elitzur 1975, Phys. Rev. D 12, 3978）证明局部规范对称性在规范固定前不可自发破缺；Fradkin–Shenker 1979（Phys. Rev. D 19, 3682）进一步表明在库仑规范下序参量的期望值恒为零。CQM中规范对称群相变必然是重组实现而非破缺，与此一致。\n\nSU(5)是物质自组织的基态同步群，其李代数$\\mathfrak{su}(5)$的根系为$A_4$型。SU(5)重组实现产生两个独立效应：\n\n#### 效应一：规范重组（不属于本征群效应）\n\n$$\\boxed{\\text{SU}(5) \\;\\xRightarrow{\\text{规范重组}}\\; U(1) \\times SU(2) \\times SU(3)}$$\n\n规范重组给出**三个空间群直积**（电磁$U(1)$、弱$SU(2)$、强$SU(3)$），**时间内禀没有群**。三者均为**紧致李群**：\n\n| 规范群 | 紧致性证明 | 耦合常数 | 物理对应 |\n|:---:|:---|:---:|:---|\n| $U(1)$ | $\\cong S^1$，紧致Abel李群 | $g_{U(1)}=\\alpha^{-1}$ | **精细结构常数 $\\alpha$**（电磁） |\n| $SU(2)$ | $\\cong S^3$，紧致非Abel李群 | $g_{SU(2)}$ | 弱相互作用 |\n| $SU(3)$ | $\\{A \\in M_3(\\mathbb{C}) \\mid A^\\dagger A = I, \\det A = 1\\}$，紧致非Abel李群 | $g_{SU(3)}$ | 强相互作用 |\n\n规范重组给出3个空间群，总秩 $= 1+1+2 = 4 = \\text{rank}(SU(5))$。**此效应与本征群无关**。\n\n#### 效应二：壳层结构（$l_k = k-1$ 由 SU(5) Dynkin图深度严格推导）\n\n壳层结构（$s/p/d/f$）$l_k = k-1$ 由 SU(5) 简单根的 Dynkin 图深度严格推导。每个壳层的本征群 $R_k$ 是重组产物：\n\n| $k$ | 本征群 $R_k$ | 紧致性 | Casimir $C_k$ | 壳层 | 容量 |\n|:---:|:---:|:---:|:---:|:---:|:---:|\n| 1 | $R_1$ | 紧致（公理1+2） | $3/4$ | s | 2 |\n| 2 | $R_2$ | 紧致（公理1+2） | $11/4$ | p | 6 |\n| 3 | $R_3$ | 紧致（公理1+2） | $27/4$ | d | 10 |\n| 4 | $R_4$ | 紧致（公理1+2） | $51/4$ | f | 14 |\n\n**四个本征群 $R_k$ 全部是紧致李群**（`06 超导/CQM_超导_FG层级同步算符体系.md` 公理 1+2 保证：$G$、$H$、$R$ 三者均为紧致李群）。这是CFT框架的数学前提：Kac-Moody代数 $\\widehat{\\mathfrak{su}(2)}_k$ 由紧致李代数 $\\mathfrak{su}(2)$ 的中心扩展构造，Verlinde公式、OPE系数、共形块均要求紧致李群结构。\n\n> **壳层标签严格推导**：壳层标签 $l_k = k-1$ 由 SU(5) 简单根的 Dynkin 图深度严格推导，使用 SU(5) 秩=4、简单根结构、Coxeter数 $h=5$ 和 Kostant 定理。\n\n#### 两个效应的关系\n\n| | 规范重组（效应一） | 壳层结构（效应二） |\n|:---|:---|:---|\n| **是否本征群** | **否** | **是**（$R_k$） |\n| **来源** | $SU(5) \\Rightarrow U(1) \\times SU(2) \\times SU(3)$ | SU(5) Dynkin图深度（$l_k = k-1$） |\n| **群数** | 3个空间群 | 4个壳层本征群 $R_k$ |\n| **紧致性** | 全紧致 | 全紧致（公理1+2） |\n| **时间群** | **无**（时间内禀没有群） | **无** |\n| **物理意义** | 规范相互作用（电磁/弱/强） | 角动量壳层（s/p/d/f） |\n| **耦合常数** | $g_{U(1)}, g_{SU(2)}, g_{SU(3)}$ | $g_k = \\alpha^{-1}\\exp(-(n_k-n_1)/n_1)$ |\n| **给出$\\alpha$** | $g_{U(1)} = \\alpha^{-1}$ | $g_1 = \\alpha^{-1}$（s壳层） |\n\n**关键**：精细结构常数 $\\alpha$ 来自 SU(5)规范重组后 $U(1)$ 电磁群的耦合常数 $g_{U(1)}=\\alpha^{-1}$：\n\n$$\\boxed{\\alpha = f(g_{U(1)})}$$\n\n精细结构常数是**SU(5)规范重组的输出**——$U(1)$电磁群耦合常数 $\\alpha^{-1}$。精细结构常数是GL(5)整体的反映。\n\n### 5.2 同步算符的完整谱结构\n\n同步算符 $\\hat{\\mathcal{S}}_k$ 作用在底空间 $M_\\ell$（Regge剖分）的伴丛截面空间 $\\Gamma(\\text{ad}(P))$ 上，由物理条件严格确定，本征群 $R_k$ 是重组产物：\n\n$$\\boxed{\\hat{\\mathcal{S}}_{\\text{atom}} = \\bigoplus_{k=1}^{4} \\hat{\\mathcal{S}}_k^{\\text{(full)}}}$$\n\n每个本征群 $R_k$ 给出该层的同步成本：\n- **耦级 $n_k$**：$n_k \\equiv C_k = l_k(l_k+1) + 3/4$（定义：同步成本=Casimir=对称性强度，径向）\n- **角动量 $l$**：壳层标签 $l_k = k-1$（SU(5) Dynkin图深度）\n- **同步成本**：$s_k = n_k + l$\n\n> **定位注（格条件而非唯一值）**：紧致李群内禀确定的不是某个唯一的作用量数值，而是作用量的**格结构**（Casimir 格 $\\{l(l+1)+3/4\\}$，量子化轨道方法中即权格整性条件 $\\langle\\lambda,\\alpha^\\vee\\rangle\\in\\mathbb{Z}$）；具体取值依赖归一化约定与移位选择，格的选择依赖群的全局形式（$SU(2)$ 允许半整数权，$SO(3)$ 仅整数权；同李代数的连通群有相同伴随轨道但可量子化轨道集不同）。玻尔-索末菲量子化 $\\oint p_u\\,du=2\\pi n_k$ 正是该格条件的体现；$l\\le h-2=3$ 的有限截断来自底空间 $A_4$ Coxeter 数据而非群内禀——群给出无穷格，底空间给出截断，二者分工明确。\n\n### 5.3 广义黎曼猜想的物理等价\n\n$$\\boxed{\\text{完整同步谱} \\iff \\text{RH} \\land \\text{GRH(GL(4))} \\land \\text{GRH(GL(5))}}$$\n\n- **黎曼猜想（$\\zeta$/GL(1) 侧的实谱条件）**：同步稳定性 → 主量子数唯一（GL(5)中心特征）\n- **GRH(GL(4))**：$SO(5)$ 旋量表示层同步稳定性 → 壳层结构唯一（GL(5)的$K$-type）\n- **GRH(GL(5))**：基态同步稳定性 → 物质自组织唯一（单层自守表示）\n- **FG完整理论需要所有层GRH同时成立**（数学前提，未证明）\n\n### 5.4 群谱决定对称性\n\n本征群 $R_k$ 决定物质分布的对称性：\n- **耦级 $n_k$**：由条件联立求解 → U(1)紧化同步成本（径向）\n- **本征群 $R_k$**：重组产物，壳层结构 $l_k = k-1$ 由 SU(5) Dynkin图深度严格推导\n- **耦合常数 $g_k$**：同步方程输出 → Casimir本征值 $C_k = n_k$ → 角动量 $l_k$ → 电子容量 $N_k^{\\max} = 2(2l_k+1) = 2, 6, 10, 14$\n- **同步成本**：$s_k = n_k + l_k$ → Aufbau填充顺序\n- 对称性决定物质分布（电子组态、分子构型、晶格结构）\n\n> **定位注（耦合层级的形式）**：$g_k=\\alpha^{-1}\\exp(-(n_k-n_1)/n_1)$ 是单圈重整化群跑动方程 $\\frac{dg}{d\\ln\\mu}=-\\gamma g$ 的解 $g(\\mu)=g(\\mu_0)\\exp(-\\gamma\\ln(\\mu/\\mu_0))$ 在同步层级 $k$ 作标度时的形式，$1/n_1=4/3$ 扮演反常量纲角色。这与框架的重整化群等价（Berry–Keating对应，见 `01 核心理论/CQM_核心_集成理论.md` §5.3）一致；$4/3$ 由此成为可检验的框架输出，不是拟合值。\n\n### 5.5 GUE统计（各层通用）\n\nMontgomery–Odlyzko：各GL(n)层L函数零点对关联 = GUE sine-kernel\n\n$$R_2(s) = 1 - \\left(\\frac{\\sin(\\pi s)}{\\pi s}\\right)^2$$\n\n各层零点 = 量子混沌能级（贝里图景：周期轨道 = 素数）。\n\n## 6. FG的层级化\n\n### 6.1 四层FG\n\nFG在不同物质组织层级有不同实现，每层由纤维丛四元组 $(M_\\ell, P_\\ell, \\mathcal{A}_\\ell, \\hat{\\mathcal{S}}_\\ell)$ 刻画：\n\n| 层级 | 底空间 $M_\\ell$ | 结构群 $G_\\ell$ | 同步算符 | 谱的可观测 |\n|:---|:---|:---|:---|:---|\n| 电子FG | 前核子底空间 | （待定） | $V_0$ | 原子能级 $E_n = -R/n^2$ |\n| 元素FG | 质子+中子分布 | $U(1) \\times SO(2) \\times SU(4)$ | $V_0 + L_{\\text{orbital}}$ | 壳层结构、Madelung规则 |\n| 分子FG | 原子分布（键网络） | 分子点群 | $V_0 + L_{\\text{mol}}$ | 分子轨道谱、键角、内禀角亏 |\n| 晶胞FG | 原子/分子在晶胞分布 | 空间群 | $V_0 + V_{\\text{cell}}$ | 晶胞量子振荡谱 |\n\n### 6.2 层级嵌套\n\n$$P_{\\text{el}} \\hookrightarrow P_{\\text{element}} \\hookrightarrow P_{\\text{mol}} \\hookrightarrow P_{\\text{cell}}$$\n\n每层底空间是上层的纤维。\n\n### 6.3 谱传递规则\n\n$$\\text{上层同步算符谱} \\;\\longrightarrow\\; \\text{下层嘉当矩阵/几何的输入} \\;\\longrightarrow\\; \\text{下层同步算符}$$\n\n上层FG的谱结构决定下层FG的输入，形成完整的第一性预测链。\n\n## 7. 物理常数\n\n| 常数 | 值 | 来源 |\n|:---|:---|:---|\n| $\\beta$ | $\\frac{1}{4\\pi}\\ln\\frac{L}{a}$ | 系统尺寸严格确定 |\n| $☯$ | $\\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1} \\approx 0.02309570897$ | Riemann xi函数 |\n| $L_u$ | $\\ln\\Lambda$ | 耦合常数空间紧化U(1)周长 |\n\n## 8. 文献锚定\n\n| 文献 | 年份 | arXiv | 贡献 |\n|:---|:---|:---|:---|\n| Hilbert–Pólya | 1914+ | — | 自伴算符 H，本征值=黎曼零点虚部 |\n| Montgomery | 1973 | — | 对关联猜想=GUE |\n| Bost–Connes | 1995 | arXiv:1012.4665 | Z(β)=ζ(β)量子统计系统 |\n| Berry–Keating | 1999 | — | H=xp算符，semiclassical |\n| Connes | 2019 | arXiv:1910.14368 | 缩放哈密顿量，谱实现 |\n| Ng | 2006 | arXiv:math/0603275 | Virasoro c=1/2谱实现 |\n| Srednicki | 2011 | arXiv:1104.1850 | 局部RH谱证明 |\n| Sierra | 2008 | arXiv:0712.0705 | xp量子化+边界波函数 |\n| Benjamin–Chang | 2022 | arXiv:2208.02259 | CFT模共形自举 |\n\n## 9. 相关文档\n\n- [FG纤维丛理论](#/doc/D029)：纤维丛语言的详细理论框架\n\n", "backlinks": ["D001", "D005", "D007", "D008", "D012", "D013", "D021", "D023", "D030"], "outlinks": ["D005", "D008", "D029", "D032"]}, {"id": "D029", "doc_id": "D029", "title": "FG纤维丛理论", "path": "07 精细引力（FG）/FG_纤维丛理论.md", "group": "07 精细引力（FG）", "layer": 2, "type": "FG", "text": "# FG纤维丛理论\n\n**作者**：ruster\n\n## 1. FG的本体论定位\n\n精细引力 FG 是**前时空**与经典引力 GR 之间的关键中介：\n\n| 层级 | 存在论地位 | 数学结构 |\n|------|-----------|---------|\n| **前时空** | 物质处于前时空的状态 | 谱经GL(5)紧化投影与黎曼零点 $\\gamma_n$ 有关 |\n| **GR** | 广度前提（平滑展开） | 伪黎曼流形 |\n| **FG** | 深度前提（层级激发） | FG 底空间上的主丛 $P(M,G)$ |\n\n$$\\boxed{\\text{FG} \\neq \\text{GR}}$$\n\n- GR是时空曲率，受 $G_N$ 限制，量级 $\\sim 10^{-43}$（$G_N$ 理论值与偏差属构造后验数字校验，待独立复现，见 `03 引力与退相干/CQM_引力_GN可能公式.md`）\n- FG是一个联络生成两种曲率——底空间Regge角亏 $\\delta_v$ + 伴丛曲率 $F=d\\mathcal{A}+\\mathcal{A}\\wedge\\mathcal{A}$——**不受 $G_N$ 限制**，量级 $O(1)$\n- FG是GR基态的非平庸激发态，直接由底空间Regge角亏给出\n\n## 1.5 纤维丛双框架：运动学（容器）与动力学（重组）的相互关联\n\n同一套纤维丛数学，两种物理诠释相互关联。**CQM以动力学（重组）框架为主视角**，运动学（容器）框架是其低能有效投影——传统物理把丛当作先验舞台，CQM把丛当作物质自组织的涌现产物，二者通过追问起源与低能冻结相互转化（§1.5.5）。\n\n### 1.5.1 总纲\n\n| | **纤维丛运动学**（容器框架，传统物理） | **FG纤维丛动力学**（重组框架，CQM） |\n|---|---|---|\n| **哲学** | 丛是**先验舞台**，物理在其上展开 | 丛是**涌现产物**，物理即重组过程 |\n| **底空间** | 先验容器（给定背景） | 物质自组织的空间形态本身（§1） |\n| **核心方程** | $D_\\mu \\psi = (\\partial_\\mu + A_\\mu)\\psi$ | $(p\\cdot h,\\, f) \\sim (p,\\, h\\cdot f)$ |\n| **主丛角色** | 固定背景（规范场 $A_\\mu$ 的载体） | 自由相（重组实现前的高对称态） |\n| **伴丛角色** | 物质取值空间（向量空间 $V$） | 重组产物（紧致李群 $R$） |\n| **定义位置** | **外部**：微分方程强加于截面 | **内部**：等价关系定义空间本身 |\n\n### 1.5.2 纤维丛运动学（容器框架，传统物理）\n\n$$\\begin{aligned}\n&\\text{主丛 } P(M,G) &&\\text{—— 舞台骨架} \\\\\n&\\text{伴丛 } E = P \\times_\\rho V &&\\text{—— 演员化妆间} \\\\\n&\\text{截面 } \\psi \\in \\Gamma(E) &&\\text{—— 演员（物质场）} \\\\\n&\\text{联络 } A \\in \\Omega^1(P,\\mathfrak{g}) &&\\text{—— 舞台灯光控制} \\\\\n&\\text{曲率 } F = dA + A\\wedge A &&\\text{—— 灯光效果}\n\\end{aligned}$$\n\n动力学方程（外部强加）：\n- **Dirac**：$(i\\gamma^\\mu D_\\mu - m)\\psi = 0$\n- **Yang-Mills**：$D^\\mu F_{\\mu\\nu} = J_\\nu$\n- **Bianchi**：$DF = 0$（舞台几何相容性）\n\n特征：\n- $G$ 固定不变，$H$ 不出现或作为外部破缺参数\n- 物质场是**向量** $\\psi: M \\to V$\n- 协变导数是**耦合装置**：$D_\\mu = \\partial_\\mu + \\rho(A_\\mu)$\n\n**CQM对容器框架的批判**：容器框架把底空间 $M$ 当作先验容器，与CQM核心主张“底空间是物质自组织的空间形态本身”矛盾。传统物理的规范场论、标准模型均采用容器框架——丛是给定的，物理在其上展开。CQM的发生学顺序（物质先在→自组织→底空间涌现→丛涌现）排除了先验容器。\n\n### 1.5.3 纤维丛动力学（重组框架，CQM）\n\n$$\\begin{aligned}\n&\\text{主丛 } P(M,G) &&\\text{—— 自由相（母群）} \\\\\n&\\text{子群 } H \\triangleleft G &&\\text{—— 紧致李群，闭正规子群（重组触发）} \\\\\n&\\text{本征群 } R &&\\text{—— 紧致李群（重组产物）} \\\\\n&\\text{重组伴丛 } E_{R} = P \\times_H R &&\\text{—— 涌现产物} \\\\\n&\\text{截面 } \\langle\\phi\\rangle \\in \\Gamma(E_{R}) &&\\text{—— 序参量/真空选择}\n\\end{aligned}$$\n\n等价关系（内部定义）：\n\n$$(p\\cdot h,\\, f) \\sim (p,\\, h\\cdot f),\\quad \\forall h \\in H$$\n\n**$R$ 是重组产物**：给定母群 $G$ 和子群 $H$（$H \\triangleleft G$，$G$、$H$ 均为紧致李群），重组产物 $R$ 是紧致李群。物理实例：磁通量子化（$U(1) \\xRightarrow{\\mathbb{Z}_n} U(1)$）、整数自旋表示（$SU(2) \\xRightarrow{\\mathbb{Z}_2} SO(3)$）、电荷量子化（$U(1)\\times SU(N) \\xRightarrow{\\mathbb{Z}_N} U(N)$）。\n\n### 1.5.4 核心对比\n\n| 对比项 | 运动学（容器，传统物理） | 动力学（重组，CQM） |\n|--------|--------------|--------------|\n| **主丛群 $G$** | 规范对称性（背景） | 母群（自由相，重组实现前） |\n| **子群 $H$** | 不出现或外部参数 | 内部子群，定义等价关系 |\n| **纤维 $F$** | 向量空间 $V$（$\\mathbb{C}, \\mathbb{C}^n, \\mathfrak{g}$） | 紧致李群 $R$（重组产物） |\n| **伴丛** | $E = P \\times_\\rho V$ | $E_{R} = P \\times_H R$ |\n| **截面** | 物质场 $\\psi$（向量值） | 序参量 $\\langle\\phi\\rangle$（陪集值） |\n| **联络作用** | 协变导数 $D_\\mu$ 转动纤维 | 重组映射折叠纤维 |\n| **曲率/场强** | 物理可观测量（能量、力） | 拓扑障碍（示性类、单极子） |\n| **破缺** | 希格斯势外部强加 VEV | 自由能极小值自发选择 $H$ |\n| **Goldstone 模** | 在 $G/H$ 上振动的场 | 重组伴丛截面的切向涨落 |\n| **质量生成** | Higgs 机制（外部耦合） | 重组后 $R$ 方向的联络分量获得质量 |\n\n### 1.5.5 转化关系：容器 ↔ 重组\n\n两种框架是**同一纤维丛对象在不同能标/相下的两种视角**：\n\n**容器 → 重组（追问起源）**：从线丛 $L_2$（容器）追溯到 $U(1) \\xRightarrow{\\mathbb{Z}_2} U(1)$（重组）——库珀对是 $\\mathbb{Z}_2$ 重组的产物。\n\n**重组 → 容器（低能有效理论）**：重组实现完成后，$R$ 的伴丛成为新能标下的固定背景——$SO(3)$ 规范场论把 $SO(3)$-向量丛当作容器，忘记它来自 $SU(2) \\xRightarrow{\\mathbb{Z}_2} SO(3)$。\n\n$$\\text{运动学} \\xrightarrow{\\text{追问 } H \\text{ 的起源}} \\text{动力学}$$\n\n$$\\text{动力学} \\xrightarrow{\\text{低能冻结 } \\langle\\phi\\rangle} \\text{运动学}$$\n\n### 1.5.6 CQM的主视角：重组框架\n\nCQM以动力学（重组）框架为主视角的原因：\n\n1. **底空间是物质自组织的空间形态本身**（§1）——排除了先验容器\n2. **丛是重组过程的涌现产物**——主丛群 $G$ 通过子群 $H$ 自我折叠为有效几何 $R$\n3. **等价关系是内部的**——等价关系定义空间本身，非外部强加的微分方程\n4. **发生学顺序**：物质先在→自组织→底空间涌现→丛涌现→重组→有效几何\n\n容器框架在低能有效理论中出现——重组实现完成后，重组产物被“冻结”为新能标下的固定背景，此时采用容器框架描述，但需记住其重组起源。二者并非对立，而是同一物理在不同能标下的相互关联视角。\n\n### 1.5.7 重组框架的深层统一：伴丛截面 = 序参量 = 物质场\n\n重组框架消除了“背景”与“物质”的形而上学分割——伴丛截面同时就是物质场。\n\n**伴丛截面 = 序参量**：重组框架中，伴丛定义为 $E_{R} = P \\times_H R \\cong P/H$，其截面是映射 $\\phi: M \\to P/H$。在时空每一点 $x \\in M$，$\\phi(x)$ 是 $G/H$ 中的一个**陪集**，即一个**真空方向**——这正是序参量。\n\n实例（重组生成群 $R$，VEV 在 $V$ 中选方向）：\n- **电弱**：重组 $(SU(2)\\times U(1)) \\xRightarrow{\\mathbb{Z}_2} U(1)\\times SO(3)$，VEV $\\langle\\phi\\rangle\\in V=\\mathbb{C}^2$ 选方向，重组实现 $\\Rightarrow U(1)_{\\text{em}}$，序参量 $\\phi(x)\\in (SU(2)\\times U(1))/U(1)_{em} \\sim S^3$\n- **超导**：重组 $U(1) \\xRightarrow{\\mathbb{Z}_2} U(1)$，库珀对凝聚相位 $\\phi(x) \\in U(1)$\n- **铁磁体**：重组 $SO(3) \\xRightarrow{SO(2)} SO(2)$，VEV $\\langle\\psi\\rangle\\in V=\\mathbb{R}^3$ 选方向，重组实现 $SO(3)\\Rightarrow SO(2)$，磁化方向 $\\phi(x)\\in SO(3)/SO(2) \\sim S^2$\n\n在重组框架中，“物质场”就是背景自身通过重组折叠后涌现的截面。\n\n**与容器框架的精确平行**：两种框架共享同一幅“场=截面”的图像，区别仅在于纤维：\n\n| | 容器框架 | 重组框架 |\n|---|---|---|\n| **伴丛** | $E = P \\times_\\rho V$ | $E_{R} = P \\times_H R$ |\n| **纤维** | 向量空间 $V$（线性） | 齐性空间 $G/H$（非线性） |\n| **截面** | 物质场 $\\psi: M \\to V$ | 序参量 $\\phi: M \\to G/H$ |\n| **变换法则** | $\\psi \\to \\rho(g)\\psi$（线性） | $\\phi \\to g\\cdot\\phi$（非线性） |\n| **真空** | $\\psi = 0$（平凡） | $\\phi = \\text{常值}$（重组方向） |\n\n**关键统一**：在两种情况下，物理场都是**伴丛的截面**。容器框架是重组框架在“纤维可线性化”时的线性投影。\n\n**背景与物质的同一**：当伴丛截面同时是物质场时，传统区分被消解：\n\n| 传统区分 | 容器框架 | 重组框架 |\n|---------|---------|---------|\n| **背景 vs 物质** | 主丛是背景，伴丛是物质容器 | 主丛通过重组**成为**伴丛，背景即物质 |\n| **真空 vs 激发** | 真空是 $\\psi=0$，激发是 $\\psi \\neq 0$ | 真空是 $\\phi = \\langle\\phi\\rangle$（非零截面），激发是 $\\phi(x)$ 在 $G/H$ 上的振动 |\n| **对称性 vs 破缺** | 对称性是背景属性，破缺是物质属性 | 对称性折叠**定义了**物质场的取值空间 |\n\n重组框架对通常说的自发对称性破缺的诠释：重组定义了新的伴丛，其非零截面就是物理真空。\n\n**可线性化情形：重组框架投影到容器**：如果 $G/H$ 允许忠实线性表示（如 $SO(3) \\hookrightarrow GL(3,\\mathbb{R})$），则 $G/H$ 的坐标可以嵌入向量空间 $V$，非线性序参量 $\\phi: M \\to G/H$ 线性化为线性物质场 $\\psi: M \\to V$，重组框架的伴丛截面就是容器框架的物质场。其实质为重组伴丛与容器伴丛的同构：\n\n$$\\underbrace{P \\times_G (G/\\ker\\rho)}_{\\text{重组伴丛}} \\;\\cong\\; \\underbrace{P \\times_\\rho V}_{\\text{容器伴丛}}$$\n\n当表示存在时，两种框架的截面完全重合。\n\n**总结**：重组框架下伴丛的截面同时就是物质场——严格的数学同一。容器框架中物质场是向量丛的截面；重组框架中物质场是齐性丛的截面。两者共享“场=伴丛截面”的本质，区别仅在于纤维是线性的 $V$ 还是非线性的 $G/H$。运动学框架与动力学框架相互关联：真空结构本身就是物质场的取值空间，容器框架是重组框架的线性化投影。\n\n## 2. 纤维丛四元组\n\n每层FG由纤维丛四元组完整刻画：\n\n$$\\boxed{(M_\\ell,\\; P(M_\\ell, G_\\ell),\\; \\mathcal{A}_\\ell,\\; \\hat{\\mathcal{S}}_\\ell)}$$\n\n| 要素 | 定义 | 物理意义 |\n|:---|:---|:---|\n| 底空间 $M_\\ell$ | 层级 $\\ell$ 的物质分布几何经Regge剖分 | 三角剖分的离散几何 |\n| 主丛 $P(M_\\ell, G_\\ell)$ | 结构群 $G_\\ell$ 上的主丛 | 规范结构 |\n| 联络 $\\mathcal{A}_\\ell$ | 由层级Regge晶胞分步生成 | 平行移动规则 |\n| 同步算符（= 作用量算符）$\\hat{\\mathcal{S}}_\\ell$ | 紧化算符在层级截面空间的实现 | 谱算符，给出群谱 |\n\n### 2.0 主丛结构关系：$F = G \\Rightarrow R = G \\Rightarrow \\hat{H}$\n\n**FG当前用于描述规范相变物理**。核心结构：CQM FG的主丛是从结构群到本征群（等价地到群算符）的重组实现，群算符是本征群在表示空间上的算符表示。箭头 $\\Rightarrow$ 表示**重组实现**（$G$ 经重组实现为 $R$，等价地重组为 $\\hat{H}$）。\n\n$$\\boxed{F = G \\Rightarrow R = G \\Rightarrow \\hat{H}}$$\n\n其中：\n- $G$：**主丛结构群**（母群，如 $SU(5)$）\n- $R$：**本征群 $R_k$**（重组产物，公理1+2保证紧致性）\n- $\\hat{H}$：**群算符**（$R$ 在表示空间上的算符表示，故 $R$ 与 $\\hat{H}$ 在谱的意义下等价）\n- $F = G \\Rightarrow R = G \\Rightarrow \\hat{H}$：**主丛**（结构群 $G$ 经重组实现为本征群 $R$，等价地重组为群算符 $\\hat{H}$）\n\n**子群重组**：在规范相变中，$G$ 本身不变，内部以子群重组——$R$ 和 $\\hat{H}$ 的谱是 $G$ 内部子群的谱（$\\text{Spec}(R), \\text{Spec}(\\hat{H}) \\subseteq \\text{Spec}(G)$），但 $G$ 本身不变为子群。规范相变是 $G$ 的内部结构通过子群重新组织，不是 $G$ 重组为别的群。\n\n**类薛定谔方程**：同步方程 $\\hat{\\mathcal{S}}|\\Psi\\rangle = n|\\Psi\\rangle$ 类比薛定谔方程 $\\hat{H}|\\psi\\rangle = E|\\psi\\rangle$：\n\n| 薛定谔方程                | CQM同步方程                   |\n| :------------------- | :------------------------ |\n| $\\hat{H}$（哈密顿算符）     | $\\hat{\\mathcal{S}}$（同步算符） |\n| $E$（能量本征值）           | $n$（同步本征值/耦级）            |\n| $\\lvert\\psi\\rangle$（本征态） | $\\lvert\\Psi\\rangle$（同步本征态）    |\n| Hilbert空间            | 纤维丛截面空间                   |\n\n**四层结构**：\n\n$$\\underbrace{G,\\; R}_{\\text{1. 代数层}} \\;\\longrightarrow\\; \\underbrace{\\hat{\\mathcal{S}}|\\Psi\\rangle = n|\\Psi\\rangle}_{\\text{2. 算符层（类薛定谔）}} \\;\\longrightarrow\\; \\underbrace{F = G \\Rightarrow R = G \\Rightarrow \\hat{H}}_{\\text{3. 丛层（主丛）}} \\;\\hookrightarrow\\; \\underbrace{\\text{运动学纤维丛}}_{\\text{4. 运动学层}}$$\n\n1. **代数层**：$G$（母群），$R$（本征群 $R_k$）\n2. **算符层**：$\\hat{\\mathcal{S}}$（同步算符，$R$ 的算符表示）→ 类薛定谔方程 $\\hat{\\mathcal{S}}|\\Psi\\rangle = n|\\Psi\\rangle$\n3. **丛层**：$F = G \\Rightarrow R = G \\Rightarrow \\hat{H}$（主丛，结构群 $G$ 经重组实现为本征群 $R$ 或群算符 $\\hat{H}$）\n4. **运动学层**：$F$ 作为主丛嵌入运动学纤维丛（§1.5.2容器框架），参与动力学\n\n**物理意义**：\n- $R = \\hat{H}$：本征群 = 群算符（谱等价）——群论结构确定算符谱，算符谱反推群论结构\n- $F = G \\Rightarrow R = G \\Rightarrow \\hat{H}$：主丛是结构群到本征群（等价地到群算符）的重组实现，物理态空间 $= \\text{Im}(G \\Rightarrow R)$\n- $F \\hookrightarrow$ 运动学纤维丛：重组框架（动力学）的产物嵌入容器框架（运动学），实现§1.5.5的转化关系\n\n**CQM纤维丛理论描述的是规范相变物理**：$F = G \\Rightarrow R = G \\Rightarrow \\hat{H}$ 的本质是规范相变。大统一群 $GL(5)$（约化李群，非紧致）本身是重组实现的，不是破缺的。**就物理相变而言：破缺的必须是非规范对称群（或更一般地，非规范对称性），但非规范对称群不一定破缺；重组实现的既可以是规范对称群，也可以是非规范对称群；而规范对称群相变必然是重组，而非破缺**。$GL(5,\\mathbb{R})$ 的时空对称性若纳入规范群则必须破缺；紧致部分（如 $SU(5) \\subset GL(5,\\mathbb{C})$）的规范相变是重组实现，没有发生破缺。母群 $G$（高对称相/自由相）经重组实现为 $R$（低对称相/有序相），群算符 $\\hat{H}$ 是重组后在表示空间中的算符残余。纤维丛刻画的是规范相变物理：主丛结构群 $G$ 是相变前的对称性，纤维 $R$ 是相变后的有序态空间，联络编码相变的局域触发机制，曲率表征相变的拓扑障碍（示性类、单极子）。§1.5.3的等价关系 $(p\\cdot h, f) \\sim (p, h\\cdot f)$ 是规范相变的数学化——等价关系折叠高对称态空间为低对称相的轨道空间。\n\n> **文献标注（规范对称性不破缺的外部依据）**：局域规范对称性不能自发破缺——Elitzur 定理（Elitzur 1975, *Phys. Rev. D* 12, 3978）；Higgs 相与禁闭区之间无热力学奇异线，规范对称性不作为相变序参量（Fradkin–Shenker 1979, *Phys. Rev. D* 19, 3682）。CQM 的重组实现立场与此定理相容：规范对称群相变是重组，而非破缺。\n\n### 2.1 四层FG剖分\n\n| 层级 | 底空间 $M_\\ell$ | 结构群 $G_\\ell$ | 联络 $\\mathcal{A}_\\ell$ |\n|:---|:---|:---|:---|\n| 电子FG | （待补） | （待补） | （待补） |\n| 元素FG | 质子+中子分布 | $U(1) \\times SO(2) \\times SU(4)$ | 核子间联络 |\n| 分子FG | 原子分布 | 分子点群 | 原子间联络（化学键） |\n| 晶胞FG | 原子/分子分布 | 空间群 | 晶胞中联络 |\n\n### 2.2 层级嵌套\n\n$$P_{\\text{el}} \\hookrightarrow P_{\\text{element}} \\hookrightarrow P_{\\text{mol}} \\hookrightarrow P_{\\text{cell}}$$\n\n每层底空间是上层的纤维。\n\n## 3. 联络：一个联络生成两种曲率\n\n$$\\mathcal{A}_\\ell \\longrightarrow \\begin{cases} \\text{底空间曲率：Regge角亏 } \\delta_v^{(\\ell)} = 2\\pi - \\sum_{\\Delta \\ni v} \\alpha_\\Delta \\\\ \\text{伴丛曲率：} F_\\ell = d\\mathcal{A}_\\ell + \\mathcal{A}_\\ell \\wedge \\mathcal{A}_\\ell \\end{cases}$$\n\n- 底空间曲率进入不确定性关系与谱调制\n- 伴丛曲率进入运动方程 $D * F = *J_\\Phi$\n- 同一联络，两种曲率，各自遵循不同的数学规则\n\n### 3.1 和乐\n\n$$W_v^{(\\ell)} = \\exp(i\\delta_v^{(\\ell)} \\hat{T}_\\ell) \\in G_\\ell$$\n\n其中 $\\hat{T}_\\ell$ 是层级结构群 $G_\\ell$ 的生成元。\n\n和乐平庸化条件给出该层级的“稳定构型”：\n- 元素FG：和乐平庸化 = 闭壳层稳定构型（稀有气体）\n- 分子FG：和乐平庸化 = 稳定杂化几何（理想键角）\n- 晶胞FG：和乐平庸化 = 稳定晶格构型\n\n### 3.2 层级角亏传递\n\n$$\\delta_v^{(\\ell+1)} = \\delta_{v,\\text{intrinsic}}^{(\\ell)} + \\Delta\\delta_{\\text{defect}}^{(\\ell+1)}$$\n\n上层内禀角亏是下层角亏的组成部分。\n\n### 3.3 伴丛运动方程形式化\n\n主丛 $P(M_\\ell, G_\\ell)$ 的**伴丛**（adjoint bundle）：\n\n$$\\boxed{\\text{ad}(P) = P \\times_{G_\\ell} \\mathfrak{g}_\\ell \\;\\xrightarrow{\\pi}\\; M_\\ell}$$\n\n其中 $\\mathfrak{g}_\\ell = \\text{Lie}(G_\\ell)$，$G_\\ell$ 通过伴随表示 $\\text{Ad}: G_\\ell \\to \\text{Aut}(\\mathfrak{g}_\\ell)$ 作用。**结构群 $G_\\ell$ 必须是紧致李群**（§2.0，公理1+2），否则伴随表示非幺正、Killing形式非负定，伴丛上的几何失去正定性。\n\n**伴丛上的几何量**：\n\n| 量 | 数学定义 | 空间 | 物理意义 |\n|:---|:---|:---|:---|\n| 联络 $\\mathcal{A}$ | $G_\\ell$-联络 | $\\Omega^1(M_\\ell) \\otimes \\text{ad}(P)$ | Regge几何生成 |\n| **伴丛曲率** $F$ | $d\\mathcal{A} + \\mathcal{A} \\wedge \\mathcal{A}$ | $\\Omega^2(M_\\ell) \\otimes \\text{ad}(P)$ | 同步场强 |\n| 外协变导数 $D$ | $d + [\\mathcal{A}, \\cdot]$ | $\\Omega^k \\otimes \\text{ad}(P) \\to \\Omega^{k+1} \\otimes \\text{ad}(P)$ | 规范协变 |\n| 同步场 $\\Phi$ | 伴丛截面 | $\\Gamma(\\text{ad}(P))$ | 物质分布 |\n| 同步流 $J_\\Phi$ | $J_\\Phi = \\frac{\\delta S_{\\text{matter}}}{\\delta \\mathcal{A}}$ | $\\Omega^1(M_\\ell) \\otimes \\text{ad}(P)$ | 物质源 |\n\n**伴丛运动方程**（Yang-Mills型）：\n\n$$\\boxed{D * F = *J_\\Phi}$$\n\n物理意义：\n- **左端 $D * F$**：伴丛曲率的协变散度，描述同步场强的规范协变变化\n- **右端 $*J_\\Phi$**：同步场 $\\Phi$（物质分布）生成的流，是同步场强的源\n- **方程整体**：物质分布（核子量子振荡）通过伴丛曲率决定同步场强，同步场强反过来重组物质分布——**自洽方程**\n\n**Bianchi恒等式**（几何自洽性）：\n\n$$D F = 0 \\quad \\iff \\quad [\\hat{L}_m, [\\hat{L}_n, \\hat{L}_p]] + \\text{cyclic} = 0 \\quad \\text{（Jacobi恒等式）}$$\n\n伴丛曲率的协变外导数为零，对应Kac-Moody代数的Jacobi恒等式（§9.3纤维丛与CFT严格对应）。这是同步方程相容性的几何保证。\n\n**同步方程与伴丛运动方程的关系**：\n\n| | 伴丛运动方程 | 同步方程 |\n|:---|:---|:---|\n| **方程** | $D * F = *J_\\Phi$ | $\\hat{\\mathcal{S}}_k \\Psi_k = n_k \\Psi_k$ |\n| **类型** | Yang-Mills型场方程 | 本征值方程 |\n| **空间** | $\\Omega^1(M_\\ell) \\otimes \\text{ad}(P)$ | $\\Gamma(\\text{ad}(P))$ |\n| **角色** | 曲率-物质自洽关系 | 谱分解（本征群分类） |\n| **关系** | 运动方程的解给出允许的曲率配置 | 本征值方程对解空间做谱分解 |\n\n同步方程是伴丛运动方程的**谱分解**：运动方程确定允许的曲率配置，同步算符 $\\hat{\\mathcal{S}}_k = \\frac{L_u}{2\\pi ☯}\\sqrt{1 - \\beta \\hat{\\delta}_v^{(k)}}$ 对这些配置做本征值分解，本征值 $n_k$ 分类本征群 $R_k$。\n\n## 4. 同步算符：纤维丛的谱算符\n\n### 4.0 核心问题：底空间+条件→同步方程→本征群→耦合常数\n\nFG的核心问题之一是：**给定底空间（Regge剖分）+条件（核子量子振荡、曲率涨落、耦合常数涨落），求解同步方程的本征群（自守形式），本征群对应的耦合常数就是涨落耦合常数指定的。**\n\n$$\\boxed{\\underbrace{M_\\ell}_{\\text{底空间}} + \\underbrace{\\hat{\\mathcal{S}}_k}_{\\text{作用量算符（同步算符，紧化算符的层级实现）}} + \\underbrace{G_k}_{\\text{对称性}} \\;\\longrightarrow\\; \\underbrace{\\Psi_k}_{\\text{自守形式}} \\;\\longrightarrow\\; \\text{耦合常数（由涨落指定）}}$$\n\n**底空间不可省略**：$\\Psi_k \\in \\Gamma(\\text{ad}(P))$ 是底空间 $M_\\ell$ 上的伴丛截面（自守形式），同步算符 $\\hat{\\mathcal{S}}_k$ 作用在 $\\Gamma(\\text{ad}(P))$ 上，对称性 $G_k$ 在 $M_\\ell$ 上作用。缺少底空间，作用量算符和对称性均无法定义。\n\n**GL(n) 由重组产物的基本表示严格确定（发生学顺序强制）**：$SU(5)$ 经重组实现 $\\Rightarrow U(1)\\times SU(2)\\times SU(3)$，各因子通过基本表示 $\\rho_{\\text{fund}}: R \\to GL(V_{\\text{fund}})$ 给出各自自守框架（$SU(5) \\xrightarrow{\\rho_{\\text{fund}}} GL(\\mathbb{C}^5)$、$SU(3) \\xrightarrow{\\rho_{\\text{fund}}} GL(\\mathbb{C}^3)$、$SU(2) \\xrightarrow{\\rho_{\\text{fund}}} GL(\\mathbb{C}^2)$、$U(1) \\xrightarrow{\\rho_{\\text{fund}}} GL(\\mathbb{C})$），$n = \\dim V_{\\text{fund}}$ 由表示严格确定。$SU(5)$ 由“含标准模型的最小单群”锚定（rank 4），$S_5=\\mathrm{Weyl}(A_4)$ 只作交叉印证。物理主丛不能反向指定 $GL(n)$：主丛结构群（紧群）是紧化投影的输出，以输出指定输入构成循环论证。详见 `FG_核心理论.md` §3.0。\n\n推导链：\n\n$$\\text{Regge剖分} + [\\hat{X},\\hat{P}]=i\\hbar \\xrightarrow{\\text{离散协变导数}} \\text{嘉当矩阵} \\xrightarrow{\\text{对角化}} \\text{声子} \\xrightarrow{\\text{几何非线性}} \\hat{\\delta}_v \\xrightarrow{\\text{FG因果}} v_\\tau \\xrightarrow{\\text{定义}} p_u \\xrightarrow{[\\hat{u},\\hat{p}_u]=i} \\text{紧化U(1)} \\xrightarrow{\\text{玻尔-索末菲}} n_k \\xrightarrow{\\text{同步方程}} G_k$$\n\n- **Regge剖分重组**：$\\mathcal{R}=(V,E,F,\\{\\bar{L}_{ij}\\})$，经典角亏 $\\bar{\\delta}_v = 2\\pi - \\sum_{\\Delta\\ni v}\\bar{\\theta}_v(\\Delta)$ 由经典边长通过余弦定律严格确定。质子 $A_4$：$\\bar{\\delta}_v=0$（理想平坦）；中子 $D(\\delta)$：$\\bar{\\delta}_v\\neq 0$（经典背景曲率）\n- **位置-动量代数**：每个顶点 $v$ 上 $[\\hat{X}_v,\\hat{P}_v]=i\\hbar$（预量子化线丛的联络曲率）\n- **嘉当矩阵 = 图拉普拉斯**：离散协变导数的矩阵形式，是Regge剖分的必然结果\n- **声子代数**：简正模式对角化保持对易子 $[\\hat{Q}_k,\\hat{\\Pi}_{k'}]=i\\hbar\\delta_{kk'}$，声子来自 $[\\hat{X},\\hat{P}]=i\\hbar$，**不是额外假设**。声子的三层结构（前时空/GR中子-质子振荡/FG核子曲率）与统一角色详见 `01 核心理论/CQM_核心_声子理论.md`\n- **曲率涨落算符（严格推导）**：位置涨落平方 + Regge几何非线性 → $\\hat{\\delta}_v^{(1)} = \\sum_k \\frac{\\hbar\\omega_k}{E_{\\text{bind}}}|v_k(v)|^2(\\hat{a}_k^\\dagger\\hat{a}_k + \\frac{1}{2})$，**不是唯象假设**。其中 $1/E_{\\text{bind}}$ 是**量纲归一化因子**——FG纤维丛截断在此处把有量纲的声子能量 $\\hbar\\omega_k$（$[\\text{能量}]$）除以核子结合能 $E_{\\text{bind}}$（$[\\text{能量}]$），得到无量纲曲率算符。这是CQM所有后续方程（同步方程、CFT/OPE）无量纲性的**根本来源**。\n- **总曲率 = 经典背景 + 量子涨落**：$\\hat{\\delta}_v = \\bar{\\delta}_v + \\hat{\\delta}_v^{(1)}$，$\\bar{\\delta}_v$ 是c-数（经典背景曲率），$\\hat{\\delta}_v^{(1)}$ 是算符（量子涨落）\n- **FG因果重组（假设）**：固有时流速 $v_\\tau^{(k)} = \\sqrt{1-\\beta\\delta_v^{(k)}}$ → 耦合动量 $p_u^{(k)} = v_\\tau^{(k)}/☯$（相变量子 $☯$）。这是FG核心机制，标注为**假设**。**不确定性关系 $\\Delta u \\cdot \\Delta v_\\tau \\geq ☯/2$，$☯$ 为相变量子**\n- **同步方程**：$\\hat{\\mathcal{S}}_k \\Psi_k = n_k \\Psi_k$，同步算符 $\\hat{\\mathcal{S}}_k = \\frac{L_u}{2\\pi ☯}\\sqrt{1-\\beta\\hat{\\delta}_v^{(k)}}$ 由条件严格确定\n- **本征群**：$R_k$ 是重组产物，壳层标签 $l_k = k-1$ 由 SU(5) 简单根的 Dynkin 图深度严格推导\n- **耦级（定义）**：$n_k \\equiv C_k = l_k(l_k+1) + 3/4$（同步成本=对称性强度）\n- **等价关系**：$\\left\\langle \\frac{L_u}{2\\pi ☯}\\sqrt{1-\\beta\\hat{\\delta}_v^{(k)}} \\right\\rangle = C_k$（锁定声子占据数 $N_k$）\n- **CFT OPE**：同步本征态 $\\otimes$ 耦合本征态 $\\to$ 群本征态（共形固定点，Dirac 条件=共形自举方程的 CQM 具体化）\n- **耦合常数**：$g_k = \\alpha^{-1}\\exp(-(n_k-n_1)/n_1)$——是同步方程的**输出**，不是输入参数\n\n### 4.0.1 SU(5) 重组实现 ⇒ $A_4$ → 4 紧致本征群 → 4 耦合常数\n\nSU(5)李代数$\\mathfrak{su}(5)$的根系为$A_4$型，重组实现产生两个独立效应：\n\n**规范重组**（不属于本征群效应，三个空间群直积，全紧致，**时间内禀没有群**）：\n\n$$\\text{SU}(5) \\;\\xRightarrow{\\text{规范重组}}\\; U(1) \\times SU(2) \\times SU(3) \\;\\xrightarrow{g_{U(1)}}\\; \\alpha^{-1}$$\n\n**本征群效应**（同步方程本征群，全紧致）：\n\n$$\\boxed{\\{\\mathrm{SU}(2)_k\\}_{k=1}^{4} \\;\\xrightarrow{\\text{4耦合常数}}\\; \\{g_k\\}_{k=1}^{4}}$$\n\n本征群 $R_k$ 是重组产物，壳层标签 $l_k = k-1$ 由 SU(5) 简单根的 Dynkin 图深度严格推导。四个本征群 $R_k \\cong SU(2)_k \\cong S^3$（三维球面，**紧致连通李群**），对应s/p/d/f四个亚壳层。Kac-Moody代数 $\\widehat{\\mathfrak{su}(2)}_k$ 由紧致李代数 $\\mathfrak{su}(2)$ 中心扩展构造，CFT框架（Verlinde公式、OPE系数）的数学前提满足。\n\n**精细结构常数 $\\alpha$ 来自SU(5)规范重组后$U(1)$电磁群的耦合常数**。精细结构常数是GL(5)整体的反映。\n\n### 4.1 耦合常数算符 $\\hat{u}$\n\n$$\\boxed{\\hat{u} = \\ln \\hat{g}, \\quad [\\hat{u}, \\hat{p}_u] = i}$$\n\n- $\\hat{u}$：耦合常数对数算符，本征值 $u \\in [0, L_u)$\n- $\\hat{g} = e^{\\hat{u}}$：耦合常数算符，本征值 $g = e^u$\n- $\\Delta u \\cdot \\Delta p_u \\geq \\frac{1}{2}$\n\n### 4.2 双空间同步算符\n\n同步算符**同时**作用于核子空间和耦合常数空间：\n\n$$\\boxed{\\hat{\\mathcal{S}} = \\hat{\\mathcal{S}}_{\\text{nucleon}} \\otimes \\hat{\\mathbb{I}}_{U(1)} + \\hat{\\mathbb{I}}_{\\text{nucleon}} \\otimes \\hat{\\mathcal{S}}_{U(1)}(\\hat{u})}$$\n\n**核子部分**（由FG因果严格确定）：\n\n$$\\hat{\\mathcal{S}}_{\\text{nucleon}} = \\frac{L_u}{2\\pi ☯}\\sqrt{1-\\beta\\hat{\\delta}_v}$$\n\n其中曲率算符 $\\hat{\\delta}_v = \\bar{\\delta}_v + \\hat{\\delta}_v^{(1)}$ 严格来自 **Regge剖分重组** + **$[\\hat{X},\\hat{P}]=i\\hbar$**：经典背景曲率 + 位置涨落平方的量子期望 + Regge几何非线性，不是唯象假设。\n\n**耦合常数部分**：\n\n$$\\hat{\\mathcal{S}}_{U(1)}(\\hat{u}) = \\sum_p \\frac{\\ln p}{\\sqrt{p}}\\delta(\\hat{u} - \\ln p)$$\n\n质数势是**投影算符的叠加**，在耦合常数空间选择 $u = \\ln p$ 的离散点。\n\n- 本征态 $\\Psi_k(u) = \\frac{1}{\\sqrt{L_u}}e^{i\\frac{2\\pi n_k}{L_u}u}$（紧化U(1)基矢）\n- 本征值 = 耦级 $n_k \\equiv C_k = l_k(l_k+1) + 3/4$（定义），等价关系 $\\left\\langle \\frac{L_u}{2\\pi ☯}\\sqrt{1-\\beta\\hat{\\delta}_v^{(k)}} \\right\\rangle = C_k$ 锁定 $N_k$\n- $☯ = \\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1} \\approx 0.02309570897$（Riemann xi函数）\n- 紧化 = $\\hat{u}$ 的**谱边界条件** $\\psi(u+L_u) = \\psi(u)$，与核子声子态联立\n\n### 4.3 同步算符的完整形式（含 Casimir）\n\n$$\\boxed{\\hat{\\mathcal{S}}_k^{\\text{(full)}} = \\frac{L_u}{2\\pi ☯}\\sqrt{1-\\beta\\hat{\\delta}_v^{(k)}} \\cdot \\hat{\\mathbb{I}}_{G_k} + \\hat{C}_2(G_k)}$$\n\n- 耦级项：U(1)紧化的同步成本（径向）\n- Casimir项：$G_k$ 内部对称的同步成本（角向）\n- 同步成本 $s_k = n_k + l$\n\n## 5. 群谱与朗兰兹纲领\n\n### 5.1 FG的完整数学对象\n\nFG的完整数学对象是**朗兰兹纲领GL(n)各层+广义黎曼猜想（GRH）**。广义黎曼猜想（GRH）是GL(5)固定层级的实谱条件。\n\n**正确结构**：不是GL(1)+GL(4)+GL(5)直和，而是**单个GL(5)自守表示**。GL(1)和GL(4)是其**子结构**（中心特征和$K$-type），分别贡献主量子数 $n$ 和轨道角动量 $l$。GL(4)来自 $SO(5)\\subset SU(5)$ 的旋量表示 $\\mathbb{C}^4$（$\\dim V = 4$），非 $SU(4)$ 重组因子。\n\n同步算符由物理条件严格确定，本征群 $R$ 是重组产物：\n\n$$\\boxed{\\hat{\\mathcal{S}}_{\\text{atom}} = \\bigoplus_{k=1}^{4} \\hat{\\mathcal{S}}_k^{\\text{(full)}}}$$\n\n物质自组织基态同步是SU(5)（GL(5)自守谱），重组实现后各因子层GL(n)谱是残留：\n\n| 朗兰兹层 | L函数 | 猜想 | FG中的角色 |\n|:---|:---|:---|:---|\n| GL(4) | $L(s, \\pi)$ | GRH(GL(4)) | $SO(5)$ 旋量表示（GL(5)的$K$-type） |\n| GL(5) | $L(s, \\pi)$ | GRH(GL(5)) | 基态同步（单层自守表示） |\n\n### 5.2 群谱的前提\n\n$$\\boxed{\\text{完整同步谱} \\iff \\text{RH} \\land \\text{GRH(GL(4))} \\land \\text{GRH(GL(5))}}$$\n\n- 黎曼猜想成立 → 本征值在临界线上 → GL(5)固定层级谱唯一\n- 广义黎曼猜想成立 → 各层本征值在临界线上 → FG完整谱唯一\n- **FG完整理论需要各层GRH同时成立**（数学前提，未证明）\n\n### 5.3 GUE统计\n\n各GL(n)层L函数零点间距 = GUE sine-kernel（Montgomery–Odlyzko推广）\n\n$$R_2(s) = 1 - \\left(\\frac{\\sin(\\pi s)}{\\pi s}\\right)^2$$\n\n各层零点 = 量子混沌能级（贝里图景：周期轨道 = 素数）。\n\n### 5.4 文献锚定\n\n| 文献 | 贡献 |\n|---|---|\n| Hilbert–Pólya (1914+) | 自伴算符H，本征值=黎曼零点虚部 |\n| Berry–Keating (1999) | H=xp算符，semiclassical实现 |\n| Connes (2019) [arXiv:1910.14368] | 缩放哈密顿量，谱实现，紧化算符 |\n| Montgomery (1973) + Odlyzko | GUE统计验证 |\n| Bost–Connes (1995) [arXiv:1012.4665] | Z(β)=ζ(β)量子统计系统 |\n| Srednicki (2011) [arXiv:1104.1850] | Berry–Keating+局部RH谱证明 |\n| Ng (2006) [arXiv:math/0603275] | Virasoro c=1/2谱实现 |\n| Benjamin–Chang (2022) [arXiv:2208.02259] | CFT模共形自举包含黎曼零点 |\n\n## 6. Regge剖分与纤维丛的对应\n\n给定纤维丛 $(M_\\ell, P_\\ell, \\pi_\\ell, G_\\ell)$，对底空间 $M_\\ell$ 进行Regge剖分 $T_\\ell$：\n\n- **顶点** = $M_\\ell$ 中的离散点（剖分对象的位置）\n- **边** = 联络 $\\mathcal{A}_\\ell$ 的离散化（连接顶点的路径，给出平移规则）\n- **面** = 曲率 $\\mathcal{F}_\\ell$ 的离散化（绕回路的和乐）\n\n### 6.1 角亏作为底空间曲率集中\n\n$$\\delta_v = 2\\pi - \\sum_i \\theta_i \\quad \\text{（角亏定义，Gauss–Bonnet 局部量）}$$\n\n### 6.2 曲率量子涨落\n\n$$\\Delta\\delta_0^2 = \\sum_q \\left|\\frac{\\partial \\delta_v}{\\partial u_q}\\right|^2 \\cdot \\frac{\\hbar}{2\\omega_q}$$\n\n其中 $\\omega_q$ 是纤维上的量子谐振子本征频率（声子频率）。\n\n## 7. 统一计算步骤\n\n给定任意层FG的纤维丛 $(M_\\ell, P_\\ell, \\pi_\\ell, G_\\ell)$，从剖分到谱的步骤完全统一：\n\n| 步骤 | 内容 | 公式 |\n|:---|:---|:---|\n| A. Regge剖分 | 对底空间三角剖分 | 顶点+边+面 |\n| B. 角亏 | 逐顶点曲率集中 | $\\delta_v = 2\\pi - \\sum_i \\theta_i$ |\n| C. 动力学矩阵 | 联络离散化 | $D_{ij} = K_{ij}/\\sqrt{m_i m_j}$ |\n| D. 声子谱 | 纤维上量子谐振子 | $\\omega_q = \\sqrt{\\text{eig}(D)}$ |\n| E. 角亏涨落 | 曲率零温量子涨落 | $\\Delta\\delta_0^2 = \\sum_q \\|\\partial\\delta_v/\\partial u_q\\|^2 \\cdot \\hbar/(2\\omega_q)$ |\n\n每步都是CQM方程严格导出，无经验拟合参数。\n\n## 8. 物理常数\n\n| 常数 | 值 | 来源 |\n|:---|:---|:---|\n| $\\beta$ | $\\frac{1}{4\\pi}\\ln\\frac{L}{a}$ | 系统尺寸严格确定 |\n| $☯$ | $\\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1} \\approx 0.02309570897$ | Riemann xi函数 |\n| $L_u$ | $\\ln\\Lambda$ | 耦合常数空间紧化U(1)周长 |\n\n## 9. 纤维丛与CFT的严格对应：联络→曲率→同步→共形\n\n**目标**：建立纤维丛结构（联络、曲率、和乐、截面）与CFT结构（Virasoro代数、共形块、OPE、primary operator）之间的严格定量映射，消除“Dirac 条件=共形自举方程”仅一行陈述的缺口。\n\nCFT一般理论见 `01 核心理论/CQM_核心_共形场论与OPE.md`。\n\n### 9.1 截面 = primary operator\n\n**纤维丛截面**：物理场是伴丛的截面 $\\psi \\in \\Gamma(E)$（$E = P\\times_\\rho V$；主丛 $P(M,G)$ 本身一般无整体截面），满足联络的协变作用 $D\\psi = 0$。\n\n**CFT primary operator**：primary operator $\\phi(z)$ 是复平面上的共形场，满足Virasoro最高权条件 $\\hat{L}_{n>0}\\phi = 0$。\n\n**严格对应**：\n\n$$\\boxed{\\psi(x) \\in \\Gamma(P(M,G)) \\;\\longleftrightarrow\\; \\phi_l(z) \\in \\mathcal{H}_{\\text{CFT}}}$$\n\n| 纤维丛 | CFT | 对应机制 |\n|:---|:---|:---|\n| 底空间 $M$（Regge剖分） | 复平面 $\\mathbb{C}$ | 指数映射 $z = e^{-\\kappa r}$（§6.4 of CFT文档） |\n| 截面 $\\psi$（物理场） | primary operator $\\phi_l$（壳层） | 态-算符对应 |\n| 截面空间 $\\Gamma$ | Hilbert空间 $\\mathcal{H}$ | 所有物理态的集合 |\n| 协变作用 $D\\psi = 0$ | 最高权条件 $\\hat{L}_{n>0}\\phi = 0$ | §9.5严格证明 |\n| 联络作用 $\\nabla_\\mu\\psi$ | descendant $\\hat{L}_{-1}^k\\phi$ | §9.2严格对应 |\n\n**截面的显式构造**：在 $A_4$ 框架下，截面（=电子轨道态）对应于descendant态：\n\n$$\\psi_{n,l,m}(x) \\;\\longleftrightarrow\\; \\sum_{k=0}^{n-l-1} c_k^{(n,l)}\\,\\hat{L}_{-1}^k\\,\\phi_{l,m}(z)$$\n\n其中 $c_k^{(n,l)}$ 是Shapovalov内积确定的descendant系数。\n\n### 9.2 联络 = Virasoro生成元\n\n**纤维丛联络**：$\\mathcal{A}_\\ell$ 作用于截面给出协变导数 $\\nabla_\\mu\\psi = \\partial_\\mu\\psi + \\mathcal{A}_\\mu\\psi$。在 $A_4$ Regge剖分下，联络离散化形式由 SU(5) 简单根的 SU(2) 子代数结构确定。\n\n**Virasoro生成元**：$\\hat{L}_n$ 作用于primary operator给出descendant。$\\hat{L}_{-1}$ 生成descendant tower，$\\hat{L}_0$ 给出共形维度。\n\n**严格对应**：\n\n$$\\boxed{\\mathcal{A}_\\ell \\;\\longleftrightarrow\\; \\{\\hat{L}_n\\}_{n \\in \\mathbb{Z}}}$$\n\n| 纤维丛联络 | Virasoro代数 | 对应机制 |\n|:---|:---|:---|\n| 联络 $\\mathcal{A}$ | $\\{\\hat{L}_n\\}$ | 模展开 $\\mathcal{A}(z) = \\sum_n \\mathcal{A}_n z^{-n-1}$ |\n| 离散联络 = 嘉当矩阵 | $\\hat{L}_{-1}$ descendant生成 | 声子频率 → descendant level |\n| 协变导数 $\\nabla_\\mu\\psi$ | descendant $\\hat{L}_{-1}^k\\phi$ | 联络作用 = descendant生成 |\n| 曲率 $F = d\\mathcal{A} + \\mathcal{A}\\wedge\\mathcal{A}$ | 对易子 $[\\hat{L}_m, \\hat{L}_n]$ | §9.3严格对应 |\n| Bianchi恒等式 $dF + [\\mathcal{A},F] = 0$ | Jacobi恒等式 | 代数自洽性 |\n\n**联络的模展开**：在CFT的复坐标下，联络的模展开为：\n\n$$\\mathcal{A}(z) = \\sum_{n=-\\infty}^{\\infty} \\mathcal{A}_n\\,z^{-n-1}$$\n\n其中 $\\mathcal{A}_n$ 对应 Virasoro 生成元 $\\hat{L}_n$；联络的**仿射型对易关系**（中心项）对应 Virasoro 中央荷：\n\n$$[\\mathcal{A}_m, \\mathcal{A}_n] = (m-n)\\mathcal{A}_{m+n} + k\\,m\\,\\delta_{m+n,0} \\;\\longleftrightarrow\\; [\\hat{L}_m, \\hat{L}_n] = (m-n)\\hat{L}_{m+n} + \\frac{c}{12}m(m^2-1)\\delta_{m+n,0}$$\n\n左式是**仿射型对易关系**（联络本身的仿射扩展），右式是 Virasoro 代数；二者的中央项由 Sugawara 构造联系，中央荷 $c = k\\dim\\mathfrak{g}/(k+h^\\vee)$ 由水平 $k$ 严格确定。\n\n### 9.3 曲率 = 对易子：Bianchi → Jacobi\n\n**纤维丛曲率**：$F = d\\mathcal{A} + \\mathcal{A}\\wedge\\mathcal{A}$，满足Bianchi恒等式 $dF + \\mathcal{A}\\wedge F - F\\wedge\\mathcal{A} = 0$。\n\n**Virasoro对易子**：$[\\hat{L}_m, \\hat{L}_n] = (m-n)\\hat{L}_{m+n} + \\frac{c}{12}m(m^2-1)\\delta_{m+n,0}$，满足Jacobi恒等式。\n\n**严格对应**：\n\n$$\\boxed{F = d\\mathcal{A} + \\mathcal{A}\\wedge\\mathcal{A} \\;\\longleftrightarrow\\; [\\hat{L}_m, \\hat{L}_n] = (m-n)\\hat{L}_{m+n} + \\frac{c}{12}m(m^2-1)\\delta_{m+n,0}}$$\n\n**Bianchi → Jacobi**：\n\nBianchi恒等式 $dF + [\\mathcal{A}, F] = 0$ 是曲率的**可积条件**——联络的二次协变导数可交换当且仅当曲率满足Bianchi。\n\nJacobi恒等式 $[\\hat{L}_m, [\\hat{L}_n, \\hat{L}_p]] + \\text{cyclic} = 0$ 是Virasoro代数的**自洽条件**——对易子的二次嵌套可交换。\n\n二者在代数层面严格对应：Bianchi保证联络定义的曲率自洽，Jacobi保证Virasoro代数的对易子自洽。\n\n**曲率本征值 → 共形维度**：\n\n壳层标签 $l_k = k-1$ 由 SU(5) 简单根的 Dynkin 图深度严格推导。primary共形维度 $h_l = l_k$（壳层角动量），descendant共形维度 $h = n + l$（Madelung规则）。\n\n### 9.4 和乐 = OPE monodromy：曲率 → 共形维度的定量映射\n\n**纤维丛和乐**：绕回路 $\\gamma$ 的平行移动：\n\n$$W(\\gamma) = \\mathcal{P}\\exp\\oint_\\gamma \\mathcal{A} = \\exp(i\\delta_v\\,\\hat{T})$$\n\n其中 $\\delta_v$ 是回路包围的角亏（底空间曲率集中），$\\hat{T}$ 是结构群生成元。\n\n**CFT monodromy**：共形块绕 $z = 0$ 的monodromy：\n\n$$\\mathcal{F}(z\\,e^{2\\pi i}) = e^{2\\pi i h}\\,\\mathcal{F}(z)$$\n\n其中 $h$ 是共形维度。monodromy描述共形块在解析延拓下的变换行为，由BPZ方程严格确定。\n\n**严格对应**：\n\n$$\\boxed{W(\\gamma) = e^{i\\delta_v\\,\\hat{T}} \\;\\longleftrightarrow\\; \\text{monodromy} = e^{2\\pi i h}}$$\n\n**定量映射**：和乐本征值 = monodromy本征值给出：\n\n$$i\\,\\delta_v\\,\\lambda_k = 2\\pi i\\,h \\quad \\longrightarrow \\quad \\boxed{h = \\frac{\\delta_v\\,\\lambda_k}{2\\pi}}$$\n\n**$A_4$ 系统的显式计算**：\n\n对 $A_4$ 嘉当矩阵的第 $k$ 个本征模式：\n- 曲率涨落 $\\delta_v^{(k)} = \\frac{\\hbar\\omega_k}{E_{\\text{bind}}}|v_k(v)|^2(N_k + \\frac{1}{2})$（来自§4.0推导链，$N_k$ 为声子占据数）\n\n- 共形维度 $h_k = \\frac{\\delta_v^{(k)}\\,\\lambda_k}{2\\pi}$（$\\lambda_k$ 为结构群生成元 $\\hat{T}$ 的本征值）\n\nprimary共形维度 $h_l = l_k$（壳层角动量，$l_k = k-1$ 由 SU(5) Dynkin图深度严格推导），descendant共形维度 $h = n + l$（Madelung规则）。\n\n**和乐平庸化 = 闭壳层稳定**：\n\n和乐平庸化 $W(\\gamma) = 1$（$\\delta_v = 0$）对应：\n- 纤维丛：平坦联络，无曲率集中\n- CFT：monodromy平凡，共形块单值\n- 物理：闭壳层稳定构型（稀有气体）\n\n和乐非平庸化 $W(\\gamma) \\neq 1$（$\\delta_v \\neq 0$）对应：\n- 纤维丛：曲率集中，非平坦联络\n- CFT：monodromy非平凡，共形块多值\n- 物理：开壳层，化学活性\n\n### 9.5 同步算符 = CFT mode算符：同步方程 = 最高权条件\n\n**同步算符**（§4.2-§4.3）：\n\n$$\\hat{\\mathcal{S}}_k^{\\text{(full)}} = \\underbrace{\\frac{L_u}{2\\pi ☯}\\sqrt{1-\\beta\\hat{\\delta}_v^{(k)}}}_{\\text{核子部分（径向）}} \\cdot \\hat{\\mathbb{I}}_{G_k} + \\underbrace{\\hat{C}_2(G_k)}_{\\text{Casimir部分（角向）}}$$\n\n**CFT mode算符**：\n\n$$\\hat{L}_0 + \\hat{C}_2(G_k) = \\underbrace{\\hat{L}_0}_{\\text{descendant level（径向）}} + \\underbrace{\\hat{C}_2(G_k)}_{\\text{角动量Casimir（角向）}}$$\n\n**严格对应**：\n\n$$\\boxed{\\hat{\\mathcal{S}}_k^{\\text{(full)}} \\;\\longleftrightarrow\\; \\hat{L}_0 + \\hat{C}_2(G_k)}$$\n\n| 同步算符 | CFT mode算符 | 对应机制 |\n|:---|:---|:---|\n| 核子部分 $\\frac{L_u}{2\\pi ☯}\\sqrt{1-\\beta\\hat{\\delta}_v^{(k)}}$ | $\\hat{L}_0$（descendant level） | 径向量子数 $n$ |\n| Casimir部分 $\\hat{C}_2(G_k)$ | $\\hat{C}_2(G_k)$（角动量Casimir） | 壳层角动量 $l$ |\n| 本征值 = 耦级 $n_k = C_k$ | 本征值 = 共形维度 $h = n + l$ | §9.5.1严格推导 |\n| 同步方程 $\\hat{\\mathcal{S}}\\Psi = n\\Psi$ | 最高权条件 $\\hat{L}_0\\phi = h\\phi$ | §9.5.2严格对应 |\n\n#### 9.5.1 耦级 → 共形维度的严格推导\n\n同步算符本征值（耦级）：\n\n$$n_k = C_k = l_k(l_k+1) + \\frac{3}{4}$$\n\nCFT mode算符本征值（共形维度）：\n\n$$h = h_{\\text{primary}} + n_{\\text{desc}} = l_k + n$$\n\n其中 $n$ 是descendant level（主量子数），$l_k$ 是primary共形维度（角动量）。\n\n**二者的关系**：\n\n同步算符的Casimir部分给出轨道角动量平方 $l_k(l_k+1)$（壳层结构），核子部分给出descendant level $n$（径向量子数）。完整同步算符的本征值：\n\n$$\\hat{\\mathcal{S}}_k^{\\text{(full)}}\\,\\Psi_{n,l} = \\underbrace{(n + l_k(l_k+1))}_{\\text{轨道部分}}\\,\\Psi_{n,l} + \\underbrace{\\frac{3}{4}}_{\\text{自旋部分}}\\,\\Psi_{n,l}$$\n\n自旋部分 $s(s+1) = 3/4$（$s = 1/2$）分离后，轨道部分 $n + l_k(l_k+1)$ 中 $l_k(l_k+1)$ 为 Casimir 本征值（与 primary 共形维度 $h_l = l_k$ 通过 $l_k \\leftrightarrow l_k(l_k+1)$ 对应），$n$ 为 descendant level。\n\n#### 9.5.2 同步方程 = 最高权条件\n\n**同步方程**：\n\n$$\\hat{\\mathcal{S}}_k\\,\\Psi_k = n_k\\,\\Psi_k$$\n\n物理意义：重组（核子量子振荡 + 曲率涨落 + 耦合常数涨落）联立求解，选出离散的同步本征态。\n\n**CFT最高权条件**：\n\n$$\\hat{L}_0\\,\\phi = h\\,\\phi, \\quad \\hat{L}_{n>0}\\,\\phi = 0$$\n\n物理意义：primary operator是Virasoro代数的最高权表示，descendant由 $\\hat{L}_{-n}$ 生成。\n\n**严格对应**：\n\n$$\\boxed{\\hat{\\mathcal{S}}_k\\,\\Psi_k = n_k\\,\\Psi_k \\;\\longleftrightarrow\\; \\hat{L}_0\\,\\phi = h\\,\\phi}$$\n\n- 同步方程选出离散本征态 $\\Psi_k$（耦级 $n_k$） → 最高权条件选出primary $\\phi$（共形维度 $h$）\n- 紧化U(1)边界条件 $\\psi(u + L_u) = \\psi(u)$ → Kac-Moody代数的可积表示条件（水平 $k$ 为正整数）\n- 等价关系锁定声子占据数 $N_k$ → fusion rules锁定允许的descendant level $n \\geq l + 1$\n\n### 9.6 Dirac条件 = 共形自举方程：严格证明\n\n**纤维丛Dirac方程**：\n\n$$D\\psi = 0 \\quad \\text{（协变作用为零）}$$\n\n其中 $D = \\gamma^\\mu \\nabla_\\mu$ 是Dirac算符，$\\nabla_\\mu = \\partial_\\mu + \\mathcal{A}_\\mu$ 是协变导数。\n\n物理意义：截面在联络作用下“无加速”——物理场满足规范条件。\n\n**CFT共形自举方程**：\n\n$$\\sum_p C_{ij}^p\\,C_{pk}^m = \\sum_p C_{jk}^p\\,C_{ip}^m \\quad \\text{（OPE结合律）}$$\n\n物理意义：OPE的配对顺序不影响结果——共形场论的代数自洽性。\n\n**严格对应**：\n\n$$\\boxed{D\\psi = 0 \\;\\longleftrightarrow\\; \\text{OPE结合律（共形自举方程）}}$$\n\n**证明链条**：\n\n1. **Dirac方程 → 截面的协变作用为零**：$D\\psi = 0$ 意味着截面 $\\psi$ 在联络 $\\mathcal{A}$ 的作用下“无源”——物理场是联络的**零模**。\n\n2. **零模 → primary operator**：在CFT对应下，联络的零模对应于Virasoro代数的最高权态（primary operator）——$\\hat{L}_{n>0}\\phi = 0$ 是“无源”条件的CFT表述。\n\n3. **primary的OPE → 结合律**：primary operator的OPE $\\phi_i \\times \\phi_j = \\sum_p C_{ij}^p \\phi_p$ 必须满足结合律（配对顺序不影响结果），否则OPE不自洽。\n\n4. **结合律 → 共形自举方程**：OPE结合律就是共形自举方程——代数自洽性条件。\n\n5. **可积条件 → Bianchi = Jacobi**：Dirac方程的可积条件 $[D, D] = F$（曲率）对应OPE结合律的相容条件——Bianchi恒等式 = Jacobi恒等式（§9.3）。\n\n$$\\boxed{D\\psi = 0 \\;\\xrightarrow{\\text{零模}}\\; \\hat{L}_{n>0}\\phi = 0 \\;\\xrightarrow{\\text{OPE}}\\; \\text{结合律} \\;\\xrightarrow{\\text{自洽}}\\; \\text{共形自举方程}}$$\n\n**$A_4$ 具体化**：$A_4$结合律方程的解恰好锁定s,p,d,f四种模式，禁戒g。这是Dirac方程=共形自举方程在CQM中的具体实例——壳层标签 $l_k = k-1$ 由 SU(5) Dynkin图深度严格推导，第5个（g）的等价关系无解。\n\n### 9.7 同步算符 = 紧化算符：三层关系统一\n\n同步算符=紧化算符在三个层次有不同表述，此处统一说明：\n\n| 层次 | 文档 | 定义 | 物理意义 |\n|:---|:---|:---|:---|\n| **前时空层**（基态定义） | 因果网络同步理论（CNST，`01 核心理论/CQM_核心_因果网络同步理论.md`）§4 | $\\hat{\\mathcal{S}}_0: \\mathcal{H}_{\\text{auto}}(\\mathrm{GL}(5)) \\to \\mathcal{H}_{\\text{phys}}(\\text{SU}(5))$ | 紧化投影：GL(5)自守形式 → SU(5)物理表示 |\n| **FG纤维丛层**（截面实现） | §4 | $\\hat{\\mathcal{S}}_\\ell$ = 紧化算符在层级截面空间 $\\Gamma(P_\\ell)$ 的实现 | 谱算符：给出群谱 $G_k$ |\n| **FG核心层**（因子再现） | FG核心 §4.4 | $\\hat{\\mathcal{S}}_{\\text{FG}}$ = 前时空紧化结构在GL(5)固定层级的再现 | 物理可观测的耦合常数 $g_k$ |\n\n**层次关系**：\n\n$$\\underbrace{\\hat{\\mathcal{S}}_0}_{\\text{前时空层：GL(5)\\to SU(5)}} \\;\\xRightarrow{\\text{SU(5)重组实现}}\\; \\underbrace{\\hat{\\mathcal{S}}_\\ell}_{\\text{FG纤维丛层：截面空间}} \\;\\xrightarrow{\\text{取GL(5)固定层级}}\\; \\underbrace{\\hat{\\mathcal{S}}_{\\text{FG}}}_{\\text{FG核心层：GL(5)固定层级}}$$\n\n- **前时空层**：紧化投影 $\\hat{\\mathcal{S}}_0$ 将非紧GL(5)自守形式投影到紧SU(5)表示。配对不变量 $\\mathfrak{c}_n$ 为实 $\\Leftrightarrow$ 紧化条件可解 $\\Leftrightarrow$ 各层L函数零点在临界线上（GRH）。\n- **FG纤维丛层**：SU(5)（$A_4$ 根系）经重组实现 $\\Rightarrow U(1)\\times SU(2)\\times SU(3)$，紧化算符下放到每层纤维丛的截面空间 $\\Gamma(P_\\ell)$，实现为 $\\hat{\\mathcal{S}}_\\ell = \\frac{L_u}{2\\pi ☯}\\sqrt{1-\\beta\\hat{\\delta}_v^{(\\ell)}}$。\n- **FG核心层**：取GL(5)固定层级，紧化算符再现为 $\\hat{u}$ 的谱边界条件 $\\psi(u+L_u) = \\psi(u)$（紧化U(1)玻尔-索末菲量子化），给出物理可观测的耦合常数 $g_k$。\n\n**与CFT的对应**（§9.5）：三层同步算符均对应CFT的mode算符 $\\hat{L}_0 + \\hat{C}_2$，但所处层级不同——前时空层对应GL(5) Kac-Moody代数，FG纤维丛层对应SU(2) Kac-Moody代数（重组实现后），FG核心层对应U(1)自由玻色子（GL(5)固定层级）。\n\n### 9.8 完整对应表\n\n| 纤维丛结构 | CFT结构 | 对应机制 | 严格性 |\n|:---|:---|:---|:---|\n| 截面 $\\psi$ | primary operator $\\phi$ | 态-算符对应 | §9.1 |\n| 联络 $\\mathcal{A}$ | Virasoro $\\{\\hat{L}_n\\}$ | 模展开 | §9.2 |\n| 曲率 $F$ | 对易子 $[\\hat{L}_m, \\hat{L}_n]$ | $F=d\\mathcal{A}+\\mathcal{A}\\wedge\\mathcal{A}$ | §9.3 |\n| Bianchi恒等式 | Jacobi恒等式 | 代数自洽性 | §9.3 |\n| 和乐 $W(\\gamma)$ | monodromy $e^{2\\pi ih}$ | $h = \\delta_v\\hat{T}/(2\\pi)$ | §9.4 |\n| 同步算符 $\\hat{\\mathcal{S}}$ | mode算符 $\\hat{L}_0 + \\hat{C}_2$ | 本征值=共形维度 | §9.5 |\n| 同步方程 $\\hat{\\mathcal{S}}\\Psi = n\\Psi$ | 最高权条件 $\\hat{L}_0\\phi = h\\phi$ | 重组→离散谱 | §9.5 |\n| Dirac条件 $D\\psi = 0$ | 共形自举方程（OPE 结合律） | 零模→primary→结合律 | §9.6 |\n| 紧化算符 | CFT mode算符 | 三层统一 | §9.7 |\n| 和乐平庸化 | 闭壳层稳定 | $\\delta_v = 0 \\Leftrightarrow$ 稀有气体 | §9.4 |\n\n### 9.9 局域分析足够性原理\n\n**问题**：底空间 $M_\\ell$ 上有大量Regge顶点 $\\{v\\}$，每个顶点有不同的曲率涨落态 $\\hat{\\delta}_v|0\\rangle$。为什么只需要取**一个**能体现底空间分布性质的代表性局域来分析，即可得到整个纤维丛的同步谱？\n\n**回答**：CFT算符插入生成局域态，但同步算符是整体定义的——其本征值谱由代数结构固定，不依赖于插入点。因此局域分析足够。\n\n#### 9.9.1 数学表述\n\n**CFT算符插入生成态**（态-算符对应，§9.1）：\n\n$$\\mathcal{O}(z)|0\\rangle = |\\mathcal{O}(z)\\rangle$$\n\n在CQM中，局域算符是曲率算符 $\\hat{\\delta}_v$，插入到Regge顶点 $v$ 生成局域态：\n\n$$\\hat{\\delta}_v |0\\rangle = |\\delta_v\\rangle$$\n\n**同步算符的普适性**（§9.5, §9.7）：\n\n$$\\hat{\\mathcal{S}}_k = \\frac{L_u}{2\\pi ☯}\\sqrt{1-\\beta\\hat{\\delta}_v^{(k)}}$$\n\n同步算符 $\\hat{\\mathcal{S}}_k$ 的本征值谱 $\\{n_k\\}$ 由 SU(5) 简单根的 Dynkin 图深度严格推导（$l_k = k-1$）：\n\n- 本征群 $\\{R_k\\}$、角动量 $\\{l_k = k-1\\}$、容量 $\\{N_k^{\\max} = 2(2l_k+1)\\}$ 均由 SU(5) 简单根的 Dynkin 图深度严格推导\n\n**关键点**：本征值谱 $\\{n_k\\}$ **不依赖于具体的插入顶点 $v$**，只依赖于代数结构。\n\n#### 9.9.2 物理图像\n\n| 层面 | 局域 | 整体 |\n|:---|:---|:---|\n| **态** | 每个顶点 $v$ 有不同的曲率涨落态 $\\lvert\\delta_v\\rangle$（离散态多） | 所有态遵守同一套同步方程 $\\hat{\\mathcal{S}}\\Psi = n\\Psi$ |\n| **算符** | 曲率算符 $\\hat{\\delta}_v$ 是局域的（定义在单个顶点） | 同步算符 $\\hat{\\mathcal{S}}$ 是整体的（定义在整个截面空间 $\\Gamma(P_\\ell)$） |\n| **谱** | 局域态携带顶点的曲率信息 | 同步本征值 $\\{n_k\\}$ 由 SU(5) Dynkin图深度严格推导（$l_k = k-1$），与顶点无关 |\n| **CFT对应** | 算符插入 $\\mathcal{O}(z)\\lvert0\\rangle$ 生成局域态 | OPE系数 $C_{ij}^k$ 由共形对称性固定，不依赖插入点 $z$ |\n\n#### 9.9.3 严格论证\n\n**命题**：取一个能体现底空间分布性质的代表性局域 $v^*$（如质子 $A_4$ 的平坦顶点 $\\bar{\\delta}_{v^*}=0$，或中子的背景曲率顶点 $\\bar{\\delta}_{v^*}\\neq 0$），分析其同步谱 $\\hat{\\mathcal{S}}\\Psi_{v^*} = n\\Psi_{v^*}$，结果普适于整个纤维丛。\n\n**证明**：\n\n1. **所有顶点共享同一代数结构**：Regge剖分的每个4-单纯形共享同一个 $A_4$ 嘉当矩阵（§6, §4.0）。嘉当矩阵是联络的离散化，由4-单纯形的组合几何确定，与顶点位置无关。\n\n2. **同步算符的本征值由代数结构决定**：$\\hat{\\mathcal{S}}_k$ 的本征值 $n_k = C_k = l_k(l_k+1) + 3/4$，其中 $l_k = k-1$ 由 SU(5) 简单根的 Dynkin 图深度严格推导（§9.5.1）。本征值不依赖于具体的顶点 $v$。\n\n3. **CFT OPE系数的普适性**：OPE $\\mathcal{O}_i(z)\\mathcal{O}_j(0) \\sim \\sum_k C_{ij}^k z^{h_k-h_i-h_j}\\mathcal{O}_k(0)$ 中，系数 $C_{ij}^k$ 由共形对称性（Kac-Moody代数 + Virasoro代数）固定，不依赖于插入点 $z$（§9.5, CFT核心文档§3）。\n\n4. **局域态→整体谱**：在代表性顶点 $v^*$ 插入算符 $\\hat{\\delta}_{v^*}$ 生成局域态 $|\\delta_{v^*}\\rangle$，用同步算符 $\\hat{\\mathcal{S}}$ 分析得到本征值谱 $\\{n_k\\}$。由于步骤1-3，任何其他顶点 $v'$ 的分析给出相同的本征值谱。$\\square$\n\n#### 9.9.4 与CFT自举的关系\n\nCFT共形自举（OPE结合律 = 共形自洽，§9.6）的普适性是局域分析足够性的代数基础：\n\n- **共形自举方程** $\\sum_p C_{ij}^p C_{pk}^q = \\sum_p C_{jk}^p C_{ip}^q$（结合律）不依赖插入点\n- **解空间**由代数结构（$A_4$ 嘉当矩阵 + Kac-Moody代数）固定\n- 因此，在一个点解自举方程，解普适于整个共形场\n\n**总结**：\n\n$$\\boxed{\\text{局域算符插入} + \\text{整体同步规则（同一代数结构）} = \\text{局域分析足够}}$$\n\n底空间上离散态虽多，但都遵守同一套同步算符 $\\hat{\\mathcal{S}}$ 和同步方程 $\\hat{\\mathcal{S}}\\Psi = n\\Psi$。取一个体现底空间分布性质的代表性局域，分析其同步谱，结果由 $A_4$ 代数结构统一给出，普适于整个纤维丛。\n\n### 9.10 相关文档\n\n- `FG_核心理论.md`：FG物理机制层（同步算符比丛作用量更根本的论证、SU(5) 重组实现 ⇒ $A_4$ → 4 耦合常数 → $\\alpha^{-1}$）\n- `01 核心理论/CQM_核心_共形场论与OPE.md`：CFT一般理论（OPE、共形自举、Kac-Moody代数、共形块、指数映射与合流极限）\n- `01 核心理论/CQM_核心_因果网络同步理论.md`：因果网络同步理论（前时空层紧化算符定义、黎曼结构→CNST七条提取、两种引力同步诠释）\n", "backlinks": ["D001", "D005", "D007", "D008", "D010", "D011", "D012", "D022", "D023", "D024", "D025", "D028"], "outlinks": ["D007", "D011", "D012", "D014"]}, {"id": "D003", "doc_id": "D003", "title": "术语表", "path": "一体化研究/附录/术语表.md", "group": "一体化研究", "layer": 0, "type": "权威基准", "text": "# CQM 术语表\n\n> 本表汇总 CQM 理论的全局术语与符号标准，供自动化比对与人工审校使用。\n> 权威源：`README.md` 符号约定与数值表 > 各概念权威定义处 > `.workbuddy/审校/00_修订基准与准则.md` §2。\n> 本表不新增任何术语，仅汇总既有标准。\n\n---\n\n## 一、核心符号（不得改名、不得改变数值）\n\n| 概念 | 标准写法 | 数值/定义 | 权威处 |\n|:---|:---|:---|:---|\n| 相变量子 | `$☯$`（英文语境 `$\\mathscr{C}$`） | $☯=\\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1}\\approx0.02309570897$ | `01 核心理论/CQM_核心_集成理论.md` |\n| 第一耦级 | `$\\mathfrak{c}_1$` | $200.04045483$（$=1/4+\\gamma_1^2$） | 集成理论 |\n| Mathieu 临界 | `$\\lambda_c$` | $1.316022911$（$\\lambda_{\\min}(q_c)=2q_c$ 唯一根，$\\lambda_c=4q_c$） | 集成理论 |\n| Dynkin 指数比 | `$I$` | $T(\\mathbf{24})/T(\\mathbf{8})=5/3$ | 集成理论 |\n| 谱修正 | `$\\kappa$` | $(31+☯)/30$ | 集成理论 |\n| 时空同步前沿速度 | `$c$` | 不承担量纲转换 | 全库统一 |\n| 禁闭映射常数 | `$K_L$` | 换算比值，非算符 | 集成理论 |\n| 转换常数族 | `$K_L,K_M,K_Q,K_\\Theta,K_N,K_J$` | $K_M=G_N^{-1}$ | 集成理论 |\n| 固有时流速 | `$v_\\tau$` | $v_\\tau\\equiv d\\tau/dt$ | FG 纤维丛理论 |\n| 固有时流速共轭动量 | `$p_u$` | —— | FG 纤维丛理论 |\n| 基本自守量纲 | `$[G_{\\max}(f)]$` | 极大关系群的同构类（唯一名；曾用名「基础量纲」「基础自守量纲」已废止） | `01 核心理论/CQM_核心_量纲与群论.md` §6.5 |\n| 量纲群 | 量纲群 | 唯一名（无别名） | `01 核心理论/CQM_核心_量纲与群论.md` §6.4.7 |\n| 自守量纲 | 自守量纲 | 上位类：基本＋子（有自守形式对应） | `01 核心理论/CQM_核心_量纲与群论.md` §6.5.13 |\n| 子自守量纲 | 子自守量纲 | 极大关系群的子群 $[G']$（$G'\u003cG_{\\max}$）定义的种类＝量纲内分化 | `01 核心理论/CQM_核心_量纲与群论.md` §6.5.13 |\n| 派生量纲 | 派生量纲 | 无自守形式对应的人为定义计量层量纲（物质的量；≠ SI 导出量纲） | `01 核心理论/CQM_核心_量纲与群论.md` §6.5.13 |\n| 属性锚点 | 属性锚点 | $GL(n)$ 的矩阵元素 $g_{ij}$（属性先在侧的基点；≠ 自守链的锚点 §7.3） | `01 核心理论/CQM_核心_量纲与群论.md` §6.5.13 |\n| 潜在-显现化 | 潜在-显现化 | 「潜在-显现」指**属性**的两态：先在为潜在，经关系而显现（实例属性、自守形式、量纲）；潜在-显现化＝属性由潜在态向显现态转化的全过程，沿三环节展开：关系分化→实例化→具体化 | `01 核心理论/CQM_核心_量纲与群论.md` §6.5.13 |\n\n## 二、牛顿引力常数\n\n$$G_N=\\frac{\\hbar c}{m_p^2}\\,I\\,\\lambda_c\\,☯^2\\,\\mathfrak{c}_1\\,\\exp\\!\\left(-\\frac{2}{☯}\\right)\\,(1+\\kappa ☯)$$\n\n| 量 | 值 |\n|:---|:---|\n| 理论值 | $6.708811657\\times10^{-39}$ GeV$^{-2}$ |\n| SI 值 | $6.6742810045\\times10^{-11}$ m$^3$kg$^{-1}$s$^{-2}$ |\n| 偏差 | $-3$ ppm |\n| 质子质量 | $m_p=0.9382720882$ GeV |\n\n> 凡出现 $G_N$ 数值或偏差之处，必须带限定语：\"构造后验数字校验，待独立复现\"。\n\n## 三、群与代数写法\n\n| 对象 | 标准写法 | 变体（须改） |\n|:---|:---|:---|\n| 具体 n | `$\\mathrm{GL}(5)$`、`$\\mathrm{SU}(5)$`、`$\\mathrm{GL}(2)$` | `GL_5`、`SU_5`、`GL5`、`SU5` |\n| 一般 n | `$\\mathrm{GL}(n)$`、`$\\mathrm{SU}(n)$` | `GLn`、`SUn` |\n| 嘉当矩阵 | `$A_4$`（数学环境） | 纯文本 `A4` |\n| 李代数 | `$\\mathfrak{su}(5)$` | `$\\hat{\\mathfrak{su}}_5$` |\n| 本征群 | `$\\{SU(2)_k\\}_{k=1}^{4}$`（全紧致，单因子） | `$\\{SU(2)_k\\}_{k=1}^4$`、`$SU(2)_{orb}\\times SU(2)_{spin}$` |\n| 商群 | `$U(1)//\\mathbb{Z}_n$` | `$Z_n$` |\n\n## 四、中文译名标准\n\n| 标准写法 | 须改的变体 | 说明 |\n|:---|:---|:---|\n| 时空同步前沿速度 | 时空前沿同步速度 | 词频 34:9 |\n| 晶胞量子振荡 | 晶格量子振荡 | 词频 76:11 |\n| 质数前网络 | 前组织网络 | 词频 34:3 |\n| p 进（中文行文带空格） | p 进 | 专名保留 p-adic |\n| Adele（专名首字母大写） | adele | 形容词 adelic |\n| 万尼尔函数／万尼尔插值 | 外尔函数／外尔插值 | 仅指 Wannier 处 |\n| 贝里曲率 | Berry 曲率（中文行文） | 首现可括注 Berry curvature |\n| 因果网络同步理论（CNST） | 裸缩写 CNST | 首现处展开 |\n| Sierra-CQM 耦谱定理 | Sierra-CQM 定理 | 用 README 口径 |\n| 结构群叠加态 | 叠加群／叠加的超导群 | 首现处说明同义 |\n| 同步算符 | 三词随意混用 | 首现处写明\"同步算符=紧化算符的层级实现\" |\n| 引力因果限制场（FG） | 引力因果场 | 主名带\"限制\"，余作别名括注 |\n| 超导同步算符 | `$\\hat{\\mathcal{S}}_{\\text{super}}$` | 旧符号 `$\\hat{\\mathcal{S}}_{\\text{SC}}$` 须改 |\n\n## 五、人名区间（统一 en dash `–`）\n\nHilbert–Pólya、Berry–Keating、Fröhlich–Morchio–Strocchi、Fradkin–Shenker、Kibble–Zurek、Sekino & Susskind\n\n## 六、箭头约定\n\n- `⇒` **仅**表示**重组实现**；一般演化、极限、映射一律用 `→`。\n- 链条写法：`$\\mathrm{GL}(5)$ ⇒ $\\mathrm{SU}(5)$（重组实现）`。\n\n## 七、不得擅自统一的登记项\n\n以下记号/数值在库中分属不同主用文档，**无法判定为同一量的异写**，保持原样并登记：\n\n| 记号/争议 | 分布 | 处置 |\n|:---|:---|:---|\n| $\\Delta\\delta_v$ 与 $\\Delta\\delta_0$ | 专题与扩展、核心理论、集成理论、统一方法论 | 保持原样，逐处登记 |\n| $K_{\\rm eff}$ 幂指数、$\\theta_D$ 指数多套取值 | 专题与扩展 §11 | 保持原样，登记 |\n| 同位素趋势方向 | 专题与扩展 | 保持原样，登记 |\n| 缺口 G5 归属 | 集成理论 / 黎曼猜想 / 待推1 | 按 README 与集成理论统一 |\n\n---\n\n*依据：`00_修订基准与准则.md` §2 · 生成时间：2026-10-05*", "backlinks": [], "outlinks": ["D001", "D005", "D009"]}, {"id": "D004", "doc_id": "D004", "title": "缺口台账", "path": "一体化研究/附录/缺口台账.md", "group": "一体化研究", "layer": 0, "type": "权威基准", "text": "# CQM 缺口台账\n\n> 本台账汇总 CQM 理论全部未闭合缺口，与 Lean 形式化状态联动。\n> **禁止**将\"未解决\"改写为\"已解决\"；缺口闭合前须保留标注。\n> 权威划分：`README.md` 缺口编号权威划分 > 各概念权威定义处。\n\n---\n\n## 一、缺口总览\n\n| 编号范围 | 主题 | 权威处 | 数量 |\n|:---|:---|:---|:---|\n| C | 核心存在性缺口 | `01 核心理论/CQM_核心_集成理论.md` | 1 |\n| G2–G8 | 核心理论缺口 | `01 核心理论/CQM_核心_集成理论.md` | 7 |\n| G9–G22 | 超导涌现链缺口 | `06 超导/CQM_超导_专题与扩展.md` §13 | 14 |\n| N1–N4 | 中子缺陷矩阵与 FG 角亏 | `01 核心理论/CQM_核心_引力存在论前提.md` §二.5 | 4 |\n| H3.1–H3.3 | 层级假设 | 各相关文档 | 3 |\n\n## 二、缺口明细\n\n| 编号 | 简述 | 状态 | Lean 对应 | 备注 |\n|:---|:---|:---|:---|:---|\n| C | 核心存在性 | `axiom` | —— | 严谨性最大敞口 |\n| G2 | —— | `待证明` | —— | —— |\n| G3 | —— | `待证明` | —— | —— |\n| G4 | —— | `待证明` | —— | —— |\n| G5 | 归属待裁定 | `待证明` | —— | 集成理论/黎曼猜想/待推1 间归属待作者裁定 |\n| G6 | —— | `未定义（占位）` | —— | README：G6 未定义，此行为占位 |\n| G7 | —— | `待证明` | ——

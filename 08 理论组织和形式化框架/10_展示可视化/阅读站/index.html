                                            |\n| :---------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| [CQM 核心 集成理论](#/doc/D005)                 | CQM 完整理论框架（十三部分）：哲学与本体论（物质先在、存在先于过程、再生产）、理论定位与关系、海森堡代数与相变量子 $☯$、耦合空间与 Hilbert 空间（Sprinkling 测度）、动力学（一阶层/二阶层、Berry–Keating 对应）、前核子自组织 = 禁闭边界（条件性幺正）、SU(5) 涌现与谱结构（4-单纯形、$\\alpha$ 与 $G_N$ 推导；§7.1 含“一证七联”框架：核心定理退相干稳态是正四单纯形 $A_4$，七大关联为其推论，缺口 C 未闭合）、谱方程与黎曼零点（Sierra-CQM 耦谱定理）、前时空与两种引力（GR/FG 同源分化）、核子结构与元素层级（中子缺陷矩阵）、超导涌现完整机制、与标准理论的关系（贝尔不等式取消、测量问题消解）                                                                                                                                                                                                                                                                                                                                                                                                              |\n| [CQM 核心 引力存在论前提](#/doc/D006)       | 引力存在论前提（前时空〔先于引力〕+ FG/GR 两种引力）与精细引力纤维丛数学结构；前时空/FG/GR 对比总表、中子缺陷矩阵、缺口编号 N1–N4、Lean 形式化对应                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  |\n| [CQM 核心 因果网络同步理论](#/doc/D007)         | 因果网络同步理论（CNST）：因果动力学理论——描述引力如何使具体的因果结构/关系成为可能。物质先在，物理实在通过物质自组织（表现为退相干）同步化而涌现，质数前网络是描述该物质关系的数学结构。从黎曼结构提取七条同步要素；前时空与两种引力的同步诠释（与主体系术语统一）；引力是因果同步的必要前提（非充分）；超导 = 同步再锁定；§6.2 置乱-同步-超导-光速统一视图（§6.2.2 同步三环节：①前提同步=置乱 / ②实现一致性同步=多群叠加 / ③状态一致性同步=相位锁定）；§6.3 因果范畴与因果动力学（§6.3.6 引力具体表现与同步性质：普遍性质如c不依赖于引力场强度，具体依赖性质如固有时流速依赖于场强度）；黎曼猜想为关键缺口。发生学分层：基态同步是 SU(5)（GL(5) 自守形式经紧化），黎曼猜想是 GL(5) 固定层级的实谱条件，同步算符是紧化算符；物理系统固定在 GL(5) 层级（SU(5) 是含标准模型的最小单群）；完整发生学流程图见该文档 §9；§9.3 共振统一图景（共振总表、α 统一、相变量子 $☯$、超导谱结构）                                                                                                                                                                                                                                                           |\n| [CQM 核心 朗兰兹分层共振与相变量子](#/doc/D008) | 朗兰兹分层共振与相变量子统一框架：质数是源，GL(5) 是谐振腔，GRH 是实谱条件，同步算符是换能器，物理规范群是输出。**§0 发生学总纲**给出 CQM 本体论骨架最简洁链条（物质先在 → 质数自组织 → GL(5) 潜能先在 → SU(5) 基态 ⇒ 重组实现 ⇒ U(1)×SU(2)×SU(3)），并确立“前时空、FG 与朗兰兹纲领相关，GR 不确定”的哲学命题（本体论与朗兰兹纲领相关、认识论固定于 GL(5) 层级、观测受禁闭与能标锁死限制）。两个关键统一：(1) 精细结构常数 α 的数论-物理双重命名统一（SU(5)重组实现 ⇒ $A_4$嘉当矩阵 ⇒ 紧致壳层群$\\{SU(2)_k\\}_{k=1}^{4}$（全紧致） ⇒ U(1)电磁群耦合常数 ⇒ $\\alpha^{-1}$；$\\alpha^{-1}$是GL(5)固定层级整体的反映；**启发式类比**：α 在标准物理中仍为实验参数，此框架给出的数值仅为≈0.16%近似，非已被纯数论严格推导）；(2) 相变量子 $☯$ 固定于 GL(5) 层级（$☯ = \\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1} \\approx 0.02309570897$，谱表示 $\\sum 1/(\\gamma_n^2+1/4)$ 条件于 RH）。**§1.1 GL(5) 对称性分层**：跨层级对称性分类——单体结构对称性（基本物理/化学在 GL(5) 内）、多体统计对称性（物理/化学均为 $GL(5)+S_n$）、引力规范冗余 Diff(M)（无限维，正交于单体/多体分类）                                                       |\n| [CQM 核心 共形场论与OPE](#/doc/D012)         | CQM核心数学语言：**CFT描述了临界自组织态扩大的机制，同时也是同步的过程机制**。“与能量无关”=拉格朗日量中没有带量纲参数+耦合锁死为纯数字=共形固定点（$\\beta(g)=0$）。**共形自举（Conformal Bootstrap）=OPE结合律=共形自洽**：配对顺序不影响结果→锁死耦合常数为离散解。三角结构（耦合常数↔同步成本↔紧致群）的CFT实现。Dirac条件=共形自举方程的CQM具体化。**$A_4$结合律锁定s,p,d,f，禁戒g**。**§5.4 中央荷$c$与相变量子$☯$的关系**：$c$与$☯$同在GL(5)固定层级，$☯$控制有效中央荷。**§6.3–§6.4 径向波函数$R_{nl}(r)\\leftrightarrow$共形块$\\mathcal{F}_{n,l}(z)$**：节点数$=n-l-1$=descendant level（代数必然），拉盖尔多项式=Kac-Moody descendant结构，指数衰减=质量形变。**§10.1（状态表）Cr/Cu异常**：OPE系数在半满(d⁵)/全满(d¹⁰)点共振→能量交叉，Kac-Moody表示对称性极值。同步四阶段：预备（FG纤维丛——赝状态）→发生（同步方程——共振量子化）→过程（CFT——扩大动力学）→完成（状态跃迁）——幂律传播$r^{-2h}$是蔓延，共形自举是共形自洽条件。Casimir决定壳层容量，共形维度$h=n+l$决定填充顺序（Madelung规则），$A_4$给出$Z_{\\max}=118$                                                                         |\n| [CQM 核心 声子理论](#/doc/D011)                 | 声子是CQM的核心量子媒介——振荡的量子、曲率涨落的源、同步的前提、时空的前提。声子三层结构（前时空/GR/FG）、声子=曲率量子的严格构造、从位置-动量到声子的FG层推导、曲率涨落算符、同步方程作用于声子占据态、时空同步前沿速度$c=\\gamma_1\\ell_{\\text{pre}}$、声子与量纲归一化、声子与超导（晶胞量子振荡驱动同步再锁定）                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                |\n| [CQM 核心 量纲与群论](#/doc/D009)             | CQM 量纲与群论方案（十三节）：量纲发生学层级——时间 $T$（第一量纲）→长度 $L$（$K_L$，禁闭映射常数，无量纲→长度）→质量 $M$（$K_M$，$K_M=G_N^{-1}$）→电荷 $Q$（$K_Q$）→…；统一公式模式：旧量纲×特征常数=新量纲（新旧指发生学先后）；符号统一为 $K$ 下标（$K_L,K_M,K_Q,K_\\Theta,K_N,K_J$），另列与已有物理常数（$G_N,k_B,N_A,K_{cd}$）的对比；不采用自然单位制；电磁高斯单位制；$c$ 为时空同步前沿速度，不承担量纲转换；SI 作为唯一翻译对照；§6.3.1 $K_L$ 谱结构与数值状态（谱参数公式、几何确定 $K_L=\\sqrt{\\lambda_p r_p}/r_{\\text{GUT}}$、量纲地位＝禁闭映射常数（无量纲耦合壳→fm）、D4–D7 自对偶 $\\tfrac12:1:2$、两条值链 0.656/0.67860 fm（几何 0.6805，与标定值差 ~0.3%），值链间差 3.3%，$g_s^{IR}$ 张力 3.73%）；自守形式猜想（§七）；§八 自然单位制批判（还原论暴政）；§九 价值转型同构（自然单位制↔庸俗经济学）；§十 一与多辩证（多：自守形式不同量纲相同不能简单组合；一：量纲一致性→自守形式普遍特征；统一：一个谱多个投影）；§十一 弦论批判（不解决量纲疑问，彻底还原论）；十二、最终总结与 SI 七基对照（无量纲→时间特征常数未知、长度层特征常数为 $K_L$（值有待确定）、质量层特征常数为 $K_M$、$c^2$ 非量纲特征常数）；§12.1 与 CQM 框架衔接（$G_N$ 含 $\\hbar c$、谱算符无量纲）；§6.5.13 量纲总分类与 §13.3 终极定稿（本体论纲领：属性先在，关系潜在-显现化它——关系分化、实例化、具体化） |\n| [唯物主义群论](#/doc/D010) | 群论分类总纲（数学核心版；本体论纲领「属性先在，关系潜在-显现化它」见引言，三环节（关系分化／实例化／具体化）分别锚定 §2.2／§6.3／§8.2 与量纲文档 §6.5.13）：变换群三层结构 $\\mathrm{Sym}\\supset\\mathrm{Diff}\\supset GL$；群约束性定义（一般：适用于任意给定作用的群与任意被实现的对象；线性层 $GL(n)$ 四条基约束性／非线性层引力侧 $f^{*}J{=}J$）×派生方向（换 $J$／$\\mathbf{S}$／$\\mathbf{C}$／$\\mathbf{P}$）＋结构数据；统一约束形式 $\\mathcal{G}(J,\\sigma,\\lambda,D)$ 与前缀演算 $\\mathbf{S}/\\mathbf{C}/\\mathbf{P}$；约束性的相对性；不变性（张量稳定子／不动点方程／对象层面不变性 vs 泛函不变／$\\mathrm{Diff}$ 层非线性稳定子／张量型约化群）；置换对称性 $S_n$ 三重角色与表示论、$S_2\\cong\\mathbb{Z}_2$ 最小离散约束性、$GL$ 层内部对称群谱系五层分类 |\n\n\n### 02 量子引力\n\n| 文档 | 内容 |\n|:---|:---|\n| [CQM 量子引力讨论](#/doc/D013) | **物质的质是作为其潜在而存在的**（不需要质本身叠加涨落）；CQM 不另立“量子引力”层，**FG 就是 FG**。比较两个候选：**假设一**（禁闭内部＝量子引力，无量纲不确定性关系读作因果序）在 ①固有时流速无从定义、而引力正系于它 ②因果结构的叠加与自组织层级性不相容 ③无事实依据——三处均不成立；**假设二**（禁闭内部＝QCD）把无量纲不确定性关系归还 FG，保留层级性与时空同步。假设二的后果：①$A_4=\\mathrm{Cartan}(\\mathrm{SU}(5))$ 描述**禁闭边界**、夸克不属该层，引力仍只由质子／中子这一有限本体提供 ②全息宇宙论依然不一定成立 ③时空同步依然成立 ④FG 与 QCD 尺度的区分仍需改进。**体系采用假设二**；在此假设下量子引力的实质内容全部由 FG 承接，通常归给量子引力的内容由 **FG** 承担 |\n\n### 03 引力与退相干\n\n| 文档 | 内容 |\n|:---|:---|\n| [CQM 引力 GN可能公式](#/doc/D014) | 牛顿引力常数 $G_N$ 的可能公式（框架内构造）：$G_N = \\hbar c \\cdot I \\cdot \\lambda_c \\cdot ☯^2 \\cdot \\mathfrak{c}_1 \\cdot \\exp(-2/☯) \\cdot (1 + \\kappa ☯) / m_p^2$。计算值与实验值偏差约 $-3$ ppm（构造后验数字校验，待独立复现；以其纯数学“推导” $G_N$ 未被主流学界当作公认独立推导） |\n| [CQM 退相干 引力因果场](#/doc/D015) | 引力因果限制场退相干理论：因果限制场作为退相干源，非微扰推导退相干速率与因果结构的关系 |\n| [CQM 退相干 跨层级深耦合与唯一性难题](#/doc/D016) | 跨层级退相干深耦合机制与唯一性难题：CQM 提出跨层级退相干深耦合机制统一退相干过程，退相干由多种物理过程共同参与、无单一主导（凡退相干都与引力有关；退相干是子类自组织的表现），贝尔不等式在跨层级耦合下的消解 |\n\n\n### 04 前沿研究\n\n| 文档                                                                   | 力讨论.md` |\n| [CQM 框架路线与理论纪要](../../../归档/CQM_框架路线与理论纪要.md) | 已归档：CQM 理论框架路线图与研究纪要（完整理论结构、层级递进、FG 层级同步算符体系、超导统一方法论、关键缺口与开放问题） |\n| [CQM 混合 混合矩阵](../../../归档/CQM_混合_混合矩阵.md) | 已归档：混合矩阵来源的随机传输方程推导（反厄米性约束+再生产幂等性系综平均→CKM/PMNS 为 $\\Sigma$ 本征矢量矩阵，Lindblad 结构，味守恒涌现） |\n| [CQM 退相干 质数数轴](../../../归档/CQM_退相干_质数数轴.md) | 已归档：禁闭退相干——质数数轴模型概念框架（禁闭=退相干=Sprinkling 密度边界发散相变，$\\frac{dN}{d\\tau}\\to0 \\Leftrightarrow \\rho(u)\\to\\infty \\Leftrightarrow$ 退相干） |\n| [FG 自守形式 从SU5到壳层结构的完整条件链](../../../归档/FG_自守形式_从SU5到壳层结构的完整条件链.md) | 已归档：从 SU(5) 到自守形式的完整 6 条件链（嘉当矩阵+数域+紧化+轨道+中心特征+Hecke 代数→壳层结构 $s/p/d/f$ 唯一确定，强多重性一+newform 理论） |\n\n### 归档 CNT\n\n| 文档 | 内容 |\n|:---|:---|\n| [归档 CNT/](../../../归档/归档 CNT) | CNT（闭合核理论）阶段（2025-2026）的全部历史研究文档。只读归档，不维护 |\n\n---\n\n## 核心数值结果\n\n| 参数 | 符号 | 数值 | 来源 |\n|:---|:---:|:---:|:---|\n| 相变量子 | $☯$ | $0.02309570897$ | $\\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1}$ |\n| 第一耦级 | $\\mathfrak{c}_1$ | $200.04045483$ | $1/4 + \\gamma_1^2$ |\n| Mathieu 临界 | $\\lambda_c$ | $1.316022911$ | 临界方程 $\\lambda_{\\min}(q_c) = 2q_c$ 的唯一根（$\\lambda_c = 4q_c$） |\n| Dynkin 指数比 | $I$ | $T(\\mathbf{24})/T(\\mathbf{8}) = 5/3$ | SU(5) 群论（SU(3) ⊂ SU(5) 嵌入） |\n| 谱修正 | $\\kappa$ | $(31+☯)/30$ | 4-单纯形/Adele 周期 |\n| **$G_N$ (理论公式值)** | | $\\mathbf{6.708811657 \\times 10^{-39}}$ GeV$^{-2}$ | CQM 推导（乘以 $\\hbar c$ 恢复完整量纲） |\n| **$G_N$ (SI)** | | $\\mathbf{6.6742810045 \\times 10^{-11}}$ m$^3$ kg$^{-1}$ s$^{-2}$ | CQM 推导 |\n| **偏差 vs CODATA** | | $\\mathbf{-3}$ **ppm** | 构造后验数字校验，待独立复现（α、$G_N$ 在标准物理中仍为实验参数/基本输入） |\n| $\\alpha^{-1}_{\\text{SU(5)}}$ | | $16384\\pi/375 \\approx 137.2583$ | 启发式近似，与实验 $137.035999$ 偏差≈0.162% |\n| **$\\alpha^{-1}_{\\text{Wyler}}$** | | $\\frac{16}{9}\\pi^{11/4}(5!)^{1/4} \\approx 137.0361$ | **Wyler常数**：$A_4$全部群论不变量（$h=5, r=4, \\lvert W\\rvert=120, \\text{tr}=8$），偏差仅**0.61 ppm**（粗表达式偏差 0.162%，两者之比约 2659；该比值是 ppm 的相对精度之比，不构成独立精度证据——Wyler 式本身在实验精度内，未提供超出实验的新信息） |\n\n---\n\n## 核心公式\n\n### 耦合空间不确定性关系\n\n$$[\\hat{u}, \\hat{p}_u] = i, \\quad \\frac{\\Delta r}{\\langle r \\rangle} \\cdot \\Delta v_\\tau \\geq \\frac{☯}{2}$$\n\n### 牛顿引力常数可能公式\n\n$$G_N = \\frac{\\hbar c}{m_p^2} \\cdot I \\cdot \\lambda_c \\cdot ☯^2 \\cdot \\mathfrak{c}_1 \\cdot \\exp\\left(-\\frac{2}{☯}\\right) \\cdot (1 + \\kappa ☯)$$\n\n### Sierra-CQM 耦谱定理\n\n$$\\mathfrak{c}_n^{(R)} = \\frac{1}{4} + \\gamma_n^2$$\n\n> **注（渐近 + 构造）**：此处 $\\mathfrak{c}_n^{(R)}=1/4+\\gamma_n^2$ 为**渐近定理**的精确形写（渐近式为 $\\mathfrak{c}_n^{(R)}=1/4+\\gamma_n^2+O(\\gamma_n^2/n)$，相对误差 $O(1/n)$）；有限 $n$ 的**精确等同属 CQM 框架自建构造**，超出渐近定理范围。算符形式借自 Berry–Keating/Sierra，**非 Sierra 2008/2011 原文的直接结果**（原文给出的是连续谱嵌入离散共振/与平均零点谱一致）。\n\n### 等价链：禁闭 = 前核子自组织\n\n$$\\frac{dN}{d\\tau} \\to 0 \\;\\Leftrightarrow\\; N(\\tau) \\to L \\;\\Leftrightarrow\\; u(\\tau) \\to \\ln L \\;\\Leftrightarrow\\; \\rho(u) \\to \\infty \\;\\Leftrightarrow\\; \\text{Decoherence}$$\n\n---\n\n## 关键术语\n\n| 术语 | 定义 |\n|:---|:---|\n| **耦合空间** | $u = \\ln r$，$r$ 为总耦合强度。量子力学的基本舞台 |\n| **因果集** | $(X, \\prec)$，再生产事件的离散因果序结构 |\n| **再生产** | $\\hat{\\mu}^2 = \\hat{\\mu}$，有限本体维持自身存在的操作 |\n| **嘉当矩阵** | $A_4 = \\text{Cartan}(\\text{SU}(5))$，禁闭边界涌现的代数结构 |\n| **L1 / L2 / L3+** | 禁闭内部 / 禁闭边界 / 外部时空 |\n| **退相干** | 双向干涉 → 单向因果，非交换 → 交换几何的相变 |\n| **条件性幺正** | 系统内部幺正演化依赖于边界持续存在 |\n| **属性锚点** | $GL(n)$ 的矩阵元素 $g_{ij}$——属性先在的基点（本体论纲领：属性先在，关系潜在-显现化它） |\n| **量纲谱系** | 基本自守量纲（极大关系群定义）／子自守量纲（子群定义，量纲内细分）／派生量纲（无自守形式对应，如物质的量） |\n\n---\n\n## 严格性缺口\n\n| 缺口 | 内容 | 优先级 |\n|:---|:---|---:|\n| **缺口 C** | 退相干稳态为何恰好是 $A_4$（正四单纯形）？ | 核心 |\n| **G2** | 耦合空间 $\\to$ 双曲 Laplacian 的必要性 | |\n| **G3** | $\\hat{D} = -i(\\partial_u - 1/2)$ 的唯一性 | |\n| **G4** | $\\hat{D} \\to \\hat{H} = \\hat{D}^2 + 1/4$ 的涌现 | |\n| **G5** | 退相干 $\\to$ 边界条件 $\\vartheta_n$ 锁定 | |\n| **G7** | $\\Sigma_{ij}$ 的第一性数值来源 | |\n| **G8** | CP 破坏相位 $\\delta$ 的严格来源 | |\n\n### 缺口编号的权威划分\n\n体系内有**三套独立编号**，作用域不同，引用时不得混用：\n\n| 编号系 | 作用域 | 权威定义处 |\n|:---|:---|:---|\n| **C / G2–G8**（现行定义覆盖 C 与 G2–G5、G7、G8；G6 未定义） | 核心理论（退相干、耦合空间、CP 相位） | 本表 + `01 核心理论/CQM_核心_集成理论.md` |\n| **G9–G22** | 超导涌现链 | `06 超导/CQM_超导_专题与扩展.md` §13 缺口表 |\n| **N1–N4** | 中子缺陷矩阵与 FG 角亏 | `01 核心理论/CQM_核心_引力存在论前提.md` §二.5 |\n\n**集成理论结论章的局部编号**：`CQM_核心_集成理论.md` 结论缺口表使用该章局部编号 A–E（A=二阶层在禁闭边界严格退相干为一阶层、B=非交换粗粒化极限、C=核心缺口 C、D=Lindblad 稳态→边-面关联矩阵、E=$\\lambda_c$ 方程是退相干的必然结果），不与 G2–G8 混用。\n\n**跨文档歧义登记**（同一记号在不同文档被赋予不同内容，引用时须指明出处）：\n\n| 记号 | 本 README / 超导 §13 的定义 | 其他文档的定义 |\n|:---|:---|:---|\n| **C** | 退相干稳态为何恰好是 $A_4$（正四单纯形） | `CQM_核心_因果网络同步理论.md:243` 记为“退相干稳态是 $\\{5,4\\}$ 镶嵌”——同一问题的不同表述，指向同一缺口 |\n| **G19** | 和乐相位闭合条件“$\\approx 1$”的容差标定 | `CQM_核心_因果网络同步理论.md:243` 记为“自由能 $F_n$ 可计算作用量” |\n| **G21** | 赝能隙相图 → 可观测量（ARPES/STM）映射 | `CQM_核心_因果网络同步理论.md:243` 记为“和乐容差标定” |\n| **N2** | 角亏-$\\delta$ 显式几何公式未写出 | `CQM_超导核心理论.md` §2.3 补注（对应 `SPAF.lean` N2 节）以 N2 指“微扰质量/行列式匹配”（该支已在 G14 闭合） |\n| **G17 / G20** | 不属缺口表编号（G17 = FG→GR 连续极限退化定理，G20-ext = 两质子耦合阈值，二者均已闭合） | `08 理论组织和形式化框架/04_Lean对接/Lean源码/README.md` |\n\n**G18 与 G22 的状态补充**：`专题与扩展.md` §13 的 G18/G22 行同时包含“已闭合环节”与“待办环节”（G18 行内含 $\\beta$、$C^2$、$\\Delta\\delta_0$ 的闭合推导，末尾列出 $q\\approx0$ 的理论解释、$E_2-E_1=\\Delta\\delta_0^2K_{\\text{eff}}$ 的严格证明、$S_{U(1)//\\mathbb{Z}_n}$ 的显式构造等未闭合项；G22 行的自由能 $F_n$ 停留在形式定义）。引用时须区分**行内已闭合项**与**行内未闭合项**，不得整行引作“闭合”或“未闭合”。\n\n---\n\n## 目录结构\n\n```\nCQMFormal/\n├── README.md ← 本文件\n\n├── 01 核心理论/ ← 理论主干\n│ ├── CQM_核心_集成理论.md\n│ ├── CQM_核心_引力存在论前提.md\n│ ├── CQM_核心_因果网络同步理论.md\n│ ├── CQM_核心_朗兰兹分层共振与相变量子.md\n│ ├── CQM_核心_共形场论与OPE.md\n│ ├── CQM_核心_声子理论.md\n│ ├── CQM_核心_量纲与群论.md\n│ └── CQM_核心_唯物主义群论.md\n├── 02 量子引力/\n│ └── CQM_引力_量子引力讨论.md\n├── 03 引力与退相干/\n│ ├── CQM_引力_GN可能公式.md\n│ ├── CQM_退相干_引力因果场.md\n│ └── CQM_退相干_跨层级深耦合与唯一性难题.md\n├── 04 前沿研究/ ← 前沿交叉文献调研与研究论文\n│ ├── CQM_前沿研究_量子快置乱普适速率极限.md\n│ ├── CQM_前沿研究_规范重组超导与SU5五重态内禀时间.md\n│ ├── CQM_前沿研究_GN第一性推导_公理化证明稿.md\n│ ├── CQM_前沿研究_质量研究思路汇总.md\n│ ├── CQM_前沿研究_待推1边界条件深度分析.md\n│ ├── FG_贝里曲率与Regge曲率的关联_研究论文.md\n│ ├── Wyler常数_A4群论分解.md\n│ ├── CQM_前沿研究_黎曼猜想证明思路.md\n│ ├── CQM_前沿研究_相变弧线与自守形式同步.md\n├── 05 方法论与批判/\n│ ├── CQM_方法论_HilbertPolya批判.md\n│ └── CQM_方法论_资本主义-旧物理-层级还原论批判.md\n├── 06 超导/ ← 超导涌现论\n│ ├── CQM_超导核心理论.md ← 完整超导理论（§1-§12、§17、§18.1/18.3，纯理论主线）\n│ ├── CQM_超导_专题与扩展.md ← 精简移出的材料/应用、推导/数值细节与进展/状态内容\n│ ├── CQM_超导_FG层级同步算符体系.md ← FG层级同步算符公理\n│ ├── CQM_超导_统一方法论.md ← 四层FG剖分方法论与统一计算链\n│ ├── 超导材料设计器/ ← 元素超导材料设计工具文档（8 篇）与配套 Godot 项目\n│ ├── cqm_analysis/ ← 数据（无 Tc 预测结果文件）\n│ │ ├── superconductors_deduplicated.csv ← 超导材料实验数据库（226 条记录）\n│ │ └── element_fg_table.json ← 元素FG表（118 个元素）\n│ └── cqm_framework/ ← 纯CQM实现\n│   ├── atom_db.py ← 共享原子数据库（118个元素）\n│   └── crystal_db.py ← 晶体结构数据库\n├── 07 精细引力（FG）/ ← 精细引力纤维丛理论\n│ ├── FG_核心理论.md\n│ └── FG_纤维丛理论.md\n├── 08 理论组织和形式化框架/ ← 结构化/形式化组织层（七维度；外部理论文本不动）\n│ ├── AGENTS.md ← 七维度运行手册（研究闭环判据）\n│ ├── README.md ← 总览\n│ ├── 00_外部引用/ · 01_结构化数据/ · 02_概念本体/ · 03_超图与理论图/\n│ ├── 04_Lean对接/ ← Lean 对接\n│ │ ├── Lean源码/ ← Lean 4 项目（11 库；8 库通过）\n│ │ ├── Lean结构提取/ ← 声明、模块、导入依赖\n│ │ ├── Lean↔概念映射.csv · lean代码路径.yaml · 蓝图/\n│ ├── 05_机器学习数据准备/ · 06_动态机制/ · 07_经验检验/ · 08_元理论反思/\n│ ├── 09_桥接与翻译/ · 10_展示可视化/ · 11_元数据/\n│ └── _build/ ← 可重复生成脚本\n\n├── 一体化研究/文献/ ← 参考文献 PDF\n│\n├── 归档/ ← 已归档文档\n│   ├── CQM_引力_量子引力集成.md\n│   ├── CQM_框架路线与理论纪要.md\n│   ├── CQM_混合_混合矩阵.md\n│   ├── CQM_退相干_质数数轴.md\n│   ├── FG_自守形式_从SU5到壳层结构的完整条件链.md\n│   └── 归档 CNT/ ← CNT 阶段历史文档（只读）\n```\n\n---\n\n## 参考文献\n\n核心文献参见各专题文档的参考文献章节。CNT 完整研究已发布于 Zenodo: DOI: 10.5281/zenodo.20804380。\n", "backlinks": ["D003", "D004", "D008", "D017"], "outlinks": ["D005", "D006", "D007", "D008", "D009", "D010", "D011", "D012", "D013", "D014", "D015", "D016", "D017", "D018", "D019", "D020", "D021", "D022", "D023", "D024", "D025", "D026", "D027", "D028", "D029", "D030", "D031", "D032", "D033"]}, {"id": "D012", "doc_id": "D012", "title": "共形场论与OPE", "path": "01 核心理论/CQM_核心_共形场论与OPE.md", "group": "01 核心理论", "layer": 1, "type": "理论主干", "text": "# CQM核心：共形场论与OPE——同步$⊗$耦合→群的数学基础\n\n**作者**：ruster\n\n## 概述\n\n**CFT描述了临界自组织态扩大的机制，同时也是同步的过程机制。** 自组织态是自组织的离散结果，不是自组织本身——自组织是过程，自组织态是该过程产出的离散结果。这不是类比，是数学上的精确等同。CFT（共形场论）不是一门深奥的玄学，它就是描述“一种态模式从触发点向全局无衰减蔓延”这套物理过程的数学语言。CQM里的“同步”——同一种态模式从局部扩展到全局——**同步是事件，同步有过程**（CFT的幂律传播 $r^{-2h}$ 描述同步的过程），同步方程描述的是整个同步事件（过程被压缩，体现为定态）。\n\n**共形自举（Conformal Bootstrap）本质是共形自洽。** “自举”的意思是：不靠实验输入任何数字，纯粹靠“逻辑上不能自相矛盾”这一条规则，把所有参数强行算出来。具体来说，自举的是**结合律（Associativity）**——你可以先配A+B得到C再配C+D，也可以先配B+D得到E再配A+E，**两种配对顺序的结果必须完全一样**。这个“无论怎么配对结果唯一”的条件叫做**自举方程**，它把耦合常数从自由变量压缩为**唯一的离散解**。在CQM中，这就是OPE的相容性条件，也就是Dirac条件的来源。\n\n**“与能量无关”的含义**：拉格朗日量里没有任何带量纲的参数（如质量$m$），且相互作用强度被锁死为确定的纯数字。没有质量尺子 = 没有特征长度 = 关联长度无穷大 = 标度不变 = 共形固定点（$\\beta(g)=0$）。\n\n**同步四阶段**：FG纤维丛+同步方程+CFT = 同步预备+同步发生+同步过程+同步完成。**同步预备**（FG纤维丛：各种赝状态——曲率算符 $\\hat{\\delta}_v$ 给出可能的同步模式，但还未同步）；**同步发生**（同步方程 $\\hat{\\mathcal{S}}\\Psi = n\\Psi$：共振量子化——什么样的态可以发生同步、同步成本多少）；**同步过程**（CFT：幂律传播 $r^{-2h}$——同步从触发点向全局扩大）；**同步完成**（状态跃迁——从未同步态跃迁到同步态）。共形自举是**共形自洽条件**（OPE结合律，静态条件）——配对顺序不影响结果，锁死结构常数。\n\n**核心结论**：CQM的三角结构（耦合常数↔同步成本↔紧致群）在共形固定点精确实现为CFT的OPE代数。共形自举方程（结合律）锁死耦合常数为离散值。元素FG的周期表第一性推导（Casimir→壳层容量、共形维度 $h_{\\rm shell}=n_{\\rm pr}+l$→Madelung规则、$A_4$→$Z_{\\max}=118$）是CFT框架的三大应用成果。\n\n## 1. 从“与能量无关”到共形固定点\n\n### 1.1 判据\n\n**“与能量无关”的判据**：拉格朗日量里没有任何带量纲的参数，且相互作用强度被锁死为确定的纯数字。\n\n$$\\mathcal{L} = \\underbrace{(\\partial\\phi)^2}_{\\text{动能}} - \\underbrace{V(\\phi)}_{\\text{势能}}$$\n\n具体来说就是两条：\n\n1. **势能中禁止质量项** $\\frac{1}{2}m^2\\phi^2$：质量 $m$ 自带固定能标，有 $m$ 就有特征长度 $1/m$，标度不变性立即被破坏。所以 $m=0$。\n2. **耦合常数不跑动** $\\beta(g)=0$：$\\lambda\\phi^n$ 中的 $\\lambda$ 必须是无量纲纯数字，且量子修正严格为零，$\\lambda$ 不随能标流动。\n\n$$\\boxed{\\beta(g) = \\frac{dg}{d\\ln\\mu} = 0 \\;\\;\\Longleftrightarrow\\;\\; \\text{没有质量尺子} + \\text{耦合锁死为纯数字} \\;\\;\\Longleftrightarrow\\;\\; \\text{共形固定点}}$$\n\n没有质量尺子 = 没有特征长度 = 关联长度 $\\xi_{\\rm corr} \\to \\infty$ = 标度不变 = 共形固定点。\n\n### 1.2 共形固定点的物理效应\n\n| 条件 | 物理效应 | 数学后果 | 势能中的表现 |\n|:---|:---|:---|:---|\n| $\\beta(g)=0$ | 耦合常数不跑动 | $g$ 是固定纯数字 | $\\lambda\\phi^4$ 的 $\\lambda$ 锁死 |\n| $m \\to 0$ | 能隙消失，关联长度 $\\xi_{\\rm corr} \\to \\infty$ | 无特征尺寸 | $m^2\\phi^2$ 项**禁止出现** |\n| $G_k$ 紧致 | 对称性恢复 | 序参数在紧致流形上等价分布 | — |\n\n**判据**：势能中没有任何带量纲的参数（如质量$m$），且相互作用强度被锁死为确定的纯数字。满足这两条就是共形固定点。\n\n### 1.3 普通微扰失效\n\n关联长度无穷大 $\\to$ 系统失去所有特征尺寸 $\\to$ 普通微扰展开（按 $1/\\xi_{\\rm corr}$ 展开）**严格发散**。\n\n**唯一替代工具**：共形场论的OPE——不依赖特征尺寸，直接描述算符乘积的代数结构。\n\n### 1.4 $\\phi^4$理论：维度依赖性的具体例子\n\n$\\phi^4$理论在不同时空维度下的共形性：\n\n| 时空维度 $d$ | $\\phi$ 的标度维度 | $\\lambda\\phi^4$ 是否允许 | $\\beta(\\lambda)$ | 是否CFT |\n|:---:|:---:|:---:|:---:|:---|\n| $d=2$ | $\\Delta_\\phi = 0$ | $\\phi^4$ 无量纲 | $\\beta=0$（经典精确） | **是CFT** |\n| $d=3$ | $\\Delta_\\phi = 1/2$ | $\\phi^4$ 有量纲 | $\\beta \\neq 0$（但存在Wilson–Fisher固定点） | 在固定点是CFT |\n| $d=4$ | $\\Delta_\\phi = 1$ | $\\lambda$ 无量纲 | $\\beta(\\lambda) = 3\\lambda^2/(16\\pi^2) \\neq 0$ | **不是CFT**（耦合跑动） |\n\n**$d=4$ 不是CFT的原因**：虽然 $\\lambda$ 无量纲，但量子修正使 $\\beta(\\lambda) \\neq 0$，耦合常数随能标跑动，标度不变性被量子涨落破坏。\n\n**$d=2$ 是CFT的原因**：$\\phi$ 的标度维度为零，$\\phi^4$ 项无量纲，且 $\\beta(\\lambda)=0$ 经典精确成立——没有量子修正破坏标度不变性。\n\n**CQM的定位**：CQM在共形固定点要求 $\\beta(g_k)=0$ 严格成立，对应 $g_k = \\alpha^{-1}\\exp(-(n_k-n_1)/n_1)$ 是与能标无关的固定纯数字。\n\n## 2. 三角结构：CQM的CFT实现\n\n### 2.1 三大要素\n\n| CQM要素 | 共形固定点行为 | CFT数学结构 | 势能中的载体 |\n|:---|:---|:---|:---|\n| **耦合常数** $g_k$ | 不跑动，固定纯数字 | 共形固定点 $\\beta(g_k)=0$ | $\\lambda\\phi^4$ 的系数 $\\lambda$ 锁死 |\n| **同步成本** $n_k$ | 与能量无关，动能=势能标度 | 无质量标度维度 | $m^2\\phi^2$ 项**禁止**（$m=0$） |\n| **紧致群** $G_k$ | 无标度刚性要求代数扩展 | Kac–Moody / Virasoro代数 | 允许的 $\\phi^n$ 形式由群表示限制 |\n\n### 2.2 耦合常数：固定纯数字\n\n在共形固定点，$g_k$ 不是随能标流动的变量。CQM中：\n\n$$g_k = \\alpha^{-1}\\exp\\left(-\\frac{n_k - n_1}{n_1}\\right), \\quad n_k \\equiv C_k = l_k(l_k+1) + \\frac{3}{4}$$\n\n$g_k$ 由群论（Casimir本征值）唯一确定，是**与能标无关的固定纯数字**。\n\n### 2.3 同步成本：无质量标度维度\n\n与能量无关 $\\to$ 动能项和势能项必须具有**完全相同的标度维度**。不能存在 $m^2\\phi^2$ 这种带质量参数的项。\n\nCQM中同步成本 $n_k = C_k$（Casimir本征值）是无量纲纯数，天然满足此要求。\n\n### 2.4 紧致群：从有限维到无穷维\n\n紧致李群 $G_k$ 在局域规范变换下发挥作用。但在无标度世界，为配合共形变换的刚性，群的代数结构必须**扩展为无穷维**：\n\n$$\\boxed{G_k \\;\\xrightarrow{\\text{共形固定点}}\\; \\hat{G}_k \\text{ (Kac–Moody代数)} \\;\\oplus\\; \\text{Virasoro代数}}$$\n\n- **Kac–Moody代数** $\\hat{\\mathfrak{g}}_k$：紧致李代数 $\\mathfrak{g}_k$ 的中心扩展，水平 $k$ 由耦合常数确定\n- **Virasoro代数**：共形变换的无穷维生成元，中央荷 $c$ 由Kac–Moody水平通过Sugawara构造确定\n\n## 3. OPE：同步本征态 ⊗ 耦合本征态 → 群本征态\n\n### 3.1 三种本征态\n\n| 本征态 | 空间 | 本征值方程 | 物理意义 |\n|:---|:---|:---|:---|\n| 同步本征态 $\\|\\{n_k\\}\\rangle_{\\text{sync}}$ | 核子空间 | $\\hat{\\mathcal{S}}_{\\text{nucleon}}\\|\\{n_k\\}\\rangle = \\left(\\sum_k n_k\\right)\\|\\{n_k\\}\\rangle$ | 同步成本（Casimir定义） |\n| 耦合本征态 $\\|u_k\\rangle_{\\text{coup}}$ | 耦合常数空间 | $\\hat{u}\\|u_k\\rangle = \\ln g_k\\|u_k\\rangle$ | 耦合常数值 |\n| 群本征态 $\\|G_k\\rangle_{\\text{group}}$ | 本征群空间 | $\\hat{C}_2(G_k)\\|G_k\\rangle = C_k\\|G_k\\rangle$ | 对称性类别 |\n\n### 3.2 OPE的核心公式\n\n**同步本征态与耦合本征态配对，映射到群本征态**：\n\n$$\\boxed{|\\{n_k\\}\\rangle_{\\text{sync}} \\otimes |u_k\\rangle_{\\text{coup}} \\xrightarrow{\\text{OPE}} \\sum_{k'} C_{k}^{k'} |G_{k'}\\rangle_{\\text{group}}}$$\n\n其中 $C_{k}^{k'}$ 是**OPE结构常数**（共形块），由CFT的中央荷和最高权表示严格确定。\n\n### 3.3 OPE的CFT标准形式\n\n在共形场论中，两个初级算符的OPE：\n\n$$\\mathcal{O}_i(z) \\cdot \\mathcal{O}_j(0) \\sim \\sum_{k} C_{ij}^{k} z^{h_k - h_i - h_j} \\mathcal{O}_k(0)$$\n\nCQM对应：\n- $\\mathcal{O}_i \\leftrightarrow |\\{n_k\\}\\rangle_{\\text{sync}}$（同步算符，标度维度 $h_i = n_k$）\n- $\\mathcal{O}_j \\leftrightarrow |u_k\\rangle_{\\text{coup}}$（耦合算符，标度维度 $h_j = \\ln g_j / \\ln\\Lambda$（$\\Lambda$ 为参考标度））\n- $\\mathcal{O}_k \\leftrightarrow |G_k\\rangle_{\\text{group}}$（群算符，标度维度 $h_k = C_k$）\n\n### 3.4 OPE系数的确定\n\nOPE结构常数 $C_{ij}^{k}$ 由以下严格确定：\n\n1. **三点函数**：$C_{ij}^{k} = \\langle \\mathcal{O}_k | \\mathcal{O}_i \\cdot \\mathcal{O}_j \\rangle$\n2. **共形自举**：交叉对称性 $\\sum_k C_{ij}^{k} C_{kl}^{m} = \\sum_k C_{il}^{k} C_{kj}^{m}$（结合律，对中间通道求和）\n3. **Kac–Moody水平**：由耦合常数 $g_k$ 确定水平 $k$，进而确定允许的最高权表示\n\n### 3.5 共形自举：共形自洽\n\n#### 3.5.1 什么是“自举”（Bootstrap）\n\n“自举”源自“提着鞋带把自己拎起来”这个悖论。在物理学中，它特指一种**无参数的、完全自洽的闭合系统**：不靠实验输入任何额外数字（如质量、耦合常数），纯粹靠“逻辑上不能自相矛盾”这一条规则，把所有的数字全部强行算出来。\n\n**共形自举（Conformal Bootstrap）**是现代物理学中大名鼎鼎的术语。如果听到物理学家说“Bootstrap”，99%指的就是它（为区分于上世纪60年代旧的“S矩阵自举”，现在通常加“共形”二字）。\n\n#### 3.5.2 自举的是“结合律”\n\n自举的是**结合律（Associativity）**，也就是OPE的相容性条件。\n\n**具体来说**：四个算符的四点函数，可以通过两种不同的OPE通道来分解：\n\n$$\\langle \\mathcal{O}_1 \\mathcal{O}_2 \\mathcal{O}_3 \\mathcal{O}_4 \\rangle = \\sum_k C_{12}^{k} C_{k34} \\,\\mathcal{F}_k^{(s)}(z) = \\sum_m C_{14}^{m} C_{m23} \\,\\mathcal{F}_m^{(t)}(z)$$\n\n- **s通道**：先配 $\\mathcal{O}_1 \\times \\mathcal{O}_2 \\to \\mathcal{O}_k$，再配 $\\mathcal{O}_k \\times \\mathcal{O}_3 \\to \\mathcal{O}_4$\n- **t通道**：先配 $\\mathcal{O}_1 \\times \\mathcal{O}_4 \\to \\mathcal{O}_m$，再配 $\\mathcal{O}_m \\times \\mathcal{O}_2 \\to \\mathcal{O}_3$\n\n**自举方程要求：两种配对顺序得到的最终结果必须完全一样。**\n\n$$\\boxed{\\sum_k C_{12}^{k} C_{k34} \\,\\mathcal{F}_k^{(s)}(z) = \\sum_m C_{14}^{m} C_{m23} \\,\\mathcal{F}_m^{(t)}(z) \\quad \\text{（共形自举方程）}}$$\n\n这个方程极其严苛——它把耦合常数 $g_k$ 从“自由变量”强行压缩为**唯一的离散解**。\n\n#### 3.5.3 为什么叫“共形”\n\n“配对顺序不影响结果”的条件，只在**共形对称性（尺度+角度不变）**下才成立。如果系统有质量尺子（能隙 $m > 0$），配对的顺序就会受到距离的影响，自举方程就不成立了。所以：\n\n$$\\text{共形自举} = \\text{共形自洽}$$\n\n#### 3.5.4 共形自举 = 共形自洽\n\n共形自举本质上是**共形自洽条件**：OPE的结合律（配对顺序不影响结果）是共形场论内部的自洽性要求，不依赖外部输入。具体来说：\n\n- **自洽性**：四点函数通过两种OPE通道分解（s通道和t通道），结果必须一致——这是代数内部的自洽要求，不是外加条件\n- **共形性**：此自洽要求只在共形对称性（尺度+角度不变）下成立；有质量尺子时配对顺序受距离影响，自洽方程失效\n- **后果**：自洽方程把耦合常数从自由变量压缩为唯一的离散解\n\n共形自举本身**不是**自组织——它是共形场论的**自洽性条件**，纯粹是数学内部的逻辑要求。但这个自洽条件**背后体现了自组织**：CFT描述了临界自组织态扩大的机制，自举作为CFT的自洽条件，反映的是自组织过程必须满足的内在相容性——配对顺序不影响结果，正是自组织过程无外部指令驱动、自我闭合的代数印记。\n\n#### 3.5.5 $A_4$结合律验证：锁定s,p,d,f，禁戒g\n\n$A_4$结合律恰好锁定4种自组织模式（s,p,d,f）并禁戒g（$l=4$）——自举原因（第5通道自举方程无解）、物理原因（g需$A_5$即新核物质相）。壳层标签由 SU(5) Dynkin图深度严格推导。详见 `07 精细引力（FG）/FG_核心理论.md` §3.0 条件链与 §5.2 定位注。\n\n## 4. Dirac条件 = 共形自举方程的CQM具体化\n\n### 4.1 逻辑链\n\n$$\\text{OPE（代数结构）} \\;\\xrightarrow{\\text{共形自举（结合律）}}\\; \\text{Dirac条件} \\;\\xrightarrow{\\text{具体化}}\\; \\text{等价关系（锁定}N_k\\text{）}$$\n\nDirac条件是**共形自举方程**（OPE结合律）在CQM中的具体化。自举方程要求“无论怎么配对结果唯一”，这个要求落地到CQM就是Dirac条件。\n\n### 4.2 自举方程的相容性要求\n\nOPE要求同步本征态与耦合本征态的配对**必须**展开为群本征态。共形自举（结合律）要求此展开的自洽性：\n\n$$\\hat{p}_u = \\frac{1}{☯}\\sqrt{1-\\beta\\hat{\\delta}_v}$$\n\n即耦合常数空间的动量 $\\hat{p}_u$ 由核子曲率 $\\hat{\\delta}_v$ 完全决定。这就是**Dirac条件**：\n\n$$\\boxed{\\hat{\\phi} = \\hat{p}_u - \\frac{1}{☯}\\sqrt{1-\\beta\\hat{\\delta}_v} \\approx 0}$$\n\n**不确定性关系 $\\Delta u \\cdot \\Delta v_\\tau \\geq ☯/2$，$☯$ 为相变量子。**\n\n**关键**：Dirac条件是**共形自举方程**（结合律）的**数学必然**。共形自洽要求耦合常数被锁死为离散值。\n\n### 4.3 等价关系\n\n将Dirac条件具体化（代入耦合层级定义 $n_k \\equiv C_k$）：\n\n$$\\frac{L_u}{2\\pi ☯}\\sqrt{1-\\beta\\delta_v^{(k)}} = C_k = l_k(l_k+1) + \\frac{3}{4}$$\n\n此等价关系锁定声子占据数 $N_k$（Bohr–Sommerfeld量子化条件），消除动力学自由度。\n\n### 4.4 三层结构的严格关系\n\n| 层次 | 公式 | 角色 |\n|:---|:---|:---|\n| **OPE** | $\\|\\{n_k\\}\\rangle \\otimes \\|u_k\\rangle \\sim \\sum C_k \\|G_k\\rangle$ | 基本代数结构 |\n| **Dirac条件** | $\\hat{p}_u = \\frac{1}{☯}\\sqrt{1-\\beta\\hat{\\delta}_v}$ | 共形自举方程的CQM具体化 |\n| **等价关系** | $\\frac{L_u}{2\\pi ☯}\\sqrt{1-\\beta\\delta_v^{(k)}} = C_k$ | 锁定 $N_k$ |\n\n## 5. Kac–Moody代数与Virasoro代数\n\n### 5.1 从紧致李群到Kac–Moody代数\n\n紧致李代数 $\\mathfrak{g}_k$ 的仿射扩展（Kac–Moody代数）：\n\n$$[\\hat{J}^a_m, \\hat{J}^b_n] = if^{abc}\\hat{J}^c_{m+n} + k\\,m\\,\\delta^{ab}\\delta_{m+n,0}$$\n\n- $m, n \\in \\mathbb{Z}$：模（loop）指标\n- $k$：水平（由耦合常数 $g_k$ 确定）\n- 中央项 $k\\,m\\,\\delta^{ab}\\delta_{m+n,0}$：无穷维扩展的核心\n\n### 5.2 Sugawara构造：Virasoro代数\n\nVirasoro生成元通过Sugawara构造从Kac–Moody代数导出：\n\n$$\\hat{L}_n = \\frac{1}{2(k + h^\\vee)} \\sum_m :\\hat{J}^a_{n-m} \\hat{J}^a_m:$$\n\n其中 $h^\\vee$ 是对偶Coxeter数。Virasoro代数：\n\n$$[\\hat{L}_m, \\hat{L}_n] = (m-n)\\hat{L}_{m+n} + \\frac{c}{12}m(m^2-1)\\delta_{m+n,0}$$\n\n中央荷：\n\n$$c = \\frac{k\\,\\dim\\mathfrak{g}}{k + h^\\vee}$$\n\n### 5.3 CQM中的具体值\n\n对 $A_4$ 型（$\\mathfrak{su}(5)$，秩 4）：\n- $\\dim\\mathfrak{g} = 24$\n- $h^\\vee = 5$（对偶Coxeter数）\n- 水平 $k$ 由耦合常数 $g_k$ 确定\n\n| 本征群 | $\\dim\\mathfrak{g}$ | $h^\\vee$ | Kac–Moody水平 $k$ |\n|:---|:---:|:---:|:---|\n| $SU(2)_{\\text{spin}}$（s壳层，$l=0$） | 3 | 2 | 由 $g_1 = \\alpha^{-1}$ 确定 |\n| $SU(2)_{\\text{orb}} \\times SU(2)_{\\text{spin}}$（p,d,f壳层，$l \\geq 1$） | 6 | 4 | 由 $g_k$ 确定 |\n\n### 5.4 中央荷 $c$ 与相变量子 $☯$ 的关系\n\n#### 5.4.1 两个量的定义与所处层级\n\n| 量 | 定义 | 所处层级 | 物理角色 |\n|:---|:---|:---|:---|\n| **中央荷** $c$ | $c = \\frac{k\\,\\dim\\mathfrak{g}}{k+h^\\vee} = \\frac{24k}{k+5}$ | GL(5)层（$A_4$ Kac–Moody代数） | Virasoro代数的中心扩展，有效自由度数 |\n| **相变量子** $☯$ | $☯ = \\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1} \\approx 0.02309570897$ | GL(5)固定层级（黎曼 $\\xi$ 函数） | 耦合动量条件的相变量子 |\n\n二者同处 GL(5) 固定层级：\n\n$$\\text{GL}(5) \\;\\xrightarrow{\\text{紧化}}\\; \\text{SU}(5) \\;\\xRightarrow{\\text{重组实现}}\\; U(1)\\times SU(2)\\times SU(3)$$\n\n#### 5.4.2 SU(5)重组实现时中央荷的分解\n\nSU(5)重组实现时，GL(5)层的中央荷由 $A_4$ Kac–Moody代数确定：\n\n$$c_{\\text{GL}(5)} = \\frac{k\\,\\dim\\mathfrak{su}(5)}{k+h^\\vee_{\\mathfrak{su}(5)}} = \\frac{24k}{k+5}$$\n\n其中 $\\dim\\mathfrak{su}(5) = 24$，$h^\\vee_{\\mathfrak{su}(5)} = 5$。\n\n**自由场极限**（$k \\to \\infty$）：$c_{\\text{GL}(5)} = 24 = \\dim\\mathfrak{su}(5)$。\n\n#### 5.4.3 相变量子 $☯$ 作为GL(5)固定层级的正则化自由度\n\n相变量子 $☯$ 可以表示为：\n\n$$☯ = \\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1} = \\frac{\\xi'(1)}{\\xi(1)}$$\n\n这是 $\\ln\\xi(s)$ 在 $s=1$ 的导数。在CFT语境中，中央荷 $c$ 衡量理论的“有效自由度数”。$☯$ 的结构（$\\xi$ 函数对数导数）恰好是**正则化自由度数**的形式——GL(5)固定层级的无穷模经过zeta正则化后的有限剩余。\n\n#### 5.4.4 $☯$ 与 $c_{\\text{GL}(5)}$ 的关系：Sugawara严格推导\n\n**命题（GL(5)固定层级中央荷的 $☯$-不变性）**：GL(5)固定层级的Kac–Moody中央荷 $c_{\\text{GL}(5)} = 24k/(k+5)$ 由水平 $k$ 严格确定；水平修正展开 $c_{\\text{GL}(5)}^{\\text{eff}} = 24k/(k+5) - 12☯\\eta + O(☯^2)$ 中的修正系数取 $\\eta = 0$（等价于水平修正 $\\delta(☯) = 0$）。【CQM 构造假设】$\\eta = 0$ 为本框架的构造假设，其严格证明未闭合——下方 3 步给出结构性论证（中央荷公式结构不变、GRH 条件下正定性与幺正性保持），但未独立证明 $\\delta(☯) = 0$。\n\n**证明**（3步）：\n\n**步骤1：GL(5)层Sugawara中央荷由 $A_4$ Kac–Moody代数确定**\n\nGL(5)层对应 $A_4$ Kac–Moody代数（$\\mathfrak{su}(5)$），Sugawara中央荷：\n\n$$c = \\frac{k \\cdot \\dim(\\mathfrak{su}(5))}{k + h^\\vee_{\\mathfrak{su}(5)}} = \\frac{24k}{k+5}$$\n\n对水平 $k > 0$，$c$ 由 $k$ 严格确定。\n\n**步骤2：相变量子 $☯$ 通过水平修正进入，中央荷公式结构不变**\n\n相变量子 $☯$ 通过 Hilbert–Pólya 算符（$\\hat{H}_{\\text{HP}} = \\hat{D}^2 + 1/4$，本征值 $\\gamma_n^2 + 1/4$，GL(5) 固定层级的谱算符，区别于谱 $\\subseteq\\{0,1\\}$ 的紧化投影）修正GL(5)固定层级的Kac–Moody水平：\n\n$$k^{\\text{eff}} = k(1 + \\delta(☯) + O(☯^2))$$\n\n其中 $\\delta(☯)$ 是 $☯$ 的某个函数。中央荷为：\n\n$$c_{\\text{GL}(5)}^{\\text{eff}} = \\frac{24k^{\\text{eff}}}{k^{\\text{eff}}+5}$$\n\n水平修正进入中央荷公式，但公式结构不变。\n\n**步骤3：GRH保证共形对称性保持**\n\nGRH（广义黎曼猜想，GL(5)固定层级的实谱条件）保证零点在临界线 $\\text{Re}(s) = 1/2$ 上，即 $\\gamma_n \\in \\mathbb{R}$。这保证谱算符的本征值/共振位置 $\\gamma_n^2 + 1/4 > 0$（正定），从而Kac–Moody水平 $k^{\\text{eff}} > 0$（幺正性保持）。在GRH成立条件下，GL(5)固定层级的共形对称性保持（条件于GRH，GRH本身未证明）。$\\square$\n\n**推论**：在 $\\eta = 0$ 构造假设下，相变量子 $☯$ 不改变中央荷数值。$☯$ 的物理角色通过以下渠道实现：\n\n| 渠道 | 机制 | 文档位置 |\n|:---|:---|:---|\n| **同步成本** | $☯$ 控制耦合动量条件 $p_u = 2\\pi n/L_u$ 的谱 | `CQM_核心_因果网络同步理论.md` §4 |\n| **OPE系数** | 水平 $k = 1/\\alpha - 5$（由 $\\alpha$ 确定，见下行）进入 OPE 系数大 $k$ 展开 | 本文档§3.4 |\n| **关联能** | $☯$ 通过 OPE 系数进入关联能 $E_c = \\sum \\|C_{ij}^p\\|^2/B_{pp} \\cdot \\Delta h_p \\cdot \\langle\\mathcal{F}_p\\rangle$（共形块结构见 §6.2） | 本文档§6.2 |\n| **耦合常数** | $g = \\sqrt{4\\pi\\alpha}$，$\\alpha$ 来自 SU(5) 重组实现 ⇒ $U(1)$ 电磁群耦合常数（几何确定）；水平 $k = 1/\\alpha - 5$ 由 $\\alpha$ 确定，方向不可逆 | 本文档§2.2 |\n\n**物理意义**：\n\n- $☯ = 0$：自由场，$c_{\\text{GL}(5)} = 24k/(k+5)$（无相互作用）\n- $☯ > 0$：有相互作用，$c_{\\text{GL}(5)}^{\\text{eff}} = 24k^{\\text{eff}}/(k^{\\text{eff}}+5)$（水平修正）\n- $☯$ 不改变中央荷数值（§5.4.4：$\\eta = 0$，构造假设）；其物理角色通过 Kac–Moody 水平与 OPE 系数实现\n\n#### 5.4.5 $A_4$ Kac–Moody中央荷的数值\n\n对 $A_4$（$\\mathfrak{su}(5)$），$\\dim\\mathfrak{g} = 24$，$h^\\vee = 5$：\n\n| 水平 $k$ | $c = 24k/(k+5)$ | 物理意义 |\n|:---:|:---:|:---|\n| 1 | 4 | 最小可积表示 |\n| 2 | 48/7 ≈ 6.857 | |\n| 3 | 9 | |\n| 4 | 32/3 ≈ 10.667 | |\n| 5 | 12 | $= \\dim\\mathfrak{su}(5)/2$ |\n| $\\infty$ | 24 | 经典极限（$= \\dim\\mathfrak{su}(5)$） |\n\n**观察**：$c = 12$（$k = 5 = h^\\vee$）是特殊点——中央荷等于 $\\dim\\mathfrak{g}/2$。此点对应于**共形WZW模型的临界水平**，可能与CQM的某个特殊状态相关。\n\n#### 5.4.6 分层共振统一\n\n中央荷 $c$ 与相变量子 $☯$ 的关系是**GL(5)固定层级共振**的一个实例：\n\n$$\\underbrace{☯}_{\\text{GL(5)固定层级}} \\;\\longleftrightarrow\\; \\underbrace{c_{\\text{GL}(5)}^{\\text{eff}}}_{\\text{GL(5)层CFT}}$$\n\n- $☯$（数论侧）：黎曼 $\\xi$ 函数在 $s=1$ 的对数导数，即全部零点的总谱权重（共振频率为 $\\gamma_n$）\n- $c$（物理侧）：Kac–Moody代数的中央荷，CFT的有效自由度数\n- **朗兰兹对应**：$☯$ 和 $c$ 是同一物理量在数论侧和物理侧的表现\n\n#### 5.4.7 状态说明\n\n| 环节 | 状态 |\n|:---|:---|\n| $c$ 和 $☯$ 同处 GL(5) 固定层级 | **严格**（GL(5)固定层级结构） |\n| SU(5)重组实现时 $c$ 由 $A_4$ Kac–Moody代数确定 | **严格**，$c = 24k/(k+5)$ |\n| $☯$ 是GL(5)固定层级的正则化自由度 | **结构严格**，$\\zeta$ 正则化的CFT诠释待严格化 |\n| $c_{\\text{GL}(5)}^{\\text{eff}} = 24k^{\\text{eff}}/(k^{\\text{eff}}+5)$（水平修正进入中央荷） | **条件于 GRH**，Sugawara构造 + GRH保证共形对称性（§5.4.4） |\n| $☯$ 通过Kac–Moody水平/OPE系数/同步成本进入物理 | **严格**，物理角色通过水平实现（§5.4.4推论） |\n| $c = 12$（$k = h^\\vee$）的特殊意义 | **待探索**，可能与CQM特殊状态相关 |\n\n## 6. 共形块与物理预测\n\n### 6.1 四点函数\n\nOPE的物理预测通过四点函数的共形块分解实现：\n\n$$\\langle \\mathcal{O}_1 \\mathcal{O}_2 \\mathcal{O}_3 \\mathcal{O}_4 \\rangle = \\sum_s C_{12}^s C_{34}^s \\mathcal{F}_s(z) \\bar{\\mathcal{F}}_s(\\bar{z})$$\n\n其中 $\\mathcal{F}_s(z)$ 是**共形块**（Virasoro代数的表示论对象），由中央荷 $c$ 和共形维度 $\\{h_i\\}$ 严格确定。\n\n### 6.2 CQM的共形块\n\n在CQM中，共形块给出：\n- **选择定则**：哪些群本征态 $|G_{k'}\\rangle$ 出现在OPE中\n- **结构常数**：$C_{k}^{k'}$ 的精确值\n- **标度维度**：$h_k = C_k = l_k(l_k+1) + 3/4$\n\n### 6.3 共形块与超几何函数\n\nCFT四点函数的共形块分解：\n\n$$\\langle \\phi_l(\\infty)\\, \\phi_l(1)\\, \\phi_l(z)\\, \\phi_l(0) \\rangle = \\sum_p C_{ll}^{p}\\, C_{ll}^{p}\\, \\mathcal{F}_p(z)\\, \\bar{\\mathcal{F}}_p(\\bar{z})$$\n\n共形块 $\\mathcal{F}_p(z)$ 满足BPZ方程（Virasoro代数的null vector条件），解为**超几何函数**：\n\n$$\\mathcal{F}_{n,l}(z) = z^{l}\\, {}_2F_1(a_{n,l},\\, b_{n,l};\\, c_{n,l};\\, z)$$\n\n其中参数 $(a_{n,l}, b_{n,l}, c_{n,l})$ 由中央荷 $c$ 和共形维度 $\\{h_i\\}$ 严格确定。\n\n### 6.4 指数映射与合流极限\n\n**从CFT到径向波函数的两步映射**：\n\n**步骤1：指数映射**（CFT平面坐标 → 物理径向坐标）\n\n$$z = e^{-\\kappa_r r}, \\quad \\kappa_r = \\frac{2}{n_{\\rm pr}a_0}$$\n\n此映射将CFT的幂律 $z^h = e^{-\\kappa_r h r}$ 转化为物理的指数衰减。\n\n**步骤2：合流极限**（超几何函数 → 拉盖尔多项式）\n\n$${}_2F_1(a, b; c; z) \\;\\xrightarrow{\\text{合流}}\\; {}_1F_1(-n_{\\rm pr}+l+1;\\, 2l+2;\\, \\rho) \\;\\propto\\; L_{n_{\\rm pr}-l-1}^{2l+1}(\\rho)$$\n\n其中 $\\rho = 2r/(n_{\\rm pr}a_0)$。合流极限对应于从**临界系统**（CFT，$m=0$，关联长度 $\\xi_{\\rm corr} = \\infty$）到**束缚态**（$m > 0$，$\\xi_{\\rm corr} = n_{\\rm pr}a_0/2 \u003c \\infty$）的质量形变。\n\n**合流极限的物理意义**：CFT描述同步过程，束缚态是同步完成（状态跃迁）后达到的物理状态。同步方程给出同步的发生条件（共振量子化），CFT给出波函数的**代数结构**（量子数、节点数、多项式因子），质量形变给出**指数衰减**（Bohr半径）。\n\n## 7. 例外：自由场极限\n\n### 7.1 平庸CFT\n\n若耦合常数 $g_k \\to 0$（自由场极限），系统退化为无质量自由粒子集合（如纯 Maxwell 理论）。\n\n- 自由场有共形对称性，但是**平庸的CFT**（无相互作用）\n- OPE结构常数退化为平凡的Wick收缩\n- Kac–Moody水平 $k \\to \\infty$，中央荷 $c$ 退化为自由场值\n\n### 7.2 非平庸CFT\n\n只要存在非零相互作用（$g_k > 0$），就是**强耦合临界CFT**：\n- OPE结构常数非平凡\n- Kac–Moody水平 $k > 0$\n- 共形块给出非平庸的物理预测\n\n**CQM的定位**：$g_k = \\alpha^{-1}\\exp(-(n_k-n_1)/n_1) > 0$ 对所有壳层成立，因此CQM是非平庸的强耦合临界CFT。\n\n## 8. 临界自组织态的扩大：CFT的本质\n\n**CFT描述了临界自组织态扩大的机制，同时也是同步的过程机制。** 这不是类比，是数学上的精确等同。CFT的每一个核心概念——态-算符对应、幂律传播、OPE——都是临界自组织态扩大过程的一个侧面。共形自举则是这套数学结构必须满足的**共形自洽条件**。同步是事件，同步有过程——CFT描述的是同步的过程，同步方程描述的是整个同步事件（过程被压缩，体现为定态）。\n\n### 8.1 再生产与扩大：马克思谱系的再生产\n\nCQM中的“再生产”是**马克思谱系的再生产**——再次生产维持结构的条件（自维持/自激），不是生物学上的复制繁衍。再生产是有限本体维持自身存在的操作（$\\mu: S \\to S$，$\\mu^2 = \\mu$，幂等性——维持而非生成，详见 `CQM_核心_集成理论.md` §1.3）。\n\n**再生产与扩大的关系**：再生产是**维持机制**（结构为何能持续存在），扩大是**同步过程**（结构如何从局部扩展到全局）。两者不矛盾——再生产提供维持的条件，CFT描述的扩大是同步的过程机制。\n\n| | 再生产（马克思谱系） | 临界自组织态的扩大 |\n|:---|:---|:---|\n| **含义** | 再次生产维持结构的条件（自维持） | 同一种态模式从触发点向全局扩展 |\n| **本体论角色** | 维持机制：结构为何持续存在 | 同步过程：结构如何从局部到全局 |\n| **CFT对应** | 幂等条件 $\\mu^2=\\mu$（存在论条件） | 两点函数传播 $\\langle\\phi(r)\\phi(0)\\rangle = r^{-2h}$ |\n| **物理图像** | 质子通过再生产维持自身存在 | 晶体生长、火焰蔓延（态模式扩大） |\n\n**同步的本质**：同步是事件——同一种态模式从触发点向全局无衰减扩展，直到覆盖整个系统。同步有过程——这个过程就是CFT描述的物理过程（幂律传播 $r^{-2h}$）。同步方程描述的是整个同步事件（过程被压缩，体现为定态）——定态不是扩大完成后的末端状态，而是整个同步过程被压缩后的表现形式。再生产维持同步态的存在——同步完成后，再生产确保同步态持续维持。\n\n### 8.2 同步有过程，同步方程描述同步事件\n\n同步四阶段：**预备**（FG纤维丛：曲率算符 $\\hat{\\delta}_v$ 给出各种赝状态）→ **发生**（同步方程 $\\hat{\\mathcal{S}}|\\psi\\rangle = n|\\psi\\rangle$：共振量子化，什么样的态可以发生同步、同步成本 $n$ 是多少）→ **过程**（CFT：幂律传播 $r^{-2h}$，同步从触发点向全局扩大）→ **完成**（状态跃迁：从未同步态跃迁到同步态）。同步的过程需要CFT补充：\n\n$$\\text{触发点} \\xrightarrow{\\text{态-算符对应}} \\text{态模式点燃} \\xrightarrow{\\text{幂律传播}} \\text{全局覆盖} \\xrightarrow{\\text{定态条件}} \\text{同步锁定}$$\n\n| 阶段 | CFT数学 | CQM对应 |\n|:---|:---|:---|\n| **触发** | 态-算符对应 $\\|\\phi\\rangle = \\lim_{z \\to 0} \\phi(z)\\|0\\rangle$ | 引力因果限制场照亮物自体 |\n| **扩大** | 传播子 $\\langle\\phi(r)\\phi(0)\\rangle = r^{-2h}$ | 概率流在耦合空间扩散 |\n| **锁定** | 非零期待值 $\\langle\\phi\\rangle \\neq 0$ | 同步算符本征态稳定 |\n| **定态** | $L_0$本征值 $h$ 锁定 | $\\hat{\\mathcal{S}}\\|\\psi\\rangle = n\\|\\psi\\rangle$ |\n\n### 8.3 态-算符对应：插入即生成\n\nCFT的第一性原理：\n\n$$\\boxed{|\\phi\\rangle = \\lim_{z \\to 0} \\phi(z)|0\\rangle}$$\n\n**CQM诠释**：\n- **真空** $|0\\rangle$ = 潜能态（质数前网络）\n- **算符插入** $\\phi(z)$ = 在耦合空间点 $z$ 建立关系，触发存在者\n- **生成的态** $|\\phi\\rangle$ = 被关系照亮的有限结构\n\n**关键**：算符放在哪，哪就有一个态——**不是创造新属性，是把已有的同一种属性模式扩大到该点**。\n\n**局域分析足够性**：虽然底空间上离散插入点很多（每个Regge顶点 $v$ 生成不同的局域态 $|\\delta_v\\rangle$），但所有态遵守同一套同步算符 $\\hat{\\mathcal{S}}$ 和同步方程 $\\hat{\\mathcal{S}}\\Psi = n\\Psi$。OPE系数 $C_{ij}^k$ 由共形对称性固定，不依赖插入点 $z$。因此只需取一个体现底空间分布性质的代表性局域分析，同步谱由 $A_4$ 代数结构统一给出，普适于整个纤维丛（详见 `07 精细引力（FG）/FG_纤维丛理论.md` §9.9）。\n\n### 8.4 幂律传播：态扩大的数学骨架\n\n临界点关联函数：\n\n$$\\boxed{\\langle\\phi(r)\\phi(0)\\rangle \\sim r^{-2h}}$$\n\n| 特征 | 物理意义 |\n|:---|:---|\n| **无指数衰减** $e^{-r/\\xi_{\\rm corr}}$ | 关联长度 $\\xi_{\\rm corr} \\to \\infty$，态扩大无尺度限制 |\n| **幂律 $r^{-2h}$** | 共形维度 $h$ 控制扩大速率——$h$ 小则扩大快，$h$ 大则扩大慢 |\n| **全空间感知** | 任何两点都共享同一种态模式，同步由此实现 |\n\n**与紧化边界的联系**：$\\xi(s)=\\xi(1-s)$ 保证临界自组织态扩大的自洽性——正向扩大（UV→IR）与反向锁定（IR→UV）统计等价。\n\n### 8.5 临界涌现 = 态扩大的相变\n\n| 区域 | 态扩大特征 | CQM状态 |\n|:---|:---|:---|\n| $T > T_c$ | 扩大有限世代后衰减（$\\xi_{\\rm corr} \u003c \\infty$） | 正常态，同步未完成 |\n| $T = T_c$ | 扩大无衰减，覆盖全局（$\\xi_{\\rm corr} \\to \\infty$） | **临界涌现**，新对称性从局部扩散到全局 |\n| $T \u003c T_c$ | 扩大完成，系统锁定于新态 | 超导态，定态条件生效 |\n\n### 8.6 CQM层级中的态扩大\n\n**元素FG——壳层模式的扩大**：\n\n$$1s\\text{触发}(n_{\\rm pr}=1,l=0) \\xrightarrow{\\text{s模式扩大}} 2s,3s,4s,\\ldots \\xrightarrow{2p\\text{触发}} p\\text{模式扩大} \\rightarrow d,f$$\n\n周期表 = 态扩大的谱：s,p,d,f是四种基本态模式，各自随 $n_{\\rm pr}$ 扩大。118 封顶 = $A_4$ 锁定 4 种模式，无更多可扩大。\n\n**超导FG——配对态的扩大**：\n\n$$\\text{局域库珀对触发} \\xrightarrow{\\text{配对相位模式传播}} \\text{无衰减扩大}(T\u003cT_c) \\xrightarrow{\\text{全局锁定}} U(1)//\\mathbb{Z}_2\\text{结构群}$$\n\n### 8.7 CQM公理的态扩大重述\n\n| CQM公理 | 态扩大诠释 |\n|:---|:---|\n| 全局因果网络/全局幺正 | **态扩大的背景场**——提供无衰减传播的基础设施 |\n| 存在者（本体及其产物） | **态扩大的种子**——触发点 |\n| 属性本身 | **态扩大的模式**——同一种态的结构 |\n| 规律/引力因果限制场 | **态扩大的条件**——共形维度 $h$ 决定扩大速率 |\n| 属性不能凭空创造，只能被照亮 | **态扩大不是创造新属性，是把已有的同一种模式扩大到更大范围** |\n\n### 8.8 一句话\n\n> **同步四阶段：预备（FG 纤维丛——各种赝状态）→ 发生（同步方程——共振量子化）→ 过程（CFT——临界自组织态扩大）→ 完成（状态跃迁）。CFT描述同步过程：幂律传播 $r^{-2h}$ 是蔓延，临界点是火焰无衰减地烧遍全局。共形自举是共形自洽条件——配对顺序不影响结果，锁死结构常数。同步完成是状态跃迁。**\n\n## 9. 与CQM核心理论的关系\n\n### 9.1 与因果网络同步理论的关系\n\n`CQM_核心_因果网络同步理论.md`中的同步算符是紧化算符：\n\n$$\\hat{\\mathcal{S}}_0: \\mathcal{H}_{\\text{auto}}(\\mathrm{GL}(5)) \\to \\mathcal{H}_{\\text{phys}}(SU(5))$$\n\nCFT视角：紧化算符是**共形映射**，同步本征态是**初级算符**，同步成本 $n_k$ 是**共形维度**。\n\n**态扩大视角**：同步是事件，同步有过程——过程是**临界自组织态的扩大**（§8）。同步方程描述的是整个同步事件（过程被压缩，体现为定态结构），CFT描述的是同步过程（扩大的动力学——幂律传播 $r^{-2h}$ 给出扩大的速率和范围）。\n\n### 9.2 与朗兰兹分层共振的关系\n\n`CQM_核心_朗兰兹分层共振与相变量子.md`中的GL(n)分层：\n\n$$GL(5) \\xrightarrow{\\text{紧化}} SU(5) \\xRightarrow{\\text{重组实现}} \\text{规范群}$$\n\nCFT视角：GL(n)分层是**Kac–Moody代数的水平分层**，每个本征群对应一个Kac–Moody水平 $k$，中央荷 $c$ 由Sugawara构造确定。\n\n**态扩大视角**：朗兰兹对应在物理侧的动力学实现——质数是触发点，$L$函数零点是态扩大的共振频率，GRH（零点在临界线）等价于态扩大无衰减（关联长度发散）。\n\n### 9.3 与FG纤维丛理论的关系\n\n`07 精细引力（FG）/FG_纤维丛理论.md`中的完整推导链：\n\n$$\\text{Regge剖分} \\to \\text{嘉当矩阵} \\to \\text{声子} \\to \\text{曲率算符} \\to \\text{同步方程} \\to G_k \\xrightarrow{\\text{OPE}} \\text{等价关系} \\to N_k$$\n\nCFT是此链条中**同步方程→本征群**步骤的数学基础。OPE给出同步本征态⊗耦合本征态→群本征态的严格映射，Dirac条件是共形自举方程（OPE结合律）的CQM具体化。\n\n**态扩大视角**：元素FG的壳层填充是态扩大的谱——s模式从1s扩大到7s，p模式从2p扩大到7p，等等。$A_4$锁定4种基本模式，$n_{\\rm pr,\\max}=7$给出扩大的截止。\n\n### 9.4 统一图景\n\n```\nCQM核心理论\n │\n ├── 因果网络同步理论（同步算符=紧化算符=共形映射）\n │ ├── 同步本征态 = CFT初级算符\n │ └── 同步有过程，过程 = 临界自组织态的扩大（§8），同步方程描述整个同步事件（压缩为定态）\n │\n ├── 朗兰兹分层共振（GL(n)分层=Kac–Moody水平分层）\n │ └── 本征群 = Kac–Moody代数的最高权表示\n │ └── 质数=触发点，L函数零点=扩大共振频率\n │\n ├── 共形场论与OPE = 临界自组织态的扩大的数学语言\n │ ├── OPE：同步⊗耦合→群本征态\n │ ├── 共形自举（结合律）：配对顺序不影响结果 → 锁死耦合常数为离散解\n │ │ └── A4结合律 → 锁定s,p,d,f，禁戒g\n │ ├── 幂律传播：r^{-2h}（临界自组织态的扩大：蔓延）\n │ ├── 径向波函数 R_nl(r) ↔ 共形块 F_nl(z)（节点数=descendant level）\n │ ├── Dirac条件 = 共形自举方程的CQM具体化\n │ ├── 紧致群 → Kac–Moody / Virasoro代数\n │ └── 同步四阶段：预备（FG 纤维丛）→发生（同步方程）→过程（CFT）→完成（状态跃迁）\n │\n ├── FG元素第一性（Regge→嘉当→声子→曲率→同步→OPE→条件→周期表）\n ├── CFT是同步方程→本征群的数学基础\n └── 壳层填充 = 态扩大的谱（s,p,d,f四种模式各自扩大）\n```\n\n## 10. 状态说明\n\n| 环节 | 状态 |\n|:---|:---|\n| “与能量无关” → 共形固定点 $\\beta(g)=0$ | **严格**（重正化群定义） |\n| $m=0$ 是共形固定点必要条件 | **严格**（尺度不变性） |\n| 普通微扰在 $\\xi_{\\rm corr}\\to\\infty$ 发散 | **严格**（微扰论基础） |\n| OPE是唯一替代工具 | **严格**（CFT定理） |\n| OPE：同步⊗耦合→群本征态 | **严格**，OPE系数 $C_{ij}^k$ 由大 $k$ 展开给出 |\n| 共形自举 = OPE结合律 = 交叉对称性 | **严格**（CFT标准理论） |\n| 共形自举 = 共形自洽 | **严格**（CFT自洽性条件） |\n| Dirac条件 = 共形自举方程的CQM具体化 | **严格**，$D\\psi=0$→零模→primary→OPE结合律→共形自举（FG纤维丛文档§9.6） |\n| $A_4$结合律锁定s,p,d,f，禁戒g | **严格**（壳层标签由 SU(5) Dynkin图深度严格推导） |\n| 紧致群 → Kac–Moody代数 | **严格**（仿射代数理论） |\n| Sugawara构造 → Virasoro代数 | **严格**（CFT标准构造） |\n| Kac–Moody水平 $k$ 由杨–米尔斯耦合 $g_{\\text{YM}}$ 确定 | **严格**，$k(g_{\\text{YM}}) = 4\\pi/g_{\\text{YM}}^2 - h^\\vee$（WZW作用量归一化；$g_{\\text{YM}}^2 = 4\\pi\\alpha$，区别于 §2.2 的 $g_k = \\alpha^{-1}\\exp(\\cdots)$） |\n| 共形块 → 壳层选择定则 | **严格**，Casimir角色分离+Madelung规则+$A_4$截止 |\n| 径向波函数节点数 $= n_{\\rm pr}-l-1$ = descendant level | **严格**（Kac–Moody代数结构） |\n| 径向波函数 $R_{nl}(r) \\leftrightarrow$ 共形块 $\\mathcal{F}_{n,l}(z)$ | **严格**，三因子结构+态-算符对应+节点定理，指数衰减=质量形变（从CFT临界点到定态） |\n| 径向Schrödinger方程 = BPZ方程的合流极限 | **严格**（5步证明：BPZ→指数映射→Kummer变换→合流极限→径向Schrödinger，见本文档§6.4） |\n| Cr/Cu异常 = OPE系数在半满/全满点共振 | **严格**，g波禁戒→S矩阵权重转移→增强 $25/16\\approx56\\%$ |\n| Madelung规则是零阶近似，OPE修正导致能量交叉 | **严格**，关联能代数框架+OPE系数大 $k$ 展开 |\n\n### 10.1 开放问题\n\n| 问题 | 严重程度 | 说明 |\n|:---|:---:|:---|\n| OPE系数 $C_{ij}^k$ 的具体值 | 已闭合 | 大 $k$ 展开 $C_{ij}^p = C^{(0)} + \\epsilon C^{(1)} + O(\\epsilon^2)$，零阶=SU(2) CG系数，一阶=Sugawara修正，d-d OPE的g波通道被 $A_4$ 截止禁戒 |\n| Kac–Moody水平 $k$ 与 $g_{\\text{YM}}$ 的映射 | 已闭合 | WZW作用量归一化 $g^2 = 4\\pi/(k+h^\\vee)$ 给出 $k(g_{\\text{YM}}) = 4\\pi/g_{\\text{YM}}^2 - h^\\vee$（$g_{\\text{YM}}^2 = 4\\pi\\alpha$），大水平极限 $k_l \\gg 1$ 是 $\\alpha \\ll 1$ 的直接推论 |\n| 共形自举方程的完整解空间 | 已闭合（g 波子项待重新推导） | $A_4$ 结合律方程解空间恰好 4 维，唯一对应 s,p,d,f；g 波需第 5 个基本权但秩为 4 不存在（待重新推导）；定量解由 Verlinde 公式 + 大 $k$ 展开给出 |\n| descendant系数 $c_k^{(n,l)}$ 的精确值 | 已闭合 | Shapovalov内积矩阵 $B_{kk}^{(l)}=k!\\,\\Gamma(2l+k)/\\Gamma(2l)$，$c_k^{(n,l)}=(-1)^k\\Gamma(n+l+1)/[k!\\,\\Gamma(n-l-k)\\,\\Gamma(2l+2+k)]$ |\n| 合流极限的严格证明 | 已闭合 | 严格两步映射（本文档§6.4）：指数映射→合流极限，与 §6.3 的超几何结构衔接，将 CFT 共形块映射到径向拉盖尔多项式 |\n| Fusion rules / OPE通道选择定则 | 已闭合 | Verlinde公式 + SU(2) Clebsch–Gordan + 径向descendant加法规则，大 $k$ 极限退化为经典CG规则 |\n| 关联能 $E_c$ 定量计算 | 已闭合 | He原子：$\\epsilon_s$ 约去，关联能不依赖耦合常数具体值；Cr/Cu：g波禁戒→S矩阵权重转移→增强 $25/16\\approx56\\%$→能级翻转 |\n| 中央荷 $c$ 与相变量子 $☯$ 的关系 | 已闭合（$c=1$ 部分）；$\\eta=0$ 为构造假设 | U(1) Sugawara中央荷 $c=1$ 严格不依赖水平（$\\dim=1$, $h^\\vee=0$ 使 $k$ 约去）；$\\eta=0$ 属构造假设（§5.4.4）；$☯$ 通过 OPE 系数/同步成本进入物理，非通过中央荷 |\n| 临界自组织态扩大的动力学方程 | 已闭合 | BPZ 方程→径向 Schrödinger 方程的映射已严格建立（两步映射，本文档§6.4）。合流极限下定量系数已严格确定：descendant系数由Shapovalov内积给出，超几何函数参数由共形维度$h=n_{\\rm pr}+l$确定，退化为拉盖尔多项式$L_{n-l-1}^{2l+1}$（本文档§6.3-§6.4）。幂律传播$r^{-2h}$的CQM具体化已完成。有限$n$修正是高阶效应，不影响周期表结构 |\n\n## 11. 文献锚定\n\n| 环节 | 文献 | 备注 |\n|:---|:---|:---|\n| 共形场论基础 | Belavin–Polyakov–Zamolodchikov (1984) | BPZ共形自举 |\n| Kac–Moody代数 | Kac (1985) | 仿射Lie代数 |\n| Sugawara构造 | Sugawara (1968) | Virasoro从Kac–Moody构造 |\n| OPE | Wilson (1969) + W. Zimmermann | 算符乘积展开 |\n| 共形块 | Di Francesco et al. (1997) | CFT教科书 |\n| Kac–Moody / Virasoro | Goddard–Kent–Olive (1986) | GKO构造 |\n| WZW模型 | Wess–Zumino (1971) + Witten (1984) | 作用量归一化 $g^2=4\\pi/(k+h^\\vee)$ |\n| Verlinde公式 | Verlinde (1988) | fusion coefficients from modular S-matrix |\n| 三点函数 | Dotsenko–Fateev (1984) | 积分表示 |\n| 共形自举 | Rattazzi et al. (2008) | 数值共形自举方法 |\n| 态-算符对应 | Belavin–Polyakov–Zamolodchikov (1984) | CFT第一性原理 |\n| 临界现象 | Wilson–Kogut (1974) | 重正化群与临界不动点 |\n\n## 12. 核心图像\n\n```\nCFT = 描述临界自组织态扩大的机制，同时也是同步的过程机制\n\n“与能量无关”（没有带量纲参数 + 耦合锁死为纯数字）\n │\n ▼\n共形固定点 β(g)=0\n │\n ├── 耦合常数 g_k：固定纯数字（不跑动）\n ├── 同步成本 n_k：无质量标度维度\n └── 紧致群 G_k → Kac–Moody / Virasoro代数\n │\n ▼\n CFT的OPE（唯一有效数学工具）\n │\n ├── 同步本征态 |{n_k}⟩_sync\n ├── 耦合本征态 |u_k⟩_coup\n └── 群本征态 |G_k⟩_group\n │\n ▼\n OPE: |{n_k}⟩ ⊗ |u_k⟩ → Σ C_k |G_k⟩\n │\n ├── 共形自举（结合律）：配对顺序不影响结果\n │ ├── 锁死耦合常数为离散解\n │ └── A4结合律 → 锁定s,p,d,f，禁戒g\n │\n └── Dirac条件 = 共形自举方程的CQM具体化\n  ├── p̂_u = (1/☯)√(1-βδ̂_v)\n  └── (L_u/2π☯)√(1-βδ_v^(k)) = C_k\n └── 锁定声子占据数 N_k\n\n 同步四阶段：预备（赝状态）→发生（共振量子化）→过程（CFT扩大）→完成（状态跃迁）\n │\n ├── 触发：态-算符对应 |φ⟩ = φ(0)|0⟩（插入即生成）\n ├── 扩大：幂律传播 ⟨φ(r)φ(0)⟩ = r^{-2h}（无衰减蔓延）\n ├── 锁定：⟨φ⟩ ≠ 0（全局覆盖）\n  └── 完成：状态跃迁 → Ŝ|ψ⟩ = n|ψ⟩（从未同步态跃迁到同步态）\n\n 共形自举 = 共形自洽（结合律条件）\n 自举锁死结构常数 → 自组织得以无衰减进行（ξ_corr→∞）\n```\n\n**同步四阶段：预备（FG 纤维丛——各种赝状态）→ 发生（同步方程——共振量子化）→ 过程（CFT——临界自组织态扩大）→ 完成（状态跃迁）。CFT描述同步过程（幂律传播 $r^{-2h}$），共形自举是共形自洽条件——配对顺序不影响结果，锁死结构常数。**\n", "backlinks": ["D001", "D007", "D023", "D024", "D025", "D029"], "outlinks": ["D028", "D029"]}, {"id": "D010", "doc_id": "D010", "title": "唯物主义群论", "path": "01 核心理论/CQM_核心_唯物主义群论.md", "group": "01 核心理论", "layer": 1, "type": "理论主干", "text": "# 唯物主义群论：$\\mathrm{Sym}\\supset\\mathrm{Diff}\\supset GL(n,\\mathbb{F})$ 三层结构、群约束性分类与不变性\n\n**作者**：ruster\n\n> **定位**：本文档属 `01 核心理论`，是对“对称性分类”这一工具的严格化数学整理，并给出与框架既有表述的对接（引用框架表述时以原文为准）。主线：**引言**（唯物主义群论定位）→ 变换群三层结构 $\\mathrm{Sym}\\supset\\mathrm{Diff}\\supset GL$ → **群约束性**分类（线性层 $GL(n,\\mathbb{F})$ 四条基约束性、非线性层与覆盖的群）→ 统一约束形式 → **不变性**（每种约束性＝“某物的某种属性／结构在某种变换下保持不变”）→ 置换对称性 $S_n$ 讨论与对称群谱系（置乱动力学的配套专论见 `../04 前沿研究/CQM_前沿研究_量子快置乱普适速率极限.md`）→ 自守形式（分析类型—自守表示—$L$ 函数）。状态标注：【标准数学】（教科书级数学事实）、【文献确立】（外部文献确立）、【CQM 框架基础】（框架既有表述，仅对称性讨论涉及处引用）、【CQM 构造假设】（本文档自造／重述的命名——**仅术语层面**，机制内容以原文为准）、【哲学诠释】（定位／诠释性陈述，**非数学命题**）。本文档的群论因此是**唯物主义群论**——群被读作**物质自组织中的组织结构／组织原则／组织约束的体现**，故强调“**实现**”（详见文首『引言』）。\n\n> **定义索引**（**只列定义**，不列命题与总览；便于查阅；括号内为该条所在节）\n\n| 定义                  | 位置        | 一句话                                                                     |\n| :------------------ | :-------- | :---------------------------------------------------------------------- |\n| **定义（关系群／约束群／实现群）** | §2.2      | 使得某物在特定关系（约束）下实现为另外一种形式的群                                               |\n| 定义 2.1（群约束性）        | §2.1      | **任意给定作用的群**所受的等式约束模式 $\\mathfrak{X}=(\\mathcal{C},\\mathcal{S})$；线性情形（$GL(n,\\mathbb{F})$）由结构张量写出 |\n| **属性关系群及其两分类**      | §5.3      | “某物＝属性”的情形；分属性量纲关系群／别的属性关系群                                             |\n| **定义（不变群约束性）**      | §6.1      | 一般：保持**某物**（任意被实现的对象；属性只是其中一类）的某种属性／结构等不变；“某物＝属性”时称**属性量的不变群约束性**（＝定义出属性关系群的那组约束）                |\n| 属性量／内蕴·表面（三层）       | §6.1      | 内蕴值具有内在不变性；表面值不一定一样                                                     |\n| 自守形式（经典写法／一般写法）     | §8.1      | 协变律 $f(\\gamma x)=j(\\gamma,x)f(x)$                                       |\n| 量纲／特征常数（`CQM_核心_量纲与群论.md` §6.4）       | §6.4 | 量纲＝属性的量度类别；$K$＝该次实现的特征常数                                                |\n\n---\n\n## 引言：唯物主义群论（为什么强调“实现”）\n\n本文档所论的“群”**不作先于物质的数学形式**看待，而是**物质自组织中的组织结构／组织原则／组织约束的体现**——这是 CQM 群论的**唯物主义定位**。它在框架原文中有直接依据【CQM 框架基础】：\n\n- **对称性不是先于物质的（横跨多篇框架文档）**：“对称性不是先验的，是**物质自组织对自己施加的条件**”（`06 超导/CQM_超导_专题与扩展.md`）；“**$SU(5)$ 不是预设的，而是物质自组织到第一稳定构型时自然锁定出来的**”（`01 核心理论/CQM_核心_朗兰兹分层共振与相变量子.md` §0）。\n- **数学结构从物质自组织中生长**（框架称“唯物化”）：“**数学结构从物质自组织中生长**”，并有对照表“数学柏拉图主义 ↔ **物质自组织结果**”（`01 核心理论/CQM_核心_集成理论.md` §13.5）；“数学结构本身是**物质自组织的化石**”（`01 核心理论/CQM_核心_因果网络同步理论.md`）。\n- **方法论归属**：CQM 的认识论本质为**唯物主义**——“数学柏拉图主义 vs 唯物主义”（`05 方法论与批判/CQM_方法论_HilbertPolya批判.md` §3.1）；“自守性的唯物主义诠释＝物质结构再生产能力的数学影像”（`04 前沿研究/CQM_前沿研究_规范重组超导与SU5五重态内禀时间.md` §4.4）。\n\n**这一在位的直接后果就是强调“实现”**：既然群不是先于物质的，它就必须被物质条件**实现出来**——于是“群**是什么**”（§2–§5 的结构分类、§8 的自守形式）与“群**如何被实现**”（§6.3 的（约束下的）重组实现）合为**同一对象的两面**，而**发生学侧（物质自组织 → 约束 → 群）是第一性的**。这正是 §6.3“同一对象两种描述角度”的本体论根据，也是本文档把“实现／约束／稳定子”作为组织主线的理由。\n\n**另两条并行强调**（与唯物主义定位一体两面，框架原文均已给出）：\n\n- **强调“关系”**：CQM 是**关系唯物主义**——对立于 RQM 的“关系唯心主义”（`05 方法论与批判/CQM_方法论_资本主义-旧物理-层级还原论批判.md` §6.6）。要义有二：**关系是物质性的**（关系性的承担者是“物质性的引力几何”，**不是意识**）；但关系是**显现方式**、**不是存在基础**。落在本文档：群正是**关系的数学载体**——“关系群／约束群／实现群”（§2.2）与“属性经其携带的**关系（约束）**实现为某形式的群”（§5.4）皆然；**群不是实体，而是约束关系的载体**（§1.2：不变性属于（群，作用）这对关系数据）。\n- **强调“属性先在”**：属性（自由度）**本体论上随附（先在）**——框架原句即用“属性先在”：“属性**本体论上随附**（**属性先在**），但**认识论上显现为关系性**（耦合实现）”（同上 §6.6）。落在本文档：这正是 §8.2 的“**属性先行**”构造路线——**属性 $P$ 先在**、带可量化不变量 $Q$，再取保 $Q$ 的群 $G_Q$、再取离散子群 $\\Gamma$，形式定义在后（§2 的“约束先行”是另一条互补路线）。\n\n> **两者不是两个对象**（框架原话）：“随附保证了'有'，关系性保证了'如何有'。两者不是两个东西，而是**同一物质过程的两个方面**”（同上 §6.6）。即 **属性先在**＝**存在侧**（先在地“有”），**关系**＝**实现／显现侧**（“如何有”）。本文档的群约束性落在**关系侧**（群＝约束关系的载体），故与“属性先在”不冲突——**属性先在，而群是它在特定关系下被实现的形态**。\n\n> **本体论纲领**：**属性先在，关系潜在-显现化它。**上面的两分（属性先在＝存在侧，关系＝实现／显现侧）按此展开：「潜在-显现」指的是**属性**：属性先在为**潜在**（属性锚点＝$GL(n)$ 的矩阵元素 $g_{ij}$），经关系而**显现**（显现为实例属性、自守形式、量纲）；「潜在-显现化」即属性由潜在态向显现态转化的全过程，沿三环节进行——**关系分化**：极大关系群 $G_{\\max}(f)$ 作为**稳定化子**定义不变量环，把处在潜在态的属性切割为实例属性类别（本文档 §2.2 关系群、§5.3 属性关系群；定义顺序先 $f$ 后群）；**实例化**：物理稳定即（约束下的）重组实现（§6.3），稳定下来的标志是建立起自守形式（§8）；**具体化**：对自守因子 $j$ 的选取和诠释把属性具体化为量纲（$j$ 即量纲因子，§8.2 第④身份；量纲谱系＝基本／子／派生，见 `CQM_核心_量纲与群论.md` §6.5.13，终极定稿见其 §13.3）。\n\n|          | 柏拉图主义读法      | 唯物主义（CQM）读法             |\n| :------- | :----------- | :---------------------- |\n| 群的来源     | 独立物质世界的数学形式  | **物质自组织中被实现出来的组织约束**    |\n| 物质与群的关系  | 物质“服从”给定的对称性 | 物质自组织**施加**约束、切出群（§6.3） |\n| 数学结构的地位  | 独立自存的实在      | **物质自组织的化石**（框架原文）      |\n| 本文档主线的落点 | 由群出发做表示论     | 由约束切出群、再看它保持什么（§2→§6）   |\n\n> **术语说明（重述性命名）**：以“**组织结构／组织原则／组织约束**”三词概括群在自组织中的地位，属【CQM 构造假设（仅术语层面）】——三词是本文档对框架既有立场的**重述**；框架原文用的是“对称性／结构／条件／组织形态”等词，**未使用**这一组三词；机制内容一律以所引原文为准。\n\n> **状态标注**：引言属【哲学诠释】——是**定位**，不是新的数学命题；所引框架表述属【CQM 框架基础】。数学侧（§1–§9）不受影响。\n\n> **文档地图与阅读路线**：\n> - **通读**：§1（变换群三层结构）→ §2–§4（群约束性的定义、分类、统一形式）→ §5（保各量的群）→ §6（不变性）→ §7（$S_n$ 与对称群谱系）→ §8（自守形式到 $L$ 函数）；\n> - **查证**：先用上方『定义索引』定位定义，再按节进入；\n> - **只看结论**：§2.1（群约束性定义）＋ §3.1（四条基约束性）＋ §6.1（不变性）；\n> - **编号说明**：一级章用阿拉伯数字（如 §5），子节为 `§N.M`；文首『引言』不编号，记作 §0。\n> - **与姊妹文档的分工（单一事实来源）**：量纲／特征常数／差异分类学以 `CQM_核心_量纲与群论.md` **§6.4** 为准（本文档 §5.5 只列要点）；三条腿的分工与常数三类分法以该文档 **§7.5** 为准（本文档 §5.5 末只给指针）；群约束性／不变性／$S_n$ 谱系／自守形式以**本文档**为准（该文档 §6.4.7 只“列而不论”）。\n\n---\n\n## 1. 变换群三层结构 $\\mathrm{Sym}\\supset\\mathrm{Diff}\\supset GL$\n\n### 1.1 三层\n\n设同一底层集合 $M$ 上叠加多重结构（集合＋向量空间 $V\\cong\\mathbb{R}^{n}$＋光滑流形），三个群都是双射群 $\\mathrm{Sym}(M)$ 的子群：\n\n$$\\boxed{\\ GL(V)\\;\\subset\\;\\mathrm{Diff}(M)\\;\\subset\\;\\mathrm{Sym}(M)\\ }$$\n\n| 群 | 保持的结构 | 约束类型 | 群的性质 |\n|:---|:---|:---|:---|\n| $\\mathrm{Sym}(M)$ | 集合基数（无结构） | 无 | 非李群 |\n| $\\mathrm{Diff}(M)$ | 光滑结构（$C^{\\infty}$ 函数层） | 正则性约束（非代数等式） | Fréchet 李群（**无穷维**） |\n| $GL(V)$ | 线性结构（加法、数乘、原点） | 多项式等式约束 | 有限维李群（$\\dim_{\\mathbb{R}}=n^{2}$） |\n\n三层即 $\\mathrm{Aut}(M,\\varnothing)$／$\\mathrm{Aut}(M,C^{\\infty}_{M})$／$\\mathrm{Aut}(V,+,\\cdot)$——“自同构群＝结构的保持者”（标准定理：第二可数 $M$ 的 $\\mathbb{R}$-代数自同构恰为 $f\\mapsto f\\circ\\varphi$，故 $\\mathrm{Diff}(M)\\cong\\mathrm{Aut}_{\\mathbb{R}}(C^{\\infty}(M))$）【标准数学】。\n\n$$\\boxed{\\ \\text{附加结构越多}\\;\\Longleftrightarrow\\;\\text{约束越多}\\;\\Longleftrightarrow\\;\\text{自同构群越小}\\ }$$\n\n只有 $GL$ 层的约束是有限维矩阵等式约束，能写进统一模板（§4）；$\\mathrm{Diff}$ 层是正则性约束，$\\mathrm{Sym}$ 层无约束。\n\n### 1.2 作用层：一切“保持”都相对于作用\n\n三层结构里的三个群**都不是抽象地出现的**——它们被给定为**同一底层集合 $M$ 上的作用**（即 $\\mathrm{Sym}(M)$ 的子群）。这一“作用前提”值得单列，因为它决定本文档全部陈述的指称方式【标准数学】：\n\n- **抽象群不承载不变性**：群本身只是一个集合带运算（范畴上即**单对象群胚**）；“保持什么”不是群的性质，而是**（群，作用对象）**这对数据的性质。同构的两个群可以在不同对象上作用，从而“保持”完全不同的东西——这正是 §5.6 **大内差异**（同一属性量在不同实现空间给出不同属性关系群）的根据。\n- **给定作用后，“不变”是精确可算的**：设 $G$ 作用于 $X$，令\n  $$\\mathrm{Fix}(S)=\\{x\\in X\\mid \\forall g\\in S,\\ gx=x\\},\\qquad \\mathrm{Stab}(Y)=\\{g\\in G\\mid \\forall y\\in Y,\\ gy=y\\},$$\n  则 $\\mathrm{Fix}\\dashv\\mathrm{Stab}$ 构成一对**反序 Galois 连接**：\n  $$S\\subseteq \\mathrm{Stab}(Y)\\iff Y\\subseteq \\mathrm{Fix}(S),$$\n  即**群的一部分（子群）↔ 被固定的元素的一部分**；伽罗瓦理论基本定理是它在 $X=L$、$G=\\mathrm{Gal}(L/K)$、$Y$ 取中间域时的特例。\n- **本文档的作用对象**：§3–§4 的对象是 $V$ 及其张量幂（$A\\cdot J=A^{\\sigma}JA$ 即 $V$ 上自然作用诱导到张量空间后的作用）；§5.1–§5.2 的对象是相应的量（四速度、正则共轭对、平行多面体体积等）；§8.2 的对象是函数的实现空间。因此**“保某量不变”一律读作“在给定作用下的稳定子”**，记 $G_{Q}=\\{g\\mid g\\cdot Q=Q\\}$（§6.1 定义）。\n- **附注（何时“不变性”退化）**：给定作用后不变子结构总存在（轨道分解 $X=\\bigsqcup_i\\mathrm{Orb}(x_i)$），但可能平凡——$G$ 在 $X$ 上**传递**时不变子集只有 $\\varnothing$ 与 $X$；要得到有意味的不变性（不动点、不变张量、不变测度），需附加条件：有限群／紧群可用平均法，紧群有 Haar 测度，线性代数群的不变多项式环有限生成（Hilbert／Noether）。\n\n---\n\n## 2. 群约束性的定义\n\n**一句话**：群约束性＝**在群上加一个约束，切出一个新群**（命题 2.2）。约束本身只是条件——**不必**预先写成“保持某属性”：如约束“$a_{31}=0$”切出子群，“它保持什么”并无先于约束的答案。对切出的**闭**子群，“保持某个张量”的读法事后**总存在但不唯一**（§6.1 标准结果）；四条基约束性（§3.1）是这种读法最自然的实例——属性保持不变性是约束的**再描述**，不是约束的定义（§6）；而被保持者总是**相对于某个作用**而言的（§1.2）。\n\n### 2.1 操作性定义\n\n> **定义 2.1（群约束性，简称“约束性”）**：**任意给定作用的群** $G$（作用对象记 $X$，§1.2）所受的约束模式 $\\mathfrak{X}=(\\mathcal{C},\\mathcal{S})$：$\\mathcal{C}$ 是加在 $G$ 上的一组**等式约束**（要求 $g\\in G$ 满足 $\\mathcal{C}$）；$\\mathcal{S}$ 是这组约束**保持的结构**（内积、体积形式、辛形式、号差等）；对应群 $G(\\mathfrak{X})=\\{g\\in G\\mid g\\ \\text{满足}\\ \\mathcal{C}\\}\\le G$。\n>\n> **两条范围说明**：① **群不限**——凡给定作用的群都可讨论其约束性（§1.2、§3.3），$GL(n,\\mathbb{F})$ 只是最便于写进统一模板的**线性情形**（§3.1、§4）；② **“某物”不限**——约束性针对的是**某物**（任意被实现的对象，§2.2），**属性只是其中一类**（§5.3），§3–§5 展开的主要是属性（量）这一支。\n>\n> **线性情形（本文档展开的标准情形）**：$G=GL(n,\\mathbb{F})$ 时，$\\mathcal{C}$ 由 $V$ 上固定结构张量写出（承托性开条件 $\\det A\\neq0$ 单列），对应群 $G(\\mathfrak{X})=\\{A\\in GL(n,\\mathbb{F})\\mid A\\ \\text{满足}\\ \\mathcal{C}\\}$；非线性情形（引力侧）见 §3.2。\n\n记号：$A^{T}$ 转置；$A^{\\dagger}=\\overline{A}^{T}$；$J$＝固定**非退化**结构矩阵；$\\Omega=\\begin{pmatrix}0&I_n\\\\-I_n&0\\end{pmatrix}$；$\\eta_{p,q}=\\mathrm{diag}(+1^{\\times p},-1^{\\times q})$；$\\sigma\\in\\{T,\\dagger,\\dagger_{\\mathbb H}\\}$。\n\n**为什么必须是等式约束**：只有等式（或承托性开条件 $\\det\\neq0$）才切出子群；不等式切出的只是子集，不封闭于乘法与取逆。\n\n> **命题 2.2（约束切出子群）**【标准数学】：$J$ 非退化、$\\sigma\\in\\{T,\\dagger\\}$，则 $\\mathcal{G}=\\{A\\mid A^{\\sigma}JA=J\\}$ 与 $\\mathcal{SL}=\\{A\\mid\\det A=1\\}$ 都是子群。\n> **证明**：乘法封闭 $(AB)^{\\sigma}J(AB)=B^{\\sigma}(A^{\\sigma}JA)B=J$；含幺 $I^{\\sigma}JI=J$；由 $A^{\\sigma}JA=J$ 得 $(A^{-1})^{\\sigma}JA^{-1}=J$。$\\mathcal{SL}$：$\\det(AB)=\\det A\\det B=1$。$\\blacksquare$\n\n---\n\n### 2.2 关系群／约束群／实现群（一般定义）\n\n> **定义（关系群／约束群／实现群）**：**使得某物在特定关系（约束）下实现为另外一种形式的群**。三个名字指同一对象，只是取的角度不同——“**关系群**”（关系）／“**约束群**”（约束）／“**实现群**”（实现）。\n\n> **两点提示**：① 定义中的“**某物**”是**任意被实现的对象**——**属性只是其中一类**（“某物＝属性”这一情形见 §5.3–§5.6）；② “**另外一种形式**”是关键——实现的结果是原形式**之外**的形式（原形式 → 新形式，二者由自守因子联系，见 §8.2）。\n\n> **纲领挂钩**：「潜在-显现化」之「关系分化」环节的一般形式——关系（约束）把处在潜在态的属性潜能分化为具体形式；量纲实现这一支的展开见 §5.3–§5.6 与 `CQM_核心_量纲与群论.md` §6.5。\n\n**与定义 2.1 的关系**：定义 2.1 的约束集 $\\mathcal{C}$ 切出群 $G(\\mathfrak{X})$；**同一个群**在“实现”这一读法下就是关系群／约束群／实现群——约束写的是它的**条件**，实现说的是它的**作用**（§1.2）。\n\n---\n\n## 3. 分类：四条基约束性与其派生\n\n### 3.1 基约束性（线性层 $GL(n)$）：四条\n\n线性层 $GL(n,\\mathbb{F})$ 的群约束性中，最自然、也最常用的**四条基约束性**是——三个二次型保持（由 $J$ 的对称／反对称／厄米类型给出）加一个行列式型。**它们只是“专门论述”的对象，不是群约束性的全部**（约束性适用于任意子群，见 §6.3）：\n\n| 基约束性 | 群 | 约束方程 | 保持结构（不变量） | 几何意义 |\n|:---|:---|:---|:---|:---|\n| **正交性 O** | $O(n)$ | $A^{T}JA=J$（$J$ 实对称，取 $J=I$） | 实内积 | 保长度、角度 |\n| **辛性 Sp** | $Sp(2n,\\mathbb{F})$ | $A^{T}JA=J$（$J$ 反对称非退化，取 $J=\\Omega$） | 辛形式 | 保相空间面积／体积（体积自动保持——辛群恒有 $\\det=1$，Pfaffian 论证：$\\mathrm{pf}(\\Omega)=\\det(S)\\,\\mathrm{pf}(\\Omega)\\Rightarrow\\det S=1$） |\n| **酉性 U** | $U(n)$ | $A^{\\dagger}JA=J$（$J$ 复厄米，取 $J=I$） | 复内积 | 保复长度、角度 |\n| **体积（特殊）** | $SL(n,\\mathbb{F})$ | $\\det A=1$（等价于 $A^{*}\\mathrm{vol}=\\mathrm{vol}$） | 体积形式 | 保体积、保定向体积 |\n\n$GL(n)$ 本身（$\\det A\\neq0$ 承托条件）不是约束，是**无约束母群**（§6.2）。\n\n> **读法提示**（§1.2）：表中“保持结构”一列指**在 $V$ 上自然作用下、诱导到张量空间后的不动点**——“约束方程”就是这一不动点条件的写法。\n\n### 3.2 基约束性（非线性层 $\\mathrm{Diff}(M)$）：引力侧\n\n$GL(n)$ 层的矩阵约束不含 $\\mathrm{Diff}(M)$（无穷维，无忠实有限维线性实现），但“约束切出子群”的思想在非线性层同样成立——**引力侧的基约束性**是“保张量场”方程：\n\n$$G=\\{f\\in\\mathrm{Diff}(M)\\mid f^{*}J=J\\}\\qquad(J\\ \\text{为}\\ M\\ \\text{上的固定张量场})$$\n\n| 非线性基约束性 | 稳定子群 | 维数 |\n|:---|:---|:---|\n| **保度规** $f^{*}g=g$ | $\\mathrm{Isom}(M,g)$ | **有限维**（Myers–Steenrod 定理） |\n| **保辛形式** $f^{*}\\omega=\\omega$ | $\\mathrm{Symp}(M,\\omega)$ | 无穷维 |\n| **保体积形式** $f^{*}\\mathrm{vol}=\\mathrm{vol}$ | $\\mathrm{SDiff}(M)$ | 无穷维 |\n| **保复结构** $f^{*}\\mathcal{J}=\\mathcal{J}$ | 全纯微分同胚群 $\\mathrm{Diff}(M,\\mathcal{J})$ | 一般无穷维（紧致可有限，如亏格 $\\ge2$ 曲线） |\n\n**一处结构不对称**：同一“保张量”方程给出的维数随对象与拓扑变化——线性层“保张量”必然给出**有限维**群，非线性层则不然（§1.1“只有 $GL$ 层的约束是有限维矩阵等式约束”的另一面）。\n\n### 3.3 群约束性覆盖的群：总览\n\n群约束性**针对的是所有群**——严格地说，凡**给定作用的群**都可读作其对象所受的约束（§1.2），故只要某一层上给出了作用，“约束性”这一读法即适用。本文档实际涉及的群按下表归拢（括号内为所在节）：\n\n| 层 | 群 | 备注 |\n|:---|:---|:---|\n| **母群**（无约束端点） | $GL(n,\\mathbb{F})$、$\\mathrm{Diff}(M)$、$\\mathrm{Sym}(M)$ | 只保裸结构，**不是**约束性（§6.2） |\n| **线性层·经典族** | $O(n)$、$SO(n)$、$U(n)$、$SU(n)$、$Sp(2n,\\mathbb{F})$、$O(p,q)$、$SO(p,q)$、$U(p,q)$、$SU(p,q)$、$SL(n,\\mathbb{F})$ | 四条基约束性及其派生（§3.1、§4） |\n| **线性层·派生族** | $CO(n)$（共形化 $\\mathbf{C}$）、$PSU(n)$／$PSO(n)$／$PSL(n)$（射影化 $\\mathbf{P}$）、$Sp(n)$、$SO^{*}(2n)$／$SU^{*}(2n)\\cong SL(n,\\mathbb{H})$（换基域 $\\mathbb{H}$） | §4.1 派生方向 |\n| **线性层·例外族** | $G_2$、$F_4$、$E_6$、$E_7$、$E_8$ | 由各自的结构张量切出（$G_2$：结合 3-形式；$F_4$：约当代数结构；$E_6$：三次型；$E_7$：辛形式＋四次型；$E_8$：无低次简单结构张量描述，见 §5.4） |\n| **仿射层**（含平移） | $E(n)=\\mathbb{R}^{n}\\rtimes O(n)$、$ISO(1,3)=O(1,3)\\ltimes\\mathbb{R}^{1,3}$（庞加莱群） | 保距离的**完全**等距群（线性部分＋平移）；单纯平移 $\\mathbb{R}$ 属此层（§5.1、§6.4） |\n| **非线性层**（引力侧） | $\\mathrm{Isom}(M,g)$、$\\mathrm{Symp}(M,\\omega)$、$\\mathrm{SDiff}(M)$、$\\mathrm{Diff}(M,\\mathcal{J})$ | 由“保张量场”切出（§3.2） |\n| **离散与有限** | $S_N$（置换与统计）、$\\mathbb{Z}^{3}$ 与空间群（晶格）、$O(1,3;\\mathbb{Z})$（离散洛伦兹）、$U(n;\\mathbb{Z}[i])$ | 连续群内取离散子群（§5.4、§7） |\n| **CQM 谱系层** | $GL(5)$／$GL(5,\\mathbb{C})$、$SU(5)$、$U(1)\\times SU(2)\\times SU(3)$、$U(1)_{B-L}$、$\\mathbb{Z}_2^{P}$、$\\mathbb{Z}_2^{C}$、$SL(2,\\mathbb{Z})$ | §7.3 |\n\n> **索引**：任意群若要在本文档的“约束性”下被讨论，需**先给定其作用**（§1.2）；给定作用后，上表每一类都是其作用对象的稳定子（§6.1 定义），并可由统一模板 $\\mathcal{G}(J,\\sigma,\\lambda,D)$（§4.1）或其非线性对应（§3.2）写出。\n\n---\n\n## 4. 统一形式\n\n### 4.1 推广的统一模板\n\n二次型约束都能写成 $G=\\{A\\mid A^{\\sigma}JA=J\\}$：$J$ 的**类型**（对称／反对称／厄米）给出三条基约束性 $O$／$Sp$／$U$（§3.1），$J$ 的**号差与基域**给出派生族（派生方向见本节末）；$\\det=1$ 是独立于 $J$ 的行列式型约束，由模板的 $D$ 参数吸收。$A^{\\sigma}JA=J$ 的含义正是“**保 $J$ 不变**”——**每种约束性都是一种不变性**（§6）。把号差、基域、标度、行列式、商一并吸收，得覆盖全部条目的模板：\n\n$$\\boxed{\\ \\mathcal{G}(J,\\sigma,\\lambda,D)\\;=\\;\\bigl\\{A\\in GL(n,\\mathbb{F})\\ \\big|\\ A^{\\sigma}JA=\\lambda(A)\\,J,\\ \\det A\\in D\\bigr\\}\\big/Z\\ }$$\n\n| 参数        | 取值                                  | 作用                                      |\n| :-------- | :---------------------------------- | :-------------------------------------- |\n| $J$       | 非退化固定矩阵                             | 决定**保哪种结构**                             |\n| $\\sigma$  | $T$／$\\dagger$／$\\dagger_{\\mathbb H}$ | 决定**基域与对合类型**                           |\n| $\\lambda$ | $\\equiv1$／标度特征标 $\\mathbb{R}^{+}$    | 决定**是否共形化**（$\\mathbf{C}$）               |\n| $D$       | $\\mathbb{F}^{\\times}$／$\\{1\\}$／其它子群  | 决定**是否特殊化**（$\\mathbf{S}$；$\\det=1$ 由此吸收） |\n| $Z$       | $\\{e\\}$／$Z(G)$                      | 决定**是否射影化**（$\\mathbf{P}$）               |\n\n**派生方向**（由四条基约束性生成其余条目）：**换 $J$ 号差** $J=\\eta_{p,q}$／$I_{p,q}$ → $O(p,q)$（洛伦兹性）／$U(p,q)$，加 $\\det=1$ 得 $SO(p,q)$／$SU(p,q)$；**换基域**（四元数）→ $Sp(n)$／$SO^{*}(2n)$；**特殊化 $\\mathbf{S}$** → $SO(n)$／$SU(n)$（辛族自动，$\\det=1$ 是推论）；**共形化 $\\mathbf{C}$** → $CO(n)$；**射影化 $\\mathbf{P}$** → $PSU/PSO/PSL$。\n\n---\n\n## 5. 时间与各量：保它们的群\n\n### 5.1 保时间的群\n\n时间的保持分三个层级，从线性到非线性：\n\n| 层级 | 群 | 保持什么 |\n|:---|:---|:---|\n| **洛伦兹（线性层）** | $O(1,3)$（$J=\\eta_{1,3}$，换 $J$ 派生） | 时空间隔 $ds^{2}=c^{2}dt^{2}-d\\vec{x}^{\\,2}$；固有时 $d\\tau$ 不变 |\n| **庞加莱（仿射层）** | $ISO(1,3)=O(1,3)\\ltimes\\mathbb{R}^{1,3}$ | 闵氏时空的**等距群**——间隔与固有时全局保持（含时间／空间平移） |\n| **引力（非线性层）** | $\\mathrm{Isom}(M,g)\\le\\mathrm{Diff}(M)$（§3.2） | 度规 $g$ → 沿世界线的固有时保持（弯曲时空的等距群） |\n\n**一句话**：保时间的群＝**洛伦兹 → 庞加莱 → $\\mathrm{Isom}(M,g)$**——线性、仿射、非线性三个层级的等距结构；单纯的时间平移 $\\mathbb{R}$（$t\\mapsto t+a$）属仿射层（§3.3），含于庞加莱。\n\n**作用对象**：$O(1,3)$ 作用于**四速度** $u^{\\mu}$（$u^{\\mu}u_{\\mu}=c^{2}$）→ 固有时不变——时间由四速度的范数保持。\n\n### 5.2 其它的量与它们的群\n\n| 量 | 群 | 不变量 |\n|:---|:---|:---|\n| 长度、角度 | $O(n)$ | 实内积 |\n| 定向 | $SO(n)$ | 实内积＋$\\det=1$ |\n| 概率（相位） | $U(n)$ | 复内积 |\n| 相空间面积 | $Sp(2n)$ | 辛形式 |\n| 体积 | $SL(n)$ | 体积形式 |\n| 角度（允许缩放） | $CO(n)$ | 共形类 |\n\n> **读法提示**（§1.2）：表中“不变量”一列是**该群作用于相应空间（表示）时**的不变量；同一个群换作用对象即可换不变量——这正是 §5.3“同一长度的多种实现”与 §5.6“大内差异”的根据。\n\n> **注（不入本章者）**：诺特荷（电荷、能量、动量）与质量（表示参数）是守恒量／参数，不是“被群保持的几何结构”。\n\n**作用对象（最小记录）**：\n- **单个向量**：$O(n)$、$U(n)$ 作用于一个向量 → 长度／概率（范数）不变；\n- **向量对**：$Sp(2n)$ 作用于正则共轭对 $(q,p)$ → 辛面积不变；\n- **向量组**：$SL(n)$ 作用于 $n$ 个向量张成的平行多面体（$\\det$＝其定向体积）→ 体积不变。\n\n### 5.3 长度的各种实现与属性关系群\n\n（**关系群／约束群／实现群**的一般定义见 §2.2。）本节讨论**“某物＝属性”**这一情形——该类称**属性关系群**（正名＝“属性”＋“关系群”；其**约束侧的对偶名称＝属性量的不变群约束性**，见 §6.1）；若某物取别的对象，则属别的关系群类。就属性这一情形而言，按所实现的对象分两类：\n\n| 类别 | 所实现的对象 | 例 |\n|:---|:---|:---|\n| **属性量纲关系群** | 属性的**量纲实现**——即讨论的是**属性量的不变性**（§5.5–§5.6、§6.1 的那一支） | “保长度”的 $E(3)$、$O(3)$；“保距离”的 $PSL(2,\\mathbb{R})$、$O(1,3)$、$\\mathrm{Isom}(M,g)$ |\n| **别的属性关系群** | 属性的**别的实现**（不一定针对量纲实现） | 置换与统计属性 → $S_N$（§7）；规范属性 → $U(1)\\times SU(2)\\times SU(3)\\subset SU(5)$（§7.3）；光滑结构属性 → $\\mathrm{Diff}(M)$（§1.1） |\n\n两类**数学模式相同**（都是“某属性在给定作用下的稳定子”，§1.2），差别只在所承载的实现属于哪一类。就“长度量度”这一属性量而言，其属性关系群就是**保持该量度不变的变换群**。\n\n“长度”不止一种实现——空间长度、波长、粒子尺度、康普顿波长、固有长度、关联长度、晶格常数、玻尔半径、普朗克长度……每种实现所在的空间与结构不同，保持它的**度量不变的属性关系群**也不同：\n\n| 长度实现 | 定义／表达式 | 属性关系群（连续） | 离散子群例子 | 说明 |\n|:---|:---|:---|:---|:---|\n| **空间长度** | $L=\\lvert\\Delta\\vec{x}\\rvert$ | $E(3)=\\mathbb R^{3}\\rtimes O(3)$ | 空间群、晶格 $\\mathbb Z^{3}$ | 欧氏空间等距群，保距离 |\n| **波长** | $\\lambda=2\\pi/\\lvert\\vec{k}\\rvert$ | $O(3)$（旋转；含平移则 $E(3)$） | 晶体点群、空间群 | 波矢空间中的长度，旋转保 $\\lvert\\vec{k}\\rvert$ |\n| **粒子尺度** | 半径 $R$ | $SO(3)$（含平移则 $E(3)$） | 二十面体群、点群 | 球对称粒子的半径，旋转不变 |\n| **康普顿波长** | $\\lambda_{C}=\\hbar/(mc)$ | 庞加莱群 $ISO(1,3)$ | 离散庞加莱群 | 静止质量 $m$ 不变——庞加莱 Casimir $P_{\\mu}P^{\\mu}=m^{2}c^{2}$ |\n| **固有长度（类空）** | $L_{0}=\\sqrt{ds^{2}}$ | $O(1,3)$／庞加莱 $ISO(1,3)$ | $O(1,3;\\mathbb Z)$ | 类空时空间隔，洛伦兹不变量 |\n| **关联长度** | $\\xi$ | $E(3)$／$O(3)$ | 取决于系统 | 相变中的空间关联尺度；临界点处放大为标度／共形对称 |\n| **散射有效半径** | $r_{\\mathrm{eff}}$ | $SO(3)$ | 点群 | 相互作用的有效空间尺度，旋转不变 |\n| **晶格常数** | $a$ | 空间群（本身即离散群） | 空间群 | 晶体的平移＋点群对称性 |\n| **玻尔半径** | $a_{0}=\\dfrac{4\\pi\\varepsilon_{0}\\hbar^{2}}{m_{e}e^{2}}$ | $SO(3)$ | 点群 | 原子尺度；库仑问题束缚态实有更大的隐含 $SO(4)$ 对称 |\n| **普朗克长度** | $l_{P}=\\sqrt{\\hbar G/c^{3}}$ | 尚不明确 | — | 被视为所有观察者共同的长度，但对应属性关系群未知 |\n\n**关键点**：\n1. **属性关系群由长度实现所在的空间与结构决定**——空间长度在欧氏空间对应 $E(3)$；波长在波矢空间对应 $O(3)$；康普顿波长在动量空间对应庞加莱群（Casimir $P_{\\mu}P^{\\mu}=m^{2}c^{2}$ 保质量）；固有长度在闵氏时空对应洛伦兹群；\n2. **离散子群是进一步选择**——在连续属性关系群内部取离散子群（晶格、空间群、离散洛伦兹群等），带来谱数据与算术结构（傅里叶系数、Hecke 特征值等）；根本结构由连续属性关系群决定（§8.2“定结构／调数值”）。（离散子群的选取——含紧性、同余性、尖点数、秩等类型结构——属**小内差异**且是**结构性**的，见 §5.6；固定 $(G_{Q},\\Gamma)$ 后的参数与谱数据是**数值差异**层，不是内差异。）\n\n$$\\boxed{\\ \\begin{aligned}&\\text{长度可表现为空间长度、波长、粒子尺度、康普顿波长、固有长度等；}\\\\&\\text{每种实现对应一个保持该长度量不变的属性关系群（}E(3),O(3),SO(3),ISO(1,3),O(1,3)\\text{）；}\\\\&\\text{离散子群只是选定属性关系群后的进一步离散化。}\\end{aligned}\\ }$$\n\n### 5.4 更完整的属性关系群列表\n\n属性关系群**远不止** §5.2–§5.3 列出的那些——**所有保持某个长度量度不变的变换群都是属性关系群**，按保持的二次型类型系统列出（“空间维数”指长度所在的实现空间维数，非群的维数）：\n\n**（1）欧氏型**（保持正定二次型 $x_1^{2}+\\cdots+x_n^{2}$）：\n\n| 群 | 保持的长度 | 空间维数 |\n|:---|:---|:---|\n| $O(n)$ | $n$ 维欧氏长度 | $n$ |\n| $SO(n)$ | $n$ 维欧氏长度＋定向 | $n$ |\n| $E(n)=\\mathbb R^{n}\\rtimes O(n)$ | $n$ 维欧氏距离（含平移） | $n$ |\n| $SO(4)$ | 4 维欧氏长度＋定向 | $4$ |\n| $SO(3)\\times SO(3)$ | 局部同构于 $SO(4)$ | $4$ |\n| $SU(2)\\times SU(2)$ | $SO(4)$ 的双覆盖 | $4$ |\n| $O(4)$ | 4 维欧氏长度 | $4$ |\n| $E(4)$ | 4 维欧氏距离（含平移） | $4$ |\n\n**（2）不定号（闵氏型）**（保持 $-x_0^{2}+x_1^{2}+\\cdots+x_n^{2}$ 型二次型）：\n\n| 群 | 保持的长度 | 空间维数 |\n|:---|:---|:---|\n| $O(1,n)$／$SO(1,n)$ | $(1+n)$ 维闵氏长度（＋定向） | $1+n$ |\n| $O(1,3)$／$SO(1,3)$ | 4 维闵氏长度（＋定向） | $4$ |\n| $ISO(1,3)$ | 闵氏距离（含平移） | $4$ |\n| $O(2,2)$／$SO(2,2)$ | $2{+}2$ 维不定号长度（＋定向） | $4$ |\n| $O(p,q)$／$SO(p,q)$ | $p{+}q$ 维不定号长度（＋定向） | $p+q$ |\n\n**（3）复／四元数／Hermite 型**：\n\n| 群 | 保持的长度 | 空间维数 |\n|:---|:---|:---|\n| $U(n)$ | $n$ 维复 Hermite 长度 | $n$（复） |\n| $SU(n)$ | 同上＋复定向（复体积元） | $n$（复） |\n| $Sp(n)$ | $n$ 维四元数 Hermite 长度 | $n$（四元数） |\n| $SO^{*}(2n)$ | 四元数反厄米型长度 | $2n$ |\n| $SU^{*}(2n)\\cong SL(n,\\mathbb H)$ | 四元数体积（四元数行列式） | $2n$ |\n\n**（4）其他几何空间**：\n\n| 群 | 保持的量 | 空间 |\n|:---|:---|:---|\n| $SO(4,1)$ | de Sitter 间隔 | $dS_4$ |\n| $SO(3,2)$ | anti-de Sitter 间隔 | $AdS_4$ |\n| $O(4,2)$ | **共形类**（度规差一个共形因子——非严格意义的长度） | 共形空间 |\n| $Sp(2n,\\mathbb R)$ | 辛“长度”（辛面积——拟长度） | 辛空间 |\n| $G_2$ | 例外 3-形式（诱导度规，$G_2\\subset SO(7)$） | $G_2$ 流形 |\n| $F_4,\\ E_6,\\ E_7,\\ E_8$ | 例外结构张量（§3.3；部分诱导度规） | 例外几何 |\n\n**（5）离散子群**——上述每个连续属性关系群都可取离散子群：$SO(4;\\mathbb Z)$、$O(1,3;\\mathbb Z)$、$U(n;\\mathbb Z[i])$、晶格、空间群、算术群等。\n\n**关键点**：\n\n$$\\boxed{\\ \\text{属性关系群：属性经其携带的关系（约束）实现为某形式的群；}\\\\\\text{就某个量度而言，即所有保持该量度不变的变换群——数量无穷多。}\\ }$$\n\n- 每个维度、每个号差、每个数域，都有对应的属性关系群；\n- 经典群 $O,SO,U,SU,Sp$ 都是属性关系群；例外群 $G_2,F_4,E_6,E_7,E_8$ 也是属性关系群（保持各自的例外结构张量，§3.3）；\n- 它们的离散子群更是无穷多。\n\n---\n\n### 5.5 量纲（要点；完整讨论见`CQM_核心_量纲与群论.md` §6.4）\n\n> **完整表述见** `CQM_核心_量纲与群论.md` **§6.5**（量纲的群论形式：基本层级、定义 1–5、核心命题、$GL(5)$ 情形、两级量纲、基本自守量纲群与量纲内分化、量纲总分类 §6.5.13）。\n\n量纲是**属性（自由度）被实现的量度类别**，特征常数 $K$ 是该次实现的特征常数。**独立属性判定、特征常数的两支（跨量纲／同量纲内）、差异分类学、物理常数与 $G_N$ 的量纲**等纯量纲内容，一律见 `CQM_核心_量纲与群论.md` **§6.4**；本节只保留与“保它们的群”直接相关的部分（本节与 §5.6 谈的是“**属性量的不变性**”这一支；**属性关系群与本文档所论的群并不都以量纲为限定**，见 §5.6 范围提示）：\n\n| 属性类型 | 量纲 | 载体群所在层 | 备注 |\n|:---|:---|:---|:---|\n| **时空型** | $[T]$、$[L]$、$[M]$ | **时空（仿射）层**（平移属 $\\mathrm{Aff}(V)=GL(V)\\ltimes V$） | $[M]$ 的群论角色为庞加莱 Casimir $P^{\\mu}P_{\\mu}=m^{2}c^{2}$（粒子静质量）；§5.1、§7.3 |\n| **内部规范荷型** | $[Q]$、色荷、弱同位旋 | **内部 $GL$ 层酉族**（$U/SU\\subset SU(5)\\subset GL(5)$） | §7.3 |\n| **借链型（统计量）** | 温度 $\\Theta$ | **经能量借链**（$ML^{2}T^{-2}$，$K_\\Theta$；§7.7.3） | 属性量纲关系群见 `CQM_核心_量纲与群论.md` §6.5.11 待建立项 3 |\n\n**三条腿的分工**：量纲发生学给**量纲类别与特征常数 $K$**（定性）、唯物主义群论给**哪个群保哪个属性量**（结构，**不出数值**）、自守形式给**数值**（定量）——三者合起来才打通“量纲—群论—自守形式”。由此“无法解释的基本常数”分三类：**有量纲特征常数**（$c$、$\\hbar$、$G_N$、$K_L$……，跨量纲对）与量纲**直接相关**；**比值型无量纲常数**（$m_e/m_p$、$\\alpha$……，同量纲对）是**量纲内差异的定量体现**，与量纲**紧密相关**（“无量纲”来自量纲相消）；只有**纯数型**（$☯$、$\\gamma_n$……）在量纲发生学中**没有对应的“量纲对”**。完整表述见 `CQM_核心_量纲与群论.md` **§7.5**。\n\n### 5.6 量纲内差异＝实现群的差异（属性关系群 vs 离散群）\n\n> **群链读法见** `CQM_核心_量纲与群论.md` **§6.5.9**（粗粒化＝沿子群链向上、细粒化＝向下）。\n\n- **量纲间差异＝属性类型的差异**（不同自由度 → 不同量纲）；\n- **量纲内差异＝实现群的差异**，分两级——**大内差异**与**小内差异**，两级都是**结构性**差异；固定 $(G_{Q},\\Gamma)$ 后的参数与谱数据**不是群**，不属内差异，独立为数值差异层：\n  - **大内差异＝连续属性关系群的选取**（同一属性量在不同实现空间给出不同连续关系群；例：“保长度”在欧氏空间 → $E(3)$（空间长度）、波矢空间 → $O(3)$（波长）、定向实现 → $SO(3)$、闵氏时空 → $O(1,3)$（固有长度）、双曲平面 → $PSL(2,\\mathbb{R})$、弯曲流形 → $\\mathrm{Isom}(M,g)$）——**改结构**（改的是“哪个群保这个量”，即 $G_{Q}$ 本身，见 §1.2、§6.1 定义）；\n  - **小内差异＝离散子群的选取**——在选定连续关系群内部取哪种离散子群（晶格 $\\mathbb{Z}^{3}$、空间群、离散洛伦兹群 $O(1,3;\\mathbb{Z})$、$U(n;\\mathbb{Z}[i])$；$SO(3)$ 内的点群 $C_n$、$D_n$、$T$、$O$、$I$——均为**旋转**点群）——**同样是结构性差异**（§8.2 精确化：商空间紧性决定连续谱有无——无尖点 → 无 Eisenstein 连续谱；同余／非同余决定 Hecke 算子代数；尖点数、秩亦然）。\n- **数值差异（不是内差异，单列一层）**：固定 $(G_{Q},\\Gamma)$ 之后的参数与谱数据——格常数、傅里叶系数、Hecke 特征值 $\\lambda_p$——只调数值（§5.3 关键点 2）。参数与谱数据**不是群**，故不属于“实现群的差异”。\n- **计数口径**：物理量纲有限（SI 七个）；**基本自守量纲（群种类）$n\\ge2$ 时无穷**（$\\mathbb{Z}/m$ 无限族，`CQM_核心_量纲与群论.md` §6.5.4 命题 3 注口径）；大内差异**命名族有限、同构类数一般无穷**（$E(n)$ 跨维数族已无穷）；小内差异无穷多（$\\mathbb{Z}/m$、$C_n$ 族）。\n- **与量纲的关系**：两级都不产生新的**物理量纲**（仍在同一量纲内），但产生**不同的基本自守量纲（群种类）**——$[E(3)]\\ne[O(3)]\\ne[O(1,3)]$（`CQM_核心_量纲与群论.md` §6.5.12 口径）；离散侧 $[G']$（$G'\u003cG_{\\max}$）是沿链向下的另一个更细种类（子自守量纲，`CQM_核心_量纲与群论.md` §6.4.7 裁定口径、§6.5.13）。\n- **勿混**：单位与标度（米→英尺、国际米原器）**不属于任何内差异层**——同一群的不同标度约定、群不变（§8.2／`CQM_核心_量纲与群论.md` §6.5.4 命题 6）。\n\n  > 标注：【标准数学（紧性—连续谱、同余性—Hecke 代数、闭子群计数）】＋【CQM 构造假设（两级层级结构与数值差异层的划出）】。\n- **范围提示**：“属性量的不变性”对应 §5.3 分类中的**属性量纲关系群**（这一支在 §5.5–§5.6 讨论）；本文档另有一类**别的属性关系群**（不一定针对属性的量纲实现），故所论的群并不都以量纲为限定：$S_N$（置换与统计，§7）、$GL(5)$／$SU(5)$（规范与谱系，§7.3）、$\\mathrm{Diff}(M)$（引力的规范冗余，§1.1）、离散子群与算术群（§5.4）等。\n- 完整讨论（含与`CQM_核心_量纲与群论.md` §6.2“大差异／同量纲内差异”的对应、用语提示）见 `CQM_核心_量纲与群论.md` §6.4。\n\n---\n\n## 6. 不变性：约束的另一面\n\n### 6.1 约束性 ＝ 不变性\n\n$A^{\\sigma}JA=J$ 读成一句话：“**无论怎样变换，被保持的形式始终不变**”：\n\n$$\\boxed{\\ \\text{每种约束性}\\ =\\ \\text{在某种变换下，某个量（结构）保持不变}\\ }$$\n\n**统一表述（限于本章与 §3–§5 展开的诸约束性）**：群约束性的被保持者**一般是“某物”**（任意被实现的对象，§2.2），**属性量只是其中一类**（§5.3）；本文档 §3–§5 所论的诸约束性主要取“某物＝属性（量）”这一支（纯结构项除外，见 §3.3 例外族），即都是**某种属性量的不变群约束性**。这里“属性量”指**某个属性的可量化体现**（长度、角度、概率模方、相空间面积／体积、时空间隔、固有时……）。**“内蕴”指该量的值在实现过程中具有内在不变性；与之相对，表面值不一定一样**（各形式（实现）下的具体值彼此可以不同）。\n\n> **用词说明**：这里的“**属性**”更接近物理上的**自由度**（degree of freedom）——指系统在描述中**可独立取值、并承受变换作用的那些方面**（空间广延、相位、质量……）；“**属性量**” $Q$ 则是该自由度的可量化体现。无论**线性层**（$GL$ 层，§3.1）还是**非线性层**（引力侧，§3.2），本文档 §3–§5 所论的每一条约束性，讨论的都是**某个量（或结构）的不变群约束性**——取“某物＝属性（量）”这一支时即**属性量的不变群约束性**：\n\n| 层 | 约束性 | 被约束（被保持）的**属性量／结构** |\n|:---|:---|:---|\n| **线性层**（$GL$ 层） | 正交性 | 实内积（长度、角度） |\n| | 酉性 | 复内积（概率模方） |\n| | 辛性 | 辛形式（相空间面积／体积） |\n| | 特殊线性性 | 体积形式（体积） |\n| **非线性层**（引力侧，§3.2） | 保度规 $f^{*}g=g$ | 度规（时空间隔、固有时） |\n| | 保辛形式 | 辛形式场（相空间面积） |\n| | 保体积形式 | 体积形式（体积） |\n| | 保复结构 | 复结构张量场（全纯结构） |\n\n> **定义（不变群约束性）**：**保持某物某种属性／结构等不变的群约束性**。\n>\n> **定义（属性量的不变群约束性）**：就本文档所论的“某物＝属性”这一情形（§5.3；被保持的是该属性的**属性量** $Q$），给定属性量 $Q$（**内蕴**：其值在实现过程中具有内在不变性，见下文“与`CQM_核心_量纲与群论.md`的接口”），**属性量的不变群约束性**指**定义出属性关系群的那组约束**——其中**属性关系群** $G_{Q}$ 是“**在群作用下保持 $Q$ 不变**”的变换群（**一般定义见 §2.2；§5.3–§5.4 为其在“某物＝属性”情形下的用法**；§8.2 亦称“度量不变的属性关系群”）：\n>\n> $$G_{Q}=\\{g\\mid g\\cdot Q=Q\\}\\qquad\\Longleftrightarrow\\qquad \\mathcal{C}_{Q}:\\ g\\cdot Q=Q$$\n>\n> 即：**约束 $\\mathcal{C}_{Q}$ 定义出属性关系群 $G_{Q}$，而 $G_{Q}$ 保持属性量 $Q$ 不变**。三者构成一个三角——正向 **属性量 → 属性关系群 → 不变群约束性**，反向 **不变群约束性 → 属性关系群 → 被保持的属性量**。\n>\n> 例：$Q=$ 实内积 → $G_{Q}=O(n)$，$\\mathcal{C}_{Q}:\\ A^{T}IA=I$；$Q=$ 辛形式 → $G_{Q}=Sp(2n,\\mathbb{F})$，$\\mathcal{C}_{Q}:\\ S^{T}\\Omega S=\\Omega$；$Q=$ 时空间隔 → $G_{Q}=O(1,3)$，$\\mathcal{C}_{Q}:\\ \\Lambda^{T}\\eta\\Lambda=\\eta$。\n>\n> **限定**（沿本节下文“标准结果”与 §2 一句话）：**“保持某个 $Q$”的读法事后总存在但不唯一**——同一属性关系群可由不同的不变群约束性给出，同一条约束也可由不同的 $Q$ 描述；故上述三角是**读法层面**的对应，不是唯一分解。\n\n**与`CQM_核心_量纲与群论.md`的接口**：本节的“属性量”与`CQM_核心_量纲与群论.md`的“属性 → 量纲”在同一条线上分属**三层**（完整论述见`CQM_核心_量纲与群论.md` §6.4）——\n\n- **① 属性被实现为量纲**（§5.5）：量纲＝该属性的**量度类别**；特征常数 $K$ 是这次实现的特征常数（`CQM_核心_量纲与群论.md` §6.4）；\n- **② 各形式（实现）各带自己的“具体值”**（数值 $\\times$ 该实现的量纲）：这是**表面层**——**表面值不一定一样**（换单位、换代表就改）；“原形式 → 新形式”由**自守因子**联系——$f(\\gamma x)=j(\\gamma,x)f(x)$，**$j\\not\\equiv1$ 时新形式的值与原型式的值不相等**。\n- **③ 属性量是内蕴的**：**“内蕴”指该量的值在实现过程中具有内在不变性**，而不是表面不变性。故属性量**不等于**任何实现下的具体值：**表面值不一定一样（表面层），属性量的值在实现过程中保持不变（内蕴层）**。\n\n**不变群约束性的含义随之明确**：$G_{Q}=\\{g\\mid g\\cdot Q=Q\\}$ 保持的是**内蕴的属性量**（内蕴层），而不是各实现的具体值——这正是“保长度”“保概率”在换了单位、换了代表之后**照样成立**的原因。\n\n$$\\underbrace{\\text{属性}\\ \\xrightarrow[\\ \\text{特征常数 }K\\ ]{\\ \\text{被实现为}\\ }\\ \\text{量纲}}_{\\text{量纲与群论 §6.4}}\\ \\rightsquigarrow\\ \\underbrace{\\text{形式（原形式／新形式）：各带其具体值}}_{\\text{表面层——表面值不一定一样，由 }j\\text{ 联系}}\\qquad\\Big\\|\\qquad \\underbrace{\\text{属性量 }Q\\ \\text{的值}}_{\\text{内蕴层——实现过程中不变}}\\ \\xrightarrow{\\ \\text{定义其属性关系群的约束}\\ }\\ \\underbrace{\\text{群约束性}}_{\\text{§6.1、§6.3}}$$\n\n（由不变性到守恒律须跨三道关，见 §6.4——故本节只处理“哪个群保哪个量”，不列守恒律。）\n\n各量与保它们的群的对应表见 §5。**标准结果**【标准数学】：任一有限维线性代数群都是某个有限组张量的稳定子（有限多个多项式方程可整体编码为一个张量）——故“保持某个张量”的读法对切出的**闭**子群事后总存在但不唯一；**“保持不变”是约束的再描述，不是约束的定义**（§2 一句话）。\n\n### 6.2 无约束母群（零约束端点）\n\n非线性层的基约束性（$f^{*}J=J$ 型四个标准稳定子）已列入 §3.2。本节补齐分类的**零约束端点**——无约束母群：$GL(n,\\mathbb{F})$（只要求 $\\det A\\neq0$，不保任何固定张量）；$\\mathrm{Diff}(M)$（只要求光滑双射，只保裸光滑结构）；$\\mathrm{Sym}(M)$（只要求双射，即 $\\mathrm{Aut}(M,\\varnothing)$）。三者分别是各层“裸结构”的自同构群；层内一切约束性＝在母群之上追加固定张量取稳定子，母群即该分类的**零约束端点**。\n\n---\n\n### 6.3 与 FG“重组实现”的关系：同一对象的两种描述角度\n\n**FG 的原文口径**【CQM 框架基础：`07 精细引力（FG）/FG_纤维丛理论.md`、`FG_核心理论.md`】：FG 主丛是**从结构群到本征群的重组实现**——\n\n$$F=G\\ \\Rightarrow\\ R=G\\ \\Rightarrow\\ \\hat{H}$$\n\n- 结构群 $G$（如 $GL(5)$／$SU(5)$）经**重组实现**为本征群 $R$（如 $U(1)\\times SU(2)\\times SU(3)$、壳层本征群 $SU(2)_{k}$），等价地重组为群算符 $\\hat{H}$；$GL(n)$ 的 $n$ **不由底空间几何读出**，而由重组产物 $R$ 的基本表示严格确定（发生学顺序强制）。\n- **Elitzur 定理**给出外部依据：局域规范对称性不能自发破缺 → **规范对称群的相变是重组，不是破缺**（框架原文立场）。\n\n**规范表述：（约束下的）重组实现**。该机制的规范写法应明确为“**（约束下的）重组实现**”——“**重组**”指出**组**的方面（结构群重组为本征群，$G\\Rightarrow R$）；“**约束下的**”指出该重组**不是任意的**，而是**在约束下**发生的（约束被物质条件实现出来），“约束实现”即对此的简说。（框架既有文档（`01 核心理论`／`07 精细引力（FG）`）通篇简称“重组实现”；本文档在需要点明其约束内涵时写“（约束下的）重组实现”。）如此，两侧共享的不只是一个核心词，而是**同一件事的命名**——**动力学侧的名字里就带着“约束”**。\n\n**是不是一回事：本质同一，只是描述角度不同。**\n\n同一个群（同一组约束）有两个面向的写法——**FG 的“重组实现”是它的动力学／发生学描述**（它如何被物质条件确立），**本文档的“群约束性”是它的数学／结构性描述**（它是什么）。二者**不是两个对象，也不是两道工序**，而是**同一对象的两面**。\n\n> **纲领挂钩**：本节即纲领「潜在-显现化」的「**实例化**」环节——物理世界通过（约束下的）重组实现把分化出的属性稳定下来（动力学描述）；稳定下来的标志是建立起自守形式（§8）。\n\n| | 动力学描述（FG：重组实现） | 数学描述（本文档：群约束性） |\n|:---|:---|:---|\n| 面向 | **如何被确立**（发生学顺序） | **是什么**（代数结构） |\n| 表述 | $F=G\\ \\Rightarrow\\ R=G\\ \\Rightarrow\\ \\hat{H}$ | $G=\\{A\\mid A^{\\sigma}JA=J\\}$ |\n| 机制 | 先在规范群 → 角亏涨落 → 扇区耦合涨落 → 条件伴丛结构群 → 物质在条件下自组织实现对称性（框架原文） | 取稳定子；约束 ↔ 保持的属性量 ↔（跨三道关后）守恒荷（§6.1、§6.4） |\n| 依据 | Elitzur 定理；“规范对称性不破缺（重组实现）” | 命题 2.2；张量稳定子（§6.1 标准结果） |\n\n**两侧会合于同一组约束**：动力学侧回答“物质条件如何收敛到某一组约束”（其中每个环节——角亏涨落、扇区耦合涨落、温度——都在**限定**这组约束），数学侧回答“这组约束切出哪个群、保持什么不变量”。故这不是“FG 把一个中间物交给本文档”，而是**同一组约束在两个层面上的展开**：\n\n$$\\underbrace{\\text{物质条件}\\ \\xrightarrow{\\ \\text{限定}+\\text{筛选}\\ }\\ \\text{约束}\\ \\mathcal{C}}_{\\text{动力学描述（FG）}}\\qquad\\Big\\|\\qquad \\underbrace{\\mathcal{C}\\ \\xrightarrow{\\ \\text{取稳定子}\\ }\\ G(\\mathcal{C})}_{\\text{数学描述（本文档）}}$$\n\n> **诚实标注**：两侧的“同一”是**本体论层面**的同一——同一个群、同一组约束；至于“**哪一组物质条件对应哪一条约束**”的逐条映射，框架原文未给出，仍属待建立项。\n\n**普遍性对等；四条基约束性只是“专门论述”的对象**：\n\n- **群约束性是普遍概念**：按定义 2.1，它适用于**任意给定作用的群**（线性情形即 $GL(n,\\mathbb{F})$ 的**任意**子群）——凡由一组等式约束切出的子群都是一个群约束性（命题 2.2）。**它不限于任何特定几条。**\n- **FG 的重组实现同样普遍**：它不针对某几个特殊群，而是对**所有子群**成立的机制（结构群 $G$ → 本征群 $R$ 的重组，在链的任一层都适用）。**两侧的普遍性是对等的**——这正支持本节开头的判断：二者是同一对象的两种描述角度。\n- **$O$／$Sp$／$U$／$SL$ 四条基约束性是“专门论述”的对象，不是约束性的全部。** 专门论述它们有两条理由：\n  1. **它们保持的不变量有直接物理意义**（长度与角度、相空间面积、概率、体积），并进一步对应守恒律（须跨三道关，见 §6.4）；\n  2. **约束形式自然**：它们恰是 2 阶张量（对称／反对称／厄米）与行列式型，即 $GL$ 层最自然的有限维等式约束，且经 §4 的参数（号差／基域／特殊化／共形化／射影化）可生成整个经典族。\n- **四条之外的群约束性同样存在**：例如上三角群（由 $a_{ij}=0\\ (i>j)$ 切出）——它并不“保持某个非退化张量”，只保退化对象（标准旗）；它同样是群约束性（定义 2.1 只要求等式约束），只是 §3–§5 的“保持某结构”语言不直接适用。\n- **一条限定（不变）**：**不能反过来说“约束的定义就是保持某个量”**。按 §2 的一句话，约束本身只是条件（约束“$a_{31}=0$”照样切出子群），“保持什么”是**事后的再描述**且**不唯一**（§6.1 标准结果：任一闭子群都可写成某张量的稳定子，但读法不唯一）。\n- **一条补充：可实现性（稳定性）筛选＝自组织成败**。数学侧约束普遍（任意闭子群，命题 2.2）；但动力学侧的“筛选”（上式）只留下**能稳定者**——理由很直接：**约束要被实现为物质结构，必须由物质自组织把自身组织到该约束上；不稳定＝自组织失败**，该约束因此在物质世界中没有对应物（尽管它在数学上照样切出一个子群）。框架支持：$SU(5)$“不是预设的，而是**物质自组织到第一稳定构型**时自然锁定出来的”（`01 核心理论/CQM_核心_朗兰兹分层共振与相变量子.md` §0）——“第一稳定构型”正是这一筛选的落点。\n  - 由此，“四条基约束性”被专门论述，除“不变量有物理意义”“约束形式自然”外，还有**第三条理由**：它们保持的是**非退化**结构（内积／辛形式／体积形式），因而具备稳定性——反例上三角群只保**退化**对象（标准旗）。\n  - **诚实标注**：稳定性的**判据**（对什么稳定、如何判定）框架尚未给出，属待建立项；“约束不稳定”是**倾向性判断**，非已证命题。\n\n> **本体论定位**：本节“同一对象两面”的**本体论根据**是 CQM 群论的唯物主义定位——群被读作物质自组织中的组织约束的体现，故**发生学侧（物质自组织 → 约束 → 群）是第一性的**。详见文首『引言』。\n\n---\n\n### 6.4 与诺特的关系：不变性 → 守恒律的三道关\n\n§6.1 把约束性等同于不变性（属性量的不变群约束性定义属性关系群，属性关系群保持属性量不变）。**但“不变性 → 守恒律”不是自动的**。诺特定理（第一定理）：**每一个连续单参数整体对称群，对应一条守恒流与守恒荷**（局部规范对称性对应第二定理的 Noether 恒等式）。因此从“保某个属性量”走到“守恒律”，至少要跨三道关：\n\n| 关卡 | 要求 | 反例（说明不可省） |\n|:---|:---|:---|\n| ① **连续性** | 群须是**连续**（李）群；离散子群只给选择定则／超选择规则，**无守恒荷** | $O(n)$ 的反射部分（$\\det=-1$）→ 宇称；$S_N$ 置换 → 统计 |\n| ② **动力学参与** | 该属性量必须是**所研究系统的动力学**所依赖的不变量，而不只是底层空间的几何结构 | 空间仍有内积，但存在外场破坏旋转不变 → 角动量**不守恒**，而“保内积”照样成立 |\n| ③ **作用量层面** | 该不变性须是作用量（或哈密顿量）的对称性 | 长度、概率模方、相空间体积的保全是**无条件**的几何／运动学事实，与动力学无关 |\n\n据此可把常见“守恒”分为三类【标准数学】：\n\n| 类别 | 例子 | 是否诺特荷 |\n|:---|:---|:---|\n| **真正的诺特荷** | $U(1)$ 相位 → 电荷；$SO(n)$ 旋转 → 角动量；内部规范对称 → 规范荷；时空平移 → 能量、动量 | **是** |\n| **几何／运动学不变性** | 保内积 → 长度与角度；保辛形式 → 相空间体积（**刘维尔**）；$\\det=1$ → 体积（不可压）；幺正性 → 概率模方 | **否**——它们是（哈密顿）动力学的**结构性事实**，不来自“对称性 $\\Rightarrow$ 守恒律” |\n| **离散对称性** | 宇称 $\\mathbb{Z}_2^{P}$、电荷共轭 $\\mathbb{Z}_2^{C}$、$S_N$ 全同置换 | **否**——给选择定则／统计，不给守恒荷 |\n\n**两处常见的混淆**：\n\n1. **刘维尔定理不是诺特定理的结论**：相空间体积守恒是哈密顿方程（辛流）的直接结构性质；诺特定理在辛情形的对应物是**矩映射（moment map）守恒**——“相空间体积不变”与“矩映射守恒”是两回事。\n2. **时间／空间平移不在 $GL$ 层**：平移是**仿射**变换（$x\\mapsto x+a$），位于 §5.1 的**仿射层**（$ISO(1,3)=O(1,3)\\ltimes\\mathbb{R}^{1,3}$ 含平移部分）；故“时间平移 → 能量守恒”与“酉性、辛性”**不是同一层次的条目**，不可并列。$GL$ 层给出的是**几何／内部不变性**（长度、概率、相空间面积、体积），而能量、动量来自**仿射层**。\n\n**与 §5.5 的接口**：§5.5 表的“属性量 ↔ 属性关系群”对应只回答“**哪个群保哪个量**”；**至于该不变性是否升级为守恒荷，取决于上述三道关**——故 §5.5 不列守恒律，守恒荷一律在本节判定。\n\n（标注：诺特定理、三类划分、两处混淆均属【标准数学】；“属性关系群／不变群约束性”的术语用法见 §6.1、§5.4。）\n\n\n---\n\n## 7. 置换对称性 $S_n$ 与对称群谱系\n\n### 7.1 三重角色\n\n置换对称群 $S_n$ 按语境分布在三个层级：\n\n| 层级 | 置换的“对象” | 母结构 | 表示论角色 |\n|:---|:---|:---|:---|\n| **外尔群** | $SU(5)$ 的 5 个基础权（**内禀结构自由度**，非独立物理系统） | $S_5=W(A_4)$，阶 $120$ | $M=E^{T}E$ 本征值 $\\{9,4,1\\}$（重数 $\\{1,4,5\\}$）经分解 $\\mathbf{10}=\\mathbf{1}\\oplus\\mathbf{4}\\oplus\\mathbf{5}$ 锁定三扇区【CQM 框架基础】 |\n| **味置换** | 夸克／轻子的味量子数 | $S_n$（$n\\le6$，近似偶然对称） | $S_6$ 有 **5 维**忠实表示，恰可嵌入 $GL(5)$——临界情形【文献确立】 |\n| **全同粒子** | $n$ 个全同粒子 | $S_n$（**无 $n$ 限制**） | 统计只用一维表示（可嵌入 $GL(1)$）；$n>6$ 时忠实表示维数 $n-1>5$，超出 $GL(5)$ |\n\n“$S_n$ 是 $n$ 个系统的置换”只在第三层成立；第一层置换的是内禀结构自由度。\n\n### 7.2 表示论要点【标准数学／文献确立】\n\n- **玻色／费米＝$S_N$ 仅有的两个一维表示**（平凡表示“对称”／符号表示“反对称”；因 $\\mathrm{Ab}(S_N)=\\mathbb{Z}_2$，$N\\ge2$），恰好穷尽一维情形；\n- **高维表示给仲统计**（parastatistics，Green 1953），但 3+1 维被 **DHR 定理**归约：混合统计自由度全部吸收为内禀紧致对称群的量子数（Doplicher–Roberts 1990）；\n- **任意子不属 $S_N$**：其母结构是辫群 $B_N$——位形空间 $C_{N}(M)=(M^{N}\\setminus\\Delta)/S_{N}$ 的基本群 $\\pi_{1}(C_{N}(M))\\cong S_N$（$\\dim M\\ge3$）或 $\\cong B_N$（$\\dim M=2$，即 2+1 维）【Leinaas–Myrheim 1977】；$B_N$ 的一维表示给阿贝尔任意子、高维表示给非阿贝尔任意子；\n- **自旋-统计定理是跨层桥梁，不是两个表示的等同**：自旋属 $GL$ 层双覆盖 $\\mathrm{Spin}(1,3)\\cong SL(2,\\mathbb{C})$ 的旋量表示（$GL(n)$ 只有张量表示），统计属 $\\mathrm{Sym}$ 层的一维表示；定理绑定对易关系，前提是相对论 QFT 公理（Lorentz＋定域＋正定＋谱条件），缺一不可。\n\n**CQM 落点**【CQM 框架基础】：$n$ 个费米子复合体的 $S_N$ 表示为 $\\mathrm{sgn}^{\\otimes n}$——$n$ 偶即玻色子（库珀对 $n=2$ → 可凝聚）。\n\n$$\\boxed{\\ \\mathrm{Sym}\\ \\text{层同时管玻色与费米——二者是}\\ S_{N}\\ \\text{的两个一维表示；高维表示给仲统计，2+1 维的任意子归辫群}\\ B_{N}\\ \\text{（不是}\\ S_{N}\\text{）。}\\ }$$\n\n### 7.3 对称群谱系：$GL$ 层内部的五层分类【CQM 框架基础】\n\n把最内层（$GL$ 层）展开，CQM 的对称群谱系为：\n\n| 对称性层级 | 框架 | 主要对称群 | 嵌入说明 |\n|:---|:---|:---|:---|\n| **基本物理（单体）** | GL(5) | 洛伦兹群 $SO(1,3)$、庞加莱群、标准模型规范群 $U(1)\\times SU(2)\\times SU(3)$、大统一候选 $SU(5)$、偶然全局对称 $U(1)_{B-L}$、分立对称 $\\mathbb{Z}_2^{P}$（宇称）、$\\mathbb{Z}_2^{C}$（电荷共轭）、味置换 $S_n$（$n\\le6$，近似）、模群 $SL(2,\\mathbb{Z})$ | 各对称因子**分别**可嵌入 $GL(5)$ 复表示，**非其直积**；$S_6$ 恰为临界情形（5 维忠实表示） |\n| **化学（单体）** | GL(5) | 分子点群（$C_n$、$D_n$、$T_d$、$O_h$、$I_h$ 等） | 全在 $GL(3)\\subset GL(5)$ 内；最大分子点群 $I_h$（阶 120）有 3 维忠实表示 |\n| **物理多体** | GL(5) $+$ $S_n$（$n>6$） | 全同粒子置换 $S_n$ | 普通统计仅用 1 维表示（可嵌入 $GL(1)$）；$S_n$ 忠实表示维数 $n-1>5$ |\n| **化学多体** | GL(5) $+$ $S_n$（$n>6$） | 晶体中全同原子／分子位置置换、复杂分子系综统计 | 与物理多体同类：大 $N$ 全同单元置换 |\n| **引力规范冗余（正交）** | $\\mathrm{Diff}(M)$ | $\\mathrm{Diff}(M)$、$\\mathrm{Map}(M,G)$ | **无限维**，不嵌入任何有限维 $GL(n)$；与有限维分类正交（§1.1） |\n\n**注**：① 有限维规范群（如标准模型群）与其**局域化**函数空间 $\\mathrm{Map}(M,G)$ 不可混淆——后者属无穷维引力侧，与有限维分类正交；② 本表是**对称性层级**分类，§3 是**约束性类型**分类，同一对象可同时出现在两表——如味置换 $S_n$ 既是本表第一行，又是离散约束性（$S_6$ 临界、$S_2$ 最小）。\n\n---\n\n## 8. 自守形式：从群到 L 函数\n\n> **本章导语**：阅读顺序 §8.1–§8.3（形式本身：定义、协变律、分析类型）→ §8.4–§8.5（结构选择与到自守表示的环节）→ §8.6–§8.7（$L$ 函数与汇总）。全章按“确定一个对象需要几个独立选择环节”统计，**不打包**。\n\n自守形式定义在 §3 所分类的群上——§3 的四条基约束性群 $O,Sp,U,SL$ 及其派生族都是**约化群**，朗兰兹纲领的自守表示与 $L$ 函数正定义在约化群上。本章按“确定一个对象需要经过多少独立选择环节”统计（**不打包**）：自守形式 **5** 个结构选择，自守表示 **7** 个环节，$L$ 函数 **7** 步确定。【标准数学／文献确立】\n\n### 8.1 核心定义与共同条件\n\n**经典写法（$GL(2)$、上半平面）**：固定离散子群 $\\Gamma$ 与权 $k$，自守形式是满足\n\n$$\\boxed{\\ f(\\gamma z)=(cz+d)^{k}f(z),\\qquad \\gamma=\\begin{pmatrix}a&b\\\\c&d\\end{pmatrix}\\in\\Gamma\\ }$$\n\n的全纯（或光滑）函数——即自守性条件 $f(\\gamma x)=j(\\gamma,x)f(x)$，自守因子 $j(\\gamma,z)=(cz+d)^{k}$（权 $k$ 嵌入自守因子）。\n\n**一般写法（$GL(n)$，Borel–Jacquet）**：固定连通约化群 $G$ 与极大紧子群 $K$，自守形式是 $G(\\mathbb Q)\\backslash G(\\mathbb A)$ 上的光滑函数 $f$，满足：\n\n| 条件 | 含义 |\n|:---|:---|\n| 自守性（左 $\\Gamma$-不变） | $f(\\gamma x)=f(x)$，$\\forall\\gamma\\in G(\\mathbb Q)$；经典自守因子被 $K$-型权作用吸收 |\n| 光滑 | 无穷远处无穷次可微，有限处局部常 |\n| $K$-有限 | 右 $K$-平移生成**有限维**空间 |\n| $Z(\\mathfrak g)$-有限 | 被泛包络代数中心 $Z(\\mathfrak U(\\mathfrak g))$ 的某有限余维理想零化 |\n| 适度增长 | 在 Siegel 集上至多多项式增长（归约论的推论） |\n| 缓增（slow increase） | 沿极小抛物子群的 split 中心方向至多多项式增长（$z$-技术条件） |\n\n上表各分析条件全部满足者称自守形式；若再对所有真抛物子群 $P$ 的常值项（constant term）为零，则称**尖点形式**——尖点性是额外条件，不是定义的一部分。【标准数学：Borel–Jacquet, Corvallis 1977, pp.189–202】\n\n### 8.2 协变律的展开：原形式、新形式与自守因子\n\n**两条路线**：§2 是“约束先行”——在群上加约束切出新群，“保持某属性”的读法事后存在（§6.1 标准结果）；自守形式还有一条**属性先行**的构造路线——先有属性及其不变量，再取保它的群，再取离散子群，形式定义在后。两条路线互补，汇合于协变律 $f(\\gamma x)=j(\\gamma,x)f(x)$。（“**属性先行**”即文首『引言』唯物主义定位中的“**属性先在**”。）\n\n**属性先行的逻辑链**（六步）：\n\n$$\\boxed{\\ \\begin{aligned}&1.\\ \\text{属性 }P\\text{ 先在，带可量化不变量 }Q\\ \\text{（}P\\ \\text{是被实现的对象：一个表示、一个}\\ L\\text{ 函数、一个算术不变量、一个物理量）};\\\\&2.\\ \\text{取保 }Q\\ \\text{的变换群}\\ G_Q=\\{g\\mid Q(gx)=Q(x)\\}\\ \\text{——即 §5\"保它们的群\"（不唯一——见下）};\\\\&3.\\ \\text{取离散子群}\\ \\Gamma\\subset G_Q\\ \\text{（}\\Gamma\\ \\text{因含于}\\ G_Q\\ \\text{而继承保}\\ Q\\ \\text{的性质——不是把}\\ \\Gamma\\ \\text{定义为保}\\ Q\\ \\text{的群）};\\\\&4.\\ \\text{属性}\\ P\\ \\text{在}\\ \\Gamma\\ \\text{作用下被实现为不同形式}\\ (f(x),\\ f(\\gamma x))\\ \\text{——同一属性的不同实现};\\\\&5.\\ \\text{自守因子}\\ j(\\gamma,x)\\ \\text{是实现规则};\\\\&6.\\ \\text{协变律}：f(\\gamma x)=j(\\gamma,x)f(x).\\end{aligned}\\ }$$\n\n**属性与度量对照**（$Q$ 的实例——与 §5.2、§5.3 的量一致）：\n\n| 属性 $P$ | 度量 $Q$ |\n|:---|:---|\n| 距离 | 欧氏长度 $\\lvert\\Delta\\vec{x}\\rvert$ |\n| 时空间隔 | $ds^{2}$ |\n| 概率 | $\\lVert\\psi\\rVert^{2}$ |\n| 体积 | $\\det$ |\n| 相位 | $U(1)$ 下相位变动，模 $\\lvert e^{i\\theta}\\rvert=1$ 不变 |\n\n**步骤 2 的展开：同一个 $Q$，多种实现——自同构群的多样性**。$G_Q$ 不由 $Q$ 唯一确定：属性 $P$ 的**实现空间**不同，自同构群就不同——这样的群称为**度量不变的属性关系群**（由“保持度量 $Q$ 不变”这一关系定义；各实现下另有习称：等距群、酉群、辛群）。\n\n**保距离**——同一个“距离”，在不同实现空间中有不同的自同构群：\n\n| 实现空间 | 保距离的群 |\n|:---|:---|\n| 欧氏平面 $\\mathbb R^{2}$ | $O(2)$（线性部分；完整等距群 $E(2)=\\mathbb R^{2}\\rtimes O(2)$） |\n| 三维欧氏空间 $\\mathbb R^{3}$ | $O(3)$（线性部分；完整等距群 $E(3)$） |\n| 双曲平面 $\\mathbb H^{2}$ | $PSL(2,\\mathbb R)$（保定向等距群） |\n| 闵氏时空 $\\mathbb R^{1,3}$ | $O(1,3)$（线性部分） |\n| 球面 $S^{2}$ | $O(3)$（全等距群） |\n| 弯曲流形 $(M,g)$ | $\\mathrm{Isom}(M,g)$ |\n\n**保体积**：\n\n| 实现空间 | 保体积的群 |\n|:---|:---|\n| 实向量空间 $\\mathbb R^{n}$ | $SL(n,\\mathbb R)$ |\n| 复向量空间 | $SL(n,\\mathbb C)$ |\n| 辛空间 | $Sp(2n)$（保辛形式 → 保体积） |\n| 带测度的流形 | 保测群（非线性，§3.2 层） |\n| 辛流形 | 辛同胚群（非线性，§3.2 层） |\n\n**保概率（范数）**：\n\n| 实现空间 | 保概率的群 |\n|:---|:---|\n| 复希尔伯特空间 | $U(n)$ |\n| 实希尔伯特空间 | $O(n)$ |\n| 无穷维希尔伯特空间 | $U(\\mathcal H)$ |\n| 量子态射影空间 | $PU(\\mathcal H)$（量子态为射线） |\n\n为什么会有很多种：实现方式不唯一——不同**维度**、不同**几何／代数／分析结构**，各有自同构群；它们保持的是**同一个 $Q$**。§5.1 的“保时间的群”三层表（洛伦兹／庞加莱／$\\mathrm{Isom}$）正是“时空间隔”这个 $Q$ 的三种实现。表注：欧氏与闵氏行为**线性部分**，完整等距群另含平移（属仿射层，§3.3）；非线性条目属 §3.2 的 $\\mathrm{Diff}$ 层。\n\n这些 $G_i$ 并不孤立——通过**同构**（$SO(3)\\cong SU(2)/\\{\\pm I\\}$）、**覆盖**（$SL(2,\\mathbb C)\\to SO^{+}(1,3)$）、**函子性**（朗兰兹的群同态，§8.6 的 $(G,\\pi,\\rho)$ 口径）与**表示**相互联系。\n\n**离散子群的位置**：$\\Gamma_i\\subset G_i$ 是选定实现**之后**、为构造自守形式而取的（链的步骤 3）——不同 $G_i$ 取不同 $\\Gamma_i$，同一 $G_i$ 也可取不同 $\\Gamma_i$（如在 $SL(2,\\mathbb R)$ 上取 $SL(2,\\mathbb Z)$、$\\Gamma_0(N)$）；$\\Gamma_i$ 的多样性是次要的，**$G_i$ 的多样性才是根本**。$\\Gamma$ 的作用有三：把连续对称性**离散化**；使自守形式得以在**商空间** $\\Gamma\\backslash G_Q$（经典地 $\\Gamma\\backslash\\mathbb H$）上定义；产生**傅里叶展开、Hecke 算子**等算术结构。\n\n**根本差异与数值差异**：改变 $G_Q$——自守因子形式、协变律、表示论、$L$ 函数全部改变，是**结构性差异**；固定 $G_Q$、改变 $\\Gamma$——自守因子的函数形式（如 $(cz+d)^k$）不变，改变的是水平、傅里叶系数、Hecke 特征值等**数值**。\n\n$$\\boxed{\\ \\text{度量不变的属性关系群定结构，离散子群调数值。}\\ }$$\n\n（精确化：$\\Gamma$ 的选择也含一处结构性——商空间的**紧性**决定连续谱是否存在（无尖点 → 无 Eisenstein 连续谱），同余与非同余 $\\Gamma$ 决定 Hecke 算子代数的性质；“定结构／调数值”在实现固定的前提下是第一近似。**据此量纲内差异定为两级**——大内（换连续关系群，结构）、小内（换离散子群，**同为结构**）；参数与谱数据（水平、傅里叶系数、Hecke 特征值）**不是群**，移出内差异、独立为**数值差异**层，见 §5.6。）\n\n**原形式与新形式**：群元素 $\\gamma$ 作用于 $f$

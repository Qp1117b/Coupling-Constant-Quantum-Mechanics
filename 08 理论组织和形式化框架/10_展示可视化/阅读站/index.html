ureOperator.lean`（不确定性关系）\n- `08 理论组织和形式化框架/04_Lean对接/Lean源码/PrimeGeometry/Generation.lean`（三代=三边=三通道=秩−1）、`CartanAlgebra/Basic.lean`（顶点数 5=秩+1）\n- `08 理论组织和形式化框架/04_Lean对接/Lean源码/Superconductivity/CouplingSpace.lean`（固有时流速与黑洞冻结一致性）、`Superconductivity.lean`（角亏-固有时-耦合动量链条）\n- `归档/FG_自守形式_从SU5到壳层结构的完整条件链.md`（§2、§9：强重数一定理归属标注 Jacquet–Shalika 1981；Piatetski-Shapiro 1979）\n- `04 前沿研究/FG_贝里曲率与Regge曲率的关联_研究论文.md`（§5.6.3 三层本体结构：承担者/度量形式/响应形式）\n\n---\n\n> **文档状态**：前沿研究记录。所有【CQM 构造假设】条目均未经证明；所有【哲学诠释】条目不构成数学或物理断言；与基础的张力节点已在 §9 总表逐条处理。后续若任何构造假设被证明或证伪，应在此处追记而不删除原始记录。\n", "backlinks": ["D001", "D010"], "outlinks": ["D005", "D006", "D007", "D008", "D011", "D012", "D022", "D028", "D029", "D030", "D031"]}, {"id": "D020", "doc_id": "D020", "title": "质量研究思路汇总", "path": "04 前沿研究/CQM_前沿研究_质量研究思路汇总.md", "group": "04 前沿研究", "layer": 2, "type": "前沿", "text": "# CQM 质量研究思路汇总\n\n**作者**：ruster\n\n## 0. 核心命题\n\n$$\n\\boxed{\n\\text{质量不是基本输入，而是自守关联的涌现结果。}\n}\n$$\n\n$$\n\\boxed{\n\\text{质子 } A_4 \\text{ 的 } L \\text{ 和 } T \\text{ 属性建立自守关联，质量从关联中生成。}\n}\n$$\n\n$$\n\\boxed{\n\\text{其他粒子是 } \\pi_p \\text{ 的朗兰兹函子性分化。}\n}\n$$\n\n---\n\n## 1. 质量的量纲地位\n\n$$[M] = [L]^3[T]^{-2}\\cdot[K_M],\\qquad K_M=G_N^{-1}$$\n\n$$\n\\boxed{\nM \\text{ 的特征常数是 } K_M\\text{（}K_M=G_N^{-1}\\text{）。}\n}\n$$\n\n$K_M$（$=G_N^{-1}$）把时空量转换成质量量纲（$L^3T^{-2}\\cdot K_M=M$），是**第一个有动力学内容的特征常数**。\n\n---\n\n## 2. 为什么直接放在 $G_N$ 层\n\n$$\n\\boxed{\n\\text{质量的建立意味着 } L \\text{ 和 } T \\text{ 已经建立。}\n}\n$$\n\n$M$ 的定义预设了 $L$ 和 $T$ 已经存在，$G_N$ 的自守形式天然包含长度-时间关联。不需要单独讨论 $1/c$ 的自守形式。\n\n---\n\n## 3. 质子的 $L$ 和 $T$ 属性\n\n| 属性 | 物理内容 | 数学对象 |\n|:---|:---|:---|\n| $L$ | 质子几何延展 | $A_4$ 谱几何 |\n| $T$ | 质子再生产周期 | 内部振荡模式 |\n\n### 3.1 $A_4$ 谱几何\n\n$A_4$ 的边-面关联矩阵 $M = E^T E$（$10 \\times 10$，迹 $30$）的谱：\n\n$$\\{9^{(1)},\\ 4^{(4)},\\ 1^{(5)}\\}$$\n\n多重度 $(1, 4, 5)$，总和 $1+4+5 = 10$（单纯形面数）。\n\n$$\n\\boxed{\n\\text{这是谱几何事实，与 } \\mathrm{SU}(5) \\text{ 表示的对应需单独论证。}\n}\n$$\n\n### 3.2 自守关联【诠释层】\n\n$$\n\\boxed{\nf_L\\left(-\\frac{1}{z}\\right) = \\chi(z) \\, f_T(z)\n}\n$$\n\n> **标注**：此式为模形式的 slash 关系（标准写法 $f(-1/z)=\\chi\\,z^k f(z)$）。若 $f_L=f_T$，它只是**模性条件本身**。把模变换解释为“L 属性 ↔ T 属性”的对应，是 CQM 的**诠释**，不是模形式理论的推论。\n\n### 3.3 统一自守表示\n\n$$\n\\boxed{\nf_L, f_T \\in \\pi_p\n}\n$$\n\n---\n\n## 4. 自守表示的构造：$\\mathrm{GL}(5)$\n\n### 4.1 为什么是 $\\mathrm{GL}(5)$\n\n$$\n\\boxed{\n\\text{单纯形 5 顶点} \\;\\to\\; \\text{基本表示维数 5} \\;\\to\\; \\mathrm{GL}(5)\n}\n$$\n\n**注意**：不是“$A_4$ 有 5 个 Dynkin 节点”。$A_4$ 的 Dynkin 图有 **4 个节点**（对应 $\\mathfrak{sl}_5$），$\\mathrm{GL}(5)$ 的约化秩是 **5**（$= \\mathrm{rank}\\ \\mathfrak{sl}_5 + 1$）。5 的来源是**基本表示维数**。\n\n| 对象 | 数量 |\n|:---|:---|\n| $A_4$ 嘉当矩阵 | $4 \\times 4$ |\n| $A_4$ Dynkin 图节点 | $4$ |\n| $\\mathrm{SU}(5)$ 秩 | $4$ |\n| 正四单纯形顶点 | $5$ |\n| $\\mathrm{GL}(5)$ 约化秩 | $5$ |\n| $\\mathrm{GL}(5)$ 基本表示维数 | $5$ |\n\n### 4.2 候选构造：$\\mathrm{Sym}^4$ 提升\n\n$$\\pi_p = \\mathrm{Sym}^4(\\pi_2)$$\n\n| 提升 | 证明者 | 状态 |\n|:---|:---|:---|\n| $\\mathrm{Sym}^2\\ (\\mathrm{GL}(2) \\to \\mathrm{GL}(3))$ | Gelbart–Jacquet 1978 | 已证 |\n| $\\mathrm{Sym}^3\\ (\\mathrm{GL}(2) \\to \\mathrm{GL}(4))$ | Kim–Shahidi 2002 | 已证 |\n| $\\mathrm{Sym}^4\\ (\\mathrm{GL}(2) \\to \\mathrm{GL}(5))$ | Kim 2003 | 已证 |\n| $\\mathrm{Sym}^5$ 以上 | — | 一般情形未知 |\n\n$$\n\\boxed{\n\\mathrm{GL}(5) \\text{ 是当代数论能站住的最高阶对称幂之一。}\n}\n$$\n\n**尖点性判据**（Kim 2003，见附录 B）：\n\n$$\\mathrm{Sym}^4(\\pi) \\text{ 尖点性} \\iff \\pi \\text{ 非二面体/四面体/八面体型}$$\n\n### 4.3 自守表示的结构\n\n$$\\pi_p = \\bigotimes_v \\pi_{p,v}$$\n\n| 素处 | 类型 | 数据 |\n|:---|:---|:---|\n| $v = \\infty$ | Archimedean | 无穷小特征，由 $A_4$ 谱几何决定 |\n| $v = p$ | 非 Archimedean | Satake 参数 |\n\n---\n\n## 5. $G_N$ 公式与自守形式的对应\n\n### 5.1 可能公式\n\n$$G_N = \\frac{\\hbar c}{m_p^2} \\cdot I \\cdot \\lambda_c \\cdot ☯^2 \\cdot \\mathfrak{c}_1 \\cdot \\exp(-2/☯) \\cdot (1 + \\kappa ☯)$$\n\n### 5.2 公式元素的分解\n\n| 因子               | 来源                         | 性质     |\n| ---------------- | -------------------------- | ------ |\n| $I = 5/3$        | $\\mathrm{SU}(5)$ Dynkin 指数比 $T(\\mathbf{24})/T(\\mathbf{8})$ | 质子特有   |\n| $\\lambda_c$      | Mathieu 临界参数               | 质子特有   |\n| $\\mathfrak{c}_1$ | 谱系数（$\\gamma_1$ 为 Riemann 第一零点，与 $☯$ 同源） | **普适**（未证构造） |\n| $\\kappa$         | 修正系数                       | 质子特有   |\n| $☯$              | 全局谱权重                      | **普适** |\n| $\\exp(-2/☯)$     | 全局谱行为                      | **普适** |\n\n$$\n\\boxed{\nG_N \\text{ 是质子特有数据与普适 } ☯,\\ \\mathfrak{c}_1 \\text{ 的结合（普适侧扛 } ☯^2、\\exp(-2/☯)、\\mathfrak{c}_1 \\text{ 三个因子）。}\n}\n$$\n\n---\n\n## 6. $☯$ 的唯一定义\n\n$$\n\\boxed{\n☯ = \\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1} = \\frac{\\xi'(1)}{\\xi(1)} \\approx 0.02309570897\n}\n$$\n\n### 6.1 $\\zeta$ 与 $\\xi$：同一对象的两副面孔\n\n$\\zeta$ 和 $\\xi$ 不是两个东西，而是 $\\mathrm{GL}(1)$ 平凡特征给出的**同一个 $L$ 函数**的两种呈现。$\\zeta$ 是最基础的那个（Selberg 类 degree 1），$\\xi$ 是在它上面补 $\\Gamma$ 因子、消极点造出来的：\n\n$$\\xi(s) = \\tfrac12\\, s(s-1)\\,\\pi^{-s/2}\\,\\Gamma(s/2)\\,\\zeta(s)$$\n\n| | $\\zeta(s)$ | $\\xi(s)$ |\n|:---|:---|:---|\n| **本质** | 有限/算术部分 | 完备 + 整化 |\n| **$s=1$** | 极点 | $= 1/2$ |\n| **Euler 积** | 有 | 无 |\n| **平凡零点** $(−2,−4,\\ldots)$ | 有 | 被消掉 |\n\n不是 $\\xi$ 退化成 $\\zeta$，而是 $\\xi$ 由 $\\zeta$ 构成。二者是同一对象的**算术面孔**（$\\zeta$：Euler 积、有极点、含平凡零点）与**谱面孔**（$\\xi$：整、无极点、只含非平凡零点）。\n\n### 6.2 为什么取 $\\xi$ 而非 $\\zeta$\n\n关键区别：$\\xi$ 把平凡零点消掉了。$\\Gamma(s/2)$ 在负偶数的极点正好抵消 $\\zeta$ 在那里的平凡零点，于是：\n\n- $\\zeta$ 的零点 = 非平凡零点（临界带）$+$ 平凡零点 $(−2,−4,\\ldots)$\n- $\\xi$ 的零点 = **只有非平凡零点** $\\{\\gamma_n\\}$\n\n$☯$ 的求和式只过 $\\gamma_n$，不过平凡零点：\n\n$$\\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1} = ☯, \\qquad \\text{谱表示 } ☯ = \\sum_{\\gamma > 0} \\frac{1}{\\gamma^2 + 1/4} \\;\\text{（条件于 RH）}$$\n\n这恰好是 $\\xi$ 的 Hadamard 积 $\\xi(s) = \\xi(0)\\prod_\\rho\\bigl(1 - s/\\rho\\bigr)$ 给出的。如果用 $\\zeta$，求和会多出一堆平凡零点的贡献；且 $\\frac{d}{ds}\\ln\\zeta(s)\\big|_{s=1}$ 发散（$\\zeta$ 在 $s=1$ 有极点）。**CQM 的 $☯$ 取自 $\\xi$ 而非 $\\zeta$，因为只有 $\\xi$ 的零点集恰好是 $\\{\\gamma_n\\}$**——它是谱上唯一干净的那个。\n\n### 6.3 $\\mathrm{GL}(n)$ 推广\n\n$☯$ 来自 $\\mathrm{GL}(n)$ 对应的平凡自守形式（Eisenstein 级数）$L$ 函数。对每个 $n$，$\\mathrm{GL}(n)$ 平凡自守形式 $L$ 函数给出 $n \\cdot ☯$（$n$ 倍相变量子）；除以 $n$ 提取出 $☯$ 本身。$☯$ 是**普适常数**，不依赖于 $n$。$\\mathrm{GL}(1)$ 情形（$n=1$）即 $☯ = \\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1}$。\n\n### 6.4 定性\n\n$☯$ 属于**谱面孔**。“质数是源”（$\\zeta$ / 算术侧）和“$☯$ 是全局谱权重”（$\\xi$ / 谱侧）不是同一侧的陈述——它们分别对应这个最简单对象的两张脸。\n\n**“相变量子”命名有据**：$☯$ 从 $\\xi$ 提取，$\\xi$ 提纯非平凡零点 $\\{\\gamma_n\\}$（消去平凡零点），而 $\\mathfrak{c}_n=\\gamma_n^2+1/4$ 是 CQM 共振位置（耦级），与相变直接关联。$☯$ 取自与相变关联的非平凡零点谱——命名不是隐喻，而是数学来源的直接体现。\n\n**正确的分层**：\n\n$$\n\\boxed{\n\\text{普适 } ☯ \\;+\\; \\text{质子特有 } \\pi_p \\;\\Longrightarrow\\; G_N\n}\n$$\n\n---\n\n## 7. 质量从自守关联中出现\n\n$$[M] = \\frac{[L]^3}{[G_N]\\cdot[T]^2}$$\n\n$$\n\\boxed{\nM_{\\text{质子}} \\sim \\text{自守 } L\\text{-函数在特殊点的值}\n}\n$$\n\n$$M_{\\text{质子}} = \\frac{L_{\\text{质子}}^3}{G_N \\cdot T_{\\text{质子}}^2}$$\n\n等价地：\n\n$$G_N = \\frac{L_{\\text{质子}}^3}{M_{\\text{质子}} \\cdot T_{\\text{质子}}^2}$$\n\n（两者是同一方程的移项，不重复列为两个结果。）\n\n**依赖方向（避免核对循环）**：$M_{\\text{质子}} = L_{\\text{质子}}^3/(G_N T_{\\text{质子}}^2)$ 给出的是 $M$、$L$、$T$ 与 $G_N$ 之间的量纲关系。而 §5 的 $G_N$ 数值公式以 $m_p$ 为**唯一量纲锚点输入**，故两条路径的依赖方向不同：\n\n- 若走 $G_N$ 公式：$G_N$ 是**输入**，本节的方程只是把它与 $L,T$ 联系起来的量纲关系，不能反过来“由 $L,T$ 推出 $G_N$”；\n- 若走自守路径：质量谱应由 $L(s,\\pi_i)$ 的特殊值给出（§8.6），此路径**不得**再调用 §5 的 $G_N$ 公式，否则构成循环。\n\n当前文档同时呈现两条路径而未声明二者互斥，这是需要保持的边界：**$G_N$ 公式与“质量从自守关联涌现”不能互为前提。**\n\n> **待补**：$L$ 与 $T$ 的**独立**来源（不得由 $m_p$ 或 $G_N$ 反解）。若补 $T=L/c$，则 $L=G_N m_p/c^2=1.242\\times10^{-54}$ m（质子引力长度量级），与质子约化康普顿波长 $2.103\\times10^{-16}$ m 差 $1.69\\times10^{38}$ 倍——该式目前是量纲关系的**恒等变形**，不是质量推导。在给出独立来源之前，本节是量纲关系的陈述，**不构成质量涌现的推导**。\n\n---\n\n## 8. 自守分化：从质子到其他粒子\n\n### 8.1 核心命题\n\n$$\n\\boxed{\n\\text{质子 } A_4 \\text{ 是基础对象，} \\pi_p \\text{ 是根本自守表示。}\n}\n$$\n\n$$\n\\boxed{\n\\text{其他粒子是 } \\pi_p \\text{ 的朗兰兹函子性分化。}\n}\n$$\n\n### 8.2 分化操作（只用已证的函子性操作）\n\n| 粒子 | 操作 | 数学形式 | 状态 |\n|:---|:---|:---|:---|\n| **介子** | 对称平方 | $\\mathrm{Sym}^2(\\pi_p)$ | 已证（Gelbart–Jacquet 1978） |\n| **中子** | 基变换（base change） | $\\mathrm{BC}_{E/F}(\\pi_p)$ | 已证（Langlands） |\n| **电子** | 自守诱导的对偶 | $\\mathrm{Ind}_H^G(\\sigma)^\\vee$ | 需构造 |\n| **激发态** | 对称幂 | $\\mathrm{Sym}^n(\\pi_p)$ | $n \\leq 4$ 已证 |\n\n**不适用的操作**（三条，各附理由）：\n\n- $\\mathrm{Res}_H(\\pi_p)$：限制到子群不是朗兰兹函子性操作；\n- $\\pi_p \\otimes D(\\delta)$：缺陷矩阵不是自守表示，不能张量；\n- $\\pi_p \\otimes \\tilde{\\pi}_p$：Rankin–Selberg $L$-函数在 $s=1$ 有单极点。\n\n### 8.3 介子的正确公式\n\n$$L(s, \\pi_p \\times \\pi_p^\\vee) = \\frac{\\zeta(s)}{\\zeta(s+1)} \\cdot L(s, \\mathrm{Sym}^2 \\pi_p)$$\n\n（含 $\\zeta(s+1)$ 分母为框架内表述，见附 B 注 2。）\n\n极点来自 $\\zeta(s)$，但 $\\mathrm{Sym}^2 \\pi_p$ 部分是有限的。所以：\n\n$$\n\\boxed{\nm_{\\text{meson}} = \\text{const} \\cdot L(1, \\mathrm{Sym}^2 \\pi_p)\n}\n$$\n\n### 8.4 中子的正确公式\n\n基变换（base change）：\n\n$$\\pi_n = \\mathrm{BC}_{E/F}(\\pi_p)$$\n\n其中 $E/F$ 是某个二次扩张，$D(\\delta)$ 作为转移参数。\n\n> **量级不匹配（硬矛盾）**：基变换给出 $L(1,\\mathrm{BC}(\\pi_p))=L(1,\\pi_p)\\cdot L(1,\\pi_p\\otimes\\chi)$——**乘积结构**，一般给出 $O(1)$ 差异；而 n–p 分裂是微扰量级 $\\frac{m_n-m_p}{m_p}=0.1378\\%$。基变换是离散操作，n–p 分裂是 0.14% 微扰，二者量级不匹配，需额外机制（电磁自能、$u/d$ 夸克质量差）或改用微扰型操作。**目前不匹配。**\n\n### 8.5 电子的正确公式\n\n自守诱导的对偶：\n\n$$\\pi_e = \\mathrm{Ind}_H^G(\\sigma)^\\vee$$\n\n其中 $H \\subset G$ 是某个子群，$\\sigma$ 是 $H$ 上的自守表示。\n\n### 8.6 质量谱【纲领性目标——非公式】\n\n$$\n\\boxed{\n\\text{质量谱 = 朗兰兹函子性分化谱。}\n}\n$$\n\n$$m_i = \\text{const} \\cdot L(1, \\pi_i)$$\n\n> **状态说明**：此式为**纲领性目标**，非可证伪公式。缺陷有三：① 每粒子一个自由常数 const → 不可证伪，**const 的确定方式目前空白**；② 量级跨度：$m_{\\rm top}/m_e=3.39\\times10^5$，而 $L(1,\\pi)$ 典型为 $O(1)$；③ 文献（附 B）只背书了函子性**操作**，未背书质量公式——附 B 自身已说清。\n\n---\n\n## 9. 完整图景\n\n$$\n\\boxed{\n\\begin{array}{c}\n\\text{质子 } A_4 \\\\\n\\swarrow \\quad\\quad \\searrow \\\\\nL \\text{ 属性} \\quad\\quad T \\text{ 属性} \\\\\n\\searrow \\quad\\quad \\swarrow \\\\\n\\text{自守关联 } \\pi_p = \\mathrm{Sym}^4(\\pi_2) \\\\\n\\downarrow \\\\\n\\text{质量 } M_{\\text{质子}} \\\\\n\\downarrow \\\\\nG_N \\text{ 的可能公式} \\\\\n\\downarrow \\\\\n\\text{朗兰兹函子性分化} \\to \\text{其他粒子}\n\\end{array}\n}\n$$\n\n---\n\n## 10. 研究路径\n\n$$\n\\boxed{\n\\begin{array}{c}\n\\text{第一步：构造 } \\pi_p = \\mathrm{Sym}^4(\\pi_2) \\\\\n\\downarrow \\\\\n\\text{第二步：计算 } L(s, \\pi_p) \\\\\n\\downarrow \\\\\n\\text{第三步：验证函数方程（} L \\leftrightarrow T \\text{ 对偶）} \\\\\n\\downarrow \\\\\n\\text{第四步：推导 } G_N \\\\\n\\downarrow \\\\\n\\text{第五步：与 CODATA 对比} \\\\\n\\downarrow \\\\\n\\text{第六步：计算朗兰兹函子性分化（\\S8）} \\\\\n\\downarrow \\\\\n\\text{第七步：得到其他粒子质量谱（\\S8.6）}\n\\end{array}\n}\n$$\n\n### 10.1 第一步：构造 $\\pi_p$\n\n**输入**：\n- $A_4$ 谱几何：$\\{9^{(1)}, 4^{(4)}, 1^{(5)}\\}$\n- $\\mathrm{SU}(5)$ Dynkin 指数比：$I = T(\\mathbf{24})/T(\\mathbf{8}) = 5/3$\n- 基本表示维数：$5$\n- 禁闭边界条件\n\n**构造**：\n$$\\pi_p = \\mathrm{Sym}^4(\\pi_2)$$\n\n### 10.2 第二步：计算 $L(s, \\pi_p)$\n\n$$L(s, \\pi_p) = \\prod_v L_v(s, \\pi_{p,v})$$\n\nArchimedean 因子：\n$$L_\\infty(s, \\pi_{p,\\infty}) = \\prod_{j=1}^{5} \\Gamma_\\mathbb{R}(s + \\mu_j)$$\n\n非 Archimedean 因子：\n$$L_p(s, \\pi_v) = \\prod_{j=1}^{5} \\frac{1}{1 - \\alpha_{j,p} p^{-s}}$$\n\n### 10.3 第三步：验证函数方程\n\n$$L(s, \\pi_p) = \\varepsilon(s, \\pi_p) L(1-s, \\tilde{\\pi}_p)$$\n\n物理诠释：$s \\leftrightarrow 1-s$ 对应 $L \\leftrightarrow T$。\n\n\n### 10.4 第四步：推导 $G_N$\n\n$$G_N = \\frac{\\hbar c}{m_p^2} \\cdot I \\cdot \\lambda_c \\cdot ☯^2 \\cdot \\mathfrak{c}_1 \\cdot \\exp(-2/☯) \\cdot (1 + \\kappa ☯)$$\n\n### 10.5 第五步：与 CODATA 对比\n\n$$G_N^{\\text{CQM}} \\stackrel{?}{=} 6.6742810045 \\times 10^{-11}\\ \\text{SI}$$\n\n当前偏差约 $-3\\ \\text{ppm}$（构造后验数字校验，待独立复现）。\n\n---\n\n## 11. 关键约束\n\n| 约束 | 内容 |\n|:---|:---|\n| **函数方程** | $L(s,\\pi_p) = \\varepsilon(s,\\pi_p) L(1-s,\\tilde{\\pi}_p)$ |\n| **尖点性** | $\\mathrm{Sym}^4(\\pi)$ 尖点性 $\\iff$ $\\pi$ 非二面体/四面体/八面体型 |\n| **谱几何** | $A_4$ 本征值 $\\{9^{(1)}, 4^{(4)}, 1^{(5)}\\}$ 决定 Archimedean 参数 |\n| **数值检验** | $G_N$ 与 CODATA 偏差约 $-3\\ \\text{ppm}$（构造后验数字校验，待独立复现） |\n| **统一性** | 所有粒子来自同一个 $\\pi_p$ 的函子性分化 |\n\n---\n\n## 12. 与传统方法的竞争关系\n\n| 维度 | 传统方法 | CQM |\n|:---|:---|:---|\n| **起点** | 质量数据 | $A_4$ 谱几何 |\n| **自守形式** | 拟合工具 | 生成机制 |\n| **质量比** | 核心对象 | 副产品 |\n| **量纲** | 预设 | 生成 |\n| **粒子数** | 每个独立 | 一个 $\\pi_p$ 分化 |\n| **第一性** | 否 | 目标 |\n\n$$\n\\boxed{\n\\text{传统回答“是什么”，CQM 回答“为什么”。}\n}\n$$\n\n---\n\n## 13. 开放问题\n\n| 问题 | 内容 |\n|:---|:---|\n| **$\\pi_2$ 的具体选择** | 从 $A_4$ 谱几何到 $\\pi_2$ 的严格映射 |\n| **$\\lambda_c, \\mathfrak{c}_1, \\kappa$ 的来源** | 质子侧的 $\\lambda_c, \\kappa$ 如何从 $\\pi_p$ 的算术数据推出；$\\mathfrak{c}_1$ 属普适侧（与 $☯$ 同源，非 $\\pi_p$ 导出；其精确等同的 n=1 误差问题见 GN 公理化证明稿 §13.3，中等偏难） |\n| **电子的自守诱导** | $\\mathrm{Ind}_H^G(\\sigma)^\\vee$ 中 $H, \\sigma$ 的具体选择 |\n| **中子的基变换** | $\\mathrm{BC}_{E/F}(\\pi_p)$ 中 $E/F$ 的具体选择（与 n–p 分裂 0.14% 的量级不匹配见 §8.4） |\n| **多重度与表示维数的对应** | $(1,4,5)$ 与 $\\mathbf{1} \\oplus \\mathbf{4} \\oplus \\mathbf{5}$ 的对应需单独论证 |\n| **$☯$ 的来源** | 从 $\\mathrm{GL}(n)$ 平凡自守形式 $L$ 函数提取（$n\\cdot☯$ 除以 $n$），普适常数，不依赖 $n$；闭式 $1+\\gamma_E/2-\\tfrac12\\ln\\pi-\\ln2$ 已验证。**注意**：$☯$ 走**平凡特征侧**（GL(1) $\\zeta/\\xi$），$\\pi_p=\\mathrm{Sym}^4(\\pi_2)$ 走**尖点侧**（GL(5)）——尖点表示的 $\\Lambda$ 本身即整、无极点，无 $\\xi$ 化，故 $☯$ **不能**由 $L(s,\\pi_p)$ 得到；二者在 $G_N$ 公式中**相乘而非同源** |\n\n---\n\n## 14. 最终结论\n\n$$\n\\boxed{\n\\text{核心思路：质子的 } L \\text{ 和 } T \\text{ 属性建立自守关联，质量从中涌现。}\n}\n$$\n\n$$\n\\boxed{\n\\text{自守表示：} \\pi_p = \\mathrm{Sym}^4(\\pi_2) \\text{ 在 } \\mathrm{GL}(5,\\mathbb{A}_{\\mathbb{Q}}) \\text{ 上。}\n}\n$$\n\n$$\n\\boxed{\n\\text{质量 } M \\text{ 和 } G_N \\text{ 从 } \\pi_p \\text{ 的 } L\\text{-函数特殊值中出现。}\n}\n$$\n\n$$\n\\boxed{\n\\text{其他粒子是 } \\pi_p \\text{ 的朗兰兹函子性分化。}\n}\n$$\n\n$$\n\\boxed{\n\\text{核心任务：从 } A_4 \\text{ 谱几何构造 } \\pi_2 \\text{，计算 } L(s, \\mathrm{Sym}^4 \\pi_2) \\text{，验证 } G_N \\text{ 和粒子质量谱。}\n}\n$$\n\n$$\n\\boxed{\n\\text{一旦 } G_N \\text{ 被第一性推导，CQM 就从“理论框架”升级为“第一性理论”。}\n}\n$$\n\n---\n\n\n## 附 A：来源定位（提取自项目文档）\n\n本汇总的正文各条目与项目文档的对应关系如下（“本汇总新增”指本汇总引入的框架性表述，项目文档无同文先行）：\n\n| 本汇总条目 | 项目出处 |\n|:---|:---|\n| §0–§2（量纲地位、$K_M$ 为 $M$ 的特征常数、$L/T$ 先建立） | `01 核心理论/CQM_核心_量纲与群论.md` §6.3（$[M]=[L]^3[T]^{-2}\\cdot[K_M]$；质量层特征常数为 $K_M$（$K_M=G_N^{-1}$）；每压掉一个量纲冒出一个更基础的特征常数） |\n| §3.1（$A_4$ 谱几何 $\\{9,4,1\\}$） | `03 引力与退相干/CQM_引力_GN可能公式.md` §8；`01 核心理论/CQM_核心_集成理论.md`（$M=E^TE$ 本征值 $\\{9,4,1\\}$、重数 $\\{1,4,5\\}$，标为“S₅ 表示论 + 迹条件”） |\n| §3.2/§3.3（自守关联、$f_L,f_T\\in\\pi_p$） | 本汇总新增（对应发生学分层：自守形式 → L 函数 → 朗兰兹；见 `01 核心理论/CQM_核心_朗兰兹分层共振与相变量子.md`） |\n| §4（GL(5) 构造与 Sym⁴ 提升） | 本汇总新增（候选构造 $\\pi_p=\\mathrm{Sym} 考 | 已证（严格） |\n| §8.3 恒等式（对齐注） | 标准恒等式：$L(s,\\pi\\times\\tilde{\\pi})=\\zeta(s)\\,L(s,\\mathrm{Sym}^2\\pi)$ | 标准恒等式不含 $\\zeta(s+1)$ 分母因子；文档写法的 $\\zeta(s+1)$ 分母为框架内表述，需对齐说明 | 需对齐 |\n| §8.4 基变换 | Langlands 1980, *Base Change for GL(2)*, Annals of Mathematics Studies 96；Arthur & Clozel 1989, *Simple Algebras, Base Change, and the Advanced Theory of the Trace Formula*, Annals of Mathematics Studies 120 | GL(2) 循环基变换；GL(n) 循环基变换与自守诱导 | 已证（严格） |\n| §8.5 自守诱导 | Arthur & Clozel 1989（循环扩张情形）；Henniart 2000, *Invent. Math.* 139, 439–455（局部） | 循环扩张的自守诱导 $\\pi\\mapsto AI(\\pi)$，L 函数保持；可解扩张亦成立 | 已证（循环/可解情形） |\n| §8.2 删除 Res_H | Cogdell 2003, “Dual groups and Langlands functoriality”, in *An Introduction to the Langlands Program*（Bernstein–Gelbart 编），251–268；Borel 1979, *Proc. Sympos. Pure Math.* 33, 27–61 | 函子性 = 经 L 群同态 $^{L}H \\to {}^{L}G$ 的表示转移；不存在一般的“限制”函子 | 支持删除判断 |\n| §3.1 $A_4$ 谱 $\\{9^{(1)},4^{(4)},1^{(5)}\\}$ | 本项目直接计算验证（迹 30、谱和 30）；框架文献：Horak & Jost 2013, *Adv. Math.* 244, 303–336；Duval & Reiner 2002, *Trans. AMS* 354, 4313–4344 | 单纯形组合/高阶 Hodge 拉普拉斯谱的一般框架；整数谱性质 | 谱事实=本项目验证；文献提供框架 |\n| §3.1 S₅ 分解 $1\\oplus4\\oplus5$ | Fulton & Harris 1991, GTM 129；James & Kerber 1981, LNM 682 | S₅ 作用在 2-子集上的 10 维置换表示分解为 $1\\oplus4\\oplus5$ | 标准（严格） |\n| §5 $\\lambda_c$（Mathieu） | McLachlan 1947, *Theory and Application of Mathieu Functions*, Oxford；NIST DLMF 第 28 章（§28.2） | Mathieu 方程标准形式、特征值 $b_1(q)$、$se_1$、连分数理论 | 标准理论；$\\lambda_c$ 数值为本项目计算（$q_c=0.3290057278$） |\n| §6 $☯$ | Titchmarsh 1986（2 版，Heath-Brown 修订） | $\\xi$ 函数、Hadamard 乘积、$\\xi'/\\xi$ 理论；恒等式 $\\sum_{\\gamma>0}1/(\\gamma^2+1/4)=\\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1}$ 可由此推出；本项目验证闭式 $1+\\gamma_E/2-\\tfrac12\\ln\\pi-\\ln2=0.02309570897$ | 标准理论；数值已验证 |\n| §10.5 CODATA | Mohr, Newell, Taylor, Tiesinga 2025, *Rev. Mod. Phys.* 97, 025002（CODATA 2022） | $G=6.67430(15)\\times10^{-11}\\ \\mathrm{m^3\\,kg^{-1}\\,s^{-2}}$（2022 与 2018 相同）；本项目值偏差 $-2.85$ ppm ≈ $-3$ ppm（构造后验数字校验，待独立复现） | 实验参考值 |\n| §4.1 Lie 理论 | Bourbaki, *Groupes et Algèbres de Lie*, Ch. 4–6；Humphreys 1972, GTM 9 | $A_4$ Dynkin 图 4 节点、Cartan 矩阵 $4\\times4$、SL(5) 秩 4、GL(5) 约化秩 5 | 标准（严格） |\n\n**补充说明**：\n\n1. **Sym⁵ 以上的现状**：§4.2 表中“一般情形未知”应精确理解为“一般 GL(2) 自守表示情形未解决”——Newton–Thorne（2021）已证明全纯 Hecke 尖点形式（无复乘）情形的对称幂函子性，不能直接外推到一般情形。\n2. **§8.3 恒等式对齐**：标准 Rankin–Selberg 恒等式为 $L(s,\\pi\\times\\tilde{\\pi})=\\zeta(s)L(s,\\mathrm{Sym}^2\\pi)$，不含 $\\zeta(s+1)$ 分母。文档写法为框架内表述，严格化时需给出该分母的机制说明或改按标准恒等式。\n3. **§8.4 术语提示**：文献中“内窥转移”（endoscopy）通常指 Langlands–Shelstad 内窥理论，而 $\\mathrm{BC}_{E/F}$（基变换）对应 Langlands 1980 / Arthur–Clozel 1989；术语可考虑统一为“基变换”以避免歧义。\n4. **§3.1 谱事实已直接验证**：4-单纯形边-面关联矩阵 $E\\in\\{0,1\\}^{10\\times10}$（$E_{fe}=1$ 当边 $e\\subset$ 面 $f$），$E^TE$ 本征值恰为 $\\{9,4,4,4,4,1,1,1,1,1\\}$，即 $\\{9^{(1)},4^{(4)},1^{(5)}\\}$，迹 30、谱和 30。\n5. **§6 $☯$ 的闭式**：$☯=\\frac{d}{ds}\\ln\\xi(s)\\big|_{s=1}=1+\\gamma_E/2-\\tfrac12\\ln\\pi-\\ln2\\approx 0.02309570897$（$\\gamma_E$ 为欧拉–马歇罗尼常数），由 $\\xi$ 定义与特殊函数值（$\\Gamma(1/2)$、$\\zeta(0)$、$\\zeta'(0)$）推出，非拟合值。\n\n---\n\n## 参考文献\n\n[1] S. Gelbart, H. Jacquet, *A relation between automorphic representations of GL(2) and GL(3)*, Ann. Sci. École Norm. Sup. (4) 11 (1978), 471–542.\n\n[2] S. Gelbart, H. Jacquet, *Forms of GL(2) from the analytic point of view*, in: Automorphic Forms, Representations and L-functions, Proc. Sympos. Pure Math. 33, AMS, 1979, 213–251.\n\n[3] H. H. Kim, F. Shahidi, *Functorial products for GL(2)×GL(3) and the symmetric cube of GL(2)*, Ann. of Math. (2) 155 (2002), 837–893.\n\n[4] H. H. Kim, *Functoriality for the exterior square of GL(4) and the symmetric fourth of GL(2)*, J. Amer. Math. Soc. 16 (2003), 139–183.\n\n[5] J. Newton, J. A. Thorne, *Symmetric power functoriality for holomorphic modular forms*, Publ. Math. IHES 134 (2021), 1–116.\n\n[6] H. Jacquet, J. Shalika, *On Euler products and the classification of automorphic forms II*, Amer. J. Math. 103 (1981), 777–815.\n\n[7] H. Jacquet, I. I. Piatetski-Shapiro, J. Shalika, *Rankin-Selberg convolutions*, Amer. J. Math. 105 (1983), 367–464.\n\n[

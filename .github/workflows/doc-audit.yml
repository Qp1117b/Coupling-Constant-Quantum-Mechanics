name: doc-audit
on:
  push:
    paths:
      - '**.md'
      - 'scripts/doc_audit.sh'
  pull_request:
    paths:
      - '**.md'
      - 'scripts/doc_audit.sh'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 文档一致性审计
        run: bash scripts/doc_audit.sh
      - name: 复现性清单检查
        run: bash scripts/repro_check.sh